<script id="lesson-data" type="application/json">{"overview":{"title":"Einführung & Überblick · Giới thiệu tổng quan","level":"A1–C1 · Grundlagen","intro":["Adverbien geben zusätzliche Informationen zu Zeit, Ort, Häufigkeit, Art und Weise oder zur Einschätzung einer Aussage. Sie verändern ihre Form normalerweise nicht.","Adverbs add information about time, place, frequency, manner, or the speaker’s view. They normally do not change form.","Trạng từ bổ sung thông tin về thời gian, nơi chốn, tần suất, cách thức hoặc nhận định. Thông thường, chúng không biến đổi hình thức."]},"zeit":{"title":"Zeit & Reihenfolge · Thời gian và trình tự","en":"Time & sequence","vi":"Thời gian & trình tự","level":"A1–B2 · Wann? / in welcher Reihenfolge?","intro":["Zeitadverbien sagen, wann etwas passiert oder in welcher Reihenfolge Handlungen stattfinden.","Time adverbs tell when something happens or in what order actions take place.","Trạng từ thời gian cho biết việc xảy ra khi nào hoặc trình tự các hành động."],"rule":["Steht die Zeitangabe am Satzanfang, besetzt sie Position 1; das finite Verb folgt auf Position 2: „Heute lerne ich.“ Im Mittelfeld kann sie auch nach dem Subjekt stehen: „Ich lerne heute.“","When a time adverbial starts the sentence, it takes position 1 and the finite verb follows in position 2. It can also appear in the middle field: “Ich lerne heute.”","Khi trạng từ thời gian đứng đầu câu, nó chiếm vị trí 1 và động từ chia theo sau ở vị trí 2. Nó cũng có thể đứng giữa câu: “Ich lerne heute.”"],"words":[{"term":"heute","ipa":"[ˈhɔʏtə]","en":"today","vi":"hôm nay","example":["Heute lerne ich neue Wörter.","Today I am learning new words.","Hôm nay tôi học từ mới."],"use":["Verwendet für etwas, das am heutigen Tag geschieht.","Use it for something happening on the current day.","Dùng cho việc diễn ra trong ngày hôm nay."],"position":["Am Satzanfang: heute auf Position 1, lerne auf Position 2. Auch möglich: „Ich lerne heute.“","At the beginning: heute is in position 1 and lerne in position 2. Also possible: “Ich lerne heute.”","Đầu câu: heute ở vị trí 1, lerne ở vị trí 2. Cũng có thể nói: “Ich lerne heute.”"],"type":"Adverb","band":"now"},{"term":"morgen","ipa":"[ˈmɔʁɡn̩]","en":"tomorrow","vi":"ngày mai","example":["Morgen fährt der Zug um acht Uhr ab.","The train leaves at eight tomorrow.","Ngày mai tàu khởi hành lúc tám giờ."],"use":["Bezeichnet den Tag nach heute.","Refers to the day after today.","Chỉ ngày kế tiếp hôm nay."],"position":["Am Satzanfang folgt das finite Verb direkt: „Morgen fährt …“; ab steht als trennbares Präfix am Satzende.","At the beginning, the finite verb follows immediately: “Morgen fährt …”; the separable prefix ab goes at the end.","Đầu câu, động từ chia theo ngay sau: “Morgen fährt …”; tiền tố tách ab đứng cuối câu."],"type":"Adverb","band":"now"},{"term":"jetzt","ipa":"[jɛtst]","en":"now","vi":"bây giờ","example":["Jetzt habe ich Zeit.","I have time now.","Bây giờ tôi có thời gian."],"use":["Betont den gegenwärtigen Zeitpunkt oder einen Wechsel zur Gegenwart.","Emphasizes the present moment or a change to what is happening now.","Nhấn mạnh thời điểm hiện tại hoặc chuyển sang việc đang diễn ra bây giờ."],"position":["Am Anfang: „Jetzt habe ich …“; im Mittelfeld: „Ich habe jetzt Zeit.“","At the beginning: “Jetzt habe ich …”; in the middle field: “Ich habe jetzt Zeit.”","Đầu câu: “Jetzt habe ich …”; giữa câu: “Ich habe jetzt Zeit.”"],"type":"Adverb","band":"now"},{"term":"später","ipa":"[ˈʃpɛːtɐ]","en":"later","vi":"lát nữa / sau này","example":["Später rufe ich dich an.","I will call you later.","Lát nữa tôi sẽ gọi cho bạn."],"use":["Verweist auf einen Zeitpunkt nach dem aktuellen Moment.","Refers to a time after the present moment.","Chỉ thời điểm sau lúc hiện tại."],"position":["Kann Position 1 einnehmen; das finite Verb kommt dann auf Position 2. Im Mittelfeld steht es oft nach dem Subjekt.","It can take position 1; the finite verb then comes in position 2. In the middle field, it often follows the subject.","Có thể đứng vị trí 1; động từ chia theo ở vị trí 2. Trong câu, nó thường đứng sau chủ ngữ."],"type":"Adverb","band":"sequence"},{"term":"zuerst","ipa":"[tsuˈʔeːɐ̯st]","en":"first","vi":"trước tiên","example":["Zuerst frühstücke ich.","First, I have breakfast.","Trước tiên, tôi ăn sáng."],"use":["Markiert den ersten Schritt oder die erste Handlung einer Abfolge.","Marks the first step or action in a sequence.","Đánh dấu bước hoặc hành động đầu tiên trong một trình tự."],"position":["Bei Position 1 folgt das Verb direkt: „Zuerst frühstücke ich.“ Nicht: „Zuerst ich frühstücke.“","When it is in position 1, the verb follows immediately: “Zuerst frühstücke ich.”","Khi đứng vị trí 1, động từ theo ngay sau: “Zuerst frühstücke ich.”"],"type":"Adverb","band":"sequence"},{"term":"danach","ipa":"[daˈnaːx]","en":"afterwards","vi":"sau đó","example":["Danach gehe ich zur Arbeit.","Afterwards, I go to work.","Sau đó tôi đi làm."],"use":["Verknüpft eine Handlung mit dem Schritt, der zeitlich darauf folgt.","Links an action to the next step in time.","Nối một hành động với việc xảy ra tiếp theo."],"position":["Am Satzanfang besetzt danach Position 1; das finite Verb steht auf Position 2: „Danach gehe ich …“","At the beginning, danach takes position 1 and the finite verb stays in position 2.","Đầu câu, danach ở vị trí 1; động từ chia vẫn ở vị trí 2: “Danach gehe ich …”"],"type":"Adverb","band":"sequence"},{"term":"bald","ipa":"[balt]","en":"soon","vi":"sắp / chẳng bao lâu nữa","example":["Der Bus kommt bald.","The bus will arrive soon.","Xe buýt sắp đến."],"use":["Sagt, dass etwas in naher Zukunft geschieht.","Says that something will happen in the near future.","Cho biết việc gì đó sẽ xảy ra trong tương lai gần."],"position":["Im Mittelfeld steht bald häufig nach dem Verb: „Der Bus kommt bald.“ Es kann auch am Satzanfang stehen: „Bald kommt der Bus.“","In the middle field it often follows the verb; it can also start the sentence, followed by the finite verb.","Trong câu, bald thường đứng sau động từ; cũng có thể đứng đầu câu, rồi đến động từ chia."],"type":"Adverb","band":"now"},{"term":"gestern","ipa":"[ˈɡɛstɐn]","en":"yesterday","vi":"hôm qua","example":["Gestern habe ich meine Freundin besucht.","Yesterday I visited my friend.","Hôm qua tôi đã đến thăm bạn mình."],"use":["Bezeichnet den Tag vor heute; häufig zusammen mit dem Perfekt für abgeschlossene Erlebnisse.","Refers to the day before today; often used with the present perfect for completed experiences.","Chỉ ngày trước hôm nay; thường dùng với Perfekt để kể việc đã hoàn tất."],"position":["Am Satzanfang: „Gestern habe ich …“; das finite Hilfsverb habe steht auf Position 2, besucht am Satzende.","At the beginning: “Gestern habe ich …”; the finite auxiliary habe is in position 2 and besucht goes at the end.","Đầu câu: “Gestern habe ich …”; trợ động từ chia habe ở vị trí 2, besucht ở cuối câu."],"type":"Adverb","band":"past"},{"term":"vorgestern","ipa":"[foːɐ̯ˈɡɛstɐn]","en":"the day before yesterday","vi":"hôm kia","example":["Vorgestern habe ich meine Schwester besucht.","I visited my sister the day before yesterday.","Hôm kia tôi đã đến thăm chị/em gái mình."],"use":["Bezeichnet den Tag zwei Tage vor heute.","Refers to the day two days before today.","Chỉ ngày cách hôm nay hai ngày."],"position":["Am Satzanfang folgt das finite Verb auf Position 2: „Vorgestern habe ich …“; besucht steht am Satzende.","At the beginning, the finite verb stays in position 2; the participle goes at the end.","Đầu câu, động từ chia vẫn ở vị trí 2; phân từ đứng cuối câu."],"type":"Adverb","band":"past"},{"term":"vorhin","ipa":"[foːɐ̯ˈhɪn]","en":"a little while ago","vi":"lúc nãy","example":["Ich habe vorhin deine Nachricht gelesen.","I read your message a little while ago.","Lúc nãy tôi đã đọc tin nhắn của bạn."],"use":["Bezieht sich auf etwas, das vor kurzer Zeit, oft noch am selben Tag, passiert ist.","Refers to something that happened a short time ago, often earlier on the same day.","Chỉ việc mới xảy ra cách đây không lâu, thường trong cùng ngày."],"position":["Im Perfekt steht das finite Hilfsverb auf Position 2; vorhin steht oft im Mittelfeld.","In the perfect tense, the finite auxiliary is in position 2; vorhin often appears in the middle field.","Ở thì Perfekt, trợ động từ chia đứng vị trí 2; vorhin thường đứng giữa câu."],"type":"Adverb","band":"past"},{"term":"neulich","ipa":"[ˈnɔɪ̯lɪç]","en":"recently","vi":"hôm nọ / dạo gần đây","example":["Neulich habe ich ein interessantes Buch gefunden.","I found an interesting book recently.","Hôm nọ tôi tìm thấy một quyển sách thú vị."],"use":["Bezeichnet einen nicht genau genannten Zeitpunkt in der jüngeren Vergangenheit.","Refers to an unspecified time in the recent past.","Chỉ một thời điểm không nói rõ trong quá khứ gần."],"position":["Kann am Satzanfang stehen: „Neulich habe ich …“; das Hilfsverb bleibt auf Position 2.","It can start the sentence; the finite auxiliary remains in position 2.","Có thể đứng đầu câu; trợ động từ chia vẫn ở vị trí 2."],"type":"Adverb","band":"past"},{"term":"damals","ipa":"[ˈdaːmaːls]","en":"back then","vi":"hồi đó","example":["Damals wohnte meine Familie in Hanoi.","My family lived in Hanoi back then.","Hồi đó gia đình tôi sống ở Hà Nội."],"use":["Verweist auf einen früher genannten oder aus dem Zusammenhang bekannten Zeitpunkt in der Vergangenheit.","Points to a time in the past already mentioned or clear from context.","Nhắc đến một thời điểm quá khứ đã được nói tới hoặc rõ theo ngữ cảnh."],"position":["Steht oft am Satzanfang; das finite Verb folgt auf Position 2: „Damals wohnte …“","It often starts the sentence, followed by the finite verb in position 2.","Thường đứng đầu câu; động từ chia theo sau ở vị trí 2."],"type":"Adverb","band":"past"},{"term":"früher","ipa":"[ˈfʁyːɐ̯]","en":"earlier; in the past","vi":"trước đây","example":["Früher fuhr ich jeden Tag mit dem Fahrrad zur Arbeit.","I used to cycle to work every day.","Trước đây ngày nào tôi cũng đi làm bằng xe đạp."],"use":["Beschreibt eine frühere Zeit oder Gewohnheit. Nicht mit „früh“ = early verwechseln.","Describes an earlier period or habit. Do not confuse it with früh, meaning early.","Mô tả thời gian hoặc thói quen trước đây; phân biệt với früh nghĩa là sớm."],"position":["Am Satzanfang: „Früher fuhr ich …“; im Mittelfeld ist „Ich fuhr früher …“ möglich.","It may start the sentence, with the verb in position 2, or appear in the middle field.","Có thể đứng đầu câu, động từ chia theo sau ở vị trí 2, hoặc đứng giữa câu."],"type":"Adverb","band":"past"},{"term":"bisher","ipa":"[bɪsˈheːɐ̯]","en":"so far; until now","vi":"cho đến nay","example":["Bisher habe ich noch keine Antwort bekommen.","So far, I have not received an answer.","Cho đến nay tôi vẫn chưa nhận được câu trả lời."],"use":["Fasst den Zeitraum von früher bis zum jetzigen Moment zusammen; oft mit Perfekt und Verneinung.","Covers the time from the past up to now; often used with the perfect tense and a negative.","Bao quát khoảng thời gian từ trước đến hiện tại; thường đi với Perfekt và câu phủ định."],"position":["Am Satzanfang: „Bisher habe ich …“; das finite Hilfsverb steht auf Position 2.","At the beginning, the finite auxiliary remains in position 2.","Đầu câu: „Bisher habe ich …“; trợ động từ chia ở vị trí 2."],"type":"Adverb","band":"past"},{"term":"längst","ipa":"[lɛŋst]","en":"long ago; already","vi":"đã lâu rồi","example":["Der Zug ist längst abgefahren.","The train left a long time ago.","Tàu đã rời ga từ lâu rồi."],"use":["Betont, dass etwas schon seit längerer Zeit geschehen ist oder gilt.","Emphasizes that something happened or has been true for quite some time.","Nhấn mạnh việc gì đã xảy ra hoặc đúng từ khá lâu."],"position":["Steht häufig im Mittelfeld beim Verb: „ist längst abgefahren“; das Hilfsverb bleibt auf Position 2.","It often appears in the middle field; the finite auxiliary stays in position 2.","Thường đứng giữa câu gần động từ; trợ động từ chia vẫn ở vị trí 2."],"type":"Adverb","band":"past"},{"term":"soeben","ipa":"[zoˈʔeːbn̩]","en":"just now","vi":"vừa mới","example":["Der Zug ist soeben angekommen.","The train has just arrived.","Tàu vừa mới đến."],"use":["Bezeichnet etwas, das unmittelbar vor dem Sprechzeitpunkt passiert ist; formeller als „gerade“.","Describes something that happened immediately before speaking; more formal than gerade.","Chỉ việc vừa xảy ra ngay trước lúc nói; trang trọng hơn gerade một chút."],"position":["Steht oft im Mittelfeld: „ist soeben angekommen“; das Hilfsverb bleibt auf Position 2.","It often appears in the middle field; the auxiliary stays in position 2.","Thường đứng giữa câu trong Perfekt; trợ động từ chia vẫn ở vị trí 2."],"type":"Adverb","band":"past"},{"term":"gerade","ipa":"[ɡəˈʁaːdə]","en":"right now; just","vi":"ngay lúc này / vừa mới","example":["Ich lerne gerade Deutsch.","I am studying German right now.","Ngay lúc này tôi đang học tiếng Đức."],"use":["Beschreibt oft eine Handlung, die genau jetzt stattfindet; je nach Zeitform auch „just“.","Often describes an action happening now; with other tenses it can also mean just.","Thường mô tả hành động đang diễn ra lúc này; tùy thì cũng có thể nghĩa là vừa mới."],"position":["Steht häufig im Mittelfeld nahe beim Verb: „Ich lerne gerade Deutsch.“","It commonly appears in the middle field near the verb.","Thường đứng giữa câu, gần động từ."],"type":"Adverb","band":"now"},{"term":"gleich","ipa":"[ɡlaɪç]","en":"in a moment; very soon","vi":"ngay sau đây / lát nữa","example":["Der Zug fährt gleich ab.","The train is leaving in a moment.","Tàu sẽ khởi hành ngay sau đây."],"use":["Bezeichnet eine sehr nahe Zukunft, oft in wenigen Augenblicken.","Refers to the very near future, often within moments.","Chỉ tương lai rất gần, thường chỉ trong chốc lát nữa."],"position":["Steht oft im Mittelfeld: „Der Zug fährt gleich ab.“ Das trennbare Präfix steht am Satzende.","It often appears in the middle field; the separable prefix goes at the end.","Thường đứng giữa câu; tiền tố tách đứng cuối câu."],"type":"Adverb","band":"now"},{"term":"sofort","ipa":"[zoˈfɔʁt]","en":"immediately","vi":"ngay lập tức","example":["Ich rufe dich sofort zurück.","I will call you back immediately.","Tôi sẽ gọi lại cho bạn ngay lập tức."],"use":["Betont, dass etwas ohne Verzögerung geschieht.","Emphasizes that something happens without delay.","Nhấn mạnh việc gì diễn ra không chậm trễ."],"position":["Meist im Mittelfeld nach dem Verb: „Ich rufe dich sofort zurück.“","Usually in the middle field after the verb.","Thường đứng giữa câu sau động từ."],"type":"Adverb","band":"now"},{"term":"demnächst","ipa":"[dəˈmɛːçst]","en":"soon; in the near future","vi":"sắp tới","example":["Demnächst eröffnen sie ein neues Café.","They are opening a new café soon.","Sắp tới họ sẽ khai trương một quán cà phê mới."],"use":["Bezeichnet einen Zeitpunkt in naher Zukunft, ohne ein genaues Datum zu nennen.","Refers to a time in the near future without giving an exact date.","Chỉ một thời điểm trong tương lai gần nhưng không nêu ngày cụ thể."],"position":["Am Satzanfang steht es auf Position 1; das finite Verb folgt direkt auf Position 2.","At the beginning it is in position 1; the finite verb follows in position 2.","Đầu câu, nó ở vị trí 1; động từ chia theo ngay ở vị trí 2."],"type":"Adverb","band":"now"},{"term":"heutzutage","ipa":"[ˈhɔʏtəˌtsaɪ̯t]","en":"nowadays","vi":"ngày nay","example":["Heutzutage buchen viele Reisende ihre Tickets online.","Nowadays, many travellers book their tickets online.","Ngày nay, nhiều du khách đặt vé trực tuyến."],"use":["Beschreibt die heutige Zeit oder typische Verhältnisse der Gegenwart.","Describes the present era or typical conditions today.","Mô tả thời đại hiện nay hoặc tình hình phổ biến ở hiện tại."],"position":["Steht oft am Satzanfang; das finite Verb folgt auf Position 2.","It often starts the sentence, followed by the finite verb in position 2.","Thường đứng đầu câu; động từ chia theo sau ở vị trí 2."],"type":"Adverb","band":"now"},{"term":"irgendwann","ipa":"[ˈɪʁɡn̩tvan]","en":"sometime; at some point","vi":"một lúc nào đó","example":["Irgendwann möchte ich die Nordsee besuchen.","I would like to visit the North Sea sometime.","Một lúc nào đó tôi muốn đến thăm biển Bắc."],"use":["Bezeichnet einen nicht näher bestimmten Zeitpunkt; der Kontext zeigt, ob Vergangenheit oder Zukunft gemeint ist.","Refers to an unspecified time; context shows whether past or future is meant.","Chỉ một thời điểm không xác định; ngữ cảnh cho biết đó là quá khứ hay tương lai."],"position":["Kann am Satzanfang stehen; dann folgt das finite Verb auf Position 2.","It can start the sentence, followed by the finite verb in position 2.","Có thể đứng đầu câu; động từ chia theo sau ở vị trí 2."],"type":"Adverb","band":"now"},{"term":"zunächst","ipa":"[tsuˈnɛːçst]","en":"first; initially","vi":"trước hết / ban đầu","example":["Zunächst kaufen wir die Fahrkarten, danach suchen wir das Gleis.","First we buy the tickets; afterwards we find the platform.","Trước hết chúng ta mua vé, sau đó tìm sân ga."],"use":["Markiert den ersten Schritt; klingt etwas geordneter oder formeller als „zuerst“.","Marks the first step; sounds a little more structured or formal than zuerst.","Đánh dấu bước đầu tiên; sắc thái chỉn chu hoặc trang trọng hơn zuerst."],"position":["Am Satzanfang folgt das finite Verb auf Position 2: „Zunächst kaufen wir …“","At the beginning, the finite verb follows in position 2.","Đầu câu, động từ chia theo sau ở vị trí 2."],"type":"Adverb","band":"sequence"},{"term":"dann","ipa":"[dan]","en":"then; next","vi":"rồi / sau đó","example":["Zuerst kaufen wir die Fahrkarten, dann steigen wir ein.","First we buy the tickets, then we get on.","Trước tiên chúng ta mua vé, rồi lên tàu."],"use":["Verbindet Handlungsschritte und nennt, was als Nächstes geschieht; je nach Kontext auch „at that time“.","Links steps in a sequence and says what happens next; depending on context, also at that time.","Nối các bước hành động và cho biết việc gì xảy ra tiếp theo; tùy ngữ cảnh cũng có nghĩa là vào lúc đó."],"position":["Beginnt dann den nächsten Hauptsatz, steht es auf Position 1 und das finite Verb folgt: „Dann steigen wir ein.“","When dann starts the next main clause, it takes position 1 and the finite verb follows.","Khi dann đứng đầu mệnh đề chính tiếp theo, nó ở vị trí 1 và động từ chia theo sau."],"type":"Adverb","band":"sequence"},{"term":"anschließend","ipa":"[ˈanʃliːsn̩t]","en":"afterwards; subsequently","vi":"tiếp theo / sau đó","example":["Wir frühstücken. Anschließend besichtigen wir die Altstadt.","We have breakfast. Afterwards, we visit the old town.","Chúng tôi ăn sáng. Tiếp theo, chúng tôi tham quan khu phố cổ."],"use":["Nennt den Schritt, der direkt auf eine gerade erwähnte Handlung folgt; häufig in Anleitungen und Berichten.","Names the step that follows an action just mentioned; common in instructions and reports.","Nêu bước diễn ra ngay sau hành động vừa nhắc; thường gặp trong hướng dẫn và bài kể."],"position":["Am Satzanfang steht anschließend auf Position 1; das finite Verb folgt auf Position 2.","At the beginning, anschließend is in position 1 and the finite verb follows in position 2.","Đầu câu, anschließend ở vị trí 1; động từ chia theo sau ở vị trí 2."],"type":"Adverb","band":"sequence"},{"term":"nachher","ipa":"[ˈnaːxheːɐ̯]","en":"later; afterwards","vi":"lát nữa / sau đó","example":["Ich rufe dich nachher an.","I will call you later.","Lát nữa tôi sẽ gọi cho bạn."],"use":["Bezeichnet einen späteren Zeitpunkt, oft später am selben Tag oder nach einem abgesprochenen Ereignis.","Refers to a later time, often later the same day or after an agreed event.","Chỉ thời điểm muộn hơn, thường là lát nữa trong ngày hoặc sau một sự kiện đã nói tới."],"position":["Steht häufig im Mittelfeld: „Ich rufe dich nachher an.“ Das trennbare Präfix steht am Satzende.","It often appears in the middle field; the separable prefix goes at the end.","Thường đứng giữa câu; tiền tố tách của động từ đứng cuối câu."],"type":"Adverb","band":"sequence"},{"term":"vorher","ipa":"[foːɐ̯ˈheːɐ̯]","en":"before that; beforehand","vi":"trước đó","example":["Vorher muss ich noch ein Hotelzimmer reservieren.","Before that, I still have to book a hotel room.","Trước đó tôi vẫn phải đặt phòng khách sạn."],"use":["Bezieht sich auf einen Zeitpunkt oder eine Handlung, die vor einem bereits bekannten Ereignis liegt.","Refers to a time or action before an event already known from context.","Chỉ thời điểm hoặc hành động trước một sự kiện đã rõ trong ngữ cảnh."],"position":["Am Satzanfang folgt das finite Verb direkt: „Vorher muss ich …“","At the beginning, the finite verb follows immediately.","Đầu câu, động từ chia theo ngay sau."],"type":"Adverb","band":"sequence"},{"term":"zuvor","ipa":"[tsuˈfoːɐ̯]","en":"previously; before that","vi":"trước đó","example":["Zuvor hatte ich noch nie in Basel übernachtet.","I had never stayed overnight in Basel before that.","Trước đó tôi chưa từng nghỉ qua đêm ở Basel."],"use":["Bedeutet „vor diesem Zeitpunkt“ und klingt meist etwas schriftlicher als vorher.","Means before that time and is usually a little more formal than vorher.","Nghĩa là trước thời điểm đó và thường mang sắc thái văn viết hơn vorher."],"position":["Kann den Satz beginnen; das finite Verb „hatte“ steht auf Position 2.","It can start the sentence; the finite verb hatte remains in position 2.","Có thể đứng đầu câu; động từ chia hatte vẫn ở vị trí 2."],"type":"Adverb","band":"sequence"},{"term":"schließlich","ipa":"[ˈʃliːslɪç]","en":"eventually; finally","vi":"cuối cùng / rốt cuộc","example":["Wir haben lange gesucht und schließlich ein Zimmer gefunden.","We searched for a long time and eventually found a room.","Chúng tôi tìm rất lâu và cuối cùng cũng tìm được một căn phòng."],"use":["Markiert das Ergebnis oder den letzten Schritt nach mehreren Ereignissen; je nach Satz auch „after all“.","Marks the result or final step after several events; depending on the sentence, it can also mean after all.","Đánh dấu kết quả hoặc bước cuối sau nhiều sự việc; tùy câu còn có thể nghĩa là xét cho cùng."],"position":["In Erzählungen steht es oft vor dem Ergebnis; am Satzanfang folgt das Verb auf Position 2.","In narratives it often appears before the result; at the beginning the verb follows in position 2.","Trong bài kể, nó thường đứng trước kết quả; nếu đứng đầu câu, động từ chia theo ở vị trí 2."],"type":"Adverb","band":"sequence"},{"term":"endlich","ipa":"[ˈɛntlɪç]","en":"finally; at last","vi":"cuối cùng cũng","example":["Endlich ist der Zug da!","The train is finally here!","Cuối cùng tàu cũng đến rồi!"],"use":["Drückt oft Erleichterung, Ungeduld oder das Ende einer langen Wartezeit aus.","Often expresses relief, impatience, or the end of a long wait.","Thường thể hiện sự nhẹ nhõm, sốt ruột hoặc việc chờ đợi lâu đã kết thúc."],"position":["Am Satzanfang folgt das finite Verb auf Position 2: „Endlich ist der Zug da.“","At the beginning, the finite verb follows in position 2.","Đầu câu, động từ chia theo sau ở vị trí 2."],"type":"Adverb","band":"sequence"},{"term":"zuletzt","ipa":"[tsuˈlɛtst]","en":"last; lastly; most recently","vi":"cuối cùng / lần gần đây nhất","example":["Zuletzt kontrollieren wir noch die Fahrkarten.","Lastly, we check the tickets.","Cuối cùng, chúng ta kiểm tra vé."],"use":["Nennt den letzten Schritt einer Reihenfolge; in anderem Kontext auch „most recently“.","Names the last step in a sequence; in other contexts, most recently.","Nêu bước cuối của trình tự; trong ngữ cảnh khác có thể là lần gần đây nhất."],"position":["Am Satzanfang steht zuletzt auf Position 1; das finite Verb folgt direkt.","At the beginning, zuletzt is in position 1 and the finite verb follows.","Đầu câu, zuletzt ở vị trí 1; động từ chia theo ngay sau."],"type":"Adverb","band":"sequence"},{"term":"inzwischen","ipa":"[ɪnˈtsvɪʃn̩]","en":"by now; meanwhile","vi":"đến nay / trong lúc đó","example":["Inzwischen ist der Bus angekommen.","By now, the bus has arrived.","Đến lúc này xe buýt đã tới."],"use":["Zeigt, dass sich während der vergangenen Zeit etwas verändert hat; je nach Kontext auch „meanwhile“.","Shows that something has changed over time; depending on context, it can also mean meanwhile.","Cho biết điều đã thay đổi trong thời gian vừa qua; tùy ngữ cảnh cũng có nghĩa là trong lúc đó."],"position":["Am Satzanfang folgt das finite Verb auf Position 2: „Inzwischen ist …“","At the beginning, the finite verb follows in position 2.","Đầu câu, động từ chia theo ở vị trí 2."],"type":"Adverb","band":"meanwhile"},{"term":"währenddessen","ipa":"[ˈvɛːʁəntˌdɛsn̩]","en":"meanwhile","vi":"trong lúc đó","example":["Linh deckt den Tisch. Währenddessen koche ich.","Linh sets the table. Meanwhile, I cook.","Linh dọn bàn. Trong lúc đó, tôi nấu ăn."],"use":["Verbindet zwei Handlungen, die zur gleichen Zeit stattfinden.","Links two actions happening at the same time.","Nối hai hành động diễn ra đồng thời."],"position":["Kann den zweiten Satz beginnen; das finite Verb folgt direkt auf Position 2.","It can start the second sentence; the finite verb follows in position 2.","Có thể đứng đầu câu thứ hai; động từ chia theo ngay ở vị trí 2."],"type":"Adverb","band":"meanwhile"},{"term":"mittlerweile","ipa":"[ˈmɪtlɐˌvaɪ̯lə]","en":"by now; in the meantime","vi":"đến nay / trong thời gian đó","example":["Mittlerweile spreche ich viel sicherer Deutsch.","By now, I speak German much more confidently.","Đến nay tôi nói tiếng Đức tự tin hơn nhiều."],"use":["Betont eine Veränderung, die sich im Lauf der Zeit ergeben hat.","Emphasizes a change that has taken place over time.","Nhấn mạnh sự thay đổi đã diễn ra theo thời gian."],"position":["Am Satzanfang folgt das finite Verb auf Position 2; im Mittelfeld ist es ebenfalls möglich.","At the beginning, the finite verb follows in position 2; it can also appear in the middle field.","Đầu câu, động từ chia theo ở vị trí 2; cũng có thể đứng giữa câu."],"type":"Adverb","band":"meanwhile"},{"term":"zwischendurch","ipa":"[ˈtsvɪʃn̩ˌdʊʁç]","en":"in between","vi":"trong lúc / xen kẽ","example":["Wir machen zwischendurch eine kurze Pause.","We take a short break in between.","Chúng tôi nghỉ giải lao ngắn giữa chừng."],"use":["Bezeichnet etwas, das innerhalb eines längeren Ablaufs zwischen anderen Tätigkeiten stattfindet.","Describes something happening between other activities during a longer process.","Chỉ việc diễn ra xen giữa các hoạt động khác trong một quá trình dài hơn."],"position":["Steht oft im Mittelfeld und kann zur Betonung auch nach vorn gestellt werden.","It often appears in the middle field and can be fronted for emphasis.","Thường đứng giữa câu; có thể đưa lên đầu để nhấn mạnh."],"type":"Adverb","band":"meanwhile"}]},"ort":{"title":"Ort · Nơi chốn","en":"Place","vi":"Nơi chốn","level":"A1–A2 · Wo? / Wohin?","intro":["Lokaladverbien beantworten Wo? (Ort) oder Wohin? (Richtung). Achte darauf, ob du einen festen Ort oder ein Ziel meinst.","Place adverbs answer “where?” or “where to?”. Check whether you mean a location or a destination.","Trạng từ nơi chốn trả lời “ở đâu?” hoặc “đi đâu?”. Hãy phân biệt vị trí cố định với đích đến."],"rule":["„Hier“ und „dort“ nennen einen Ort; „dorthin“ nennt ein Ziel. Steht das Adverb am Satzanfang, bleibt das finite Verb auf Position 2.","“Hier” and “dort” name a location; “dorthin” names a destination. If the adverb starts the sentence, the finite verb remains in position 2.","“Hier” và “dort” nêu vị trí; “dorthin” nêu đích đến. Khi trạng từ đứng đầu câu, động từ chia vẫn ở vị trí 2."],"words":[{"term":"hier","ipa":"[hiːɐ̯]","en":"here","vi":"ở đây","example":["Der Schlüssel liegt hier.","The key is here.","Chìa khóa ở đây."],"use":["Zeigt auf den Ort, an dem sich die sprechende Person befindet oder den sie meint.","Points to the speaker’s current or indicated location.","Chỉ nơi người nói đang ở hoặc đang nhắc đến."],"position":["Im Mittelfeld nach dem Verb: „Der Schlüssel liegt hier.“ Am Anfang: „Hier liegt der Schlüssel.“","In the middle field after the verb, or at the beginning with the verb in position 2.","Trong câu, đứng sau động từ; nếu đưa lên đầu thì động từ chia theo ngay sau."],"type":"Adverb"},{"term":"dort","ipa":"[dɔʁt]","en":"there / over there","vi":"ở đó / đằng kia","example":["Der Supermarkt ist dort.","The supermarket is over there.","Siêu thị ở đằng kia."],"use":["Zeigt auf einen Ort, der nicht unmittelbar hier ist.","Points to a place away from here.","Chỉ một nơi không ở ngay đây."],"position":["Wie „hier“ kann es im Mittelfeld oder auf Position 1 stehen: „Dort ist der Supermarkt.“","It can appear in the middle field or in position 1; the finite verb follows if it starts the clause.","Có thể đứng giữa câu hoặc ở vị trí 1; nếu đứng đầu thì động từ chia theo sau."],"type":"Adverb"},{"term":"drinnen","ipa":"[ˈdʁɪnən]","en":"inside","vi":"ở bên trong","example":["Die Kinder spielen drinnen.","The children are playing inside.","Bọn trẻ đang chơi bên trong nhà."],"use":["Bezeichnet einen Ort innerhalb eines Gebäudes oder Raums.","Describes a location inside a building or room.","Chỉ vị trí ở bên trong một tòa nhà hoặc căn phòng."],"position":["Im Mittelfeld steht es oft nach dem Verb: „Die Kinder spielen drinnen.“ Für Betonung: „Drinnen spielen die Kinder.“","It often follows the verb in the middle field; it can move to the beginning for emphasis.","Thường đứng sau động từ; có thể đưa lên đầu để nhấn mạnh."],"type":"Adverb"},{"term":"draußen","ipa":"[ˈdʁaʊ̯sn̩]","en":"outside","vi":"ở bên ngoài","example":["Heute essen wir draußen.","We are eating outside today.","Hôm nay chúng tôi ăn ở ngoài trời."],"use":["Bezeichnet einen Ort im Freien, außerhalb eines Gebäudes.","Describes an outdoor location, outside a building.","Chỉ nơi ngoài trời, bên ngoài tòa nhà."],"position":["Im Beispielsatz steht es nach dem Verb und nach der Zeitangabe. Am Satzanfang wäre möglich: „Draußen essen wir heute.“","Here it follows the verb and time phrase. It may also start the sentence.","Trong ví dụ, nó đứng sau động từ và cụm thời gian; cũng có thể đưa lên đầu câu."],"type":"Adverb"},{"term":"oben","ipa":"[ˈoːbn̩]","en":"upstairs / above","vi":"ở trên / tầng trên","example":["Mein Zimmer ist oben.","My room is upstairs.","Phòng tôi ở tầng trên."],"use":["Bezeichnet eine höhere Stelle oder ein oberes Stockwerk.","Describes a higher place or upper floor.","Chỉ vị trí cao hơn hoặc tầng trên."],"position":["Im Mittelfeld: „Mein Zimmer ist oben.“ Am Anfang: „Oben ist mein Zimmer.“","It can be in the middle field or at the start; if first, the finite verb follows.","Có thể đứng giữa câu hoặc đầu câu; nếu đứng đầu, động từ chia theo ngay sau."],"type":"Adverb"},{"term":"unten","ipa":"[ˈʊntn̩]","en":"downstairs / below","vi":"ở dưới / tầng dưới","example":["Die Waschmaschine steht unten.","The washing machine is downstairs.","Máy giặt ở tầng dưới."],"use":["Bezeichnet eine tiefere Stelle oder ein unteres Stockwerk.","Describes a lower place or lower floor.","Chỉ vị trí thấp hơn hoặc tầng dưới."],"position":["Im Mittelfeld nach dem Verb: „Die Waschmaschine steht unten.“ Für Betonung: „Unten steht die Waschmaschine.“","It usually follows the verb; it may move to the beginning for emphasis.","Thường đứng sau động từ; có thể đưa lên đầu câu để nhấn mạnh."],"type":"Adverb"},{"term":"dorthin","ipa":"[dɔʁtˈhɪn]","en":"to there","vi":"đến đó","example":["Wohin gehst du? Ich gehe dorthin.","Where are you going? I am going there.","Bạn đi đâu? Tôi đi đến đó."],"use":["Bezeichnet eine Richtung oder ein Ziel, nicht nur einen festen Ort.","Describes a direction or destination, not just a location.","Chỉ hướng hoặc đích đến, không chỉ vị trí cố định."],"position":["Kann nach dem Bewegungsverb stehen: „Ich gehe dorthin.“ Ein vorangestelltes Richtungsadverb steht auf Position 1, dann folgt das Verb.","It can follow a verb of movement; if fronted, the finite verb follows it in position 2.","Có thể đứng sau động từ chỉ chuyển động; nếu đưa lên đầu, động từ chia ở vị trí 2."],"type":"Adverb"},{"term":"links","ipa":"[lɪŋks]","en":"on the left","vi":"ở bên trái","example":["Die Bäckerei ist links neben der Apotheke.","The bakery is to the left of the pharmacy.","Tiệm bánh ở bên trái nhà thuốc."],"use":["Bezeichnet die linke Seite eines Bezugspunkts.","Names the left side of a reference point.","Chỉ phía bên trái của một mốc."],"position":["Meist nach dem Verb oder vor einer Ortsangabe.","Usually after the verb or before a place phrase.","Thường sau động từ hoặc trước cụm nơi chốn."],"type":"Adverb"},{"term":"rechts","ipa":"[ʁɛçts]","en":"on the right","vi":"ở bên phải","example":["Der Eingang ist rechts neben dem Aufzug.","The entrance is on the right next to the elevator.","Lối vào ở bên phải cạnh thang máy."],"use":["Bezeichnet die rechte Seite eines Bezugspunkts.","Names the right side of a reference point.","Chỉ phía bên phải của một mốc."],"position":["Meist nach dem Verb oder vor einer Ortsangabe.","Usually after the verb or before a place phrase.","Thường sau động từ hoặc trước cụm nơi chốn."],"type":"Adverb"},{"term":"vorne","ipa":"[ˈfɔʁnə]","en":"at the front","vi":"ở phía trước","example":["Die Gäste sitzen vorne im Bus.","The passengers are sitting at the front of the bus.","Hành khách ngồi ở phía trước xe buýt."],"use":["Bezeichnet den vorderen Bereich.","Names the front area.","Chỉ khu vực phía trước."],"position":["Oft nach dem Verb: „Sie sitzen vorne.“","Often after the verb.","Thường sau động từ."],"type":"Adverb"},{"term":"hinten","ipa":"[ˈhɪntn̩]","en":"at the back","vi":"ở phía sau","example":["Die Toiletten sind hinten im Flur.","The restrooms are at the back of the hallway.","Nhà vệ sinh ở phía cuối hành lang."],"use":["Bezeichnet den hinteren Bereich.","Names the back area.","Chỉ khu vực phía sau."],"position":["Oft nach dem Verb oder vor einer Ortsangabe.","Often after the verb or before a place phrase.","Thường sau động từ hoặc trước cụm nơi chốn."],"type":"Adverb"},{"term":"überall","ipa":"[ˈyːbɐˌʔal]","en":"everywhere","vi":"khắp nơi","example":["Im Park liegen überall bunte Blätter.","There are colorful leaves everywhere in the park.","Trong công viên, lá nhiều màu rơi khắp nơi."],"use":["Bezeichnet viele oder alle Orte in einem Bereich.","Refers to many or all places in an area.","Chỉ nhiều nơi hoặc mọi nơi trong một khu vực."],"position":["Im Mittelfeld oder am Anfang; bei Voranstellung folgt das Verb auf Position 2.","In the middle field or at the start; when fronted, the verb stays in position 2.","Ở giữa hoặc đầu câu; nếu đầu câu, động từ chia ở vị trí 2."],"type":"Adverb"},{"term":"irgendwo","ipa":"[ˈɪʁɡəntˌvoː]","en":"somewhere","vi":"ở đâu đó","example":["Mein Schlüssel liegt irgendwo in der Wohnung.","My key is somewhere in the apartment.","Chìa khóa của tôi ở đâu đó trong căn hộ."],"use":["Nennt einen nicht näher bestimmten Ort.","Names a place that is not specified.","Chỉ một nơi chưa xác định cụ thể."],"position":["Oft vor einer genaueren Ortsangabe.","Often before a more specific place phrase.","Thường trước cụm địa điểm cụ thể."],"type":"Adverb"},{"term":"nirgends","ipa":"[ˈnɪʁɡənts]","en":"nowhere","vi":"không ở đâu cả","example":["Hier gibt es nirgends einen Geldautomaten.","There is no cash machine anywhere around here.","Ở đây không có cây ATM nào cả."],"use":["Verneint das Vorhandensein an irgendeinem Ort.","Negates the existence of something in any place.","Phủ định việc có thứ gì ở bất cứ đâu."],"position":["Oft nahe beim Verb: „Es gibt nirgends …“","Often near the verb.","Thường gần động từ."],"type":"Adverb"},{"term":"woanders","ipa":"[voˈʔandɐs]","en":"somewhere else","vi":"ở nơi khác","example":["Wir treffen uns heute woanders.","We are meeting somewhere else today.","Hôm nay chúng ta gặp nhau ở nơi khác."],"use":["Bezeichnet einen anderen, nicht genannten Ort.","Names a different, unspecified place.","Chỉ một nơi khác chưa nói rõ."],"position":["Meist nach dem Verb oder am Satzende.","Usually after the verb or at the end.","Thường sau động từ hoặc cuối câu."],"type":"Adverb"},{"term":"hierher","ipa":"[hiːɐ̯ˈheːɐ̯]","en":"to here; over here","vi":"đến đây","example":["Kannst du bitte hierher kommen?","Can you come over here, please?","Bạn có thể đến đây giúp mình không?"],"use":["Zeigt Bewegung zum Ort der sprechenden Person.","Shows movement toward the speaker’s location.","Chỉ chuyển động hướng về chỗ người nói."],"position":["Oft nach einem Bewegungsverb.","Often after a verb of motion.","Thường sau động từ chỉ chuyển động."],"type":"Adverb"},{"term":"nebenan","ipa":"[neːbn̩ˈʔan]","en":"next door","vi":"ngay bên cạnh","example":["Unsere Nachbarn wohnen nebenan.","Our neighbors live next door.","Hàng xóm của chúng tôi sống ngay bên cạnh."],"use":["Bezeichnet einen direkt angrenzenden Ort.","Names a directly adjacent place.","Chỉ nơi ngay bên cạnh."],"position":["Meist nach dem Verb.","Usually after the verb.","Thường sau động từ."],"type":"Adverb"}]},"frequency":{"title":"Häufigkeit · Tần suất","en":"Frequency","vi":"Tần suất","level":"A1–A2 · Wie oft?","intro":["Häufigkeitsadverbien zeigen, wie oft etwas geschieht. Sie helfen, Gewohnheiten und Routinen genauer zu beschreiben.","Frequency adverbs show how often something happens. They are useful for describing habits and routines.","Trạng từ tần suất cho biết việc gì xảy ra thường xuyên đến mức nào; chúng giúp mô tả thói quen và nếp sinh hoạt."],"rule":["In einem neutralen Aussagesatz stehen sie häufig im Mittelfeld nach dem Subjekt: „Ich fahre oft mit dem Bus.“ Für Betonung können sie auf Position 1 stehen: „Oft fahre ich …“","In a neutral statement they often appear in the middle field after the subject. For emphasis they can take position 1: “Oft fahre ich …”","Trong câu kể trung tính, chúng thường đứng sau chủ ngữ ở giữa câu. Khi muốn nhấn mạnh, có thể đưa lên vị trí 1: “Oft fahre ich …”"],"words":[{"term":"immer","ipa":"[ˈɪmɐ]","en":"always","vi":"luôn luôn","example":["Ich trinke morgens immer Kaffee.","I always drink coffee in the morning.","Buổi sáng tôi luôn uống cà phê."],"use":["Beschreibt etwas, das regelmäßig oder jedes Mal geschieht.","Describes something that happens regularly or every time.","Mô tả việc diễn ra đều đặn hoặc lần nào cũng vậy."],"position":["Meist im Mittelfeld nach dem Subjekt: „Ich trinke immer …“; am Anfang mit Inversion: „Immer trinke ich …“","Usually in the middle field after the subject; at the beginning, the verb follows it.","Thường đứng sau chủ ngữ; nếu đứng đầu, động từ chia theo ngay sau."],"type":"Adverb"},{"term":"oft","ipa":"[ɔft]","en":"often","vi":"thường xuyên","example":["Wir gehen oft zu Fuß.","We often walk.","Chúng tôi thường đi bộ."],"use":["Zeigt, dass etwas häufig, aber nicht jedes Mal geschieht.","Shows that something happens frequently, but not every time.","Cho biết việc xảy ra thường xuyên nhưng không phải lần nào cũng vậy."],"position":["Im Mittelfeld nach dem Subjekt: „Wir gehen oft …“; bei Betonung: „Oft gehen wir …“","Usually after the subject; for emphasis it can start the sentence and trigger inversion.","Thường đứng sau chủ ngữ; khi nhấn mạnh có thể đứng đầu câu và đảo động từ lên sau nó."],"type":"Adverb"},{"term":"manchmal","ipa":"[ˈmançmaːl]","en":"sometimes","vi":"thỉnh thoảng","example":["Manchmal koche ich am Abend.","Sometimes I cook in the evening.","Thỉnh thoảng tôi nấu ăn vào buổi tối."],"use":["Beschreibt ein gelegentliches Ereignis, nicht eine feste Routine.","Describes an occasional event rather than a fixed routine.","Mô tả việc đôi khi xảy ra, không phải thói quen cố định."],"position":["Steht oft am Satzanfang; dann folgt das finite Verb: „Manchmal koche ich …“ Auch möglich: „Ich koche manchmal …“","It often starts the sentence, followed by the finite verb; it can also appear in the middle field.","Thường đứng đầu câu, sau đó là động từ chia; cũng có thể đứng giữa câu."],"type":"Adverb"},{"term":"selten","ipa":"[ˈzɛltn̩]","en":"rarely","vi":"hiếm khi","example":["Sie fährt selten mit dem Taxi.","She rarely takes a taxi.","Cô ấy hiếm khi đi taxi."],"use":["Zeigt, dass etwas nur in wenigen Fällen geschieht.","Shows that something happens only in a small number of cases.","Cho biết việc chỉ xảy ra trong một số ít trường hợp."],"position":["Im Mittelfeld: „Sie fährt selten …“; als Fokus am Anfang: „Selten fährt sie …“","In the middle field, or at the beginning for emphasis with the finite verb in position 2.","Đứng giữa câu; nếu nhấn mạnh ở đầu câu thì động từ chia theo ở vị trí 2."],"type":"Adverb"},{"term":"nie","ipa":"[niː]","en":"never","vi":"không bao giờ","example":["Er isst nie Fleisch.","He never eats meat.","Anh ấy không bao giờ ăn thịt."],"use":["Verneint, dass etwas jemals geschieht; „nie“ steht oft anstelle einer Häufigkeit.","Says that something does not happen at any time; it often replaces a frequency phrase.","Phủ định việc gì đó xảy ra; thường thay cho cụm chỉ tần suất."],"position":["Im Mittelfeld vor dem ergänzten Objekt: „Er isst nie Fleisch.“ Bei Satzanfang: „Nie isst er Fleisch.“","It appears in the middle field before the object; if fronted, the verb follows in position 2.","Thường đứng giữa câu, trước tân ngữ; nếu đưa lên đầu, động từ chia theo sau."],"type":"Adverb"},{"term":"meistens","ipa":"[ˈmaɪ̯stn̩s]","en":"mostly / most of the time","vi":"hầu hết / thường là","example":["Meistens fahre ich mit dem Bus.","Most of the time, I take the bus.","Hầu hết thời gian tôi đi xe buýt."],"use":["Beschreibt, was in den meisten Fällen zutrifft, lässt aber Ausnahmen zu.","Describes what is true in most cases while allowing exceptions.","Mô tả điều đúng trong đa số trường hợp nhưng vẫn có ngoại lệ."],"position":["Am Satzanfang mit Inversion: „Meistens fahre ich …“; alternativ im Mittelfeld: „Ich fahre meistens …“","It can start the sentence with inversion or appear in the middle field.","Có thể đứng đầu câu và làm động từ đảo theo, hoặc đứng giữa câu."],"type":"Adverb"},{"term":"häufig","ipa":"[ˈhɔɪ̯fɪç]","en":"frequently","vi":"thường xuyên","example":["Ich bin häufig mit dem Rad unterwegs.","I often travel by bike.","Tôi thường xuyên đi lại bằng xe đạp."],"use":["Beschreibt etwas, das oft vorkommt.","Describes something that happens often.","Mô tả việc xảy ra thường xuyên."],"position":["Meist im Mittelfeld vor der näheren Ergänzung.","Usually in the middle field before a complement.","Thường ở giữa câu trước phần bổ sung."],"type":"Adverb"},{"term":"regelmäßig","ipa":"[ˈʁeːɡl̩ˌmɛːsɪç]","en":"regularly","vi":"đều đặn","example":["Sie ruft ihre Eltern regelmäßig an.","She calls her parents regularly.","Cô ấy gọi điện cho bố mẹ đều đặn."],"use":["Betont wiederkehrende Abstände oder eine Routine.","Emphasizes recurring intervals or a routine.","Nhấn mạnh chu kỳ lặp lại hoặc thói quen."],"position":["Im Mittelfeld oder am Satzende.","In the middle field or at the end.","Ở giữa hoặc cuối câu."],"type":"Adverb"},{"term":"normalerweise","ipa":"[nɔʁˈmaːlɐˌvaɪ̯zə]","en":"normally; usually","vi":"thông thường","example":["Normalerweise esse ich um zwölf zu Mittag.","I normally have lunch at twelve.","Thông thường tôi ăn trưa lúc mười hai giờ."],"use":["Nêu điều thường xảy ra, có thể đối chiếu với ngoại lệ.","States what is usual, sometimes contrasted with an exception.","Nêu điều thường xảy ra, đôi khi đối chiếu với ngoại lệ."],"position":["Am Satzanfang oder im Mittelfeld; am Anfang folgt das Verb auf Position 2.","At the start or in the middle; at the start, the verb follows in position 2.","Đầu hoặc giữa câu; nếu đầu câu, động từ chia đứng vị trí 2."],"type":"Adverb"},{"term":"gelegentlich","ipa":"[ɡəˈleːɡəntlɪç]","en":"occasionally","vi":"thỉnh thoảng","example":["Gelegentlich gehen wir nach der Arbeit ins Kino.","We occasionally go to the cinema after work.","Thỉnh thoảng chúng tôi đi xem phim sau giờ làm."],"use":["Beschreibt etwas, das von Zeit zu Zeit geschieht.","Describes something that happens from time to time.","Mô tả việc đôi khi xảy ra."],"position":["Am Anfang oder im Mittelfeld.","At the start or in the middle field.","Đầu hoặc giữa câu."],"type":"Adverb"},{"term":"ab und zu","ipa":"[ap ʊnt ˈtsuː]","en":"now and then","vi":"thỉnh thoảng","example":["Ich trinke ab und zu einen Kaffee am Nachmittag.","I have a coffee now and then in the afternoon.","Thỉnh thoảng tôi uống cà phê vào buổi chiều."],"use":["Feste Wendung für eine gelegentliche, wiederkehrende Handlung.","Fixed phrase for an occasional repeated action.","Cụm cố định chỉ việc thỉnh thoảng lặp lại."],"position":["Im Mittelfeld nach dem Subjekt oder nahe dem Satzende.","In the middle field after the subject or near the end.","Ở giữa câu sau chủ ngữ hoặc gần cuối câu."],"type":"Feste adverbiale Wendung"},{"term":"täglich","ipa":"[ˈtɛːklɪç]","en":"daily; every day","vi":"hằng ngày","example":["Der Zug fährt täglich um 7:10 Uhr ab.","The train departs daily at 7:10.","Tàu khởi hành hằng ngày lúc 7 giờ 10."],"use":["Beschreibt, dass etwas jeden Tag geschieht.","Means something happens every day.","Chỉ việc diễn ra mỗi ngày."],"position":["Nach dem Verb oder vor einer Zeitangabe.","After the verb or before a time phrase.","Sau động từ hoặc trước cụm giờ."],"type":"Adverb"},{"term":"wöchentlich","ipa":"[ˈvœçntlɪç]","en":"weekly; every week","vi":"hằng tuần","example":["Wir treffen uns wöchentlich zum Deutschkurs.","We meet weekly for German class.","Chúng tôi gặp nhau hằng tuần để học tiếng Đức."],"use":["Beschreibt, dass etwas jede Woche geschieht.","Means something happens every week.","Chỉ việc diễn ra mỗi tuần."],"position":["Nach dem Verb oder am Satzende.","After the verb or at the end.","Sau động từ hoặc ở cuối câu."],"type":"Adverb"},{"term":"ständig","ipa":"[ˈʃtɛndɪç]","en":"constantly","vi":"liên tục","example":["Er schaut ständig auf sein Handy.","He is constantly looking at his phone.","Anh ấy liên tục nhìn vào điện thoại."],"use":["Betont sehr häufige Wiederholung, manchmal mit kritischem Ton.","Emphasizes very frequent repetition, sometimes critically.","Nhấn mạnh việc lặp lại liên tục, đôi khi mang ý phê bình."],"position":["Meist im Mittelfeld nahe beim Verb.","Usually in the middle field near the verb.","Thường ở giữa câu gần động từ."],"type":"Adverb"}]},"manner":{"title":"Art und Weise · Cách thức","en":"Manner","vi":"Cách thức","level":"A1–A2 · Wie?","intro":["Diese Adverbien beschreiben, wie jemand etwas tut oder wie eine Handlung wirkt. „Gern“ zeigt außerdem, dass jemand etwas mag.","These adverbs describe how someone does something or how an action feels. “Gern” also shows that someone enjoys an activity.","Nhóm này mô tả ai đó làm việc như thế nào hoặc hành động tạo cảm giác ra sao. “Gern” còn diễn tả sự yêu thích."],"rule":["Sie stehen häufig im Mittelfeld beim Verb oder nach einem kurzen Objekt. Wird ein Adverb zur Betonung an den Satzanfang gestellt, folgt das finite Verb auf Position 2.","They often appear in the middle field near the verb or after a short object. If fronted for emphasis, the finite verb follows in position 2.","Chúng thường đứng ở giữa câu gần động từ hoặc sau tân ngữ ngắn. Nếu đưa lên đầu để nhấn mạnh, động từ chia đứng ở vị trí 2."],"words":[{"term":"gern","ipa":"[ɡɛʁn]","en":"gladly; like to","vi":"thích làm gì","example":["Ich höre gern deutsche Musik.","I like listening to German music.","Tôi thích nghe nhạc Đức."],"use":["Steht bei einem Verb und zeigt, dass man die Handlung gern macht.","Appears with a verb to show that the person enjoys the activity.","Đi cùng động từ để cho biết người nói thích làm việc đó."],"position":["Meist nach dem konjugierten Verb und vor dem Objekt: „Ich höre gern Musik.“","Usually after the conjugated verb and before the object.","Thường đứng sau động từ chia và trước tân ngữ."],"type":"Adverb"},{"term":"lieber","ipa":"[ˈliːbɐ]","en":"preferably / rather","vi":"thích hơn","example":["Ich trinke lieber Tee als Kaffee.","I prefer tea to coffee.","Tôi thích trà hơn cà phê."],"use":["Vergleicht Vorlieben; es drückt aus, was man bevorzugt.","Compares preferences and says what someone would choose.","So sánh sở thích và nêu điều người nói ưu tiên hơn."],"position":["Steht meist direkt beim Verb: „Ich trinke lieber …“; der Vergleich mit als folgt danach.","It usually appears near the verb; the comparison with als follows.","Thường đứng gần động từ; phần so sánh với als theo sau."],"type":"Adverb"},{"term":"am liebsten","ipa":"[am ˈliːpstn̩]","en":"most of all","vi":"thích nhất","example":["Am Wochenende schlafe ich am liebsten lange.","At the weekend, I most like sleeping in.","Cuối tuần tôi thích ngủ nướng nhất."],"use":["Drückt die stärkste Vorliebe aus; es ist die Superlativform von gern.","Expresses the strongest preference; it is the superlative form of gern.","Diễn tả sở thích mạnh nhất; đây là dạng so sánh nhất của gern."],"position":["Kann nach dem Verb stehen oder für Betonung an den Satzanfang rücken: „Am liebsten schlafe ich …“","It can follow the verb or start the sentence for emphasis; the finite verb then follows.","Có thể đứng sau động từ hoặc lên đầu để nhấn mạnh; khi đó động từ chia theo ngay sau."],"type":"adverbiale Wendung"},{"term":"langsam","ipa":"[ˈlaŋzaːm]","en":"slowly","vi":"chậm","example":["Bitte sprechen Sie langsam.","Please speak slowly.","Xin hãy nói chậm."],"use":["Beschreibt ein niedriges Tempo; oft als Bitte oder Empfehlung.","Describes a slow pace; often used in a request or suggestion.","Mô tả tốc độ chậm; thường dùng trong lời đề nghị hoặc yêu cầu."],"position":["Steht beim Vollverb: „Sprechen Sie langsam.“ Bei Modalverb bleibt es beim Infinitiv: „Sie können langsam sprechen.“","It appears with the main verb; with a modal verb it stays near the infinitive.","Đứng cùng động từ chính; với động từ tình thái, nó ở gần nguyên mẫu."],"type":"Adjektiv (adverbial gebraucht)"},{"term":"schnell","ipa":"[ʃnɛl]","en":"quickly / fast","vi":"nhanh","example":["Der Bus fährt schnell.","The bus is travelling fast.","Xe buýt chạy nhanh."],"use":["Beschreibt ein hohes Tempo oder eine kurze Dauer.","Describes a high speed or short duration.","Mô tả tốc độ cao hoặc thời gian ngắn."],"position":["Steht beim Vollverb im Mittelfeld: „Der Bus fährt schnell.“","It appears in the middle field with the main verb.","Đứng ở giữa câu cùng động từ chính."],"type":"Adjektiv (adverbial gebraucht)"},{"term":"gut","ipa":"[ɡuːt]","en":"well","vi":"tốt / giỏi","example":["Sie erklärt die Aufgabe gut.","She explains the task well.","Cô ấy giải thích bài tập tốt."],"use":["Beschreibt, wie gut eine Handlung ausgeführt wird. Als Adjektiv kann gut auch ein Nomen beschreiben: „ein guter Plan“.","Describes how well an action is performed. As an adjective, gut can also describe a noun.","Mô tả hành động được thực hiện tốt ra sao. Khi bổ nghĩa cho danh từ, gut là tính từ và đổi đuôi: “ein guter Plan”."],"position":["Als Adverb bleibt gut unverändert und steht beim Verb: „Sie erklärt gut.“ Vor einem Nomen wird es dekliniert: „ein guter Plan“.","As an adverb, gut does not change and appears with the verb; before a noun it takes an adjective ending.","Làm trạng từ, gut không đổi và đứng cùng động từ; trước danh từ, nó nhận đuôi tính từ."],"type":"Adjektiv (adverbial gebraucht)"},{"term":"gemeinsam","ipa":"[ɡəˈmaɪ̯nzaːm]","en":"together","vi":"cùng nhau","example":["Wir lernen gemeinsam für die Prüfung.","We study together for the exam.","Chúng tôi cùng học cho kỳ thi."],"use":["Betont, dass Personen eine Handlung zusammen ausführen.","Emphasizes that people do an activity together.","Nhấn mạnh nhiều người cùng thực hiện một hành động."],"position":["Steht meist im Mittelfeld beim Verb oder am Satzende: „Wir lernen gemeinsam.“","It usually appears near the verb in the middle field or at the end of the clause.","Thường đứng gần động từ ở giữa câu hoặc cuối mệnh đề."],"type":"Adjektiv (adverbial gebraucht)"},{"term":"vorsichtig","ipa":"[ˈfoːɐ̯ˌzɪçtɪç]","en":"carefully; cautiously","vi":"cẩn thận","example":["Fahren Sie hier bitte vorsichtig.","Please drive carefully here.","Xin hãy lái xe cẩn thận ở đây."],"use":["Beschreibt eine Handlung, die mit Sorgfalt ausgeführt wird.","Describes an action done with care.","Mô tả hành động được làm cẩn thận."],"position":["Nach dem Verb oder einem kurzen Objekt.","After the verb or a short object.","Sau động từ hoặc tân ngữ ngắn."],"type":"Adjektiv (adverbial gebraucht)"},{"term":"leise","ipa":"[ˈlaɪ̯zə]","en":"quietly; softly","vi":"khẽ; nhẹ nhàng","example":["Die Kinder lesen leise im Zimmer.","The children are reading quietly in the room.","Bọn trẻ đọc sách khẽ trong phòng."],"use":["Beschreibt geringe Lautstärke oder eine geräuscharme Handlung.","Describes low volume or a quiet action.","Mô tả âm lượng nhỏ hoặc hành động ít gây tiếng động."],"position":["Meist nach dem Verb.","Usually after the verb.","Thường sau động từ."],"type":"Adjektiv (adverbial gebraucht)"},{"term":"sorgfältig","ipa":"[ˈzɔʁkˌfɛltɪç]","en":"carefully; thoroughly","vi":"cẩn thận; kỹ lưỡng","example":["Bitte lesen Sie die Aufgabe sorgfältig.","Please read the task carefully.","Xin hãy đọc bài tập thật kỹ."],"use":["Betont genaues und aufmerksames Arbeiten.","Emphasizes careful attention to detail.","Nhấn mạnh việc làm kỹ và chú ý chi tiết."],"position":["Nach dem Objekt oder am Satzende.","After the object or at the end.","Sau tân ngữ hoặc cuối câu."],"type":"Adjektiv (adverbial gebraucht)"},{"term":"absichtlich","ipa":"[ˈapˌzɪçtlɪç]","en":"deliberately; on purpose","vi":"cố ý","example":["Sie hat die Tür absichtlich offengelassen.","She deliberately left the door open.","Cô ấy cố ý để cửa mở."],"use":["Macht deutlich, dass etwas mit Absicht und nicht zufällig geschah.","Shows something was intentional, not accidental.","Cho biết việc xảy ra có chủ đích, không phải vô tình."],"position":["Im Mittelfeld nahe beim Verb oder beim betonten Teil.","In the middle field near the verb or emphasized element.","Ở giữa câu gần động từ hoặc phần được nhấn mạnh."],"type":"Adverb"},{"term":"allein","ipa":"[aˈlaɪ̯n]","en":"alone; by oneself","vi":"một mình","example":["Am Wochenende reise ich allein nach Hamburg.","At the weekend I am travelling to Hamburg alone.","Cuối tuần tôi đi Hamburg một mình."],"use":["Zeigt, dass jemand etwas ohne Begleitung tut.","Shows someone does something without company.","Chỉ việc ai đó làm một mình, không có người đi cùng."],"position":["Oft nach dem Verb oder am Satzende.","Often after the verb or at the end.","Thường sau động từ hoặc cuối câu."],"type":"Adverb / Adjektiv (kontextabhängig)"},{"term":"anders","ipa":"[ˈandɐs]","en":"differently; otherwise","vi":"khác đi; theo cách khác","example":["Heute machen wir die Übung anders.","Today we are doing the exercise differently.","Hôm nay chúng ta làm bài tập theo cách khác."],"use":["Bezeichnet eine andere Art als zuvor oder erwartet.","Names a manner different from what was mentioned or expected.","Chỉ cách làm khác với điều đã nói hoặc dự đoán."],"position":["Meist nach dem Verb oder Objekt.","Usually after the verb or object.","Thường sau động từ hoặc tân ngữ."],"type":"Adverb / Adjektiv (kontextabhängig)"},{"term":"freundlich","ipa":"[ˈfʁɔɪ̯ntlɪç]","en":"in a friendly manner","vi":"một cách thân thiện","example":["Die Mitarbeiterin erklärt den Weg freundlich.","The employee explains the directions in a friendly way.","Nhân viên nữ giải thích đường đi một cách thân thiện."],"use":["Beschreibt die freundliche Art einer Handlung.","Describes the friendly manner of an action.","Mô tả cách thực hiện hành động một cách thân thiện."],"position":["Nach dem Verb oder Objekt.","After the verb or object.","Sau động từ hoặc tân ngữ."],"type":"Adjektiv (adverbial gebraucht)"}]},"verbindungen":{"title":"Satzverbindungen · Nối ý","en":"Connecting ideas","vi":"Nối ý","level":"B1 · Satzverbindungen","intro":["Satzadverbien drücken Beziehungen zwischen Aussagen aus: Grund und Folge, Gegensatz oder einen zusätzlichen Gedanken.","Sentence adverbs express links between statements, such as cause and result, contrast, or an additional point.","Trạng từ nối câu thể hiện quan hệ giữa các ý như nguyên nhân–kết quả, tương phản hoặc bổ sung."],"rule":["Deshalb, trotzdem und außerdem können Position 1 besetzen; das finite Verb folgt direkt. Merktipp: „aber“ und „denn“ sind Konjunktionen, keine Satzadverbien. Bei zwei Hauptsätzen steht vor ihnen ein Komma; die Wortstellung danach bleibt Subjekt + Verb: „…, denn der Zug fällt aus.“","Deshalb, trotzdem, and außerdem can take position 1, followed immediately by the finite verb. Memory tip: aber and denn are conjunctions, not sentence adverbs. Use a comma before them when joining main clauses; the clause after them keeps subject–verb order.","Deshalb, trotzdem và außerdem có thể đứng ở vị trí 1, sau đó là động từ chia. Mẹo nhớ: aber và denn là liên từ, không phải trạng từ câu. Khi nối hai mệnh đề chính, đặt dấu phẩy trước chúng; sau đó vẫn theo trật tự chủ ngữ + động từ: “…, denn der Zug fällt aus.”"],"words":[{"term":"deshalb","ipa":"[dɛsˈhalp]","en":"therefore","vi":"vì vậy","example":["Der Zug fällt aus. Deshalb nehme ich den Bus.","The train is cancelled. Therefore, I am taking the bus.","Tàu bị hủy. Vì vậy, tôi đi xe buýt."],"use":["Zeigt eine Folge oder Konsequenz aus der vorherigen Aussage.","Shows a result or consequence of the previous statement.","Chỉ kết quả hoặc hệ quả từ ý trước."],"position":["Oft am Satzanfang: „Deshalb nehme ich …“ Das finite Verb nehme steht direkt danach auf Position 2.","Often at the beginning; the finite verb follows it directly in position 2.","Thường đứng đầu câu; động từ chia theo ngay sau ở vị trí 2."],"type":"Adverb mit Verbindungsfunktion"},{"term":"trotzdem","ipa":"[ˈtʁɔtsdeːm]","en":"nevertheless / even so","vi":"dù vậy","example":["Es regnet. Trotzdem gehen wir spazieren.","It is raining. Even so, we are going for a walk.","Trời đang mưa. Dù vậy, chúng tôi vẫn đi dạo."],"use":["Leitet eine Aussage ein, die im Gegensatz zur vorherigen Information steht.","Introduces a statement that contrasts with the previous information.","Mở đầu ý trái với thông tin vừa nêu."],"position":["Am Satzanfang steht trotzdem auf Position 1; gehen folgt auf Position 2: „Trotzdem gehen wir …“","At the beginning it takes position 1; the finite verb follows in position 2.","Đầu câu, trotzdem ở vị trí 1; động từ chia đứng vị trí 2."],"type":"Adverb mit Verbindungsfunktion"},{"term":"außerdem","ipa":"[ˈaʊ̯sɐˌdeːm]","en":"in addition / besides","vi":"ngoài ra","example":["Die Wohnung ist hell. Außerdem liegt sie nah am Bahnhof.","The apartment is bright. In addition, it is close to the station.","Căn hộ sáng sủa. Ngoài ra, nó còn gần nhà ga."],"use":["Fügt einen weiteren passenden Punkt hinzu.","Adds another relevant point.","Bổ sung thêm một ý liên quan."],"position":["Am Satzanfang: „Außerdem liegt sie …“; das finite Verb liegt kommt direkt nach dem Adverb.","At the beginning, followed immediately by the finite verb.","Đầu câu, động từ chia theo ngay sau trạng từ."],"type":"Adverb mit Verbindungsfunktion"},{"term":"dennoch","ipa":"[ˈdɛnɔx]","en":"nevertheless","vi":"tuy vậy","example":["Die Aufgabe war schwierig. Dennoch hat sie sie gelöst.","The task was difficult. Nevertheless, she solved it.","Bài tập khó. Tuy vậy, cô ấy vẫn giải được."],"use":["Markiert einen Gegensatz; der Ton wirkt etwas formeller als trotzdem.","Signals contrast; it sounds somewhat more formal than trotzdem.","Đánh dấu sự tương phản; sắc thái trang trọng hơn trotzdem một chút."],"position":["Kann am Anfang stehen: „Dennoch hat sie …“; das finite Verb hat bleibt auf Position 2.","It can start the clause; the finite verb remains in position 2.","Có thể đứng đầu mệnh đề; động từ chia vẫn ở vị trí 2."],"type":"Adverb mit Verbindungsfunktion"},{"term":"somit","ipa":"[zoˈmɪt]","en":"thus / consequently","vi":"do đó","example":["Alle Unterlagen sind vollständig. Somit können wir den Antrag abschicken.","All the documents are complete. Thus, we can send the application.","Hồ sơ đã đầy đủ. Do đó, chúng ta có thể gửi đơn."],"use":["Fasst eine Schlussfolgerung aus den vorherigen Informationen zusammen; eher schriftlich.","Summarizes a conclusion from the previous information; more common in writing.","Tóm tắt kết luận rút ra từ thông tin trước; thường gặp hơn trong văn viết."],"position":["Steht oft am Anfang eines Hauptsatzes: „Somit können wir …“; können folgt als finites Verb auf Position 2.","It often starts a main clause; the finite modal verb follows in position 2.","Thường đứng đầu câu chính; động từ tình thái chia theo ở vị trí 2."],"type":"Adverb mit Verbindungsfunktion"},{"term":"deswegen","ipa":"[dɛsˈveːɡn̩]","en":"therefore; for that reason","vi":"vì vậy; vì lý do đó","example":["Der Bus kommt nicht. Deswegen nehme ich ein Taxi.","The bus is not coming. Therefore, I am taking a taxi.","Xe buýt không đến. Vì vậy, tôi bắt taxi."],"use":["Führt eine Folge aus der vorherigen Aussage ein.","Introduces a consequence of the previous statement.","Nêu hệ quả của ý trước."],"position":["Am Anfang auf Position 1; das finite Verb folgt direkt auf Position 2.","At the start in position 1; the finite verb follows in position 2.","Đầu câu ở vị trí 1; động từ chia theo ngay ở vị trí 2."],"type":"Adverb mit Verbindungsfunktion"},{"term":"daher","ipa":"[daˈheːɐ̯]","en":"therefore; hence","vi":"do đó; vì vậy","example":["Die Straße ist gesperrt. Daher fahren wir mit der U-Bahn.","The road is closed. Hence, we are taking the subway.","Đường bị chặn. Vì vậy chúng tôi đi tàu điện ngầm."],"use":["Leitet eine Schlussfolgerung oder Folge ein.","Introduces a conclusion or result.","Dẫn vào kết luận hoặc hệ quả."],"position":["Oft am Satzanfang; danach steht das finite Verb auf Position 2.","Often at the beginning, followed by the finite verb in position 2.","Thường ở đầu câu; động từ chia theo sau ở vị trí 2."],"type":"Adverb mit Verbindungsfunktion"},{"term":"darum","ipa":"[daˈʁʊm]","en":"that is why; therefore","vi":"vì thế; bởi vậy","example":["Ich bin müde. Darum gehe ich früh ins Bett.","I am tired. That is why I am going to bed early.","Tôi mệt. Vì thế tôi đi ngủ sớm."],"use":["Nennt eine Folge oder Begründung.","Names a consequence or reason.","Nêu hệ quả hoặc lý do."],"position":["Am Satzanfang folgt das finite Verb direkt auf Position 2.","At the beginning, the finite verb follows directly in position 2.","Đầu câu thì động từ chia theo ngay ở vị trí 2."],"type":"Adverb mit Verbindungsfunktion"},{"term":"zudem","ipa":"[tsuˈdeːm]","en":"moreover; in addition","vi":"hơn nữa; ngoài ra","example":["Das Hotel liegt zentral. Zudem ist das Frühstück inklusive.","The hotel is centrally located. Moreover, breakfast is included.","Khách sạn nằm ở trung tâm. Hơn nữa, bữa sáng đã bao gồm."],"use":["Fügt einen weiteren Grund oder eine Information hinzu.","Adds another reason or piece of information.","Bổ sung lý do hoặc thông tin."],"position":["Am Satzanfang, danach Verbposition 2.","At the start, followed by verb-second order.","Đầu câu, theo sau là trật tự V2."],"type":"Adverb mit Verbindungsfunktion"},{"term":"sonst","ipa":"[zɔnst]","en":"otherwise; or else","vi":"nếu không; bằng không","example":["Beeil dich, sonst verpassen wir den Zug.","Hurry up, or else we will miss the train.","Nhanh lên, nếu không chúng ta sẽ lỡ tàu."],"use":["Nennt, was andernfalls passieren kann.","Says what may happen if not.","Nêu điều có thể xảy ra nếu không làm vậy."],"position":["Am Anfang des zweiten Satzteils; danach Verbposition 2.","At the start of the second clause, followed by verb-second order.","Đầu mệnh đề thứ hai; theo sau là trật tự V2."],"type":"Adverb mit Verbindungsfunktion"},{"term":"stattdessen","ipa":"[ʃtatˈdɛsn̩]","en":"instead","vi":"thay vào đó","example":["Der Zug fällt aus. Stattdessen fahren wir mit dem Bus.","The train is cancelled. Instead, we are taking the bus.","Tàu bị hủy. Thay vào đó, chúng tôi đi xe buýt."],"use":["Führt eine Alternative zu dem zuvor Genannten ein.","Introduces an alternative to what was just mentioned.","Đưa ra phương án thay cho điều vừa nói."],"position":["Am Satzanfang folgt das finite Verb auf Position 2.","At the beginning, the finite verb follows in position 2.","Đầu câu thì động từ chia theo sau ở vị trí 2."],"type":"Adverb mit Verbindungsfunktion"},{"term":"folglich","ipa":"[ˈfɔlklɪç]","en":"consequently","vi":"do đó / vì thế","example":["Die Daten sind unvollständig. Folglich ist ein direkter Vergleich schwierig.","The data are incomplete. Consequently, a direct comparison is difficult.","Dữ liệu chưa đầy đủ. Vì thế, việc so sánh trực tiếp gặp khó khăn."],"use":["Führt eine logische Schlussfolgerung ein; eher formell.","Introduces a logical conclusion; it is somewhat formal.","Mở đầu kết luận logic; sắc thái khá trang trọng."],"position":["Am Satzanfang: „Folglich ist …“; das finite Verb ist steht direkt danach auf Position 2.","At the beginning, followed by the finite verb in position 2.","Đầu câu, động từ chia theo ngay sau ở vị trí 2."],"type":"Adverb mit Verbindungsfunktion"}]},"nuancen":{"title":"Einschätzung & Nuancen · Nhận định & sắc thái","en":"Stance and nuance","vi":"Nhận định & sắc thái","level":"B2–C1 · Nuancen","intro":["Diese Adverbien zeigen, wie sicher, überraschend oder einschränkend eine Aussage gemeint ist. Sie helfen, differenzierter zu formulieren.","These adverbs show how certain, surprising, or qualified a statement is. They help make language more nuanced.","Nhóm trạng từ này thể hiện mức độ chắc chắn, bất ngờ hoặc giới hạn của nhận định, giúp diễn đạt có sắc thái hơn."],"rule":["Viele dieser Wörter können am Satzanfang stehen; dann folgt das finite Verb auf Position 2. Im Mittelfeld verändern sie die Betonung, ohne die Grundstellung des Verbs aufzuheben.","Many of these words can start the sentence; the finite verb then follows in position 2. In the middle field, they change emphasis without removing the verb-second rule.","Nhiều từ có thể đứng đầu câu; động từ chia theo sau ở vị trí 2. Nếu đứng giữa câu, chúng thay đổi trọng tâm nhưng không làm mất quy tắc động từ vị trí 2."],"words":[{"term":"allerdings","ipa":"[ˈalɐˌdɪŋs]","en":"however / admittedly","vi":"tuy nhiên / đúng là","example":["Der Vorschlag ist sinnvoll. Allerdings fehlen noch genaue Kosten.","The proposal makes sense. However, exact costs are still missing.","Đề xuất hợp lý. Tuy nhiên, vẫn còn thiếu chi phí cụ thể."],"use":["Leitet eine Einschränkung oder einen Gegenpunkt ein.","Introduces a qualification or counterpoint.","Mở đầu ý giới hạn hoặc ý phản biện."],"position":["Am Satzanfang: „Allerdings fehlen …“; im Mittelfeld: „Der Vorschlag ist allerdings sinnvoll.“","At the beginning the verb follows in position 2; in the middle it follows the conjugated verb.","Đầu câu thì động từ chia theo ở vị trí 2; giữa câu thường đứng sau động từ chia."],"type":"Adverb"},{"term":"hingegen","ipa":"[hɪnˈɡeːɡn̩]","en":"by contrast / whereas","vi":"ngược lại","example":["Die erste Lösung ist teuer; die zweite ist hingegen leicht umzusetzen.","The first solution is expensive; the second, by contrast, is easy to implement.","Giải pháp thứ nhất tốn kém; ngược lại, giải pháp thứ hai dễ thực hiện."],"use":["Stellt zwei Personen, Dinge oder Möglichkeiten gegenüber.","Contrasts two people, things, or options.","Đối chiếu hai người, sự việc hoặc lựa chọn."],"position":["Steht oft im Mittelfeld nach dem Subjekt oder Verb: „Die zweite ist hingegen …“; kann auch früh stehen.","It often appears in the middle field after the subject or verb, and can be placed earlier for emphasis.","Thường đứng giữa câu sau chủ ngữ hoặc động từ; cũng có thể đưa lên sớm để nhấn mạnh."],"type":"Adverb"},{"term":"offenbar","ipa":"[ˈɔfn̩ˌbaːɐ̯]","en":"apparently","vi":"có vẻ như","example":["Offenbar wurde die Nachricht nicht weitergeleitet.","Apparently, the message was not forwarded.","Có vẻ như tin nhắn đã không được chuyển tiếp."],"use":["Markiert eine Schlussfolgerung, die aus sichtbaren Hinweisen gezogen wird.","Signals an inference based on available evidence.","Đánh dấu suy luận dựa trên những dấu hiệu có thể quan sát."],"position":["Kann Position 1 besetzen: „Offenbar wurde …“; das finite Hilfsverb wurde steht auf Position 2.","It can take position 1; the finite auxiliary follows in position 2.","Có thể đứng vị trí 1; trợ động từ chia theo ở vị trí 2."],"type":"Adverb"},{"term":"immerhin","ipa":"[ɪmɐˈhɪn]","en":"at least / after all","vi":"dù sao thì / ít nhất","example":["Wir haben nicht alles geschafft. Immerhin ist der wichtigste Teil fertig.","We did not finish everything. At least the most important part is done.","Chúng tôi chưa hoàn thành mọi thứ. Dù sao, phần quan trọng nhất đã xong."],"use":["Hebt trotz eines Problems einen positiven oder wichtigen Punkt hervor.","Highlights a positive or important point despite a problem.","Nêu bật điểm tích cực hoặc quan trọng dù có khó khăn."],"position":["Am Anfang: „Immerhin ist …“; im Mittelfeld: „Der wichtigste Teil ist immerhin fertig.“","It can start the clause or appear in the middle field.","Có thể đứng đầu mệnh đề hoặc ở giữa câu."],"type":"Adverb"},{"term":"ohnehin","ipa":"[ˈoːnəˌhɪn]","en":"anyway","vi":"dù sao thì / vốn dĩ","example":["Wir müssen ohnehin bis Freitag entscheiden.","We have to make a decision by Friday anyway.","Dù sao thì chúng ta cũng phải quyết định trước thứ Sáu."],"use":["Drückt aus, dass etwas unabhängig von der vorherigen Information gilt.","Says that something is true regardless of the previous information.","Cho biết điều gì đó vẫn đúng bất kể thông tin vừa nêu."],"position":["Steht meist im Mittelfeld: „Wir müssen ohnehin …“; es kann je nach Betonung auch vorangestellt werden.","It usually appears in the middle field; it can be fronted for emphasis.","Thường đứng giữa câu; có thể đưa lên đầu tùy điều muốn nhấn mạnh."],"type":"Adverb"},{"term":"vielleicht","ipa":"[flaɪ̯çt]","en":"perhaps / maybe","vi":"có lẽ","example":["Vielleicht kommt Anna heute zum Kurs.","Perhaps Anna is coming to class today.","Có lẽ hôm nay Anna sẽ đến lớp."],"use":["Drückt eine Möglichkeit aus, ohne sie als sicher darzustellen.","Expresses a possibility without presenting it as certain.","Diễn tả khả năng nhưng không khẳng định chắc chắn."],"position":["Am Satzanfang: „Vielleicht kommt Anna …“; das finite Verb kommt folgt auf Position 2. Auch möglich: „Anna kommt vielleicht …“","At the beginning the finite verb follows in position 2; it can also appear in the middle field.","Đầu câu, động từ chia theo ở vị trí 2; cũng có thể đứng giữa câu."],"type":"Adverb"},{"term":"wahrscheinlich","ipa":"[vaːɐ̯ˈʃaɪ̯ntlɪç]","en":"probably; likely","vi":"có lẽ; có khả năng","example":["Der Zug kommt wahrscheinlich zehn Minuten später.","The train will probably arrive ten minutes later.","Có lẽ tàu sẽ đến muộn mười phút."],"use":["Drückt eine wahrscheinliche, aber nicht sichere Vermutung aus.","Expresses a likely but uncertain prediction.","Diễn tả dự đoán có khả năng nhưng chưa chắc chắn."],"position":["Meist im Mittelfeld; bei Voranstellung folgt das Verb auf Position 2.","Usually in the middle field; when fronted, the verb stays in position 2.","Thường ở giữa câu; nếu đầu câu, động từ chia ở vị trí 2."],"type":"Satzadverb"},{"term":"vermutlich","ipa":"[fɛɐ̯ˈmuːtlɪç]","en":"presumably; probably","vi":"có lẽ; theo dự đoán","example":["Sie ist vermutlich noch im Büro.","She is probably still at the office.","Có lẽ cô ấy vẫn còn ở văn phòng."],"use":["Markiert eine vorsichtige Schlussfolgerung aus vorhandenen Hinweisen.","Signals a cautious inference from available evidence.","Đánh dấu suy đoán thận trọng từ thông tin hiện có."],"position":["Im Mittelfeld oder am Satzanfang mit Verbposition 2.","In the middle field or at the start with verb-second order.","Ở giữa hoặc đầu câu với động từ chia ở vị trí 2."],"type":"Satzadverb"},{"term":"anscheinend","ipa":"[ˈanˌʃaɪ̯nənt]","en":"apparently; seemingly","vi":"xem ra; có vẻ","example":["Anscheinend hat das Museum heute geschlossen.","Apparently, the museum is closed today.","Xem ra hôm nay bảo tàng đóng cửa."],"use":["Zeigt eine Schlussfolgerung aus sichtbaren Anzeichen.","Shows an inference from visible signs.","Chỉ suy luận từ những dấu hiệu quan sát được."],"position":["Am Satzanfang folgt das finite Verb auf Position 2.","At the beginning, the finite verb follows in position 2.","Đầu câu, động từ chia theo sau ở vị trí 2."],"type":"Satzadverb"},{"term":"hoffentlich","ipa":"[ˈhɔfn̩tlɪç]","en":"hopefully","vi":"hy vọng là","example":["Hoffentlich finden wir den richtigen Weg.","Hopefully, we will find the right way.","Hy vọng là chúng ta tìm được đường đúng."],"use":["Drückt einen Wunsch oder eine Hoffnung des Sprechers aus.","Expresses the speaker’s hope or wish.","Diễn tả mong muốn hoặc hy vọng của người nói."],"position":["Oft am Satzanfang; das finite Verb folgt auf Position 2.","Often at the beginning, followed by the finite verb in position 2.","Thường đầu câu; động từ chia theo sau ở vị trí 2."],"type":"Satzadverb"},{"term":"leider","ipa":"[ˈlaɪ̯dɐ]","en":"unfortunately","vi":"tiếc là; đáng tiếc","example":["Leider ist das Zimmer heute schon vergeben.","Unfortunately, the room is already booked today.","Tiếc là hôm nay căn phòng đã có người đặt."],"use":["Drückt Bedauern über eine unerwünschte Information aus.","Expresses regret about unwelcome information.","Thể hiện sự tiếc nuối trước tin không mong muốn."],"position":["Am Anfang oder im Mittelfeld; bei Voranstellung gilt Verbposition 2.","At the start or in the middle; when fronted, verb-second applies.","Đầu hoặc giữa câu; nếu đầu câu, động từ chia ở vị trí 2."],"type":"Satzadverb"},{"term":"eigentlich","ipa":"[ˈaɪ̯ɡntlɪç]","en":"actually; really","vi":"thật ra; thực ra","example":["Eigentlich wollte ich heute zu Hause bleiben.","Actually, I wanted to stay at home today.","Thật ra hôm nay tôi định ở nhà."],"use":["Kann eine wirkliche Absicht markieren oder eine Frage abschwächen.","Can mark a real intention or soften a question.","Có thể nêu ý định thật hoặc làm câu hỏi bớt trực tiếp."],"position":["Im Mittelfeld oder am Satzanfang; dann folgt das finite Verb auf Position 2.","In the middle field or at the start; the finite verb then follows in position 2.","Ở giữa hoặc đầu câu; nếu đầu câu, động từ chia ở vị trí 2."],"type":"Adverb / Modalpartikel (kontextabhängig)"},{"term":"eventuell","ipa":"[eˈvɛntu̯ɛl]","en":"possibly; perhaps","vi":"có thể; có lẽ","example":["Wir können eventuell einen späteren Zug nehmen.","We can possibly take a later train.","Chúng ta có thể đi chuyến tàu muộn hơn."],"use":["Nennt eine mögliche Option; bedeutet nicht „schließlich“.","Names a possible option; it does not mean “eventually”.","Nêu một phương án có thể; không có nghĩa là “cuối cùng”."],"position":["Meist im Mittelfeld nahe beim Verb.","Usually in the middle field near the verb.","Thường ở giữa câu gần động từ."],"type":"Satzadverb"},{"term":"natürlich","ipa":"[naˈtyːɐ̯lɪç]","en":"of course; naturally","vi":"tất nhiên","example":["Natürlich helfe ich dir mit dem Koffer.","Of course I will help you with the suitcase.","Tất nhiên tôi sẽ giúp bạn xách va-li."],"use":["Markiert etwas Selbstverständliches oder eine freundliche Zustimmung.","Marks something obvious or a friendly affirmative response.","Nêu điều hiển nhiên hoặc lời đồng ý thân thiện."],"position":["Am Satzanfang folgt das finite Verb auf Position 2.","At the beginning, the finite verb follows in position 2.","Đầu câu thì động từ chia theo sau ở vị trí 2."],"type":"Satzadverb"},{"term":"sicherlich","ipa":"[ˈzɪçɐlɪç]","en":"certainly; surely","vi":"chắc chắn","example":["Sie wird sich sicherlich über die Nachricht freuen.","She will certainly be happy about the news.","Chắc chắn cô ấy sẽ vui khi nghe tin."],"use":["Drückt eine starke, aber nicht absolute Sicherheit aus.","Expresses strong but not absolute confidence.","Thể hiện sự tin tưởng cao nhưng không tuyệt đối."],"position":["Meist im Mittelfeld vor der bewerteten Aussage.","Usually in the middle field before the element being qualified.","Thường giữa câu trước phần được nhận định."],"type":"Satzadverb"}]},"exercises":{"title":"Üben · Luyện tập","en":"Practice","vi":"Luyện tập","level":"Wiederholen · Ôn tập","intro":["Löse zuerst selbst. Öffne danach die Karte und vergleiche Antwort, Bedeutung und Satzstellung.","Try each item first. Then open the card to compare the answer, meaning, and word order.","Hãy tự làm trước, rồi mở từng thẻ để so đáp án, nghĩa và trật tự từ."],"exercises":[{"q":["Heute ___ ich mit dem Bus zur Arbeit.","Today I take the bus to work.","Hôm nay tôi đi làm bằng xe buýt."],"a":["Heute fahre ich mit dem Bus zur Arbeit.","Heute = Zeitangabe auf Position 1; das finite Verb fahre steht auf Position 2.","Heute is in position 1; the finite verb fahre is in position 2.","Heute ở vị trí 1; động từ chia fahre ở vị trí 2."]},{"q":["Wie oft gehst du schwimmen? – Ich gehe ___ schwimmen, aber nicht jede Woche.","How often do you swim? – I swim sometimes, but not every week.","Bạn đi bơi bao lâu một lần? – Thỉnh thoảng tôi đi bơi, nhưng không phải tuần nào cũng đi."],"a":["Wie oft gehst du schwimmen? – Ich gehe manchmal schwimmen.","Manchmal beschreibt eine gelegentliche Handlung und steht hier im Mittelfeld.","Manchmal describes an occasional action and appears in the middle field here.","Manchmal diễn tả việc đôi khi xảy ra và đứng ở giữa câu trong ví dụ này."]},{"q":["Der Zug fällt aus. ___ nehme ich den Bus.","The train is cancelled. Therefore, I am taking the bus.","Tàu bị hủy. Vì vậy, tôi đi xe buýt."],"a":["Der Zug fällt aus. Deshalb nehme ich den Bus.","Deshalb expresses a consequence. At the beginning it takes position 1, so nehme follows in position 2.","Deshalb diễn tả kết quả. Khi đứng đầu câu, nó chiếm vị trí 1 và nehme theo sau ở vị trí 2."]},{"q":["Es regnet, ___ gehen wir spazieren.","It is raining, but we are going for a walk.","Trời đang mưa, nhưng chúng tôi vẫn đi dạo."],"a":["Es regnet, aber wir gehen spazieren.","Aber is a coordinating conjunction, not an adverb. Put a comma before it when it joins two main clauses; after aber, the normal subject–verb order remains.","Aber là liên từ, không phải trạng từ. Đặt dấu phẩy trước aber khi nối hai mệnh đề chính; sau aber vẫn giữ trật tự chủ ngữ–động từ bình thường."]}]}}</script>
<script>
(() => {
 const D=JSON.parse(document.getElementById("lesson-data").textContent);
 const app=document.getElementById("app");
 const order=["zeit","ort","frequency","manner","verbindungen","nuancen","exercises"];
 const labels={zeit:"A1–B2 · Zeit & Reihenfolge",ort:"A1–A2 · Ortsangaben",frequency:"A1–A2 · Häufigkeit",manner:"A1–A2 · Art und Weise",verbindungen:"B1 · Satzverbindungen",nuancen:"B2–C1 · Nuancen",exercises:"Wiederholen · Üben"};
 const esc=(s)=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
 const trip=(arr)=>'<div class="triple">'+arr.map((x,i)=>'<p><b>'+["DE","EN","VI"][i]+':</b> '+esc(x)+'</p>').join("")+'</div>';
 const cardHref=(k)=>'./deutsch-adverbien.html?gruppe='+encodeURIComponent(k)+'#inhalt';
 function overview(){
  const cats=order.map(k=>{const c=D[k],count=c.words?.length??c.exercises?.length??0;return '<a class="category" href="'+cardHref(k)+'"><span class="level">'+esc(labels[k])+'</span><h3>'+esc(c.title.split(" · ")[0])+'</h3><p class="meta">'+esc(c.en)+' · '+esc(c.vi)+'</p>'+trip(c.intro)+'<span class="open">Öffnen · Mở nội dung →</span><span class="count">'+count+(k==="exercises"?" Übungen · bài luyện":" Wörter · từ")+'</span></a>'}).join("");
