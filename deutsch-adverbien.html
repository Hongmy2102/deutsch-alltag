<script id="lesson-data" type="application/json">{"overview":{"title":"Einführung & Überblick · Giới thiệu tổng quan","level":"A1–C1 · Grundlagen","intro":["Adverbien geben zusätzliche Informationen zu Zeit, Ort, Häufigkeit, Art und Weise oder zur Einschätzung einer Aussage. Sie verändern ihre Form normalerweise nicht.","Adverbs add information about time, place, frequency, manner, or the speaker’s view. They normally do not change form.","Trạng từ bổ sung thông tin về thời gian, nơi chốn, tần suất, cách thức hoặc nhận định. Thông thường, chúng không biến đổi hình thức."]},"zeit":{"title":"Zeit · Thời gian","en":"Time","vi":"Thời gian","level":"A1–A2 · Wann?","intro":["Zeitadverbien sagen, wann etwas passiert oder in welcher Reihenfolge Handlungen stattfinden.","Time adverbs tell when something happens or in what order actions take place.","Trạng từ thời gian cho biết việc xảy ra khi nào hoặc trình tự các hành động."],"rule":["Steht die Zeitangabe am Satzanfang, besetzt sie Position 1; das finite Verb folgt auf Position 2: „Heute lerne ich.“ Im Mittelfeld kann sie auch nach dem Subjekt stehen: „Ich lerne heute.“","When a time adverbial starts the sentence, it takes position 1 and the finite verb follows in position 2. It can also appear in the middle field: “Ich lerne heute.”","Khi trạng từ thời gian đứng đầu câu, nó chiếm vị trí 1 và động từ chia theo sau ở vị trí 2. Nó cũng có thể đứng giữa câu: “Ich lerne heute.”"],"words":[{"term":"heute","ipa":"[ˈhɔʏtə]","en":"today","vi":"hôm nay","example":["Heute lerne ich neue Wörter.","Today I am learning new words.","Hôm nay tôi học từ mới."],"use":["Verwendet für etwas, das am heutigen Tag geschieht.","Use it for something happening on the current day.","Dùng cho việc diễn ra trong ngày hôm nay."],"position":["Am Satzanfang: heute auf Position 1, lerne auf Position 2. Auch möglich: „Ich lerne heute.“","At the beginning: heute is in position 1 and lerne in position 2. Also possible: “Ich lerne heute.”","Đầu câu: heute ở vị trí 1, lerne ở vị trí 2. Cũng có thể nói: “Ich lerne heute.”"],"type":"Adverb"},{"term":"morgen","ipa":"[ˈmɔʁɡn̩]","en":"tomorrow","vi":"ngày mai","example":["Morgen fährt der Zug um acht Uhr ab.","The train leaves at eight tomorrow.","Ngày mai tàu khởi hành lúc tám giờ."],"use":["Bezeichnet den Tag nach heute.","Refers to the day after today.","Chỉ ngày kế tiếp hôm nay."],"position":["Am Satzanfang folgt das finite Verb direkt: „Morgen fährt …“; ab steht als trennbares Präfix am Satzende.","At the beginning, the finite verb follows immediately: “Morgen fährt …”; the separable prefix ab goes at the end.","Đầu câu, động từ chia theo ngay sau: “Morgen fährt …”; tiền tố tách ab đứng cuối câu."],"type":"Adverb"},{"term":"jetzt","ipa":"[jɛtst]","en":"now","vi":"bây giờ","example":["Jetzt habe ich Zeit.","I have time now.","Bây giờ tôi có thời gian."],"use":["Betont den gegenwärtigen Zeitpunkt oder einen Wechsel zur Gegenwart.","Emphasizes the present moment or a change to what is happening now.","Nhấn mạnh thời điểm hiện tại hoặc chuyển sang việc đang diễn ra bây giờ."],"position":["Am Anfang: „Jetzt habe ich …“; im Mittelfeld: „Ich habe jetzt Zeit.“","At the beginning: “Jetzt habe ich …”; in the middle field: “Ich habe jetzt Zeit.”","Đầu câu: “Jetzt habe ich …”; giữa câu: “Ich habe jetzt Zeit.”"],"type":"Adverb"},{"term":"später","ipa":"[ˈʃpɛːtɐ]","en":"later","vi":"lát nữa / sau này","example":["Später rufe ich dich an.","I will call you later.","Lát nữa tôi sẽ gọi cho bạn."],"use":["Verweist auf einen Zeitpunkt nach dem aktuellen Moment.","Refers to a time after the present moment.","Chỉ thời điểm sau lúc hiện tại."],"position":["Kann Position 1 einnehmen; das finite Verb kommt dann auf Position 2. Im Mittelfeld steht es oft nach dem Subjekt.","It can take position 1; the finite verb then comes in position 2. In the middle field, it often follows the subject.","Có thể đứng vị trí 1; động từ chia theo ở vị trí 2. Trong câu, nó thường đứng sau chủ ngữ."],"type":"Adverb"},{"term":"zuerst","ipa":"[tsuˈʔeːɐ̯st]","en":"first","vi":"trước tiên","example":["Zuerst frühstücke ich.","First, I have breakfast.","Trước tiên, tôi ăn sáng."],"use":["Markiert den ersten Schritt oder die erste Handlung einer Abfolge.","Marks the first step or action in a sequence.","Đánh dấu bước hoặc hành động đầu tiên trong một trình tự."],"position":["Bei Position 1 folgt das Verb direkt: „Zuerst frühstücke ich.“ Nicht: „Zuerst ich frühstücke.“","When it is in position 1, the verb follows immediately: “Zuerst frühstücke ich.”","Khi đứng vị trí 1, động từ theo ngay sau: “Zuerst frühstücke ich.”"],"type":"Adverb"},{"term":"danach","ipa":"[daˈnaːx]","en":"afterwards","vi":"sau đó","example":["Danach gehe ich zur Arbeit.","Afterwards, I go to work.","Sau đó tôi đi làm."],"use":["Verknüpft eine Handlung mit dem Schritt, der zeitlich darauf folgt.","Links an action to the next step in time.","Nối một hành động với việc xảy ra tiếp theo."],"position":["Am Satzanfang besetzt danach Position 1; das finite Verb steht auf Position 2: „Danach gehe ich …“","At the beginning, danach takes position 1 and the finite verb stays in position 2.","Đầu câu, danach ở vị trí 1; động từ chia vẫn ở vị trí 2: “Danach gehe ich …”"],"type":"Adverb"},{"term":"bald","ipa":"[balt]","en":"soon","vi":"sắp / chẳng bao lâu nữa","example":["Der Bus kommt bald.","The bus will arrive soon.","Xe buýt sắp đến."],"use":["Sagt, dass etwas in naher Zukunft geschieht.","Says that something will happen in the near future.","Cho biết việc gì đó sẽ xảy ra trong tương lai gần."],"position":["Im Mittelfeld steht bald häufig nach dem Verb: „Der Bus kommt bald.“ Es kann auch am Satzanfang stehen: „Bald kommt der Bus.“","In the middle field it often follows the verb; it can also start the sentence, followed by the finite verb.","Trong câu, bald thường đứng sau động từ; cũng có thể đứng đầu câu, rồi đến động từ chia."],"type":"Adverb"},{"term":"gestern","ipa":"[ˈɡɛstɐn]","en":"yesterday","vi":"hôm qua","example":["Gestern habe ich meine Freundin besucht.","Yesterday I visited my friend.","Hôm qua tôi đã đến thăm bạn mình."],"use":["Bezeichnet den Tag vor heute; häufig zusammen mit dem Perfekt für abgeschlossene Erlebnisse.","Refers to the day before today; often used with the present perfect for completed experiences.","Chỉ ngày trước hôm nay; thường dùng với Perfekt để kể việc đã hoàn tất."],"position":["Am Satzanfang: „Gestern habe ich …“; das finite Hilfsverb habe steht auf Position 2, besucht am Satzende.","At the beginning: “Gestern habe ich …”; the finite auxiliary habe is in position 2 and besucht goes at the end.","Đầu câu: “Gestern habe ich …”; trợ động từ chia habe ở vị trí 2, besucht ở cuối câu."],"type":"Adverb"}]},"ort":{"title":"Ort · Nơi chốn","en":"Place","vi":"Nơi chốn","level":"A1–A2 · Wo? / Wohin?","intro":["Lokaladverbien beantworten Wo? (Ort) oder Wohin? (Richtung). Achte darauf, ob du einen festen Ort oder ein Ziel meinst.","Place adverbs answer “where?” or “where to?”. Check whether you mean a location or a destination.","Trạng từ nơi chốn trả lời “ở đâu?” hoặc “đi đâu?”. Hãy phân biệt vị trí cố định với đích đến."],"rule":["„Hier“ und „dort“ nennen einen Ort; „dorthin“ nennt ein Ziel. Steht das Adverb am Satzanfang, bleibt das finite Verb auf Position 2.","“Hier” and “dort” name a location; “dorthin” names a destination. If the adverb starts the sentence, the finite verb remains in position 2.","“Hier” và “dort” nêu vị trí; “dorthin” nêu đích đến. Khi trạng từ đứng đầu câu, động từ chia vẫn ở vị trí 2."],"words":[{"term":"hier","ipa":"[hiːɐ̯]","en":"here","vi":"ở đây","example":["Der Schlüssel liegt hier.","The key is here.","Chìa khóa ở đây."],"use":["Zeigt auf den Ort, an dem sich die sprechende Person befindet oder den sie meint.","Points to the speaker’s current or indicated location.","Chỉ nơi người nói đang ở hoặc đang nhắc đến."],"position":["Im Mittelfeld nach dem Verb: „Der Schlüssel liegt hier.“ Am Anfang: „Hier liegt der Schlüssel.“","In the middle field after the verb, or at the beginning with the verb in position 2.","Trong câu, đứng sau động từ; nếu đưa lên đầu thì động từ chia theo ngay sau."],"type":"Adverb"},{"term":"dort","ipa":"[dɔʁt]","en":"there / over there","vi":"ở đó / đằng kia","example":["Der Supermarkt ist dort.","The supermarket is over there.","Siêu thị ở đằng kia."],"use":["Zeigt auf einen Ort, der nicht unmittelbar hier ist.","Points to a place away from here.","Chỉ một nơi không ở ngay đây."],"position":["Wie „hier“ kann es im Mittelfeld oder auf Position 1 stehen: „Dort ist der Supermarkt.“","It can appear in the middle field or in position 1; the finite verb follows if it starts the clause.","Có thể đứng giữa câu hoặc ở vị trí 1; nếu đứng đầu thì động từ chia theo sau."],"type":"Adverb"},{"term":"drinnen","ipa":"[ˈdʁɪnən]","en":"inside","vi":"ở bên trong","example":["Die Kinder spielen drinnen.","The children are playing inside.","Bọn trẻ đang chơi bên trong nhà."],"use":["Bezeichnet einen Ort innerhalb eines Gebäudes oder Raums.","Describes a location inside a building or room.","Chỉ vị trí ở bên trong một tòa nhà hoặc căn phòng."],"position":["Im Mittelfeld steht es oft nach dem Verb: „Die Kinder spielen drinnen.“ Für Betonung: „Drinnen spielen die Kinder.“","It often follows the verb in the middle field; it can move to the beginning for emphasis.","Thường đứng sau động từ; có thể đưa lên đầu để nhấn mạnh."],"type":"Adverb"},{"term":"draußen","ipa":"[ˈdʁaʊ̯sn̩]","en":"outside","vi":"ở bên ngoài","example":["Heute essen wir draußen.","We are eating outside today.","Hôm nay chúng tôi ăn ở ngoài trời."],"use":["Bezeichnet einen Ort im Freien, außerhalb eines Gebäudes.","Describes an outdoor location, outside a building.","Chỉ nơi ngoài trời, bên ngoài tòa nhà."],"position":["Im Beispielsatz steht es nach dem Verb und nach der Zeitangabe. Am Satzanfang wäre möglich: „Draußen essen wir heute.“","Here it follows the verb and time phrase. It may also start the sentence.","Trong ví dụ, nó đứng sau động từ và cụm thời gian; cũng có thể đưa lên đầu câu."],"type":"Adverb"},{"term":"oben","ipa":"[ˈoːbn̩]","en":"upstairs / above","vi":"ở trên / tầng trên","example":["Mein Zimmer ist oben.","My room is upstairs.","Phòng tôi ở tầng trên."],"use":["Bezeichnet eine höhere Stelle oder ein oberes Stockwerk.","Describes a higher place or upper floor.","Chỉ vị trí cao hơn hoặc tầng trên."],"position":["Im Mittelfeld: „Mein Zimmer ist oben.“ Am Anfang: „Oben ist mein Zimmer.“","It can be in the middle field or at the start; if first, the finite verb follows.","Có thể đứng giữa câu hoặc đầu câu; nếu đứng đầu, động từ chia theo ngay sau."],"type":"Adverb"},{"term":"unten","ipa":"[ˈʊntn̩]","en":"downstairs / below","vi":"ở dưới / tầng dưới","example":["Die Waschmaschine steht unten.","The washing machine is downstairs.","Máy giặt ở tầng dưới."],"use":["Bezeichnet eine tiefere Stelle oder ein unteres Stockwerk.","Describes a lower place or lower floor.","Chỉ vị trí thấp hơn hoặc tầng dưới."],"position":["Im Mittelfeld nach dem Verb: „Die Waschmaschine steht unten.“ Für Betonung: „Unten steht die Waschmaschine.“","It usually follows the verb; it may move to the beginning for emphasis.","Thường đứng sau động từ; có thể đưa lên đầu câu để nhấn mạnh."],"type":"Adverb"},{"term":"dorthin","ipa":"[dɔʁtˈhɪn]","en":"to there","vi":"đến đó","example":["Wohin gehst du? Ich gehe dorthin.","Where are you going? I am going there.","Bạn đi đâu? Tôi đi đến đó."],"use":["Bezeichnet eine Richtung oder ein Ziel, nicht nur einen festen Ort.","Describes a direction or destination, not just a location.","Chỉ hướng hoặc đích đến, không chỉ vị trí cố định."],"position":["Kann nach dem Bewegungsverb stehen: „Ich gehe dorthin.“ Ein vorangestelltes Richtungsadverb steht auf Position 1, dann folgt das Verb.","It can follow a verb of movement; if fronted, the finite verb follows it in position 2.","Có thể đứng sau động từ chỉ chuyển động; nếu đưa lên đầu, động từ chia ở vị trí 2."],"type":"Adverb"}]},"frequency":{"title":"Häufigkeit · Tần suất","en":"Frequency","vi":"Tần suất","level":"A1–A2 · Wie oft?","intro":["Häufigkeitsadverbien zeigen, wie oft etwas geschieht. Sie helfen, Gewohnheiten und Routinen genauer zu beschreiben.","Frequency adverbs show how often something happens. They are useful for describing habits and routines.","Trạng từ tần suất cho biết việc gì xảy ra thường xuyên đến mức nào; chúng giúp mô tả thói quen và nếp sinh hoạt."],"rule":["In einem neutralen Aussagesatz stehen sie häufig im Mittelfeld nach dem Subjekt: „Ich fahre oft mit dem Bus.“ Für Betonung können sie auf Position 1 stehen: „Oft fahre ich …“","In a neutral statement they often appear in the middle field after the subject. For emphasis they can take position 1: “Oft fahre ich …”","Trong câu kể trung tính, chúng thường đứng sau chủ ngữ ở giữa câu. Khi muốn nhấn mạnh, có thể đưa lên vị trí 1: “Oft fahre ich …”"],"words":[{"term":"immer","ipa":"[ˈɪmɐ]","en":"always","vi":"luôn luôn","example":["Ich trinke morgens immer Kaffee.","I always drink coffee in the morning.","Buổi sáng tôi luôn uống cà phê."],"use":["Beschreibt etwas, das regelmäßig oder jedes Mal geschieht.","Describes something that happens regularly or every time.","Mô tả việc diễn ra đều đặn hoặc lần nào cũng vậy."],"position":["Meist im Mittelfeld nach dem Subjekt: „Ich trinke immer …“; am Anfang mit Inversion: „Immer trinke ich …“","Usually in the middle field after the subject; at the beginning, the verb follows it.","Thường đứng sau chủ ngữ; nếu đứng đầu, động từ chia theo ngay sau."],"type":"Adverb"},{"term":"oft","ipa":"[ɔft]","en":"often","vi":"thường xuyên","example":["Wir gehen oft zu Fuß.","We often walk.","Chúng tôi thường đi bộ."],"use":["Zeigt, dass etwas häufig, aber nicht jedes Mal geschieht.","Shows that something happens frequently, but not every time.","Cho biết việc xảy ra thường xuyên nhưng không phải lần nào cũng vậy."],"position":["Im Mittelfeld nach dem Subjekt: „Wir gehen oft …“; bei Betonung: „Oft gehen wir …“","Usually after the subject; for emphasis it can start the sentence and trigger inversion.","Thường đứng sau chủ ngữ; khi nhấn mạnh có thể đứng đầu câu và đảo động từ lên sau nó."],"type":"Adverb"},{"term":"manchmal","ipa":"[ˈmançmaːl]","en":"sometimes","vi":"thỉnh thoảng","example":["Manchmal koche ich am Abend.","Sometimes I cook in the evening.","Thỉnh thoảng tôi nấu ăn vào buổi tối."],"use":["Beschreibt ein gelegentliches Ereignis, nicht eine feste Routine.","Describes an occasional event rather than a fixed routine.","Mô tả việc đôi khi xảy ra, không phải thói quen cố định."],"position":["Steht oft am Satzanfang; dann folgt das finite Verb: „Manchmal koche ich …“ Auch möglich: „Ich koche manchmal …“","It often starts the sentence, followed by the finite verb; it can also appear in the middle field.","Thường đứng đầu câu, sau đó là động từ chia; cũng có thể đứng giữa câu."],"type":"Adverb"},{"term":"selten","ipa":"[ˈzɛltn̩]","en":"rarely","vi":"hiếm khi","example":["Sie fährt selten mit dem Taxi.","She rarely takes a taxi.","Cô ấy hiếm khi đi taxi."],"use":["Zeigt, dass etwas nur in wenigen Fällen geschieht.","Shows that something happens only in a small number of cases.","Cho biết việc chỉ xảy ra trong một số ít trường hợp."],"position":["Im Mittelfeld: „Sie fährt selten …“; als Fokus am Anfang: „Selten fährt sie …“","In the middle field, or at the beginning for emphasis with the finite verb in position 2.","Đứng giữa câu; nếu nhấn mạnh ở đầu câu thì động từ chia theo ở vị trí 2."],"type":"Adverb"},{"term":"nie","ipa":"[niː]","en":"never","vi":"không bao giờ","example":["Er isst nie Fleisch.","He never eats meat.","Anh ấy không bao giờ ăn thịt."],"use":["Verneint, dass etwas jemals geschieht; „nie“ steht oft anstelle einer Häufigkeit.","Says that something does not happen at any time; it often replaces a frequency phrase.","Phủ định việc gì đó xảy ra; thường thay cho cụm chỉ tần suất."],"position":["Im Mittelfeld vor dem ergänzten Objekt: „Er isst nie Fleisch.“ Bei Satzanfang: „Nie isst er Fleisch.“","It appears in the middle field before the object; if fronted, the verb follows in position 2.","Thường đứng giữa câu, trước tân ngữ; nếu đưa lên đầu, động từ chia theo sau."],"type":"Adverb"},{"term":"meistens","ipa":"[ˈmaɪ̯stn̩s]","en":"mostly / most of the time","vi":"hầu hết / thường là","example":["Meistens fahre ich mit dem Bus.","Most of the time, I take the bus.","Hầu hết thời gian tôi đi xe buýt."],"use":["Beschreibt, was in den meisten Fällen zutrifft, lässt aber Ausnahmen zu.","Describes what is true in most cases while allowing exceptions.","Mô tả điều đúng trong đa số trường hợp nhưng vẫn có ngoại lệ."],"position":["Am Satzanfang mit Inversion: „Meistens fahre ich …“; alternativ im Mittelfeld: „Ich fahre meistens …“","It can start the sentence with inversion or appear in the middle field.","Có thể đứng đầu câu và làm động từ đảo theo, hoặc đứng giữa câu."],"type":"Adverb"}]},"manner":{"title":"Art und Weise · Cách thức","en":"Manner","vi":"Cách thức","level":"A1–A2 · Wie?","intro":["Diese Adverbien beschreiben, wie jemand etwas tut oder wie eine Handlung wirkt. „Gern“ zeigt außerdem, dass jemand etwas mag.","These adverbs describe how someone does something or how an action feels. “Gern” also shows that someone enjoys an activity.","Nhóm này mô tả ai đó làm việc như thế nào hoặc hành động tạo cảm giác ra sao. “Gern” còn diễn tả sự yêu thích."],"rule":["Sie stehen häufig im Mittelfeld beim Verb oder nach einem kurzen Objekt. Wird ein Adverb zur Betonung an den Satzanfang gestellt, folgt das finite Verb auf Position 2.","They often appear in the middle field near the verb or after a short object. If fronted for emphasis, the finite verb follows in position 2.","Chúng thường đứng ở giữa câu gần động từ hoặc sau tân ngữ ngắn. Nếu đưa lên đầu để nhấn mạnh, động từ chia đứng ở vị trí 2."],"words":[{"term":"gern","ipa":"[ɡɛʁn]","en":"gladly; like to","vi":"thích làm gì","example":["Ich höre gern deutsche Musik.","I like listening to German music.","Tôi thích nghe nhạc Đức."],"use":["Steht bei einem Verb und zeigt, dass man die Handlung gern macht.","Appears with a verb to show that the person enjoys the activity.","Đi cùng động từ để cho biết người nói thích làm việc đó."],"position":["Meist nach dem konjugierten Verb und vor dem Objekt: „Ich höre gern Musik.“","Usually after the conjugated verb and before the object.","Thường đứng sau động từ chia và trước tân ngữ."],"type":"Adverb"},{"term":"lieber","ipa":"[ˈliːbɐ]","en":"preferably / rather","vi":"thích hơn","example":["Ich trinke lieber Tee als Kaffee.","I prefer tea to coffee.","Tôi thích trà hơn cà phê."],"use":["Vergleicht Vorlieben; es drückt aus, was man bevorzugt.","Compares preferences and says what someone would choose.","So sánh sở thích và nêu điều người nói ưu tiên hơn."],"position":["Steht meist direkt beim Verb: „Ich trinke lieber …“; der Vergleich mit als folgt danach.","It usually appears near the verb; the comparison with als follows.","Thường đứng gần động từ; phần so sánh với als theo sau."],"type":"Adverb"},{"term":"am liebsten","ipa":"[am ˈliːpstn̩]","en":"most of all","vi":"thích nhất","example":["Am Wochenende schlafe ich am liebsten lange.","At the weekend, I most like sleeping in.","Cuối tuần tôi thích ngủ nướng nhất."],"use":["Drückt die stärkste Vorliebe aus; es ist die Superlativform von gern.","Expresses the strongest preference; it is the superlative form of gern.","Diễn tả sở thích mạnh nhất; đây là dạng so sánh nhất của gern."],"position":["Kann nach dem Verb stehen oder für Betonung an den Satzanfang rücken: „Am liebsten schlafe ich …“","It can follow the verb or start the sentence for emphasis; the finite verb then follows.","Có thể đứng sau động từ hoặc lên đầu để nhấn mạnh; khi đó động từ chia theo ngay sau."],"type":"Adverb"},{"term":"langsam","ipa":"[ˈlaŋzaːm]","en":"slowly","vi":"chậm","example":["Bitte sprechen Sie langsam.","Please speak slowly.","Xin hãy nói chậm."],"use":["Beschreibt ein niedriges Tempo; oft als Bitte oder Empfehlung.","Describes a slow pace; often used in a request or suggestion.","Mô tả tốc độ chậm; thường dùng trong lời đề nghị hoặc yêu cầu."],"position":["Steht beim Vollverb: „Sprechen Sie langsam.“ Bei Modalverb bleibt es beim Infinitiv: „Sie können langsam sprechen.“","It appears with the main verb; with a modal verb it stays near the infinitive.","Đứng cùng động từ chính; với động từ tình thái, nó ở gần nguyên mẫu."],"type":"Adverb"},{"term":"schnell","ipa":"[ʃnɛl]","en":"quickly / fast","vi":"nhanh","example":["Der Bus fährt schnell.","The bus is travelling fast.","Xe buýt chạy nhanh."],"use":["Beschreibt ein hohes Tempo oder eine kurze Dauer.","Describes a high speed or short duration.","Mô tả tốc độ cao hoặc thời gian ngắn."],"position":["Steht beim Vollverb im Mittelfeld: „Der Bus fährt schnell.“","It appears in the middle field with the main verb.","Đứng ở giữa câu cùng động từ chính."],"type":"Adverb"},{"term":"gut","ipa":"[ɡuːt]","en":"well","vi":"tốt / giỏi","example":["Sie erklärt die Aufgabe gut.","She explains the task well.","Cô ấy giải thích bài tập tốt."],"use":["Beschreibt, wie gut eine Handlung ausgeführt wird. Als Adjektiv kann gut auch ein Nomen beschreiben: „ein guter Plan“.","Describes how well an action is performed. As an adjective, gut can also describe a noun.","Mô tả hành động được thực hiện tốt ra sao. Khi bổ nghĩa cho danh từ, gut là tính từ và đổi đuôi: “ein guter Plan”."],"position":["Als Adverb bleibt gut unverändert und steht beim Verb: „Sie erklärt gut.“ Vor einem Nomen wird es dekliniert: „ein guter Plan“.","As an adverb, gut does not change and appears with the verb; before a noun it takes an adjective ending.","Làm trạng từ, gut không đổi và đứng cùng động từ; trước danh từ, nó nhận đuôi tính từ."],"type":"Adverb"},{"term":"gemeinsam","ipa":"[ɡəˈmaɪ̯nzaːm]","en":"together","vi":"cùng nhau","example":["Wir lernen gemeinsam für die Prüfung.","We study together for the exam.","Chúng tôi cùng học cho kỳ thi."],"use":["Betont, dass Personen eine Handlung zusammen ausführen.","Emphasizes that people do an activity together.","Nhấn mạnh nhiều người cùng thực hiện một hành động."],"position":["Steht meist im Mittelfeld beim Verb oder am Satzende: „Wir lernen gemeinsam.“","It usually appears near the verb in the middle field or at the end of the clause.","Thường đứng gần động từ ở giữa câu hoặc cuối mệnh đề."],"type":"Adverb"}]},"verbindungen":{"title":"Satzverbindungen · Nối ý","en":"Connecting ideas","vi":"Nối ý","level":"B1 · Satzverbindungen","intro":["Satzadverbien drücken Beziehungen zwischen Aussagen aus: Grund und Folge, Gegensatz oder einen zusätzlichen Gedanken.","Sentence adverbs express links between statements, such as cause and result, contrast, or an additional point.","Trạng từ nối câu thể hiện quan hệ giữa các ý như nguyên nhân–kết quả, tương phản hoặc bổ sung."],"rule":["Deshalb, trotzdem und außerdem können Position 1 besetzen; das finite Verb folgt direkt. Merktipp: „aber“ und „denn“ sind Konjunktionen, keine Satzadverbien. Bei zwei Hauptsätzen steht vor ihnen ein Komma; die Wortstellung danach bleibt Subjekt + Verb: „…, denn der Zug fällt aus.“","Deshalb, trotzdem, and außerdem can take position 1, followed immediately by the finite verb. Memory tip: aber and denn are conjunctions, not sentence adverbs. Use a comma before them when joining main clauses; the clause after them keeps subject–verb order.","Deshalb, trotzdem và außerdem có thể đứng ở vị trí 1, sau đó là động từ chia. Mẹo nhớ: aber và denn là liên từ, không phải trạng từ câu. Khi nối hai mệnh đề chính, đặt dấu phẩy trước chúng; sau đó vẫn theo trật tự chủ ngữ + động từ: “…, denn der Zug fällt aus.”"],"words":[{"term":"deshalb","ipa":"[dɛsˈhalp]","en":"therefore","vi":"vì vậy","example":["Der Zug fällt aus. Deshalb nehme ich den Bus.","The train is cancelled. Therefore, I am taking the bus.","Tàu bị hủy. Vì vậy, tôi đi xe buýt."],"use":["Zeigt eine Folge oder Konsequenz aus der vorherigen Aussage.","Shows a result or consequence of the previous statement.","Chỉ kết quả hoặc hệ quả từ ý trước."],"position":["Oft am Satzanfang: „Deshalb nehme ich …“ Das finite Verb nehme steht direkt danach auf Position 2.","Often at the beginning; the finite verb follows it directly in position 2.","Thường đứng đầu câu; động từ chia theo ngay sau ở vị trí 2."],"type":"Adverb"},{"term":"trotzdem","ipa":"[ˈtʁɔtsdeːm]","en":"nevertheless / even so","vi":"dù vậy","example":["Es regnet. Trotzdem gehen wir spazieren.","It is raining. Even so, we are going for a walk.","Trời đang mưa. Dù vậy, chúng tôi vẫn đi dạo."],"use":["Leitet eine Aussage ein, die im Gegensatz zur vorherigen Information steht.","Introduces a statement that contrasts with the previous information.","Mở đầu ý trái với thông tin vừa nêu."],"position":["Am Satzanfang steht trotzdem auf Position 1; gehen folgt auf Position 2: „Trotzdem gehen wir …“","At the beginning it takes position 1; the finite verb follows in position 2.","Đầu câu, trotzdem ở vị trí 1; động từ chia đứng vị trí 2."],"type":"Adverb"},{"term":"außerdem","ipa":"[ˈaʊ̯sɐˌdeːm]","en":"in addition / besides","vi":"ngoài ra","example":["Die Wohnung ist hell. Außerdem liegt sie nah am Bahnhof.","The apartment is bright. In addition, it is close to the station.","Căn hộ sáng sủa. Ngoài ra, nó còn gần nhà ga."],"use":["Fügt einen weiteren passenden Punkt hinzu.","Adds another relevant point.","Bổ sung thêm một ý liên quan."],"position":["Am Satzanfang: „Außerdem liegt sie …“; das finite Verb liegt kommt direkt nach dem Adverb.","At the beginning, followed immediately by the finite verb.","Đầu câu, động từ chia theo ngay sau trạng từ."],"type":"Adverb"},{"term":"dennoch","ipa":"[ˈdɛnɔx]","en":"nevertheless","vi":"tuy vậy","example":["Die Aufgabe war schwierig. Dennoch hat sie sie gelöst.","The task was difficult. Nevertheless, she solved it.","Bài tập khó. Tuy vậy, cô ấy vẫn giải được."],"use":["Markiert einen Gegensatz; der Ton wirkt etwas formeller als trotzdem.","Signals contrast; it sounds somewhat more formal than trotzdem.","Đánh dấu sự tương phản; sắc thái trang trọng hơn trotzdem một chút."],"position":["Kann am Anfang stehen: „Dennoch hat sie …“; das finite Verb hat bleibt auf Position 2.","It can start the clause; the finite verb remains in position 2.","Có thể đứng đầu mệnh đề; động từ chia vẫn ở vị trí 2."],"type":"Adverb"},{"term":"somit","ipa":"[zoˈmɪt]","en":"thus / consequently","vi":"do đó","example":["Alle Unterlagen sind vollständig. Somit können wir den Antrag abschicken.","All the documents are complete. Thus, we can send the application.","Hồ sơ đã đầy đủ. Do đó, chúng ta có thể gửi đơn."],"use":["Fasst eine Schlussfolgerung aus den vorherigen Informationen zusammen; eher schriftlich.","Summarizes a conclusion from the previous information; more common in writing.","Tóm tắt kết luận rút ra từ thông tin trước; thường gặp hơn trong văn viết."],"position":["Steht oft am Anfang eines Hauptsatzes: „Somit können wir …“; können folgt als finites Verb auf Position 2.","It often starts a main clause; the finite modal verb follows in position 2.","Thường đứng đầu câu chính; động từ tình thái chia theo ở vị trí 2."],"type":"Adverb"}]},"nuancen":{"title":"Einschätzung & Nuancen · Nhận định & sắc thái","en":"Stance and nuance","vi":"Nhận định & sắc thái","level":"B2–C1 · Nuancen","intro":["Diese Adverbien zeigen, wie sicher, überraschend oder einschränkend eine Aussage gemeint ist. Sie helfen, differenzierter zu formulieren.","These adverbs show how certain, surprising, or qualified a statement is. They help make language more nuanced.","Nhóm trạng từ này thể hiện mức độ chắc chắn, bất ngờ hoặc giới hạn của nhận định, giúp diễn đạt có sắc thái hơn."],"rule":["Viele dieser Wörter können am Satzanfang stehen; dann folgt das finite Verb auf Position 2. Im Mittelfeld verändern sie die Betonung, ohne die Grundstellung des Verbs aufzuheben.","Many of these words can start the sentence; the finite verb then follows in position 2. In the middle field, they change emphasis without removing the verb-second rule.","Nhiều từ có thể đứng đầu câu; động từ chia theo sau ở vị trí 2. Nếu đứng giữa câu, chúng thay đổi trọng tâm nhưng không làm mất quy tắc động từ vị trí 2."],"words":[{"term":"allerdings","ipa":"[ˈalɐˌdɪŋs]","en":"however / admittedly","vi":"tuy nhiên / đúng là","example":["Der Vorschlag ist sinnvoll. Allerdings fehlen noch genaue Kosten.","The proposal makes sense. However, exact costs are still missing.","Đề xuất hợp lý. Tuy nhiên, vẫn còn thiếu chi phí cụ thể."],"use":["Leitet eine Einschränkung oder einen Gegenpunkt ein.","Introduces a qualification or counterpoint.","Mở đầu ý giới hạn hoặc ý phản biện."],"position":["Am Satzanfang: „Allerdings fehlen …“; im Mittelfeld: „Der Vorschlag ist allerdings sinnvoll.“","At the beginning the verb follows in position 2; in the middle it follows the conjugated verb.","Đầu câu thì động từ chia theo ở vị trí 2; giữa câu thường đứng sau động từ chia."],"type":"Adverb"},{"term":"hingegen","ipa":"[hɪnˈɡeːɡn̩]","en":"by contrast / whereas","vi":"ngược lại","example":["Die erste Lösung ist teuer; die zweite ist hingegen leicht umzusetzen.","The first solution is expensive; the second, by contrast, is easy to implement.","Giải pháp thứ nhất tốn kém; ngược lại, giải pháp thứ hai dễ thực hiện."],"use":["Stellt zwei Personen, Dinge oder Möglichkeiten gegenüber.","Contrasts two people, things, or options.","Đối chiếu hai người, sự việc hoặc lựa chọn."],"position":["Steht oft im Mittelfeld nach dem Subjekt oder Verb: „Die zweite ist hingegen …“; kann auch früh stehen.","It often appears in the middle field after the subject or verb, and can be placed earlier for emphasis.","Thường đứng giữa câu sau chủ ngữ hoặc động từ; cũng có thể đưa lên sớm để nhấn mạnh."],"type":"Adverb"},{"term":"folglich","ipa":"[ˈfɔlklɪç]","en":"consequently","vi":"do đó / vì thế","example":["Die Daten sind unvollständig. Folglich ist ein direkter Vergleich schwierig.","The data are incomplete. Consequently, a direct comparison is difficult.","Dữ liệu chưa đầy đủ. Vì thế, việc so sánh trực tiếp gặp khó khăn."],"use":["Führt eine logische Schlussfolgerung ein; eher formell.","Introduces a logical conclusion; it is somewhat formal.","Mở đầu kết luận logic; sắc thái khá trang trọng."],"position":["Am Satzanfang: „Folglich ist …“; das finite Verb ist steht direkt danach auf Position 2.","At the beginning, followed by the finite verb in position 2.","Đầu câu, động từ chia theo ngay sau ở vị trí 2."],"type":"Adverb"},{"term":"offenbar","ipa":"[ˈɔfn̩ˌbaːɐ̯]","en":"apparently","vi":"có vẻ như","example":["Offenbar wurde die Nachricht nicht weitergeleitet.","Apparently, the message was not forwarded.","Có vẻ như tin nhắn đã không được chuyển tiếp."],"use":["Markiert eine Schlussfolgerung, die aus sichtbaren Hinweisen gezogen wird.","Signals an inference based on available evidence.","Đánh dấu suy luận dựa trên những dấu hiệu có thể quan sát."],"position":["Kann Position 1 besetzen: „Offenbar wurde …“; das finite Hilfsverb wurde steht auf Position 2.","It can take position 1; the finite auxiliary follows in position 2.","Có thể đứng vị trí 1; trợ động từ chia theo ở vị trí 2."],"type":"Adverb"},{"term":"immerhin","ipa":"[ɪmɐˈhɪn]","en":"at least / after all","vi":"dù sao thì / ít nhất","example":["Wir haben nicht alles geschafft. Immerhin ist der wichtigste Teil fertig.","We did not finish everything. At least the most important part is done.","Chúng tôi chưa hoàn thành mọi thứ. Dù sao, phần quan trọng nhất đã xong."],"use":["Hebt trotz eines Problems einen positiven oder wichtigen Punkt hervor.","Highlights a positive or important point despite a problem.","Nêu bật điểm tích cực hoặc quan trọng dù có khó khăn."],"position":["Am Anfang: „Immerhin ist …“; im Mittelfeld: „Der wichtigste Teil ist immerhin fertig.“","It can start the clause or appear in the middle field.","Có thể đứng đầu mệnh đề hoặc ở giữa câu."],"type":"Adverb"},{"term":"ohnehin","ipa":"[ˈoːnəˌhɪn]","en":"anyway","vi":"dù sao thì / vốn dĩ","example":["Wir müssen ohnehin bis Freitag entscheiden.","We have to make a decision by Friday anyway.","Dù sao thì chúng ta cũng phải quyết định trước thứ Sáu."],"use":["Drückt aus, dass etwas unabhängig von der vorherigen Information gilt.","Says that something is true regardless of the previous information.","Cho biết điều gì đó vẫn đúng bất kể thông tin vừa nêu."],"position":["Steht meist im Mittelfeld: „Wir müssen ohnehin …“; es kann je nach Betonung auch vorangestellt werden.","It usually appears in the middle field; it can be fronted for emphasis.","Thường đứng giữa câu; có thể đưa lên đầu tùy điều muốn nhấn mạnh."],"type":"Adverb"},{"term":"vielleicht","ipa":"[flaɪ̯çt]","en":"perhaps / maybe","vi":"có lẽ","example":["Vielleicht kommt Anna heute zum Kurs.","Perhaps Anna is coming to class today.","Có lẽ hôm nay Anna sẽ đến lớp."],"use":["Drückt eine Möglichkeit aus, ohne sie als sicher darzustellen.","Expresses a possibility without presenting it as certain.","Diễn tả khả năng nhưng không khẳng định chắc chắn."],"position":["Am Satzanfang: „Vielleicht kommt Anna …“; das finite Verb kommt folgt auf Position 2. Auch möglich: „Anna kommt vielleicht …“","At the beginning the finite verb follows in position 2; it can also appear in the middle field.","Đầu câu, động từ chia theo ở vị trí 2; cũng có thể đứng giữa câu."],"type":"Adverb"}]},"exercises":{"title":"Üben · Luyện tập","en":"Practice","vi":"Luyện tập","level":"Wiederholen · Ôn tập","intro":["Löse zuerst selbst. Öffne danach die Karte und vergleiche Antwort, Bedeutung und Satzstellung.","Try each item first. Then open the card to compare the answer, meaning, and word order.","Hãy tự làm trước, rồi mở từng thẻ để so đáp án, nghĩa và trật tự từ."],"exercises":[{"q":["Heute ___ ich mit dem Bus zur Arbeit.","Today I take the bus to work.","Hôm nay tôi đi làm bằng xe buýt."],"a":["Heute fahre ich mit dem Bus zur Arbeit.","Heute = Zeitangabe auf Position 1; das finite Verb fahre steht auf Position 2.","Heute is in position 1; the finite verb fahre is in position 2.","Heute ở vị trí 1; động từ chia fahre ở vị trí 2."]},{"q":["Wie oft gehst du schwimmen? – Ich gehe ___ schwimmen, aber nicht jede Woche.","How often do you swim? – I swim sometimes, but not every week.","Bạn đi bơi bao lâu một lần? – Thỉnh thoảng tôi đi bơi, nhưng không phải tuần nào cũng đi."],"a":["Wie oft gehst du schwimmen? – Ich gehe manchmal schwimmen.","Manchmal beschreibt eine gelegentliche Handlung und steht hier im Mittelfeld.","Manchmal describes an occasional action and appears in the middle field here.","Manchmal diễn tả việc đôi khi xảy ra và đứng ở giữa câu trong ví dụ này."]},{"q":["Der Zug fällt aus. ___ nehme ich den Bus.","The train is cancelled. Therefore, I am taking the bus.","Tàu bị hủy. Vì vậy, tôi đi xe buýt."],"a":["Der Zug fällt aus. Deshalb nehme ich den Bus.","Deshalb expresses a consequence. At the beginning it takes position 1, so nehme follows in position 2.","Deshalb diễn tả kết quả. Khi đứng đầu câu, nó chiếm vị trí 1 và nehme theo sau ở vị trí 2."]},{"q":["Es regnet, ___ gehen wir spazieren.","It is raining, but we are going for a walk.","Trời đang mưa, nhưng chúng tôi vẫn đi dạo."],"a":["Es regnet, aber wir gehen spazieren.","Aber is a coordinating conjunction, not an adverb. Put a comma before it when it joins two main clauses; after aber, the normal subject–verb order remains.","Aber là liên từ, không phải trạng từ. Đặt dấu phẩy trước aber khi nối hai mệnh đề chính; sau aber vẫn giữ trật tự chủ ngữ–động từ bình thường."]}]}}</script>
<script>
(() => {
 const D=JSON.parse(document.getElementById("lesson-data").textContent);
 const app=document.getElementById("app");
 const order=["zeit","ort","frequency","manner","verbindungen","nuancen","exercises"];
 const labels={zeit:"A1–A2 · Zeitangaben",ort:"A1–A2 · Ortsangaben",frequency:"A1–A2 · Häufigkeit",manner:"A1–A2 · Art und Weise",verbindungen:"B1 · Satzverbindungen",nuancen:"B2–C1 · Nuancen",exercises:"Wiederholen · Üben"};
 const esc=(s)=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
 const trip=(arr)=>'<div class="triple">'+arr.map((x,i)=>'<p><b>'+["DE","EN","VI"][i]+':</b> '+esc(x)+'</p>').join("")+'</div>';
 const cardHref=(k)=>'./deutsch-adverbien.html?gruppe='+encodeURIComponent(k)+'#inhalt';
 function overview(){
  const cats=order.map(k=>{const c=D[k],count=c.words?.length??c.exercises?.length??0;return '<a class="category" href="'+cardHref(k)+'"><span class="level">'+esc(labels[k])+'</span><h3>'+esc(c.title.split(" · ")[0])+'</h3><p class="meta">'+esc(c.en)+' · '+esc(c.vi)+'</p>'+trip(c.intro)+'<span class="open">Öffnen · Mở nội dung →</span><span class="count">'+count+(k==="exercises"?" Übungen · bài luyện":" Wörter · từ")+'</span></a>'}).join("");
  app.innerHTML='<section class="hero"><div class="eyebrow">Grammatik · Wiederholen & vertiefen</div><h1>Adverbien verstehen und sicher verwenden</h1><div class="intro"><p><b>DE:</b> Wiederhole wichtige Adverbien und lerne, wie sie Aussagen verbinden und den Satzbau beeinflussen.</p><p><b>EN:</b> Review useful adverbs and learn how they connect ideas and affect word order.</p><p><b>VI:</b> Ôn trạng từ thường dùng, cách chúng nối ý và ảnh hưởng đến trật tự câu.</p></div><nav class="chips"><a class="chip" href="'+cardHref("zeit")+'">A1–A2 · Zeit</a><a class="chip" href="'+cardHref("ort")+'">A1–A2 · Ort</a><a class="chip" href="'+cardHref("verbindungen")+'">B1 · Verbindungen</a><a class="chip" href="'+cardHref("nuancen")+'">B2–C1 · Nuancen</a><a class="chip" href="'+cardHref("exercises")+'">Üben</a></nav></section><section class="section" id="themen"><div class="section-head"><div><div class="eyebrow">Lernbereiche · Learning areas · Khu vực học</div><h2>Wähle ein Thema</h2><div class="intro">Mở từng thẻ để học riêng nhóm từ, ví dụ, bản dịch, cách dùng và vị trí trong câu.</div></div></div><div class="grid"><a class="category" href="'+cardHref("overview")+'"><span class="level">Einführung · Tổng quan</span><h3>'+esc(D.overview.title.split(" · ")[0])+'</h3><p class="meta">Overview · Giới thiệu</p>'+trip(D.overview.intro)+'<span class="open">Öffnen · Mở tổng quan →</span></a>'+cats+'</div></section><section class="section"><h2>Was lernst du hier? · Nội dung học</h2><div class="overview-grid"><article class="overview-card"><h3>Wann? · Zeit</h3>'+trip(["heute, morgen, zuerst, danach und weitere Zeitangaben.","today, tomorrow, first, afterwards, and other time expressions.","heute, morgen, zuerst, danach và các từ chỉ thời gian khác."])+'</article><article class="overview-card"><h3>Wo? / Wohin? · Ort & Richtung</h3>'+trip(["hier und dort nennen einen Ort; dorthin zeigt ein Ziel.","hier and dort name a location; dorthin shows a destination.","hier, dort chỉ vị trí; dorthin chỉ đích đến."])+'</article><article class="overview-card"><h3>Wie oft? / Wie? · Frequenz & Art</h3>'+trip(["Beschreibe Routinen und wie eine Handlung ausgeführt wird.","Describe routines and how an action is done.","Mô tả thói quen và cách một hành động diễn ra."])+'</article><article class="overview-card"><h3>Position im Satz · Vị trí trong câu</h3>'+trip(["Steht ein Satzglied am Anfang, folgt das finite Verb auf Position 2: „Heute lerne ich.“","When an adverbial starts a main clause, the finite verb stays in position 2.","Khi trạng từ đứng đầu câu, động từ chia vẫn ở vị trí 2: “Heute lerne ich.”"])+'</article></div><div class="note"><b>Merktipp · Tip · Mẹo:</b> <b>deshalb, trotzdem, außerdem</b> có thể đứng đầu câu và theo sau là động từ chia (V2). <b>aber, denn</b> là liên từ nối hai mệnh đề chính: thường có dấu phẩy phía trước, sau liên từ giữ trật tự chủ ngữ + động từ.</div></section>';
 }
 function wordCard(w){
  return '<article class="word-card"><div class="word-title"><div><h3>'+esc(w.term)+'</h3><div class="ipa">IPA: '+esc(w.ipa)+'</div></div><button class="speak" type="button" data-speak="'+esc(w.term)+'" aria-label="Hören: '+esc(w.term)+'">🔊 Hören</button></div><p class="meaning"><b>EN:</b> '+esc(w.en)+' <span aria-hidden="true"> · </span><b>VI:</b> '+esc(w.vi)+'</p><div class="example"><div class="ex-label">Beispiel · Example · Ví dụ</div><div class="de">DE: '+esc(w.example[0])+'</div><div class="translation"><span><b>EN:</b> '+esc(w.example[1])+'</span><span><b>VI:</b> '+esc(w.example[2])+'</span></div></div><div class="explain"><h4>Wann verwenden? · When to use · Khi nào dùng?</h4>'+trip(w.use)+'</div><div class="explain position"><h4>Satzposition · Sentence position · Vị trí trong câu</h4>'+trip(w.position)+'</div></article>';
 }
 function category(k){
  if(k==="overview"){overviewDetail();return}
  const c=D[k];if(!c){overview();return}
  const heading=c.title.split(" · ")[0];
  const intro='<div class="intro"><p><b>DE:</b> '+esc(c.intro[0])+'</p><p><b>EN:</b> '+esc(c.intro[1])+'</p><p><b>VI:</b> '+esc(c.intro[2])+'</p></div>';
  const rule='<div class="rulebox"><h3>Regel & Orientierung · Rule · Quy tắc và cách nhận biết</h3>'+trip(c.rule)+'</div>';
  let body="";
  if(c.words){
   body='<div class="word-grid">'+c.words.map(wordCard).join("")+'</div>';
   if(k==="verbindungen")body+='<div class="note"><b>Aber & denn · Dấu phẩy:</b> <i>aber</i> và <i>denn</i> là liên từ, không phải trạng từ. Khi nối hai mệnh đề chính, đặt dấu phẩy trước liên từ; sau nó không đảo động từ: <b>Es regnet, aber wir gehen spazieren.</b> · <b>Ich bleibe zu Hause, denn ich bin krank.</b></div>';
  } else if(k==="exercises"){
   body='<div class="practice-list">'+c.exercises.map((e,i)=>'<details class="exercise"><summary>Aufgabe '+(i+1)+' · '+esc(e.q[0])+'</summary><div class="answer"><p><b>EN:</b> '+esc(e.q[1])+'</p><p><b>VI:</b> '+esc(e.q[2])+'</p><hr><p><b>Lösung:</b> '+esc(e.a[0])+'</p><p><b>DE · Erklärung:</b> '+esc(e.a[1])+'</p><p><b>EN · Explanation:</b> '+esc(e.a[2])+'</p><p><b>VI · Giải thích:</b> '+esc(e.a[3]||e.a[2])+'</p></div></details>').join("")+'</div>';
  }
  app.innerHTML='<a class="back" href="./deutsch-adverbien.html#themen">← Alle Themen · Tất cả chủ đề</a><section class="detail-hero" id="inhalt"><div class="eyebrow">'+esc(c.level)+'</div><h1>'+esc(heading)+'</h1>'+intro+rule+'</section><section class="section"><div class="section-head"><div><div class="eyebrow">Einzeln lernen · Learn each word · Học từng từ</div><h2>'+esc(k==="exercises"?"Üben und verstehen · Luyện tập có giải thích":"Wörter mit Beispielen · Từ kèm ví dụ")+'</h2></div><span class="count">'+(c.words?.length??c.exercises?.length??0)+(c.words?" Wörter":" Übungen")+'</span></div>'+body+'</section>';
 }
 function overviewDetail(){
  const o=D.overview;
  app.innerHTML='<a class="back" href="./deutsch-adverbien.html#themen">← Alle Themen · Tất cả chủ đề</a><section class="detail-hero" id="inhalt"><div class="eyebrow">Einführung · A1–C1</div><h1>Einführung & Überblick</h1>'+trip(o.intro)+'</section><section class="section"><h2>Was ist ein Adverb? · Trạng từ là gì?</h2><div class="overview-grid"><article class="overview-card"><h3>Funktion · Chức năng</h3>'+trip(["Adverbien ergänzen Informationen zu Zeit, Ort, Häufigkeit, Art und Weise oder zur Einschätzung.","Adverbs add information about time, place, frequency, manner, or the speaker’s view.","Trạng từ bổ sung thông tin về thời gian, nơi chốn, tần suất, cách thức hoặc nhận định."])+'</article><article class="overview-card"><h3>Form · Hình thức</h3>'+trip(["Adverbien sind normalerweise unveränderlich: heute, hier, oft, gern.","Adverbs are usually invariable: heute, hier, oft, gern.","Trạng từ thường không biến đổi hình thức: heute, hier, oft, gern."])+'</article><article class="overview-card"><h3>Wortstellung · Trật tự từ</h3>'+trip(["Im Hauptsatz steht das finite Verb auf Position 2. Beginnt der Satz mit einem Adverb, folgt das Verb unmittelbar: „Danach fahre ich nach Hause.“","In a main clause the finite verb is in position 2. If an adverb starts the sentence, the verb follows it: “Danach fahre ich nach Hause.”","Trong câu chính, động từ chia đứng vị trí 2. Nếu trạng từ đứng đầu câu, động từ theo ngay sau: “Danach fahre ich nach Hause.”"])+'</article><article class="overview-card"><h3>Zeit – Art – Ort · Thời gian – cách thức – nơi chốn</h3>'+trip(["Eine hilfreiche neutrale Reihenfolge ist oft: Zeit, Art und Weise, Ort: „Ich fahre morgen mit dem Zug nach Berlin.“","A useful neutral order is often time, manner, place: “Ich fahre morgen mit dem Zug nach Berlin.”","Một trật tự trung tính hữu ích thường là: thời gian, cách thức, nơi chốn: “Ich fahre morgen mit dem Zug nach Berlin.”"])+'</article></div><div class="note"><b>Wichtig:</b> <i>aber</i> und <i>denn</i> sind Konjunktionen. Bei zwei Hauptsätzen steht vor ihnen ein Komma; danach bleibt die normale Subjekt–Verb-Reihenfolge. <i>Deshalb</i> und <i>trotzdem</i> können dagegen vorn stehen und lösen V2 aus.</div></section><section class="section"><h2>Ein Thema auswählen · Chọn nhóm để học</h2><div class="grid">'+order.map(k=>'<a class="category" href="'+cardHref(k)+'"><span class="level">'+esc(labels[k])+'</span><h3>'+esc(D[k].title.split(" · ")[0])+'</h3><span class="open">Öffnen · Mở nội dung →</span></a>').join("")+'</div></section>';
 }
 const group=new URLSearchParams(location.search).get("gruppe");
 if(group)category(group);else overview();
 document.addEventListener("click",e=>{const b=e.target.closest("[data-speak]");if(!b)return;if(!("speechSynthesis" in window)){b.textContent="Audio nicht verfügbar";return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(b.dataset.speak);u.lang="de-DE";u.rate=.84;u.pitch=1;u.volume=1;speechSynthesis.speak(u)});
})();
</script>
</body>
</html>
