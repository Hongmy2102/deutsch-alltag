const C={
1:{title:'Guten Tag!',video:'AfVncunCClg',pdf:'https://www.klett-sprachen.de/downloads/21452/netzwerk-neu-a1-transkript-audios-kursbuch-kapitel-1-6/pdf',tracks:[['1.1',0],['1.2',16],['1.3',38],['1.4',47],['1.5',58],['1.6',88],['1.7',101],['1.8',114],['1.9',151],['1.10',192],['1.11',234],['1.12',283],['1.13',359]],focus:['Begrüßung, Namen, Herkunft, Telefonnummern und Buchstabieren','greeting, names, origin, phone numbers, and spelling','lời chào, tên, quê quán, số điện thoại và đánh vần'],grammar:['Bei einer W-Frage steht das Fragewort zuerst; das konjugierte Verb folgt direkt danach. In einer Ja/Nein-Frage steht das Verb zuerst.','A W-question starts with the question word, followed immediately by the conjugated verb. A yes/no question starts with the verb.','Câu hỏi W đặt từ hỏi trước, động từ đã chia theo ngay sau. Câu hỏi có/không đưa động từ lên đầu.'],example:['Woher kommen Sie? – Ich komme aus Vietnam.','Where are you from? – I am from Vietnam.','Anh/chị đến từ đâu? – Tôi đến từ Việt Nam.'],words:[['der Name','[ˈnaːmə]','name','tên'],['die Telefonnummer','[ˈteːləfoːnˌnʊmɐ]','phone number','số điện thoại'],['buchstabieren','[buˈxʃtaːbiːʁən]','spell','đánh vần'],['kommen','[ˈkɔmən]','come','đến']]},
2:{title:'Freunde, Kollegen und ich',video:'eogec8JDLJo',pdf:'https://www.klett-sprachen.de/downloads/21452/netzwerk-neu-a1-transkript-audios-kursbuch-kapitel-1-6/pdf',tracks:[['1.14',0],['1.15',19],['1.16',37],['1.17',57],['1.18',69],['1.19',104],['1.20',122]],focus:['Hobbys, Vorlieben, Verabredungen und Zahlen','hobbies, preferences, plans, and numbers','sở thích, điều mình thích, hẹn gặp và số đếm'],grammar:['gern steht meist nach dem konjugierten Verb und sagt, dass man etwas gern tut. Für einen Vorschlag nutzt man zum Beispiel „Gehen wir …?“','gern usually follows the conjugated verb and says you enjoy an activity. A suggestion can start with “Gehen wir …?”','gern thường đứng sau động từ đã chia để nói mình thích làm gì. Có thể rủ ai bằng mẫu “Gehen wir …?”'],example:['Ich lese gern und reise mit meinen Freunden.','I like reading and travelling with my friends.','Tôi thích đọc sách và đi du lịch cùng bạn bè.'],words:[['das Hobby','[ˈhɔbi]','hobby','sở thích'],['der Freund','[fʁɔʏnt]','friend','bạn nam'],['reisen','[ˈʁaɪ̯zn̩]','travel','du lịch'],['gern','[ɡɛʁn]','gladly; like to','thích']]},
3:{title:'In Hamburg',video:'289-RWW_fgk',pdf:'https://www.klett-sprachen.de/downloads/21452/netzwerk-neu-a1-transkript-audios-kursbuch-kapitel-1-6/pdf',tracks:[['1.21',0],['1.22',24],['1.23',55],['1.24',76],['1.25',97],['1.26',123],['1.27',207],['1.28',223],['1.29',304],['1.30',400],['1.31',438],['1.32',467],['1.33',492],['1.34',509],['1.35',553],['1.36',574],['1.37',609]],focus:['Stadtinformationen, Sehenswürdigkeiten, Wege und Verkehr','city information, sights, directions, and transport','thông tin thành phố, địa điểm tham quan, đường đi và phương tiện'],grammar:['Wo? fragt nach einem Ort; Wohin? fragt nach dem Ziel. Mit einem Verkehrsmittel steht meist mit + Dativ, zum Beispiel mit dem Bus.','Wo? asks about a location; Wohin? asks about a destination. A means of transport commonly follows mit + dative, as in mit dem Bus.','Wo? hỏi vị trí; Wohin? hỏi điểm đến. Phương tiện thường đi với mit + Dativ, ví dụ mit dem Bus.'],example:['Wir fahren mit dem Bus zum Hafen.','We are taking the bus to the harbour.','Chúng tôi đi xe buýt đến cảng.'],words:[['der Hafen','[ˈhaːfn̩]','harbour','cảng'],['der Bahnhof','[ˈbaːnhoːf]','station','nhà ga'],['das Rathaus','[ˈʁaːthaʊ̯s]','town hall','tòa thị chính'],['geradeaus','[ɡəˈʁaːdəʔaʊ̯s]','straight ahead','đi thẳng']]},
4:{title:'Guten Appetit!',video:'OSuSAGhuBFQ',pdf:'https://www.klett-sprachen.de/downloads/21452/netzwerk-neu-a1-transkript-audios-kursbuch-kapitel-1-6/pdf',tracks:[['1.41',0],['1.42',20],['1.43',56],['1.44',73],['1.45',111],['1.46',179],['1.47',216],['1.48',246],['1.49',262],['1.50',277],['1.51',304],['1.52',315],['1.53',347],['1.54',361],['1.55',375],['1.56',383],['1.57',396],['1.58',417],['1.59',442]],focus:['Einkaufen, Mengen, Preise, Lebensmittel und gemeinsam essen','shopping, quantities, prices, food, and eating together','mua sắm, số lượng, giá cả, thực phẩm và cùng ăn'],grammar:['Mengen stehen oft ohne Pluralartikel: 100 Gramm Käse, zwei Kilo Kartoffeln. Eine höfliche Bestellung beginnt oft mit „Ich möchte …“ oder „Ich hätte gern …“.','Quantities often appear without a plural article: 100 grams of cheese, two kilos of potatoes. A polite order often begins with “Ich möchte …” or “Ich hätte gern …”.','Lượng hàng thường đứng không cần mạo từ số nhiều: 100 Gramm Käse, zwei Kilo Kartoffeln. Có thể gọi món lịch sự bằng “Ich möchte …” hoặc “Ich hätte gern …”.'],example:['Ich hätte gern zwei Brötchen, bitte.','I would like two bread rolls, please.','Cho tôi xin hai chiếc bánh mì nhỏ.'],words:[['das Brot','[bʁoːt]','bread','bánh mì'],['die Kartoffel','[kaʁˈtɔfl̩]','potato','khoai tây'],['der Käse','[ˈkɛːzə]','cheese','phô mai'],['kosten','[ˈkɔstn̩]','cost','có giá']]},
5:{title:'Alltag und Familie',video:'iqCfJV-B_J0',pdf:'https://www.klett-sprachen.de/downloads/21452/netzwerk-neu-a1-transkript-audios-kursbuch-kapitel-1-6/pdf',tracks:[['1.60',0],['1.61',20],['1.62',37],['1.63',60],['1.64',86],['1.65',99],['1.66',115],['1.67',140],['1.68',194],['1.69',218],['1.70',235],['1.71',252],['1.72',273],['1.73',290],['1.74',312],['1.75',330],['1.76',351],['1.77',368],['1.78',412],['1.79',428],['1.80',449],['1.81',497],['1.82',512],['1.83',543],['1.84',562],['1.85',584]],focus:['Tagesablauf, Uhrzeit, Familie, Termine und Alltagssituationen','daily routines, time, family, appointments, and everyday situations','sinh hoạt hằng ngày, giờ giấc, gia đình, lịch hẹn và tình huống thường gặp'],grammar:['Trennbare Verben teilen sich im Hauptsatz: aufstehen → Ich stehe um sieben Uhr auf. Bei Uhrzeiten zeigt um den Zeitpunkt; danach ordnet Ereignisse.','Separable verbs split in a main clause: aufstehen → Ich stehe um sieben Uhr auf. um gives the time; danach orders events.','Động từ tách chia ra hai phần trong câu chính: aufstehen → Ich stehe um sieben Uhr auf. um chỉ giờ; danach nối các việc theo trình tự.'],example:['Um halb sieben stehe ich auf. Danach frühstücke ich.','I get up at half past six. Then I have breakfast.','Tôi thức dậy lúc sáu giờ rưỡi. Sau đó tôi ăn sáng.'],words:[['der Alltag','[ˈʔaltaːk]','everyday life','đời sống hằng ngày'],['aufstehen','[ˈaʊ̯fˌʃteːən]','get up','thức dậy'],['die Familie','[faˈmiːli̯ə]','family','gia đình'],['danach','[daˈnaːx]','afterwards','sau đó']]},
6:{title:'Zeit mit Freunden',video:'Txn4cazNUqc',pdf:'https://www.klett-sprachen.de/downloads/21452/netzwerk-neu-a1-transkript-audios-kursbuch-kapitel-1-6/pdf',tracks:[['1.86',0],['1.87',25],['1.88',61],['1.89',85],['1.90',115],['1.91',164],['1.92',190],['1.93',211],['1.94',257],['1.95',289],['1.96',311],['1.97',328],['1.98',398]],focus:['Freizeit, Einladungen, Geburtstage und Verabredungen','free time, invitations, birthdays, and plans','thời gian rảnh, lời mời, sinh nhật và hẹn gặp'],grammar:['Lust haben + zu + Infinitiv fragt freundlich nach Interesse: Hast du Lust, einen Film zu sehen? Am + Wochentag nennt den Tag.','Lust haben + zu + infinitive asks about interest: Would you like to watch a film? am + weekday names the day.','Lust haben + zu + động từ nguyên mẫu dùng để hỏi ai có muốn làm gì không. am + thứ trong tuần cho biết ngày.'],example:['Hast du Lust, heute einen Film zu sehen?','Would you like to watch a film today?','Hôm nay bạn có muốn xem phim không?'],words:[['die Freizeit','[ˈfʁaɪ̯tsaɪ̯t]','free time','thời gian rảnh'],['die Einladung','[ˈʔaɪ̯nlaːdʊŋ]','invitation','lời mời'],['der Geburtstag','[ɡəˈbuːɐ̯tstaːk]','birthday','sinh nhật'],['mitbringen','[ˈmɪtˌbʁɪŋən]','bring along','mang theo']]},
7:{title:'Arbeitsalltag',video:'NeiCO7Ol9qo',pdf:'https://www.klett-sprachen.de/downloads/22307/netzwerk-neu-a1-transkript-audios-kursbuch-kapitel-7-12/pdf',tracks:[['2.1',0],['2.2',27],['2.3',56],['2.4',79],['2.5',100],['2.6',123],['2.7',203],['2.8',218],['2.9',262],['2.10',361],['2.11',377]],focus:['Arbeitstag, kurze Gespräche, Termine und Bitten am Arbeitsplatz','workdays, short conversations, appointments, and requests at work','ngày làm việc, hội thoại ngắn, lịch hẹn và lời nhờ nơi công sở'],grammar:['Können Sie …? và Können Sie mir …? là cách nhờ lịch sự. Mit + Dativ nêu người đi cùng hoặc phương tiện.','Können Sie …? and Können Sie mir …? make polite requests. mit + dative names a companion or means of transport.','Können Sie …? và Können Sie mir …? là cách nhờ lịch sự. mit + Dativ chỉ người đi cùng hoặc phương tiện.'],example:['Können Sie mir bitte helfen?','Could you please help me?','Anh/chị có thể vui lòng giúp tôi không?'],words:[['der Termin','[tɛɐ̯ˈmiːn]','appointment','lịch hẹn'],['die Firma','[ˈfɪʁma]','company','công ty'],['unterschreiben','[ʊntɐˈʃʁaɪ̯bn̩]','sign','ký tên'],['abholen','[ˈʔapˌhoːlən]','pick up','đón']]},
8:{title:'Gesundheit',video:'RiiH6HFP8IQ',pdf:'https://www.klett-sprachen.de/downloads/22307/netzwerk-neu-a1-transkript-audios-kursbuch-kapitel-7-12/pdf',tracks:[['2.12',0],['2.13',34],['2.14',64],['2.15',96],['2.16',138],['2.17',183],['2.18',277],['2.19',330],['2.20',350],['2.21',402],['2.22',453]],focus:['Gesund leben, Beschwerden beschreiben und beim Arzt nachfragen','healthy habits, describing symptoms, and asking a doctor questions','lối sống khỏe, mô tả triệu chứng và hỏi bác sĩ'],grammar:['Mir tut der Kopf weh: cơ thể là chủ ngữ, còn mir cho biết người bị đau. Müssen và dürfen giúp nói điều cần làm hoặc được phép làm.','In “Mir tut der Kopf weh,” the body part is the subject and mir identifies the person in pain. müssen and dürfen express necessity and permission.','Trong “Mir tut der Kopf weh”, bộ phận cơ thể là chủ ngữ, mir chỉ người bị đau. müssen và dürfen diễn tả việc cần làm hoặc được phép.'],example:['Mir tut der Arm weh. Darf ich Sport machen?','My arm hurts. May I exercise?','Tôi bị đau tay. Tôi có được chơi thể thao không?'],words:[['der Kopf','[kɔpf]','head','đầu'],['der Schmerz','[ʃmɛɐ̯ts]','pain','cơn đau'],['das Rezept','[ʁeˈtsɛpt]','prescription','đơn thuốc'],['dürfen','[ˈdʏʁfn̩]','may; be allowed to','được phép']]},
9:{title:'Meine Wohnung',video:'4RM6Fu6M49g',pdf:'https://www.klett-sprachen.de/downloads/22307/netzwerk-neu-a1-transkript-audios-kursbuch-kapitel-7-12/pdf',tracks:[['2.23',0],['2.24',80],['2.25',102],['2.26',187],['2.27',223],['2.28',368],['2.29',388],['2.30',435],['2.31',450],['2.32',473],['2.33',499],['2.34',531],['2.35',562]],focus:['Zimmer, Möbel, Wohnungsanzeigen, Lage und Umzug','rooms, furniture, rental listings, location, and moving','phòng, đồ nội thất, tin thuê nhà, vị trí và chuyển nhà'],grammar:['Wo? mô tả vị trí hiện tại nên Wechselpräpositionen đi với Dativ; Wohin? nêu đích đến nên đi với Akkusativ. im = in dem.','Wo? describes a location, so two-way prepositions take dative; Wohin? gives a destination, so they take accusative. im = in dem.','Wo? hỏi chỗ đang ở nên giới từ hai chiều dùng Dativ; Wohin? hỏi hướng đến nên dùng Akkusativ. im = in dem.'],example:['Das Sofa steht im Wohnzimmer. Ich stelle den Stuhl ins Zimmer.','The sofa is in the living room. I put the chair into the room.','Ghế sofa ở phòng khách. Tôi đặt ghế vào phòng.'],words:[['das Wohnzimmer','[ˈvoːnˌtsɪmɐ]','living room','phòng khách'],['die Miete','[ˈmiːtə]','rent','tiền thuê'],['der Aufzug','[ˈaʊ̯ftsʊk]','lift; elevator','thang máy'],['stellen','[ˈʃtɛlən]','put; place upright','đặt dựng']]},
10:{title:'Studium und Beruf',video:'oCKUW83-X_g',pdf:'https://www.klett-sprachen.de/downloads/22307/netzwerk-neu-a1-transkript-audios-kursbuch-kapitel-7-12/pdf',tracks:[['2.38',0],['2.39',207],['2.40',294],['2.41',347],['2.42',362],['2.43',374],['2.44',428],['2.45',442]],focus:['Berufe, Studium, Arbeitsbedingungen und Meinungen','jobs, studies, working conditions, and opinions','nghề nghiệp, việc học, điều kiện làm việc và ý kiến'],grammar:['als + Beruf nennt die Tätigkeit: Sie arbeitet als Ärztin. mögen und gefallen helfen, Vorlieben und Meinungen auszudrücken.','als + profession names someone’s job: She works as a doctor. mögen and gefallen express preferences and opinions.','als + nghề nghiệp nêu công việc: Sie arbeitet als Ärztin. mögen và gefallen giúp nói điều mình thích hoặc nhận xét.'],example:['Ich arbeite als Lehrerin und mein Beruf macht mir Spaß.','I work as a teacher and enjoy my job.','Tôi làm giáo viên và thấy công việc của mình thú vị.'],words:[['der Beruf','[bəˈʁuːf]','profession; job','nghề nghiệp'],['die Prüfung','[ˈpʁyːfʊŋ]','exam','kỳ thi'],['verdienen','[fɛɐ̯ˈdiːnən]','earn','kiếm tiền'],['gefallen','[ɡəˈfalən]','please; be liked','làm ai thích']]},
11:{title:'Die Jacke gefällt mir!',video:'Y_mX9EVUIFE',pdf:'https://www.klett-sprachen.de/downloads/22307/netzwerk-neu-a1-transkript-audios-kursbuch-kapitel-7-12/pdf',tracks:[['2.46',0],['2.47',20],['2.48',52],['2.49',77],['2.50',156],['2.51',189],['2.52',203],['2.53',220],['2.54',276],['2.55',305],['2.56',371]],focus:['Kleidung, Farben, Einkaufen, Größen und Gefallen','clothes, colours, shopping, sizes, and preferences','quần áo, màu sắc, mua sắm, kích cỡ và sở thích'],grammar:['gefallen works like “be pleasing to”: the item is the subject and mir is the person who likes it. Welcher/welche/welches agrees with the noun’s gender.','gefallen works like “be pleasing to”: the item is the subject and mir is the person who likes it. Welcher/welche/welches agrees with the noun’s gender.','gefallen dùng khác tiếng Việt: món đồ là chủ ngữ, mir là người thấy thích. Welcher/welche/welches thay đổi theo giống danh từ.'],example:['Die Jacke gefällt mir, aber der Mantel ist zu teuer.','I like the jacket, but the coat is too expensive.','Tôi thích chiếc áo khoác này, nhưng chiếc áo choàng kia quá đắt.'],words:[['die Jacke','[ˈjakə]','jacket','áo khoác'],['der Mantel','[ˈmantl̩]','coat','áo choàng'],['die Größe','[ˈɡʁøːsə]','size','kích cỡ'],['passen','[ˈpasn̩]','fit; suit','vừa; hợp']]},
12:{title:'Ab in den Urlaub!',video:'DH6yVv8DSfw',pdf:'https://www.klett-sprachen.de/downloads/22307/netzwerk-neu-a1-transkript-audios-kursbuch-kapitel-7-12/pdf',tracks:[['2.57',0],['2.58',89],['2.59',261],['2.60',311],['2.61',345],['2.62',361]],focus:['Reise planen, packen, Hotel und unterwegs sein','planning a trip, packing, hotels, and getting around','lên kế hoạch, xếp hành lý, khách sạn và đi lại'],grammar:['Bei wenn steht das konjugierte Verb im Nebensatz am Ende. Modalverben nehmen einen Infinitiv ans Satzende; trennbare Verben teilen sich im Hauptsatz.','In a wenn-clause, the conjugated verb goes last. Modal verbs send an infinitive to the end; separable verbs split in main clauses.','Trong mệnh đề wenn, động từ đã chia ở cuối. Modalverb đẩy nguyên mẫu xuống cuối; động từ tách tách đôi trong câu chính.'],example:['Wenn es regnet, nehme ich den Regenschirm mit.','If it rains, I take the umbrella with me.','Nếu trời mưa, tôi mang ô theo.'],words:[['der Koffer','[ˈkɔfɐ]','suitcase','vali'],['die Regenjacke','[ˈʁeːɡn̩ˌjakə]','rain jacket','áo khoác mưa'],['der Regenschirm','[ˈʁeːɡn̩ˌʃɪʁm]','umbrella','ô; dù'],['mitnehmen','[ˈmɪtˌneːmən]','take along','mang theo']]}
};

const TRACK_GUIDES={
'2.57':{title:['Packen und auswählen','Packing and choosing what to take','Xếp hành lý và chọn đồ mang theo'],listen:['Zwei Reisende prüfen, was in den Koffer kommt, was zu Hause bleibt und was sie unterwegs vielleicht brauchen. Achte darauf, wie sie begründen und gemeinsam entscheiden.','Two travellers decide what goes in the suitcase, what stays home, and what they may need on the trip. Notice how they give reasons and decide together.','Hai người đi du lịch chọn đồ cho va-li, món nào để ở nhà và thứ gì có thể cần. Hãy chú ý cách họ nêu lý do rồi cùng quyết định.'],grammar:['Mitnehmen und hierlassen sind trennbare Verben: „Ich nehme die Regenjacke mit.“ Im Hauptsatz steht das Verbteil mit am Ende. Mit wenn wird eine Bedingung genannt; das konjugierte Verb steht dann im Nebensatz am Schluss.','mitnehmen and hierlassen are separable verbs: the prefix moves to the end of a main clause. A wenn-clause gives a condition and sends its conjugated verb to the end.','mitnehmen (mang theo) và hierlassen (để lại) là động từ tách: tiền tố xuống cuối câu chính. Mệnh đề wenn nêu điều kiện và đưa động từ đã chia xuống cuối mệnh đề.'],example:['Wenn es kühl wird, nehme ich einen Pullover mit.','If it gets cool, I take a sweater with me.','Nếu trời trở lạnh, tôi mang theo áo len.'],words:[['der Koffer','[ˈkɔfɐ]','suitcase','va-li'],['die Regenjacke','[ˈʁeːɡn̩ˌjakə]','rain jacket','áo khoác mưa'],['mitnehmen','[ˈmɪtˌneːmən]','take along','mang theo'],['hierlassen','[ˈhiːɐ̯ˌlasn̩]','leave here','để lại đây']]},
'2.58':{title:['Im Hotel einchecken und Ausflüge planen','Checking in and planning outings','Nhận phòng khách sạn và lên lịch tham quan'],listen:['Ein Paar meldet sich im Hotel an, fragt nach Tipps für die Stadt und vergleicht Möglichkeiten für die gemeinsame Tagesplanung. Achte auf höfliche Fragen und Uhrzeiten.','A couple checks in, asks for city tips, and plans the day together. Listen for polite questions and times.','Một cặp đôi nhận phòng, hỏi gợi ý tham quan và cùng lên lịch trong ngày. Hãy để ý câu hỏi lịch sự và cách nói giờ.'],grammar:['Können Sie …? ist eine höfliche Bitte. Nach Modalverben wie können steht das zweite Verb am Ende im Infinitiv: „Können Sie uns Tipps geben?“ Bei Vorschlägen helfen zuerst … dann … danach, Schritte der Reihe nach zu ordnen.','Können Sie …? is a polite request. After a modal verb such as können, the second verb stays at the end as an infinitive. zuerst, dann, danach put plans in order.','Können Sie …? là cách nhờ lịch sự. Sau modalverb như können, động từ thứ hai ở nguyên mẫu cuối câu. zuerst, dann, danach giúp sắp xếp kế hoạch theo thứ tự.'],example:['Können Sie uns ein ruhiges Café empfehlen?','Could you recommend a quiet café to us?','Anh/chị có thể giới thiệu cho chúng tôi một quán cà phê yên tĩnh không?'],words:[['das Hotel','[hoˈtɛl]','hotel','khách sạn'],['die Sehenswürdigkeit','[ˈzeːənsvʏɐ̯dɪçkaɪ̯t]','sight; attraction','địa điểm tham quan'],['der Tipp','[tɪp]','tip','gợi ý'],['empfehlen','[ɛmˈpfeːlən]','recommend','giới thiệu']]},
'2.59':{title:['Den Weg mit öffentlichen Verkehrsmitteln finden','Finding the route by public transport','Tìm đường bằng phương tiện công cộng'],listen:['Die Reisenden orientieren sich auf dem Stadtplan und entscheiden, welche Tram sie nehmen und wo sie ein- und aussteigen. Zeichne die Haltestellen in der genannten Reihenfolge mit.','The travellers use a city map to choose a tram and identify where to board and get off. Follow the stops in order.','Hai người xem bản đồ, chọn tuyến tàu điện và xác định chỗ lên, xuống. Hãy theo dõi các điểm dừng theo đúng thứ tự.'],grammar:['einsteigen und aussteigen sind trennbare Verben: „Wir steigen an der Haltestelle ein.“ Nach können steht fahren im Infinitiv am Satzende. an der Haltestelle sagt, wo man wartet; in die Tram beschreibt die Bewegung hinein.','einsteigen and aussteigen are separable verbs. After können, fahren goes to the end as an infinitive. an der Haltestelle names a location; in die Tram describes movement into it.','einsteigen và aussteigen là động từ tách. Sau können, fahren ở nguyên mẫu cuối câu. an der Haltestelle chỉ vị trí; in die Tram chỉ hướng đi vào tàu.'],example:['Wir steigen an der nächsten Haltestelle in die Tram ein.','We get on the tram at the next stop.','Chúng tôi lên tàu điện ở trạm kế tiếp.'],words:[['die Haltestelle','[ˈhaltəˌʃtɛlə]','stop; station','trạm dừng'],['die Tram','[tʁam]','tram','tàu điện'],['einsteigen','[ˈaɪ̯nˌʃtaɪ̯ɡn̩]','get on','lên xe/tàu'],['aussteigen','[ˈaʊ̯sˌʃtaɪ̯ɡn̩]','get off','xuống xe/tàu']]},
'2.60':{title:['Ähnliche Laute und Wörter unterscheiden','Distinguishing similar sounds and words','Phân biệt âm và từ gần giống nhau'],listen:['In dieser Ausspracheübung kommen kurze Wortgruppen mit ähnlichen Lauten. Höre genau hin und sprich die Wörter langsam, danach im natürlichen Rhythmus nach.','This pronunciation exercise uses short word groups with similar sounds. Listen closely, then repeat slowly and at a natural pace.','Bài phát âm gồm các cụm từ ngắn có âm gần giống nhau. Hãy nghe kỹ, đọc chậm rồi nhắc lại với nhịp tự nhiên.'],grammar:['Hier geht es nicht um eine neue Grammatikregel, sondern darum, Laute sauber zu unterscheiden. Achte auf den Anlaut und die Länge des Vokals.','This track practises pronunciation rather than a new grammar rule. Focus on the first sound and vowel length.','Track này luyện phát âm, không giới thiệu quy tắc ngữ pháp mới. Hãy chú ý âm đầu và độ dài nguyên âm.'],example:['Wir warten vor dem Hotel.','We are waiting in front of the hotel.','Chúng tôi đang chờ trước khách sạn.'],words:[['vorstellen','[ˈfoːɐ̯ˌʃtɛlən]','introduce; imagine','giới thiệu; hình dung'],['das Frühstück','[ˈfʁyːʃtʏk]','breakfast','bữa sáng'],['warten','[ˈvaʁtn̩]','wait','chờ'],['das Video','[ˈviːdeo]','video','video'],['der Film','[fɪlm]','film','phim'],['viele','[ˈfiːlə]','many','nhiều']]},
'2.61':{title:['Einen Satz mit ähnlichen Anlauten sprechen','Speaking a sentence with similar initial sounds','Luyện câu có nhiều âm đầu gần nhau'],listen:['Mehrere Wörter beginnen mit ähnlichen Lauten. Höre, welche Silben deutlich hervortreten, und sprich den ganzen Satz anschließend in einem ruhigen Sprachfluss.','Several words begin with similar sounds. Notice the stressed syllables and then say the full sentence smoothly.','Nhiều từ trong câu bắt đầu bằng âm gần giống nhau. Hãy nghe âm tiết được nhấn rồi đọc cả câu liền mạch, từ tốn.'],grammar:['Die Wortstellung bleibt die eines Aussagesatzes: Das konjugierte Verb steht an zweiter Stelle. wollen + Infinitiv drückt einen gemeinsamen Plan oder Wunsch aus; der Infinitiv steht am Satzende.','The sentence keeps normal statement word order: the conjugated verb is in second position. wollen + infinitive expresses a shared plan or wish, with the infinitive at the end.','Câu vẫn theo trật tự câu kể: động từ đã chia ở vị trí thứ hai. wollen + động từ nguyên mẫu diễn tả dự định hoặc mong muốn chung; nguyên mẫu đứng cuối câu.'],example:['Wir wollen im Winter zusammen wandern.','We want to go hiking together in winter.','Mùa đông chúng tôi muốn cùng nhau đi bộ đường dài.'],words:[['der Fotograf','[fotoˈɡʁaːf]','photographer','nhiếp ảnh gia'],['wandern','[ˈvandɐn]','hike','đi bộ đường dài'],['vergessen','[fɛɐ̯ˈɡɛsn̩]','forget','quên'],['der Winter','[ˈvɪntɐ]','winter','mùa đông']]},
'2.62':{title:['Über das Wetter sprechen','Talking about the weather','Nói về thời tiết'],listen:['Zum Schluss hörst du kurze, ausdrucksstarke Reaktionen auf Hitze und starken Regen. Achte darauf, wie die Stimme die Überraschung oder das Ärgernis hörbar macht.','At the end, you hear short expressive reactions to heat and heavy rain. Notice how intonation conveys surprise or frustration.','Phần cuối có những câu cảm thán ngắn về trời nóng và mưa lớn. Hãy chú ý ngữ điệu thể hiện ngạc nhiên hoặc khó chịu.'],grammar:['Ausrufe wie „So eine Hitze!“ sind verkürzte Alltagssätze: Das Nomen steht im Mittelpunkt, ein Verb fehlt. Es schüttet ist eine feste umgangssprachliche Wendung für sehr starken Regen.','Exclamations such as “What heat!” are shortened everyday phrases centred on a noun. Es schüttet is an idiom meaning that it is pouring with rain.','Câu cảm thán như “So eine Hitze!” là cách nói rút gọn, nhấn vào danh từ và lược động từ. Es schüttet là cách nói thông dụng nghĩa là mưa như trút nước.'],example:['Mann, ist das heute heiß!','Wow, it is hot today!','Trời ơi, hôm nay nóng quá!'],words:[['das Wetter','[ˈvɛtɐ]','weather','thời tiết'],['die Hitze','[ˈhɪtsə]','heat','cái nóng'],['das Mistwetter','[ˈmɪstˌvɛtɐ]','dreadful weather','thời tiết tệ'],['schütten','[ˈʃʏtn̩]','pour','mưa như trút']]}

Object.assign(TRACK_GUIDES,{
'1.1':{title:['Sich begrüßen und nach dem Befinden fragen','Greeting each other and asking how someone is','Chào nhau và hỏi thăm'],listen:['Nina und Niklas begrüßen sich informell und fragen kurz, wie es dem anderen geht. Achte auf die knappen Antworten und die Gegenfrage.','Nina and Niklas greet each other informally and briefly ask how the other is. Notice the short replies and the return question.','Nina và Niklas chào nhau thân mật rồi hỏi thăm ngắn gọn. Hãy chú ý câu trả lời và câu hỏi lại.'],grammar:['„Wie geht’s?“ ist die Kurzform von „Wie geht es?“; dir steht im Dativ. „Und dir?“ gibt die Frage freundlich zurück.','“Wie geht’s?” shortens “Wie geht es?”; dir is dative. “Und dir?” returns the question.','„Wie geht’s?“ là dạng rút gọn của „Wie geht es?“; dir ở Dativ. „Und dir?“ dùng để hỏi lại thân thiện.'],example:['Hallo, wie geht es dir? – Gut, danke. Und dir?','Hi, how are you? – Fine, thanks. And you?','Chào bạn, bạn khỏe không? – Mình khỏe, cảm ơn. Còn bạn?'],words:[['der Dank','[daŋk]','thanks','lời cảm ơn'],['gut','[ɡuːt]','well; good','khỏe; tốt'],['es gehen','[ɛs ˈɡeːən]','to be doing','cảm thấy; diễn ra']]},
'1.2':{title:['Namen nennen und nachfragen','Giving names and asking again','Nói tên và hỏi lại'],listen:['In einer lockeren Begegnung stellen sich zwei Personen vor; eine dritte Person wird ebenfalls begrüßt. Achte darauf, wie Namen erfragt und wiederholt werden.','In an informal meeting, two people introduce themselves and greet another person. Listen for how names are asked and repeated.','Trong cuộc gặp thân mật, hai người giới thiệu rồi chào thêm một người. Hãy chú ý cách hỏi và nhắc lại tên.'],grammar:['„Wie heißt du?“ fragt nach dem Namen. „Ich heiße …“ antwortet darauf. du ist informell; bei unbekannten Erwachsenen verwendet man oft Sie.','“Wie heißt du?” asks for a name; “Ich heiße …” answers it. du is informal; Sie is common with unfamiliar adults.','„Wie heißt du?“ hỏi tên; „Ich heiße …“ trả lời. du dùng thân mật, còn với người lớn chưa quen thường dùng Sie.'],example:['Wie heißt du? – Ich heiße Mai.','What is your name? – My name is Mai.','Bạn tên gì? – Mình tên Mai.'],words:[['heißen','[ˈhaɪ̯sn̩]','be called','tên là'],['die Frage','[ˈfʁaːɡə]','question','câu hỏi'],['die Antwort','[ˈantvɔʁt]','answer','câu trả lời']]},
'1.3':{title:['Sich verabschieden','Saying goodbye','Chào tạm biệt'],listen:['Die Personen beenden kurze Begegnungen mit unterschiedlichen Abschiedsformen. Achte darauf, welcher Ausdruck ein Wiedersehen bald erwarten lässt.','The speakers end brief encounters with different farewells. Notice which expression suggests they will meet again soon.','Mọi người kết thúc cuộc gặp bằng vài cách chào khác nhau. Hãy để ý câu nào hàm ý sớm gặp lại.'],grammar:['„Bis bald“ ist eine feste Abschiedsformel. Das Verb bis gehört hier nicht zu einem Satzbauplan, sondern bedeutet sinngemäß „wir sehen uns bald wieder“.','“Bis bald” is a fixed farewell meaning that you expect to see someone again soon.','„Bis bald“ là lời chào tạm biệt cố định, hàm ý hai người sẽ sớm gặp lại.'],example:['Tschüs, bis bald!','Bye, see you soon!','Tạm biệt, hẹn sớm gặp lại!'],words:[['tschüs','[tʃyːs]','bye','tạm biệt'],['bald','[balt]','soon','sớm'],['auf Wiedersehen','[aʊ̯f ˈviːdɐˌzeːən]','goodbye (formal)','tạm biệt (lịch sự)']]},
'1.4':{title:['Sich formell vorstellen','Introducing yourself formally','Tự giới thiệu trang trọng'],listen:['Eine Begrüßung am Morgen wird mit Namen und Familiennamen beantwortet. Achte auf den höflichen Ton und die Anrede Frau.','A morning greeting is followed by first and last names. Listen for the polite tone and the title Frau.','Lời chào buổi sáng được đáp lại bằng tên và họ. Hãy chú ý cách nói lịch sự và cách xưng hô Frau.'],grammar:['„Mein Name ist …“ und „Ich heiße …“ stellen sich vor. Frau steht vor dem Nachnamen; das ist höflich und formell.','“Mein Name ist …” and “Ich heiße …” introduce someone. Frau comes before a surname as a polite form of address.','„Mein Name ist …“ và „Ich heiße …“ dùng để giới thiệu. Frau đặt trước họ để xưng hô lịch sự.'],example:['Guten Morgen, Frau Weber. Mein Name ist Lan.','Good morning, Ms Weber. My name is Lan.','Chào buổi sáng, bà Weber. Tôi tên Lan.'],words:[['der Morgen','[ˈmɔʁɡn̩]','morning','buổi sáng'],['der Name','[ˈnaːmə]','name','tên'],['die Frau','[fʁaʊ̯]','Ms; woman','bà; phụ nữ']]},
'1.5':{title:['Höfliche Anrede und Namen','Polite forms of address and names','Xưng hô lịch sự và tên'],listen:['Mehrere Erwachsene begrüßen sich, stellen eine dritte Person vor und fragen noch einmal nach dem Namen. Achte auf Herr/Frau und Sie.','Several adults greet one another, introduce a third person, and ask for a name again. Notice Herr/Frau and Sie.','Một nhóm người lớn chào nhau, giới thiệu người thứ ba rồi hỏi lại tên. Hãy chú ý Herr/Frau và Sie.'],grammar:['Sie und Ihnen sind höfliche Formen. In „Wie heißen Sie?“ ist wie das Fragewort; danach steht das konjugierte Verb heißen.','Sie and Ihnen are polite forms. In “Wie heißen Sie?”, wie is the question word and the conjugated verb heißen follows it.','Sie và Ihnen là cách xưng hô lịch sự. Trong „Wie heißen Sie?“, wie là từ hỏi và động từ đã chia heißen đứng ngay sau.'],example:['Wie heißen Sie? – Ich bin Frau Nguyen.','What is your name? – I am Ms Nguyen.','Bà tên là gì? – Tôi là bà Nguyen.'],words:[['der Herr','[hɛɐ̯]','Mr; gentleman','ông; ngài'],['Ihnen','[ˈiːnən]','you (formal, dative)','ông/bà (Dativ lịch sự)'],['vorstellen','[ˈfoːɐ̯ˌʃtɛlən]','introduce','giới thiệu']]},
'1.6':{title:['Sich höflich verabschieden','Saying goodbye politely','Chào tạm biệt lịch sự'],listen:['Die Gesprächspartner verabschieden sich höflich und sprechen einander mit Namen an. Achte auf die Kombination aus formellem und vertrautem Abschied.','The speakers say goodbye politely and use names. Notice how formal and familiar farewells can appear together.','Mọi người chào tạm biệt lịch sự và gọi tên nhau. Hãy để ý sự kết hợp giữa cách nói trang trọng và thân mật.'],grammar:['„Auf Wiedersehen“ ist die formelle Abschiedsformel. „Tschüs“ klingt lockerer. Beide passen je nach Beziehung und Situation.','“Auf Wiedersehen” is formal; “Tschüs” is more casual. Choose according to the relationship and situation.','„Auf Wiedersehen“ trang trọng hơn „Tschüs“. Chọn cách nói tùy quan hệ và hoàn cảnh.'],example:['Auf Wiedersehen, Herr Hansen.','Goodbye, Mr Hansen.','Tạm biệt ông Hansen.'],words:[['wiedersehen','[ˈviːdɐˌzeːən]','see again','gặp lại'],['der Abschied','[ˈapʃiːt]','farewell','lời chia tay'],['tschüs','[tʃyːs]','bye','tạm biệt']]},
'1.7':{title:['Herkunft, Sprachen und Wohnort','Origin, languages, and place of residence','Quê quán, ngôn ngữ và nơi ở'],listen:['Eine Person beantwortet Fragen dazu, woher sie kommt, welche Sprachen sie spricht und wo sie wohnt. Achte darauf, dass die Fragewörter unterschiedliche Informationen verlangen.','One person answers questions about origin, languages, and where she lives. Notice that each question word asks for different information.','Một người trả lời câu hỏi về quê quán, ngôn ngữ và nơi ở. Hãy nhận ra mỗi từ hỏi cần một loại thông tin khác nhau.'],grammar:['Woher fragt nach Herkunft: aus + Dativ. Wo fragt nach dem Wohnort: in + Dativ. Welche Sprachen fragt nach dem Objekt; sprechen ändert sich zu ich spreche.','Woher asks about origin: aus + dative. Wo asks about residence: in + dative. Welche Sprachen asks for the object; sprechen becomes spreche with ich.','Woher hỏi xuất thân: aus + Dativ. Wo hỏi nơi ở: in + Dativ. Welche Sprachen hỏi ngôn ngữ; sprechen đổi thành spreche với ich.'],example:['Wo wohnen Sie? – Ich wohne in Hanoi.','Where do you live? – I live in Hanoi.','Ông/bà sống ở đâu? – Tôi sống ở Hà Nội.'],words:[['die Herkunft','[ˈhɛɐ̯kʊnft]','origin','xuất thân'],['die Sprache','[ˈʃpʁaːxə]','language','ngôn ngữ'],['wohnen','[ˈvoːnən]','live; reside','sống; cư trú']]},
'1.8':{title:['Zahlen von null bis zwanzig','Numbers from zero to twenty','Số từ 0 đến 20'],listen:['Die Zahlen werden der Reihe nach gesprochen. Höre besonders auf die Endungen und wiederhole erst in kleinen Gruppen, dann ohne Pause.','The numbers are spoken in sequence. Listen to the endings and repeat in small groups, then without pauses.','Các số được đọc theo thứ tự. Hãy chú ý âm cuối, nhắc lại từng nhóm nhỏ rồi đọc liền mạch.'],grammar:['Zahlen sind hier Wortschatz, keine Satzgrammatik. Lerne sie als Klangfolge; bei Telefonnummern werden Ziffern einzeln gesprochen.','This track practises number words, not sentence grammar. Learn their sound; telephone numbers are usually read digit by digit.','Track này luyện từ chỉ số, không phải ngữ pháp câu. Hãy nhớ âm của từng số; số điện thoại thường đọc từng chữ số.'],example:['Meine Nummer endet auf sieben.','My number ends in seven.','Số của tôi kết thúc bằng số bảy.'],words:[['die Zahl','[tsaːl]','number','con số'],['null','[nʊl]','zero','số không'],['zwölf','[tsvœlf]','twelve','mười hai']]},
'1.9':{title:['Am Telefon eine Nachricht hinterlassen','Leaving a message on the phone','Để lại lời nhắn qua điện thoại'],listen:['Ein Anrufer möchte eine bestimmte Person sprechen. Sie ist nicht da, deshalb bittet er um einen Rückruf und nennt seine Telefonnummer.','A caller asks to speak to someone who is unavailable, requests a call back, and gives his number.','Người gọi muốn gặp một người đang vắng mặt nên nhờ gọi lại và để lại số điện thoại.'],grammar:['„Ich möchte Frau Berg sprechen“ nutzt möchten als höfliche Bitte; sprechen bleibt Infinitiv am Ende. „Kann sie zurückrufen?“ fragt nach Möglichkeit.','“Ich möchte … sprechen” is a polite request; sprechen stays infinitive at the end. “Kann sie zurückrufen?” asks about possibility.','„Ich möchte … sprechen“ là lời nhờ lịch sự; sprechen giữ nguyên mẫu cuối câu. „Kann sie zurückrufen?“ hỏi người đó có thể gọi lại không.'],example:['Ich möchte Herrn Nguyen sprechen. Kann er zurückrufen?','I would like to speak to Mr Nguyen. Can he call back?','Tôi muốn gặp ông Nguyen. Ông ấy có thể gọi lại không?'],words:[['das Telefon','[ˈteːlefoːn]','telephone','điện thoại'],['zurückrufen','[tsuˈʁʏkˌʁuːfn̩]','call back','gọi lại'],['die Nummer','[ˈnʊmɐ]','number','số']]},
'1.10':{title:['Eine Telefonnummer notieren und bestätigen','Writing down and confirming a phone number','Ghi và xác nhận số điện thoại'],listen:['Ein zweites Telefongespräch wiederholt eine Telefonnummer zur Kontrolle. Achte auf Zahlenblöcke und die Bestätigung, ob alles stimmt.','A second phone call repeats a telephone number for checking. Listen for number groups and confirmation.','Cuộc gọi thứ hai đọc lại số điện thoại để kiểm tra. Hãy chú ý cách chia nhóm số và xác nhận đúng sai.'],grammar:['„Wie ist Ihre Telefonnummer?“ ist eine W-Frage. „Das ist richtig“ bestätigt die Information; richtig steht hier als Adjektiv nach sein ohne Endung.','“Wie ist Ihre Telefonnummer?” is a W-question. “Das ist richtig” confirms the information; richtig is an uninflected predicate adjective after sein.','„Wie ist Ihre Telefonnummer?“ là câu hỏi W. „Das ist richtig“ xác nhận thông tin; richtig là tính từ vị ngữ nên không thêm đuôi.'],example:['Ist die Nummer 0123 richtig? – Ja, das stimmt.','Is the number 0123 correct? – Yes, that is right.','Số 0123 có đúng không? – Vâng, đúng rồi.'],words:[['die Telefonnummer','[ˈteːləfoːnˌnʊmɐ]','phone number','số điện thoại'],['richtig','[ˈʁɪçtɪç]','correct','đúng'],['bestätigen','[bəˈʃtɛːtɪɡn̩]','confirm','xác nhận']]},
'1.11':{title:['Das Alphabet hören','Listening to the alphabet','Nghe bảng chữ cái'],listen:['Die Buchstaben werden der Reihe nach vorgesprochen. Achte auf Umlaute und ß, die im Deutschen eigene Namen haben.','The letters are spoken in sequence. Notice the umlauts and ß, which have their own German names.','Các chữ cái được đọc lần lượt. Hãy chú ý các chữ có dấu umlaut và ß vì chúng có tên đọc riêng.'],grammar:['Das Alphabet ist Aussprachetraining. ä, ö, ü sind eigene Buchstabenvarianten; ß heißt Eszett und klingt wie ein scharfes s.','This is pronunciation practice. ä, ö, ü are distinct letter forms; ß is called Eszett and sounds like a sharp s.','Đây là luyện phát âm. ä, ö, ü là các chữ cái riêng; ß gọi là Eszett và phát âm như âm s mạnh.'],example:['Mein Name beginnt mit M und endet mit y.','My name begins with M and ends with y.','Tên tôi bắt đầu bằng M và kết thúc bằng y.'],words:[['der Buchstabe','[ˈbuːxʃtaːbə]','letter','chữ cái'],['das Alphabet','[ˌalfaˈbeːt]','alphabet','bảng chữ cái'],['buchstabieren','[buˈxʃtaːbiːʁən]','spell','đánh vần']]},
'1.12':{title:['Eine E-Mail-Adresse buchstabieren','Spelling an email address','Đánh vần địa chỉ email'],listen:['Zwei Personen geben ihre E-Mail-Adressen durch und bitten um Wiederholung oder Buchstabieren. Achte auf minus, Unterstrich, @ und Punkt.','Two people give email addresses and ask for repetition or spelling. Listen for hyphen, underscore, at sign, and dot.','Hai người đọc địa chỉ email và nhờ nhắc lại hoặc đánh vần. Hãy chú ý dấu gạch nối, gạch dưới, @ và dấu chấm.'],grammar:['„Kannst du sie buchstabieren?“ sie bezieht sich auf die E-Mail-Adresse. Nach kann steht buchstabieren als Infinitiv am Satzende.','“Can you spell it?” sie refers to the email address. After kann, buchstabieren stays infinitive at the end.','„Kannst du sie buchstabieren?“ dùng sie thay cho địa chỉ email. Sau kann, buchstabieren ở nguyên mẫu cuối câu.'],example:['Kannst du meine Adresse bitte buchstabieren?','Can you spell my address, please?','Bạn có thể đánh vần địa chỉ của mình giúp mình không?'],words:[['die E-Mail-Adresse','[ˈiːmeːlʔaˌdʁɛsə]','email address','địa chỉ email'],['der Unterstrich','[ˈʊntɐˌʃtʁɪç]','underscore','dấu gạch dưới'],['buchstabieren','[buˈxʃtaːbiːʁən]','spell','đánh vần']]},
'1.13':{title:['Um Wiederholung und langsameres Sprechen bitten','Asking for repetition and slower speech','Nhờ nhắc lại và nói chậm hơn'],listen:['Die Sprecherin übt kurze Sätze, wenn sie etwas nicht verstanden hat: nachfragen, um Wiederholung bitten und das Tempo senken.','The speaker practises short phrases for when something is unclear: asking again, requesting repetition, and slowing the pace.','Người nói luyện câu ngắn khi chưa hiểu: hỏi lại, nhờ nhắc lại và xin nói chậm hơn.'],grammar:['In „Das verstehe ich nicht“ steht das finite Verb verstehe an Position zwei. Das bekannte Objekt Das steht zur Betonung am Satzanfang.','In “Das verstehe ich nicht”, the finite verb verstehe is in position two. The familiar object Das moves to the front for emphasis.','Trong „Das verstehe ich nicht“, động từ đã chia verstehe ở vị trí thứ hai. Tân ngữ Das được đưa lên đầu để nhấn mạnh.'],example:['Entschuldigung, bitte ein bisschen langsamer.','Sorry, a little more slowly, please.','Xin lỗi, vui lòng nói chậm hơn một chút.'],words:[['verstehen','[fɛɐ̯ˈʃteːən]','understand','hiểu'],['langsam','[ˈlaŋzaːm]','slowly','chậm'],['wiederholen','[viːdɐˈhoːlən]','repeat','nhắc lại']]}
});
Object.assign(TRACK_GUIDES,{
'1.14':{title:['Über Hobbys sprechen','Talking about hobbies','Nói về sở thích'],listen:['Ein Interview fragt nach Freizeitaktivitäten. Eine Person nennt Schwimmen und Joggen und sagt, wie oft sie das macht.','An interview asks about free-time activities. One person mentions swimming and jogging and says how often she does them.','Bài phỏng vấn hỏi về hoạt động lúc rảnh. Một người kể việc bơi, chạy bộ và tần suất.'],grammar:['gern zeigt, dass man eine Tätigkeit mag; oft beschreibt die Häufigkeit. Das konjugierte Verb steht direkt nach dem Subjekt.','gern says that someone enjoys an activity; oft gives frequency. The conjugated verb follows the subject.','gern diễn tả thích làm việc gì; oft chỉ tần suất. Động từ chia đứng sau chủ ngữ.'],example:['Ich jogge gern und schwimme oft.','I like jogging and often swim.','Tôi thích chạy bộ và thường đi bơi.'],words:[['das Hobby','[ˈhɔbi]','hobby','sở thích'],['schwimmen','[ˈʃvɪmən]','swim','bơi'],['joggen','[ˈdʒɔɡn̩]','jog','chạy bộ']]},
'1.15':{title:['Vorlieben vergleichen','Comparing preferences','So sánh sở thích'],listen:['Zwei Freunde sprechen darüber, ob sie gern lesen, reisen oder ins Kino gehen. Achte auf Zustimmung und die höfliche Verneinung einer Aktivität.','Two friends discuss whether they enjoy reading, travelling, or going to the cinema. Notice agreement and a gentle negative reply.','Hai người bạn nói về việc thích đọc sách, du lịch hay đi xem phim. Hãy chú ý cách đồng ý và từ chối nhẹ nhàng.'],grammar:['gern steht meist nach dem konjugierten Verb. „Nicht so gern“ verneint die Vorliebe, ohne die Aktivität völlig abzulehnen.','gern usually follows the conjugated verb. “Nicht so gern” softens a negative preference.','gern thường đứng sau động từ chia. „Nicht so gern“ diễn tả không thích lắm, nhẹ hơn phủ định hoàn toàn.'],example:['Ich lese gern, aber ich gehe nicht so gern ins Kino.','I like reading, but I do not enjoy going to the cinema as much.','Tôi thích đọc sách, nhưng không thích đi xem phim lắm.'],words:[['lesen','[ˈleːzn̩]','read','đọc'],['reisen','[ˈʁaɪ̯zn̩]','travel','du lịch'],['das Kino','[ˈkiːno]','cinema','rạp chiếu phim']]},
'1.16':{title:['Freizeitaktivitäten nennen','Naming leisure activities','Kể hoạt động lúc rảnh'],listen:['Eine Freundin erzählt, dass sie gern fotografiert und am Wochenende tanzt. Achte auf die Zeitangabe am Wochenende.','A friend says she enjoys photography and dancing at weekends. Listen for the time phrase am Wochenende.','Một người bạn kể mình thích chụp ảnh và nhảy vào cuối tuần. Hãy chú ý cụm am Wochenende.'],grammar:['Am Wochenende besteht aus an + dem und steht mit Dativ. Bei ich heißt es ich fotografiere und ich tanze; beide Verben stehen im Präsens.','am Wochenende contracts an dem and takes the dative. The present forms are fotografiere and tanze.','am Wochenende rút gọn từ an dem và đi với Dativ. Động từ hiện tại chia là fotografiere và tanze.'],example:['Am Wochenende fotografiere ich gern.','I like taking photos at the weekend.','Cuối tuần tôi thích chụp ảnh.'],words:[['fotografieren','[fotoɡʁaˈfiːʁən]','take photographs','chụp ảnh'],['tanzen','[ˈtantsn̩]','dance','nhảy'],['das Wochenende','[ˈvɔxn̩ˌʔɛndə]','weekend','cuối tuần']]},
'1.17':{title:['Einen Kinobesuch verabreden','Arranging a cinema visit','Hẹn nhau đi xem phim'],listen:['Zwei Personen schlagen einen Kinobesuch vor, prüfen passende Tage und finden einen Termin, der beiden passt.','Two people suggest going to the cinema, check possible days, and find a time that works for both.','Hai người rủ nhau đi xem phim, thử các ngày rồi chọn ngày cả hai đều đi được.'],grammar:['„Gehen wir …?“ ist ein Vorschlag mit Verb an erster Stelle. Am + Wochentag nennt den Tag; das geht leider nicht sagt höflich ab.','“Gehen wir …?” makes a suggestion with the verb first. am + weekday names the day; das geht leider nicht declines politely.','„Gehen wir …?“ là lời rủ, động từ lên đầu. am + thứ chỉ ngày; das geht leider nicht từ chối lịch sự.'],example:['Gehen wir am Mittwoch ins Kino? – Ja, gern.','Shall we go to the cinema on Wednesday? – Yes, gladly.','Thứ Tư mình đi xem phim nhé? – Được đó.'],words:[['der Vorschlag','[ˈfoːɐ̯ʃlaːk]','suggestion','lời đề nghị'],['der Mittwoch','[ˈmɪtvɔx]','Wednesday','thứ Tư'],['leider','[ˈlaɪ̯dɐ]','unfortunately','tiếc là']]},
'1.18':{title:['Fragen und Antworten intonieren','Using question and answer intonation','Luyện ngữ điệu hỏi và đáp'],listen:['Mehrere Mini-Dialoge üben Fragen zu Vorschlägen, Tagen und gemeinsamen Aktivitäten. Höre, ob die Stimme am Ende steigt oder fällt.','Several mini-dialogues practise questions about plans, days, and activities. Listen for rising and falling intonation.','Các hội thoại ngắn luyện câu hỏi về kế hoạch, ngày và hoạt động. Hãy nghe ngữ điệu lên hay xuống ở cuối câu.'],grammar:['Bei einer Entscheidungsfrage wie „Gehen wir …?“ steht das Verb zuerst; die Stimme steigt oft. Eine W-Frage wie „Wann?“ hat das Fragewort vorn und meist fallende Intonation.','A yes/no question such as “Gehen wir …?” starts with the verb and often rises. A W-question begins with its question word and often falls.','Câu hỏi Có/Không như „Gehen wir …?“ đưa động từ lên đầu và thường lên giọng. Câu hỏi W đặt từ hỏi đầu câu và thường xuống giọng.'],example:['Wann treffen wir uns? – Am Samstag.','When shall we meet? – On Saturday.','Khi nào mình gặp nhau? – Thứ Bảy.'],words:[['die Frage','[ˈfʁaːɡə]','question','câu hỏi'],['die Antwort','[ˈantvɔʁt]','answer','câu trả lời'],['treffen','[ˈtʁɛfn̩]','meet','gặp']]},
'1.19':{title:['Nein höflich und regional sagen','Saying no politely and regionally','Từ chối và cách nói theo vùng'],listen:['Mehrere Sprecher sagen, dass etwas leider nicht möglich ist. Manche verwenden regionale oder lockere Varianten.','Several speakers say that something is unfortunately not possible, using casual or regional variants.','Nhiều người nói rằng tiếc là việc đó không thể; có người dùng cách nói thân mật hoặc theo vùng.'],grammar:['„Das geht leider nicht“ ist eine höfliche Absage. Nee und nö sind umgangssprachlich; regionale Aussprache kann Wörter verkürzen, ändert aber nicht den Grundsinn.','“Das geht leider nicht” is a polite refusal. Nee and nö are informal; regional pronunciation changes the sound, not the basic meaning.','„Das geht leider nicht“ là cách từ chối lịch sự. Nee và nö thân mật; giọng vùng miền đổi âm nhưng ý chính vẫn vậy.'],example:['Am Freitag geht es leider nicht.','Friday unfortunately does not work for me.','Tiếc là thứ Sáu mình không đi được.'],words:[['leider','[ˈlaɪ̯dɐ]','unfortunately','tiếc là'],['regional','[ʁeɡioˈnaːl]','regional','thuộc vùng miền'],['gehen','[ˈɡeːən]','work; be possible','được; có thể']]},
'1.20':{title:['Große Zahlen verstehen','Understanding large numbers','Nghe hiểu số lớn'],listen:['Zahlwörter steigen von zweistelligen Zahlen bis zu Tausendern und Zehntausendern. Höre zuerst die Einheiten und dann die Größenordnung.','Number words grow from two-digit numbers to thousands and tens of thousands. Listen for units and then the scale.','Các số tăng từ hàng chục đến hàng nghìn và hàng chục nghìn. Hãy nghe hàng đơn vị trước rồi xác định độ lớn.'],grammar:['Im Deutschen steht bei 21 bis 99 oft zuerst die Einerzahl, dann und, dann die Zehnerzahl: einundzwanzig. Tausend und hundert werden zusammengeschrieben.','In German numbers 21–99, the unit often comes before und and the tens: einundzwanzig. Tausend and hundert join the number word.','Trong tiếng Đức, số 21–99 thường đọc hàng đơn vị trước, rồi und, rồi hàng chục: einundzwanzig. Tausend và hundert ghép liền trong từ số.'],example:['Die Stadt hat fünfundzwanzigtausend Einwohner.','The town has twenty-five thousand residents.','Thành phố có hai mươi lăm nghìn cư dân.'],words:[['die Zahl','[tsaːl]','number','con số'],['hundert','[ˈhʊndɐt]','hundred','một trăm'],['tausend','[ˈtaʊ̯zn̩t]','thousand','một nghìn']]}
});

'1.21':{title:['Zahlen und den Hamburger Hafen beschreiben','Describing figures and the Port of Hamburg','Mô tả số liệu và cảng Hamburg'],listen:['Ein kurzer Informationstext nennt Größe und Bedeutung des Hafens. Höre die großen Zahlen und die Einheiten genau.','A short information segment describes the port’s scale and importance. Listen carefully to the large numbers and units.','Đoạn thông tin nói về quy mô và vai trò của cảng. Hãy nghe kỹ số lớn và đơn vị.'],grammar:['pro Jahr bedeutet „jedes Jahr“. Mengenangaben wie über 72 Quadratkilometer stehen ohne zusätzlichen Artikel vor der Maßeinheit.','pro Jahr means “per year”. Quantities such as über 72 Quadratkilometer appear directly before the unit.','pro Jahr nghĩa là “mỗi năm”. Cụm số lượng như über 72 Quadratkilometer đứng trước đơn vị đo.'],example:['Der Hafen ist über 70 Quadratkilometer groß.','The port is over 70 square kilometres in area.','Cảng rộng hơn 70 kilômét vuông.'],words:[['der Hafen','[ˈhaːfn̩]','harbour; port','cảng'],['das Schiff','[ʃɪf]','ship','tàu thủy'],['der Quadratkilometer','[kvaˈdʁaːtkiˌloːmɛtɐ]','square kilometre','kilômét vuông']]},
'1.22':{title:['Am Bahnhof Informationen verstehen','Understanding information at the station','Hiểu thông tin ở nhà ga'],listen:['Eine Durchsage warnt vor einem abfahrenden Zug; danach folgen Zahlen zu Zugverbindungen und Fahrzeiten.','An announcement warns passengers about a departing train, followed by figures for routes and travel times.','Thông báo nhắc hành khách tránh xa tàu sắp chạy; sau đó là số liệu tuyến và thời gian đi.'],grammar:['„Der Zug fährt ab“ enthält das trennbare Verb abfahren: ab steht am Ende. Fahrzeiten stehen oft mit in + Zeitangabe, etwa in zwei Stunden.','“Der Zug fährt ab” uses the separable verb abfahren; ab goes at the end. Travel times often use in + duration.','„Der Zug fährt ab“ dùng động từ tách abfahren; ab xuống cuối. Thời gian di chuyển thường dùng in + khoảng thời gian.'],example:['Der Zug fährt in zwei Stunden nach Berlin.','The train goes to Berlin in two hours.','Tàu đi Berlin trong hai giờ.'],words:[['der Bahnhof','[ˈbaːnhoːf]','station','nhà ga'],['das Gleis','[ɡlaɪ̯s]','platform; track','sân ga; đường ray'],['abfahren','[ˈapˌfaːʁən]','depart','khởi hành']]},
'1.23':{title:['Das Hamburger Rathaus beschreiben','Describing Hamburg’s town hall','Mô tả tòa thị chính Hamburg'],listen:['Ein Rundgang nennt Alter, Breite, Höhe und Anzahl der Räume im Rathaus. Höre, welche Zahl zu welcher Eigenschaft gehört.','A tour gives the town hall’s age, width, height, and number of rooms. Match each figure to the correct feature.','Đoạn giới thiệu nêu tuổi, chiều rộng, chiều cao và số phòng. Hãy ghép từng con số với thông tin đúng.'],grammar:['„Es gibt“ bedeutet, dass etwas vorhanden ist; danach steht das Nomen im Akkusativ. Maße beschreiben mit sein eine Eigenschaft: Das Rathaus ist breit.','Es gibt means something exists and is followed by an accusative noun. sein links the building to a measurement or feature.','„Es gibt“ nói có thứ gì và theo sau là danh từ Akkusativ. sein nối tòa nhà với số đo hoặc đặc điểm.'],example:['Im Rathaus gibt es viele Räume.','There are many rooms in the town hall.','Trong tòa thị chính có nhiều phòng.'],words:[['das Rathaus','[ˈʁaːthaʊ̯s]','town hall','tòa thị chính'],['der Raum','[ʁaʊ̯m]','room','căn phòng'],['breit','[bʁaɪ̯t]','wide','rộng']]},
'1.24':{title:['Eine Sehenswürdigkeit vorstellen','Introducing a landmark','Giới thiệu địa danh'],listen:['Ein Beitrag stellt die Michaeliskirche vor, nennt ihren Hamburger Spitznamen und beschreibt Turm und Aussicht.','A segment introduces St Michael’s Church, its local nickname, and the tower and view.','Đoạn giới thiệu nhà thờ St. Michael, biệt danh địa phương, tòa tháp và tầm nhìn.'],grammar:['„Man sagt …“ führt eine allgemeine oder örtliche Bezeichnung ein. „Hier ist Platz für …“ beschreibt, wie viele Personen hinein passen.','Man sagt introduces a common or local name. Hier ist Platz für states how many people fit.','„Man sagt …“ giới thiệu cách gọi chung hoặc địa phương. „Hier ist Platz für …“ nói sức chứa.'],example:['In Hamburg sagt man kurz „der Michel“.','In Hamburg, people often call it “the Michel”.','Ở Hamburg, người ta thường gọi ngắn là “der Michel”.'],words:[['die Kirche','[ˈkɪʁçə]','church','nhà thờ'],['der Turm','[tʊʁm]','tower','tòa tháp'],['der Platz','[plats]','space; place','chỗ; nơi']]},
'1.25':{title:['Die Elbphilharmonie entdecken','Discovering the Elbphilharmonie','Khám phá Elbphilharmonie'],listen:['Ein Gespräch kündigt den Besuch eines neuen Konzertgebäudes an und nennt Besucher- und Konzertzahlen.','A conversation introduces a new concert hall and gives visitor and concert figures.','Cuộc trò chuyện giới thiệu một nhà hòa nhạc mới và nêu số khách, số buổi diễn.'],grammar:['„Das Konzert beginnt in fünf Minuten“ nutzt Präsens für einen nahen, geplanten Zeitpunkt. „hinauf“ beschreibt die Bewegung nach oben.','The present tense can describe a near scheduled event. hinauf describes movement upward.','Hiện tại có thể nói về lịch sắp diễn ra. hinauf chỉ hướng đi lên.'],example:['Das Konzert beginnt in zehn Minuten.','The concert begins in ten minutes.','Buổi hòa nhạc bắt đầu sau mười phút.'],words:[['das Konzert','[kɔnˈtsɛʁt]','concert','buổi hòa nhạc'],['der Besucher','[bəˈzuːxɐ]','visitor','khách tham quan'],['hinauf','[hɪˈnaʊ̯f]','upwards','lên trên']]},
'1.26':{title:['Mit dem Taxi ein Ziel erreichen','Taking a taxi to a destination','Đi taxi đến điểm cần đến'],listen:['Fahrgast und Fahrer klären das Ziel, die Route und den Fahrpreis. Achte darauf, wie die Fahrt höflich begonnen und beendet wird.','Passenger and driver confirm the destination, route, and fare. Notice how the ride is requested and concluded politely.','Khách và tài xế xác nhận điểm đến, đường đi và giá tiền. Hãy chú ý cách yêu cầu và kết thúc chuyến đi lịch sự.'],grammar:['„Zum Hotel“ ist die Kurzform von zu dem Hotel und steht mit Dativ. „Das macht 13 Euro 70“ nennt den Gesamtpreis.','zum Hotel contracts zu dem Hotel and uses the dative. Das macht … states the total price.','„Zum Hotel“ rút gọn từ zu dem Hotel, đi với Dativ. „Das macht …“ nêu tổng số tiền.'],example:['Zum Bahnhof, bitte. – Das macht zwölf Euro.','To the station, please. – That will be twelve euros.','Đến nhà ga, làm ơn. – Tổng cộng mười hai euro.'],words:[['das Taxi','[ˈtaksi]','taxi','taxi'],['der Fahrgast','[ˈfaːɐ̯ɡast]','passenger','hành khách'],['der Preis','[pʁaɪ̯s]','price','giá']]},
'1.27':{title:['Regional grüßen','Greeting people regionally','Chào hỏi theo vùng miền'],listen:['Drei kurze Grußformen stammen aus verschiedenen deutschsprachigen Regionen. Höre die Aussprache und ordne sie nicht als verschiedene Bedeutungen ein.','Three greetings come from different German-speaking regions. Listen to the pronunciation; they do not express completely different meanings.','Ba lời chào ngắn đến từ các vùng nói tiếng Đức khác nhau. Hãy nghe cách phát âm; chúng không mang nghĩa hoàn toàn khác nhau.'],grammar:['Moin, Grüß Gott und Grüezi sind regionale Grußformeln. Grüß ist ein Imperativ von grüßen, aber die ganze Wendung funktioniert als feste Begrüßung.','Moin, Grüß Gott, and Grüezi are regional greetings. Grüß is an imperative form, but the whole phrase functions as a fixed greeting.','Moin, Grüß Gott và Grüezi là lời chào theo vùng. Grüß vốn là mệnh lệnh của grüßen, nhưng cả cụm được dùng như lời chào cố định.'],example:['Grüezi! – Grüezi, wie geht es Ihnen?','Hello! – Hello, how are you?','Xin chào! – Xin chào, ông/bà khỏe không?'],words:[['grüßen','[ˈɡʁyːsn̩]','greet','chào hỏi'],['der Gruß','[ɡʁuːs]','greeting','lời chào'],['regional','[ʁeɡioˈnaːl]','regional','thuộc vùng miền']]},
'1.28':{title:['Vokale unterscheiden','Distinguishing vowel sounds','Phân biệt nguyên âm'],listen:['Wortgruppen zeigen kurze und lange Vokale in einfachen Wörtern. Achte darauf, wie die Vokallänge den Klang verändert.','Word groups show short and long vowels in simple words. Listen for how vowel length changes the sound.','Các nhóm từ luyện nguyên âm ngắn và dài. Hãy nghe độ dài nguyên âm làm âm từ thay đổi thế nào.'],grammar:['Hier geht es um Aussprache, nicht um eine neue Grammatikregel. Ein langer Vokal wird länger gehalten; übe ihn im ganzen Wort, nicht nur isoliert.','This is pronunciation practice, not a new grammar rule. Hold a long vowel longer and practise it in the whole word.','Đây là luyện phát âm, không có quy tắc ngữ pháp mới. Kéo dài nguyên âm dài và luyện trong cả từ.'],example:['Der Weg ist lang.','The way is long.','Con đường dài.'],words:[['der Weg','[veːk]','way; path','con đường'],['lang','[laŋ]','long','dài'],['der Zug','[tsuːk]','train','tàu hỏa']]},
'1.29':{title:['Vokale noch einmal hören','Reviewing vowel sounds','Ôn nghe nguyên âm'],listen:['Dieselben Lautgruppen kommen noch einmal. Vergleiche bewusst die Wörter mit langem und kurzem Vokal und wiederhole sie.','The same sound groups appear again. Compare words with long and short vowels and repeat them.','Các nhóm âm được nghe lại. Hãy so sánh từ có nguyên âm dài, ngắn rồi nhắc lại.'],grammar:['Die Wiederholung festigt den Lautunterschied. Bei einem neuen Wort hilft es, die betonte Silbe und Vokallänge mitzuhören.','The repetition reinforces sound contrasts. With a new word, listen for the stressed syllable and vowel length.','Lượt lặp giúp ghi nhớ sự khác nhau của âm. Khi nghe từ mới, chú ý âm tiết nhấn và độ dài nguyên âm.'],example:['Bitte sprechen Sie langsam.','Please speak slowly.','Xin hãy nói chậm.'],words:[['sprechen','[ˈʃpʁɛçn̩]','speak','nói'],['langsam','[ˈlaŋzaːm]','slowly','chậm'],['der Laut','[laʊ̯t]','sound','âm']]},
'1.30':{title:['Den Weg zum Theater erfragen','Asking for directions to the theatre','Hỏi đường đến nhà hát'],listen:['Eine Person fragt nach dem Theater und bekommt eine Wegbeschreibung mit mehreren Abbiegungen. Höre genau, wo sie links geht und wann sie geradeaus läuft.','A person asks for the theatre and gets directions with several turns. Track where to turn left and continue straight.','Một người hỏi đường đến nhà hát và được chỉ lối có nhiều chỗ rẽ. Hãy theo dõi lúc rẽ trái và đi thẳng.'],grammar:['„Wo ist …?“ fragt nach einem Ort. Die höfliche Weganweisung nutzt den Imperativ mit Sie: Gehen Sie links/geradeaus.','Wo ist …? asks for a location. Polite directions use the Sie imperative: Gehen Sie links/geradeaus.','„Wo ist …?“ hỏi vị trí. Chỉ đường lịch sự dùng mệnh lệnh với Sie: Gehen Sie links/geradeaus.'],example:['Gehen Sie hier links und dann geradeaus.','Turn left here and then go straight.','Ông/bà rẽ trái ở đây rồi đi thẳng.'],words:[['das Theater','[teˈaːtɐ]','theatre','nhà hát'],['links','[lɪŋks]','left','bên trái'],['geradeaus','[ɡəˈʁaːdəʔaʊ̯s]','straight ahead','đi thẳng']]},
'1.31':{title:['Den Weg zur U-Bahn finden','Finding the underground station','Tìm đường đến tàu điện ngầm'],listen:['Eine Person fragt nach der U-Bahn und erhält eine Wegbeschreibung mit rechts und links. Höre die Reihenfolge der Richtungswechsel.','A person asks for the underground and gets directions using right and left. Follow the sequence of turns.','Một người hỏi đường đến tàu điện ngầm và được chỉ bằng phải, trái. Hãy nghe thứ tự các chỗ rẽ.'],grammar:['rechts und links sind Richtungsadverbien. Da verweist auf den Ort, den man nach der Weganweisung erreicht.','rechts and links are direction adverbs. Da points to the place reached after following the directions.','rechts và links là trạng từ chỉ hướng. Da chỉ nơi đến sau khi đi theo hướng dẫn.'],example:['Gehen Sie rechts und dann gleich links.','Go right and then immediately left.','Rẽ phải rồi rẽ trái ngay.'],words:[['die U-Bahn','[ˈuːbaːn]','underground; metro','tàu điện ngầm'],['rechts','[ʁɛçts]','right','bên phải'],['gleich','[ɡlaɪ̯ç]','immediately','ngay']]},
'1.32':{title:['Nach dem Weg zum Hotel fragen','Asking the way to a hotel','Hỏi đường đến khách sạn'],listen:['Ein Reisender fragt nach einem Hotel, erhält zwei Wegschritte und erkundigt sich, ob der Weg weit ist.','A traveller asks for a hotel, gets two directions, and checks whether it is far.','Một du khách hỏi khách sạn, nghe hai bước chỉ đường rồi hỏi có xa không.'],grammar:['„Ist das weit?“ ist eine Ja/Nein-Frage: Das Verb ist steht zuerst. Eine Zeitangabe wie fünf Minuten beschreibt die Gehzeit.','“Ist das weit?” is a yes/no question with ist first. A phrase such as fünf Minuten gives walking time.','„Ist das weit?“ là câu hỏi Có/Không, đưa ist lên đầu. Cụm fünf Minuten cho biết thời gian đi bộ.'],example:['Ist das weit? – Nein, nur fünf Minuten.','Is it far? – No, only five minutes.','Có xa không? – Không, chỉ năm phút thôi.'],words:[['das Hotel','[hoˈtɛl]','hotel','khách sạn'],['weit','[vaɪ̯t]','far','xa'],['die Minute','[miˈnuːtə]','minute','phút']]},
'1.33':{title:['Nomen aus Kultur und Veranstaltungen hören','Listening for cultural and event nouns','Nghe danh từ về văn hóa và sự kiện'],listen:['Eine Wortliste sammelt Begriffe zu Bühne, Musik, Film und Publikum. Höre den Artikel mit, denn er gehört zum Nomen.','A word list collects terms for theatre, music, film, and audiences. Listen to each article because it is part of the noun.','Danh sách gom từ về sân khấu, âm nhạc, phim và khán giả. Hãy nghe kèm mạo từ vì mạo từ là phần cần nhớ của danh từ.'],grammar:['Das ist Wortschatz- und Artikeltraining, keine Satzregel. Lerne jedes Nomen mit seinem Artikel: das Theater, der Chor, das Publikum.','This is vocabulary and article practice, not a sentence rule. Learn each noun together with its article.','Đây là luyện từ vựng và mạo từ, không phải quy tắc câu. Học mỗi danh từ cùng der/die/das.'],example:['Das Publikum hört ein Konzert.','The audience listens to a concert.','Khán giả nghe một buổi hòa nhạc.'],words:[['das Theater','[teˈaːtɐ]','theatre','nhà hát'],['der Chor','[koːɐ̯]','choir','dàn hợp xướng'],['das Publikum','[ˈpuːblikʊm]','audience','khán giả']]},
'1.34':{title:['Hobbys im Sommer','Hobbies in summer','Sở thích mùa hè'],listen:['Eine Radiohörerin erzählt, dass sie im Sommer nach der Arbeit und am Wochenende schwimmt. Höre auf Jahreszeit, Tageszeit und Häufigkeit.','A radio caller says she swims in summer after work and at weekends. Listen for season, time of day, and frequency.','Một thính giả kể mình bơi vào mùa hè, sau giờ làm và cuối tuần. Chú ý mùa, thời điểm và tần suất.'],grammar:['im Sommer bedeutet in dem Sommer und steht im Dativ. jeden Tag ist eine Zeitangabe im Akkusativ und beschreibt, wie oft etwas passiert.','im Sommer contracts in dem and takes the dative. jeden Tag is an accusative time expression showing frequency.','im Sommer rút gọn in dem và đi với Dativ. jeden Tag là cụm thời gian Akkusativ chỉ tần suất.'],example:['Im Sommer schwimme ich jeden Tag.','In summer, I swim every day.','Mùa hè ngày nào tôi cũng bơi.'],words:[['der Sommer','[ˈzɔmɐ]','summer','mùa hè'],['die Arbeit','[ˈaʁbaɪ̯t]','work','công việc'],['schwimmen','[ˈʃvɪmən]','swim','bơi']]},
'1.35':{title:['Radfahren im Frühling','Cycling in spring','Đạp xe vào mùa xuân'],listen:['Eine Frau erzählt, dass sie im April oder Mai gern Rad fährt und im Urlaub täglich unterwegs ist.','A woman says she enjoys cycling in April or May and rides every day while on holiday.','Một người phụ nữ thích đạp xe vào tháng Tư hoặc Năm và đi xe mỗi ngày trong kỳ nghỉ.'],grammar:['Im April/im Mai nennt den Zeitpunkt; mit dem Fahrrad verwendet mit + Dativ. „Meine Freundin und ich“ ist ein zusammengesetztes Subjekt und verlangt fahren im Plural.','im April/im Mai gives the time; mit dem Fahrrad uses mit + dative. The compound subject takes plural fahren.','im April/im Mai chỉ thời điểm; mit dem Fahrrad dùng mit + Dativ. Chủ ngữ ghép „Meine Freundin und ich“ đi với fahren số nhiều.'],example:['Im Mai fahre ich gern mit dem Fahrrad.','I like cycling in May.','Tháng Năm tôi thích đi xe đạp.'],words:[['das Fahrrad','[ˈfaːɐ̯ˌʁaːt]','bicycle','xe đạp'],['der Urlaub','[ˈuːɐ̯laʊ̯p]','holiday','kỳ nghỉ'],['fahren','[ˈfaːʁən]','ride; travel','đi; lái']]},
'1.36':{title:['Im Herbst reisen','Travelling in autumn','Du lịch vào mùa thu'],listen:['Ein Anrufer berichtet von Reisen im Herbst, nennt mehrere Städte und erklärt, warum diese Jahreszeit angenehm ist.','A caller talks about autumn trips, names several cities, and explains why the season is pleasant.','Một thính giả kể các chuyến đi mùa thu, nhắc nhiều thành phố và giải thích vì sao mùa này dễ chịu.'],grammar:['nach steht meist ohne Artikel vor Städten: nach Leipzig. Im Oktober/im November sind Dativ-Zeitangaben; dann ordnet die nächsten Schritte.','nach usually has no article before city names. im Oktober/im November are dative time phrases; dann orders the next steps.','nach thường không có mạo từ trước tên thành phố. im Oktober/im November là cụm thời gian Dativ; dann nối bước kế tiếp.'],example:['Im Herbst reisen wir nach Leipzig und Dresden.','In autumn, we travel to Leipzig and Dresden.','Mùa thu chúng tôi đi Leipzig và Dresden.'],words:[['der Herbst','[hɛʁpst]','autumn','mùa thu'],['die Stadt','[ʃtat]','city','thành phố'],['reisen','[ˈʁaɪ̯zn̩]','travel','du lịch']]},
'1.37':{title:['Hobbys im Winter','Hobbies in winter','Sở thích mùa đông'],listen:['Eine Anruferin erzählt, dass sie im Winter gern spazieren geht und Museen besucht. Sie vergleicht draußen und drinnen.','A caller says she likes walking and visiting museums in winter, contrasting outdoors and indoors.','Một thính giả thích đi dạo và thăm bảo tàng vào mùa đông; cô ấy so sánh bên ngoài với trong nhà.'],grammar:['spazieren gehen ist eine feste Verbverbindung; oft steht gehen am Ende. Draußen und drinnen sind Ortsadverbien und bilden einen Gegensatz.','spazieren gehen is a fixed verb combination; gehen often comes at the end. draußen and drinnen are contrasting place adverbs.','spazieren gehen là cụm động từ cố định; gehen thường đứng cuối. draußen và drinnen là cặp trạng từ chỉ nơi đối lập.'],example:['Im Winter gehe ich gern ins Museum.','In winter, I like going to the museum.','Mùa đông tôi thích đi bảo tàng.'],words:[['der Winter','[ˈvɪntɐ]','winter','mùa đông'],['das Museum','[muˈzeːʊm]','museum','bảo tàng'],['spazieren gehen','[ʃpaˈtsiːʁən ˈɡeːən]','go for a walk','đi dạo']]}
});

['2 · Hỏi gợi ý tham quan','Das Paar fragt höflich nach Sehenswürdigkeiten und vergleicht einen Spaziergang mit einer Stadttour.','They ask hotel staff what they can visit and compare a walk with a city tour.','Họ hỏi nhân viên khách sạn nên tham quan gì và cân nhắc đi bộ hay tour.','„Können Sie … geben?“ ist eine höfliche Bitte. Nach können steht geben als Infinitiv am Satzende.','“Können Sie … geben?” is a polite request. After können, geben stays as an infinitive at the end.','„Können Sie … geben?“ là cách nhờ lịch sự; sau können, geben ở nguyên mẫu cuối câu.'],
['3 · Xếp lịch trong ngày','Sie bringen Frühstück, Stadttour, Museum und Abendessen in eine sinnvolle Reihenfolge.','The travellers arrange breakfast, sightseeing, a museum visit, and dinner in order.','Hai người xếp lần lượt bữa sáng, tham quan, bảo tàng và bữa tối.','zuerst, dann und danach ordnen die Schritte. Steht ein Zeitwort vorn, bleibt das Verb auf Position zwei.','zuerst, dann, danach order the steps. If a time word comes first, the verb stays in position two.','zuerst, dann, danach nối các bước. Khi trạng từ thời gian đứng đầu, động từ vẫn ở vị trí thứ hai.']],

['2 · Chọn tuyến tàu điện','Sie vergleichen die Tramlinien und suchen eine direkte Verbindung zum Ziel.','They compare tram lines and look for a direct route to the destination.','Họ so sánh các tuyến tàu điện và tìm tuyến đi thẳng đến nơi cần đến.','mit steht immer mit dem Dativ. Deshalb heißt es mit der Tram.','mit always takes the dative. Therefore, it is mit der Tram.','mit luôn đi với Dativ, vì vậy nói mit der Tram.'],

'2.60':[
['1 · Nghe âm đầu','Höre auf den ersten Konsonanten jedes kurzen Wortes.','Listen for the opening consonant in each short word.','Nghe phụ âm đầu trong từng từ ngắn.','Hier wird Aussprache geübt, keine neue Grammatik. Vergleiche den gehörten Laut, statt nur nach der Schreibweise zu raten.','This is pronunciation practice, not a new grammar rule. Compare the sound rather than guessing from spelling.','Đây là luyện phát âm, không thêm quy tắc ngữ pháp. Hãy so sánh âm nghe được thay vì đoán theo chữ viết.'],
['2 · Nghe nguyên âm và trọng âm','Achte auf Vokallänge und Betonung, damit ähnlich klingende Wörter unterscheidbar bleiben.','Notice how vowel length and stress distinguish similar-sounding words.','Chú ý độ dài nguyên âm và âm tiết được nhấn để phân biệt từ gần giống nhau.','Lange und kurze Vokale können Wörter unterscheiden. Wiederhole deshalb die ganze Wortgruppe im natürlichen Rhythmus.','Long and short vowels can distinguish words. Repeat the whole word group at a natural rhythm.','Nguyên âm dài và ngắn có thể làm đổi nghĩa từ. Hãy nhắc lại cả cụm với nhịp tự nhiên.']],
'2.61':[
['1 · Bắt nhịp câu','Der Übungssatz verbindet ähnlich klingende Wörter und trainiert einen gleichmäßigen Sprechrhythmus.','The practice sentence groups similar sounds to build a steady speaking rhythm.','Câu luyện tập gom các âm gần giống nhau để rèn nhịp nói đều.','wollen + Infinitiv drückt einen Wunsch aus: wollen wird konjugiert, das Vollverb steht am Satzende.','wollen + infinitive expresses a wish: wollen is conjugated and the main verb goes at the end.','wollen + động từ nguyên mẫu diễn tả mong muốn: wollen chia theo chủ ngữ, động từ chính ở cuối câu.'],
