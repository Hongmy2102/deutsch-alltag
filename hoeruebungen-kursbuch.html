['2.38',['Berufe und Arbeitszufriedenheit vergleichen','Comparing jobs and job satisfaction','So sánh nghề nghiệp và mức độ hài lòng'],['Eine Radiosendung sammelt Stimmen aus verschiedenen Berufen: Segellehrerin, Studentin, Architektin, Reiseführer und Erzieher. Jede Person nennt, was Spaß macht und was schwierig ist.','A radio show hears from a sailing instructor, student, architect, tour guide, and educator about rewards and drawbacks.','Chương trình radio hỏi nhiều nghề: giáo viên chèo thuyền, sinh viên, kiến trúc sư, hướng dẫn viên và giáo viên mầm non; mỗi người kể điều thích và khó khăn.'],['„Was gefällt Ihnen?“ nutzt gefallen: Die Sache ist das Subjekt, Ihnen steht im Dativ. „Mein Beruf macht mir Spaß“ nutzt mir ebenfalls im Dativ. als nennt den Beruf; können + Infinitiv zeigt Fähigkeit oder Möglichkeit.','gefallen makes the liked thing the subject and uses dative Ihnen. als names a profession; können + infinitive expresses ability.','gefallen đặt sự vật được thích làm chủ ngữ và dùng Ihnen ở Dativ. als nêu nghề; können + nguyên mẫu diễn tả khả năng.'],['Mein Beruf macht mir Spaß, aber im Winter kann ich nicht segeln.','I enjoy my job, but I can’t sail in winter.','Tôi thích công việc của mình, nhưng mùa đông tôi không thể chèo thuyền.'],[['der Beruf','[bəˈʁuːf]','profession; job','nghề nghiệp'],['die Segellehrerin','[ˈzeːɡl̩ˌleːʁəʁɪn]','sailing instructor','giáo viên chèo thuyền'],['der Reiseführer','[ˈʁaɪ̯zəˌfyːʁɐ]','tour guide','hướng dẫn viên'],['der Erzieher','[ɛɐ̯ˈtsiːɐ̯]','educator','giáo viên mầm non']]],
['2.39',['Über einen langen Studien- und Arbeitstag sprechen','Talking about a long day of study and work','Kể về ngày học và làm việc dài'],['Zwei Studierende vergleichen Prüfungen, Referate, Training und Schichten in einer Bäckerei. Beide berichten, was sie heute und gestern gemacht haben.','Two students compare exams, presentations, training, and bakery shifts, using today and yesterday as reference points.','Hai sinh viên so sánh kỳ thi, thuyết trình, tập luyện và ca làm ở tiệm bánh; họ kể việc hôm nay và hôm qua.'],['Das Perfekt bildet sich meist mit haben + Partizip II: gelernt, gearbeitet, gemacht. Die Zeitangabe gestern steht oft am Anfang; heute kann dasselbe Perfekt oder Präsens begleiten, je nach abgeschlossener Handlung.','The perfect uses haben + past participle for these verbs. gestern signals past events.','Perfekt thường dùng haben + Partizip II với các động từ này. gestern báo sự việc quá khứ.'],['Ich habe gestern im Studio trainiert. Heute habe ich eine Prüfung gemacht.','I trained at the gym yesterday. Today I took an exam.','Hôm qua tôi tập ở phòng gym. Hôm nay tôi đã làm bài thi.'],[['das Studium','[ˈʃtuːdi̯ʊm]','studies','việc học đại học'],['die Prüfung','[ˈpʁyːfʊŋ]','exam','kỳ thi'],['die Präsentation','[pʁɛzɛntaˈtsi̯oːn]','presentation','bài thuyết trình'],['arbeiten – gearbeitet','[ˈaʁbaɪ̯tn̩] – [ɡəˈʔaʁbaɪ̯tət]','work – worked','làm việc – đã làm']]],
['2.40',['Frühere Arbeit und die Entscheidung fürs Studium','Past work and choosing to study','Công việc trước đây và quyết định đi học'],['Ein Student erzählt von vier Jahren Arbeit bei einer Bank: gutes Geld, aber viel Stress und wenig Zeit für Freunde. Im Urlaub trifft er Maya und beschließt, etwas anderes zu machen.','A student recalls four years at a bank: good pay but stress and little time. A holiday meeting with Maya prompts a change.','Một sinh viên kể đã làm ngân hàng bốn năm: lương tốt nhưng căng thẳng, ít thời gian. Trong kỳ nghỉ gặp Maya và quyết định đổi hướng.'],['Im Perfekt heißt es „Ich habe gearbeitet/gesehen/getroffen“: haben + Partizip II. Bei trennbaren Verben wie kennenlernen steht ge zwischen Präfix und Stamm: kennengelernt. „Es hat Probleme gegeben“ nutzt geben im Partizip gegeben.','The perfect uses haben + participle. In separable verbs, ge goes between prefix and stem, e.g. kennengelernt.','Perfekt dùng haben + Partizip II. Với động từ tách, ge nằm giữa tiền tố và gốc, như kennengelernt.'],['Ich habe vier Jahre gearbeitet und im Urlaub meine Freundin getroffen.','I worked for four years and met my friend on holiday.','Tôi đã làm việc bốn năm và gặp bạn gái trong kỳ nghỉ.'],[['die Bank','[baŋk]','bank','ngân hàng'],['der Urlaub','[ˈuːɐ̯laʊ̯p]','holiday','kỳ nghỉ'],['treffen – getroffen','[ˈtʁɛfn̩] – [ɡəˈtʁɔfn̩]','meet – met','gặp – đã gặp'],['kennenlernen – kennengelernt','[ˈkɛnənˌlɛʁnən] – [kɛnənɡəˈlɛʁnt]','get to know – got to know','làm quen – đã làm quen']]],
['2.41',['Kurze Vokale und Konsonanten hören','Listening for short vowels and consonants','Nghe nguyên âm ngắn và phụ âm'],['Die Übung stellt kurze Wörter gegenüber. Achte darauf, welcher Vokal und welcher Endkonsonant zu hören ist, statt nur die Wortbedeutung zu erraten.','Short words are contrasted; listen for the vowel and final consonant.','Các từ ngắn được đối chiếu; hãy nghe nguyên âm và phụ âm cuối thay vì đoán nghĩa.'],['Dies ist Lauttraining. Ein kleiner Lautunterschied kann ein anderes Wort ergeben; wiederhole jedes Wort deutlich, aber im natürlichen Rhythmus.','This is sound practice: a small sound difference can change the word. Repeat naturally.','Đây là luyện âm: khác một âm nhỏ có thể thành từ khác. Hãy nhắc lại rõ nhưng tự nhiên.'],['Der Hund ist aus dem Haus.','The dog is out of the house.','Con chó đi ra khỏi nhà.'],[['heiß','[haɪ̯s]','hot','nóng'],['der Hund','[hʊnt]','dog','chó'],['aus','[aʊ̯s]','out of','ra khỏi'],['der Laut','[laʊ̯t]','sound','âm']]],
['2.42',['Ähnliche Wörter in kurzen Sätzen unterscheiden','Distinguishing similar words in short sentences','Phân biệt từ gần âm trong câu ngắn'],['Drei kurze Sätze enthalten ähnliche Laute und Namen: Hanna/Hans, Huber/Hilber. Höre genau, welche Person und welcher Ort gemeint sind.','Three short sentences contrast similar names and words. Listen for the exact person and place.','Ba câu ngắn có tên và từ gần âm như Hanna/Hans, Huber/Hilber; hãy nghe chính xác người và nơi được nhắc.'],['Beim Hörverstehen hilft es, den ganzen Satz zu nutzen: Hotel, Hamburg und zu Hause geben Hinweise. Nicht nur auf einen einzelnen Laut verlassen.','Use the whole sentence context; do not rely on just one sound.','Hãy dùng cả ngữ cảnh câu như Hotel, Hamburg, zu Hause; đừng chỉ dựa vào một âm.'],['Hans hat heute zu Hause gearbeitet.','Hans worked at home today.','Hôm nay Hans làm việc ở nhà.'],[['heute','[ˈhɔʏ̯tə]','today','hôm nay'],['zu Hause','[tsuː ˈhaʊ̯zə]','at home','ở nhà'],['das Hotel','[hoˈtɛl]','hotel','khách sạn'],['arbeiten','[ˈaʁbaɪ̯tn̩]','work','làm việc']]],
['2.43',['Am Telefon nach einer Stelle fragen','Calling to ask about a job opening','Gọi điện hỏi về vị trí tuyển dụng'],['Claudia ruft wegen einer Anzeige an, fragt nach der zuständigen Ansprechpartnerin und bittet darum, verbunden zu werden. Sie lässt sich Name und Durchwahl wiederholen.','Claudia calls about a job ad, asks for the contact person, and requests a transfer and extension number.','Claudia gọi về tin tuyển dụng, hỏi người phụ trách, nhờ nối máy rồi xin nhắc lại tên và số máy lẻ.'],['„Können Sie mich verbinden?“ und „Können Sie mir … geben?“ sind höfliche Bitten. mich ist Akkusativ für die Person, mir Dativ für den Empfänger. „Das habe ich nicht verstanden“ steht im Perfekt.','Können Sie makes polite requests. mich is accusative; mir is dative. habe verstanden is perfect tense.','Können Sie tạo lời nhờ lịch sự. mich là Akkusativ; mir là Dativ. habe verstanden là Perfekt.'],['Können Sie mich bitte mit Frau Selmicz verbinden?','Could you connect me to Ms Selmicz, please?','Anh/chị nối máy giúp tôi với bà Selmicz được không?'],[['die Anzeige','[ˈantsaɪ̯ɡə]','advertisement','tin tuyển dụng'],['die Durchwahl','[ˈdʊʁçˌvaːl]','extension number','số máy lẻ'],['verbinden','[fɛɐ̯ˈbɪndn̩]','connect','nối máy'],['wiederholen','[viːdɐˈhoːlən]','repeat','nhắc lại']]],
['2.44',['Telefonate beginnen und beenden','Starting and ending phone calls','Mở đầu và kết thúc cuộc gọi'],['Die Übung sammelt sehr kurze Telefonformen: Begrüßung, Nachname als Meldung und Verabschiedung. Höre, welche Wendung zum Anfang oder Ende passt.','The exercise collects short phone phrases: greeting, answering with a surname, and saying goodbye.','Bài tập gom cách nói điện thoại ngắn: chào hỏi, xưng họ khi nghe máy và tạm biệt.'],['„Müller“ allein ist eine übliche knappe Meldung am Telefon. „Auf Wiederhören“ wird beim Telefonieren verwendet; im persönlichen Gespräch sagt man meist Auf Wiedersehen.','A surname alone can answer the phone. Auf Wiederhören is for calls.','Chỉ nói họ là cách nghe máy ngắn gọn. Auf Wiederhören dùng qua điện thoại; gặp trực tiếp thường nói Auf Wiedersehen.'],['Firma Hölke, guten Tag. – Auf Wiederhören.','Hölke company, good day. – Goodbye.','Công ty Hölke xin nghe. – Tạm biệt.'],[['das Telefonat','[telefoˈnaːt]','phone call','cuộc điện thoại'],['der Nachname','[ˈnaːxˌnaːmə]','surname','họ'],['Auf Wiederhören','[aʊ̯f ˈviːdɐˌhøːʁən]','goodbye (on the phone)','tạm biệt (qua điện thoại)']]],
['2.45',['Saisonarbeit auf Festspielen, Märkten und Festen','Seasonal work at festivals and markets','Làm thời vụ ở lễ hội và chợ'],['Drei Personen erzählen von Nebenjobs: Statist bei Opernfestspielen, Verkäufer auf dem Weihnachtsmarkt und Kellnerin auf dem Oktoberfest. Sie beschreiben Aufgaben, Einkommen und Stimmung.','Three people describe seasonal jobs as an extra, market seller, and Oktoberfest waitress.','Ba người kể việc thời vụ: diễn viên quần chúng ở lễ hội opera, bán hàng chợ Giáng sinh và phục vụ Oktoberfest; họ nói về việc, thu nhập và không khí.'],['„Ich arbeite als …“ nennt die Tätigkeit. „Man verdient nicht viel“ verwendet man allgemein. müssen + Infinitiv sagt, was man nicht tun muss; aber verbindet Vor- und Nachteile.','als names a job. man generalises; müssen + infinitive gives obligation; aber contrasts pros and cons.','als nêu nghề. man nói chung; müssen + nguyên mẫu nói nghĩa vụ; aber nối ưu và nhược điểm.'],['Ich arbeite als Kellnerin. Die Arbeit macht Spaß, aber sie ist anstrengend.','I work as a waitress. The job is fun, but tiring.','Tôi làm phục vụ. Công việc vui nhưng mệt.'],[['der Statist','[ʃtaˈtɪst]','extra; background actor','diễn viên quần chúng'],['der Weihnachtsmarkt','[ˈvaɪ̯naxtsˌmaʁkt]','Christmas market','chợ Giáng sinh'],['die Kellnerin','[ˈkɛlnəʁɪn]','waitress','nhân viên phục vụ nữ'],['verdienen','[fɛɐ̯ˈdiːnən]','earn','kiếm tiền']]],
['2.46',['Ein Kleid auf einer Party loben','Complimenting a dress at a party','Khen chiếc váy ở buổi tiệc'],['Gäste begrüßen einander und bedanken sich für die Einladung. Lena macht Hanna ein Kompliment zu ihrem neuen Kleid.','Guests greet each other and thank the host; Lena compliments Hanna’s new dress.','Khách chào nhau và cảm ơn lời mời; Lena khen chiếc váy mới của Hanna.'],['„Das Kleid ist schön“ verwendet sein + Adjektiv. „Es ist ganz neu“ nutzt neu als Zustandsbeschreibung. ein Kompliment wird oft direkt mit dem Kleid als Thema formuliert.','sein + adjective describes the dress; neu describes its state.','sein + tính từ miêu tả chiếc váy; neu nói chiếc váy còn mới.'],['Das Kleid ist echt schön. – Danke, es ist ganz neu.','The dress is really beautiful. – Thanks, it’s brand new.','Chiếc váy đẹp thật đấy. – Cảm ơn, nó mới tinh.'],[['das Kleid','[klaɪ̯t]','dress','váy'],['die Einladung','[ˈaɪ̯nlaːdʊŋ]','invitation','lời mời'],['neu','[nɔɪ̯]','new','mới'],['schön','[ʃøːn]','beautiful','đẹp']]],
['2.47',['Ein altes T-Shirt und der Tanzplan','An old T-shirt and plans to dance','Chiếc áo phông cũ và kế hoạch khiêu vũ'],['Lena bemerkt, dass Felix’ T-Shirt alt aussieht. Hanna erklärt, dass sie ein neues gekauft hat, aber Felix tanzen möchte und das Anziehen warten muss.','Lena says Felix’s shirt looks old. Hanna has bought a new one, but Felix wants to dance first.','Lena nhận xét áo của Felix trông cũ; Hanna nói đã mua áo mới nhưng Felix muốn khiêu vũ trước.'],['„Das sieht alt aus“ nutzt aussehen als trennbares Verb. „muss warten“ verwendet müssen + Infinitiv. ein neues steht für ein neues T-Shirt; das Nomen wird nicht wiederholt.','aussehen splits; müssen + infinitive expresses necessity. ein neues substitutes for T-Shirt.','aussehen là động từ tách; müssen + nguyên mẫu nói việc cần làm. ein neues thay cho T-Shirt để tránh lặp danh từ.'],['Das T-Shirt muss warten. Wir wollen tanzen.','The T-shirt can wait. We want to dance.','Chiếc áo để sau cũng được. Chúng mình muốn khiêu vũ.'],[['das T-Shirt','[ˈtiːʃœːɐ̯t]','T-shirt','áo phông'],['einkaufen','[ˈaɪ̯nˌkaʊ̯fn̩]','shop','mua sắm'],['warten','[ˈvaʁtn̩]','wait','chờ'],['tanzen','[ˈtsantsn̩]','dance','khiêu vũ']]],
['2.48',['Im Internet nach Kleidung suchen','Searching online for clothes','Tìm quần áo trên mạng'],['Eine Person braucht etwas Neues zum Anziehen. Der Freund empfiehlt eine Website; dort findet sie passende Kleidung.','Someone needs new clothes, and a friend recommends a shopping website.','Một người cần quần áo mới; bạn giới thiệu trang web mua sắm và họ bắt đầu xem.'],['„etwas Neues“ nominalisiert das Adjektiv: Neues wird großgeschrieben und ersetzt ein Nomen. zum Anziehen bedeutet „zum Tragen“ und enthält einen substantivierten Infinitiv.','etwas Neues capitalises the adjective as a noun. zum Anziehen means “to wear” and nominalises the infinitive.','„etwas Neues“ biến tính từ thành danh từ nên viết hoa. zum Anziehen nghĩa là để mặc và danh từ hóa động từ.'],['Ich brauche etwas Neues zum Anziehen.','I need something new to wear.','Tôi cần thứ gì đó mới để mặc.'],[['die Kleidung','[ˈklaɪ̯dʊŋ]','clothing','quần áo'],['etwas Neues','[ˈɛtvas ˈnɔɪ̯əs]','something new','điều gì đó mới'],['anziehen','[ˈanˌtsiːən]','put on; wear','mặc vào'],['die Website','[ˈvɛbzaɪ̯t]','website','trang web']]],
['2.49',['Kleidung nach Farbe und Geschmack auswählen','Choosing clothes by colour and taste','Chọn quần áo theo màu và sở thích'],['Zwei Personen vergleichen T-Shirts, Hemden, Pullover und Hosen. Sie sind sich über Farben und Stil uneinig und suchen weiter.','Two people compare shirts, sweaters, and trousers, disagree about colours and style, and keep browsing.','Hai người so áo phông, sơ mi, áo len và quần; họ bất đồng về màu sắc và kiểu dáng rồi tìm tiếp.'],['welcher/welche/welches richtet sich nach dem Nomen: welches T-Shirt, welcher Pullover, welche Hose. „Wie wäre …?“ ist ein Vorschlag; „Das mag ich nicht“ drückt eine persönliche Vorliebe aus.','welcher forms agree with noun gender. Wie wäre …? makes a suggestion; mögen expresses preference.','welcher đổi theo giống danh từ. Wie wäre …? đưa ra gợi ý; mögen diễn tả sở thích.'],['Welches T-Shirt meinst du? – Das schwarze dort.','Which T-shirt do you mean? – The black one over there.','Bạn nói chiếc áo phông nào? – Chiếc màu đen đằng kia.'],[['der Pullover','[ˈpʊloˌvɐ]','sweater','áo len'],['das Hemd','[hɛmt]','shirt','áo sơ mi'],['die Hose','[ˈhoːzə]','trousers','quần dài'],['bunt','[bʊnt]','colourful','sặc sỡ']]],
['2.50',['Mantel, Jacke und Hut im Onlineshop vergleichen','Comparing a coat, jacket, and hat online','So sánh áo khoác và mũ trên cửa hàng mạng'],['Eine Person schlägt Mantel und Jacke vor, die andere lehnt ab und findet einen Hut toll. Schließlich kommen Hut und schwarzes T-Shirt in den Warenkorb.','One shopper rejects coats and jackets but likes a hat; the items go into the cart.','Một người chọn áo khoác, người kia không thích nhưng lại thấy mũ đẹp; cuối cùng họ thêm mũ và áo đen vào giỏ.'],['dieser/diese/dieses und welcher/welche/welches stimmen mit dem Nomen überein: dieser Hut, diese Jacke, dieser Mantel. „in den Warenkorb“ beschreibt Bewegung und steht im Akkusativ.','Demonstratives and question words agree with noun gender. in den Warenkorb is directional accusative.','dieser/diese/dieses và welcher/welche/welches đổi theo giống danh từ. in den Warenkorb chỉ hướng đưa vào nên Akkusativ.'],['Diesen Hut finde ich super. Ich lege ihn in den Warenkorb.','I think this hat is great. I’ll put it in the basket.','Tôi thấy chiếc mũ này rất đẹp. Tôi cho nó vào giỏ hàng.'],[['der Mantel','[ˈmantl̩]','coat','áo choàng'],['die Jacke','[ˈjakə]','jacket','áo khoác'],['der Hut','[huːt]','hat','mũ'],['der Warenkorb','[ˈvaːʁənˌkɔʁp]','shopping cart','giỏ hàng']]],
['2.51',['Trennbare Verben nach Anfangslauten ordnen','Sorting separable verbs by initial sounds','Phân loại động từ tách theo âm đầu'],['Die Übung stellt Wortpaare vor: bekommen/mitkommen, einkaufen/verkaufen und aufstehen/verstehen. Höre, wie Vorsilben den Wortanfang und die Bedeutung verändern.','Word pairs contrast separable and non-separable verbs, highlighting prefixes and sound changes.','Bài tập đối chiếu cặp động từ như bekommen/mitkommen, einkaufen/verkaufen, aufstehen/verstehen để nghe tiền tố và nghĩa đổi ra sao.'],['Nicht jedes Verb mit einer Vorsilbe ist trennbar. einkaufen und aufstehen sind trennbar; bekommen und verstehen bleiben zusammen. Lerne die Verben als einzelne Wörter mit ihrer Trennbarkeit.','Not every prefixed verb is separable. einkaufen and aufstehen split; bekommen and verstehen do not.','Không phải động từ nào có tiền tố cũng tách. einkaufen, aufstehen tách; bekommen, verstehen không tách.'],['Ich kaufe heute ein. Ich verstehe die Aufgabe.','I’m shopping today. I understand the task.','Hôm nay tôi đi mua sắm. Tôi hiểu bài tập.'],[['einkaufen','[ˈaɪ̯nˌkaʊ̯fn̩]','shop','mua sắm'],['verkaufen','[fɛɐ̯ˈkaʊ̯fn̩]','sell','bán'],['aufstehen','[ˈaʊ̯fˌʃteːən]','get up','thức dậy'],['verstehen','[fɛɐ̯ˈʃteːən]','understand','hiểu']]],
['2.52',['Einkaufen im Perfekt erzählen','Talking about shopping in the perfect tense','Kể việc mua sắm bằng thì Perfekt'],['Die Übung setzt kaufen, verkaufen und einkaufen in kurze Sätze über bereits erledigte Einkäufe.','The exercise puts buying and shopping into short completed-action sentences.','Bài tập đặt kaufen, verkaufen, einkaufen vào câu về việc đã làm xong.'],['Bei regelmäßigen Verben bildet man das Partizip II oft mit ge- + Stamm + -t: kaufen → gekauft. Bei trennbarem einkaufen steht ge zwischen ein und kauf: eingekauft.','Regular participles often use ge- + stem + -t. In separable einkaufen, ge goes after ein.','Động từ có quy tắc thường tạo Partizip II bằng ge- + gốc + -t. Với einkaufen, ge nằm sau tiền tố ein.'],['Ich habe ein T-Shirt gekauft und heute schon eingekauft.','I bought a T-shirt and have already done the shopping today.','Tôi đã mua một áo phông và hôm nay đã đi mua sắm rồi.'],[['kaufen – gekauft','[ˈkaʊ̯fn̩] – [ɡəˈkaʊ̯ft]','buy – bought','mua – đã mua'],['einkaufen – eingekauft','[ˈaɪ̯nˌkaʊ̯fn̩] – [ˈaɪ̯nɡəˌkaʊ̯ft]','shop – shopped','đi mua sắm – đã mua sắm']]],
['2.53',['Im Geschäft einen passenden Pullover finden','Finding a suitable sweater in a shop','Tìm áo len phù hợp trong cửa hàng'],['Eine Kundin sucht einen Pullover, probiert verschiedene Größen und Farben und fragt nach dem Preis. Der Verkäufer holt eine kleinere Größe.','A customer looks for a sweater, compares sizes and colours, asks the price, and tries a smaller size.','Khách tìm áo len, thử màu và cỡ, hỏi giá; người bán lấy cỡ nhỏ hơn.'],['„Grün steht mir nicht“ nutzt stehen im Sinn von „gut aussehen an jemandem“; mir ist Dativ. gefallen cũng dùng người thích ở Dativ. „Probieren Sie ihn an“ là mệnh lệnh lịch sự với động từ tách anprobieren.','stehen means suit and takes dative mir. anprobieren is separable in the polite imperative.','stehen nghĩa là hợp với ai và dùng mir ở Dativ. anprobieren là động từ tách; mệnh lệnh lịch sự „Probieren Sie ihn an“.'],['Der Pullover steht mir gut, aber er ist zu weit.','The sweater suits me, but it is too loose.','Áo len hợp với tôi nhưng hơi rộng.'],[['der Pullover','[ˈpʊloˌvɐ]','sweater','áo len'],['die Größe','[ˈɡʁøːsə]','size','kích cỡ'],['anprobieren','[ˈanˌpʁoˌbiːʁən]','try on','mặc thử'],['weit','[vaɪ̯t]','loose; wide','rộng']]],
['2.54',['Über Kleidung und Passform sprechen','Talking about clothes and fit','Nói về quần áo và độ vừa'],['Drei kurze Szenen prüfen, ob Jacke, Hose und Kleid gefallen und passen. Preis und Größe entscheiden mit.','Three scenes discuss whether a jacket, trousers, and dress look good and fit.','Ba đoạn ngắn nói áo khoác, quần và váy có đẹp và vừa không; giá và cỡ cũng quan trọng.'],['gefallen nutzt die Person im Dativ: Die Jacke gefällt mir; passen ebenfalls: Sie passt dir nicht. zu groß/zu teuer nennt einen übermäßigen Grad.','gefallen and passen take the person in dative. zu groß/zu teuer mean too large/expensive.','gefallen và passen dùng người ở Dativ. zu groß/zu teuer nghĩa là quá rộng/quá đắt.'],['Die Hose gefällt meinem Sohn, aber sie passt ihm nicht.','My son likes the trousers, but they do not fit him.','Con trai tôi thích chiếc quần nhưng mặc không vừa.'],[['die Hose','[ˈhoːzə]','trousers','quần dài'],['das Kleid','[klaɪ̯t]','dress','váy'],['passen','[ˈpasn̩]','fit','vừa'],['gefallen','[ɡəˈfalən]','please; be liked','làm ai thích']]],
['2.55',['Einkäufe in einem Kaufhaus planen','Planning purchases in a department store','Lên kế hoạch mua đồ trong trung tâm thương mại'],['Zwei Personen prüfen ihre Einkaufsliste: Parfüm, Duschgel, Schal, USB-Stick und Geschenk. Sie planen Stockwerke und einen Kaffeestopp.','Two shoppers list perfume, shower gel, scarf, USB stick, and gift, planning floors and a coffee stop.','Hai người rà danh sách mua nước hoa, sữa tắm, khăn, USB và quà; họ tính tầng mua hàng và nghỉ uống cà phê.'],['„Der Schal passt nicht zum Anzug“: zu dem wird zum; zu verlangt Dativ. brauchen + Akkusativ nennt, was noch fehlt. „im zweiten Stock“ ist Dativ und beschreibt den Ort.','zu contracts to zum and takes dative. brauchen takes accusative; im zweiten Stock gives location.','zu dem rút gọn thành zum và đi với Dativ. brauchen nhận Akkusativ; im zweiten Stock chỉ vị trí.'],['Der Schal passt zum Anzug. Danach gehen wir in den fünften Stock.','The scarf goes with the suit. Afterwards we go to the fifth floor.','Khăn hợp với bộ vest. Sau đó chúng ta lên tầng năm.'],[['das Kaufhaus','[ˈkaʊ̯fˌhaʊ̯s]','department store','trung tâm thương mại'],['der Anzug','[ˈantsuːk]','suit','bộ vest'],['das Duschgel','[ˈduːʃˌɡeːl]','shower gel','sữa tắm'],['der USB-Stick','[ˈuːɛsbeːˌʃtɪk]','USB stick','USB']]],
['2.56',['In einem Kaufhaus nach Abteilungen fragen','Asking for departments in a store','Hỏi vị trí quầy hàng trong cửa hàng'],['Kurze Fragen suchen ein Café, Papier und Sportschuhe. Die Antworten nennen den fünften Stock oder das Erdgeschoss.','Short questions ask for a café, paper, and sports shoes; replies give the floor.','Các câu hỏi ngắn tìm quán cà phê, giấy và giày thể thao; câu trả lời nêu tầng.'],['„Wo finde ich …?“ fragt nach einem Standort. „Das gibt es im Erdgeschoss“ nutzt es als formales Subjekt; in + Dativ nennt die Abteilung/Etage.','Wo finde ich asks for location. es is a formal subject; im + dative gives the floor.','„Wo finde ich …?“ hỏi vị trí. es là chủ ngữ hình thức; im + Dativ chỉ tầng.'],['Wo finde ich Sportschuhe? – Im fünften Stock.','Where can I find sports shoes? – On the fifth floor.','Tôi tìm giày thể thao ở đâu? – Ở tầng năm.'],[['das Erdgeschoss','[ˈeːɐ̯tɡəʃɔs]','ground floor','tầng trệt'],['der Stock','[ʃtɔk]','floor','tầng'],['die Schreibwaren','[ˈʃʁaɪ̯pˌvaːʁən]','stationery','đồ dùng văn phòng phẩm'],['der Sportschuh','[ˈʃpɔʁtˌʃuː]','sports shoe','giày thể thao']]]
].forEach(function(r){addTrack(r[0],r[1],r[2],r[3],r[4],r[5])});

var rows=[
['○','Ach ja, das ist auch nett.','Oh yes, that is nice too.','Ừ, cái đó cũng đẹp đấy.'],
['○','Das muss ich auch mal wieder anziehen. Ja, das nehme ich mit.','I should wear that again sometime. Yes, I’ll take it with me.','Món đó mình cũng nên mặc lại. Ừ, mình sẽ mang theo.'],
['○','Und der Pulli, hm, wenn es mal nicht so warm ist …','And the sweater, hmm, in case it isn’t so warm …','Còn áo len này, ừm, phòng khi trời không ấm lắm …'],
['○','So, jetzt bin ich fertig – nur noch alles in den Koffer. Mist, passt nicht alles rein. Also noch mal … Schatz? Bist du schon fertig mit Packen?','There, I’m done now—just need to put everything in the suitcase. Oh no, it doesn’t all fit. Let’s try again … Honey, are you finished packing yet?','Rồi, mình xong rồi—chỉ còn cho mọi thứ vào va-li. Chết thật, không nhét vừa hết. Để thử lại … Mình ơi, bạn đóng gói xong chưa?'],
['●','Nein, noch nicht ganz. Ich brauche aber nicht mehr lang. Sag mal, nimmst du Badesachen mit? Vielleicht gehen wir ja mal schwimmen.','No, not quite yet. I won’t need much longer. Tell me, are you taking swimwear? Maybe we’ll go swimming sometime.','Chưa xong hẳn. Nhưng mình sắp xong rồi. Này, bạn có mang đồ bơi không? Có khi mình đi bơi đấy.'],
['○','Ach komm, wir gehen hier auch nie schwimmen – das kannst du doch hierlassen. Wir wollen doch die Stadt ansehen. Ach Mensch … Der Koffer geht nicht zu. Na, dann muss ich halt ein paar Sachen hierlassen. Sag mal, brauchen wir eine Winterjacke?','Come on, we never go swimming here anyway—you can leave that behind. We want to see the city. Oh dear … The suitcase won’t close. Then I’ll just have to leave a few things behind. Tell me, do we need a winter coat?','Thôi nào, ở đây mình cũng chẳng bao giờ đi bơi—bạn cứ để đồ đó lại. Mình muốn đi tham quan thành phố mà. Ôi trời … Va-li không đóng được. Vậy thì mình đành để lại vài món. Này, mình có cần áo khoác mùa đông không?'],
['●','Nein, so kalt ist es noch nicht. Und wenn es kalt ist, gehen wir ja auch mal in ein Café.','No, it isn’t that cold yet. And if it gets cold, we can always go to a café.','Không, trời chưa lạnh đến thế. Nếu lạnh thì mình có thể ghé quán cà phê.'],
['○','Ja super, gute Idee. Dann lasse ich die Winterjacke hier. Aber die Regenjacke nehme ich mit.','Great, good idea. Then I’ll leave the winter coat here. But I’ll take the rain jacket.','Ừ, hay đấy. Vậy mình để áo khoác mùa đông lại. Nhưng mình sẽ mang áo mưa theo.'],
['●','Klar. Ich habe auch einen Regenschirm. Hast du den Reiseführer dabei?','Sure. I have an umbrella too. Do you have the travel guide with you?','Được thôi. Mình cũng có ô. Bạn mang theo sách hướng dẫn du lịch chưa?'],
['○','Ja, natürlich. Also, ich habe jetzt einfach zwei Hosen, einen Rock, drei T-Shirts, zwei Blusen und einen Pulli eingepackt. Meinst du, das reicht?','Yes, of course. So, I’ve packed two pairs of trousers, a skirt, three T-shirts, two blouses, and a sweater. Do you think that’s enough?','Có chứ. Mình đã xếp hai chiếc quần, một chiếc váy, ba áo phông, hai áo kiểu và một áo len. Bạn nghĩ vậy đủ chưa?'],
