'1.1':[['1','Zwei Bekannte begrüßen sich locker und fragen kurz nach dem Befinden.','Two acquaintances greet each other casually and ask how the other is.','Hai người quen chào nhau thân mật và hỏi thăm sức khỏe.','„Wie geht es dir?“ wird oft zu „Wie geht’s dir?“ verkürzt; dir ist Dativ.','“Wie geht es dir?” is often shortened to “Wie geht’s dir?”; dir is dative.','„Wie geht es dir?“ thường rút gọn thành „Wie geht’s dir?“; dir ở Dativ.'],['2','Die zweite Person antwortet knapp und fragt höflich zurück.','The other person answers briefly and returns the question.','Người kia trả lời ngắn rồi hỏi lại.','„Und dir?“ lässt die Wiederholung von geht es weg; der Sinn bleibt klar.','“Und dir?” omits the repeated geht es; the meaning stays clear.','„Und dir?“ lược phần geht es đã biết; ý vẫn rõ.']],
'1.2':[['1','Eine neue Person wird begrüßt und nach ihrem Vornamen gefragt.','A new person is greeted and asked for a first name.','Một người mới được chào và hỏi tên.','„Wer bist du?“ fragt nach der Person; „Wie heißt du?“ fragt gezielt nach dem Namen.','“Wer bist du?” asks who the person is; “Wie heißt du?” asks for the name.','„Wer bist du?“ hỏi người đó là ai; „Wie heißt du?“ hỏi cụ thể tên.'],['2','Der Name wird genannt und zur Sicherheit noch einmal erfragt.','The name is given and then checked once more.','Tên được nói ra rồi hỏi lại để chắc chắn.','heißen wird nach dem Subjekt konjugiert: ich heiße, du heißt.','heißen changes with the subject: ich heiße, du heißt.','heißen chia theo chủ ngữ: ich heiße, du heißt.']],
'1.3':[['1','Die kurzen Begegnungen enden mit unterschiedlichen lockeren Abschiedsformen.','The brief encounters end with different casual farewells.','Các cuộc gặp ngắn kết thúc bằng vài cách chào tạm biệt thân mật.','„Bis bald“ kündigt ein baldiges Wiedersehen an; es ist eine feste Wendung.','“Bis bald” suggests seeing each other again soon; it is a fixed expression.','„Bis bald“ hàm ý sớm gặp lại; đây là cụm cố định.']],
'1.4':[['1','Eine formelle Begrüßung am Morgen wird mit Vor- und Nachnamen beantwortet.','A formal morning greeting is answered with first and last names.','Lời chào buổi sáng trang trọng được đáp lại bằng tên và họ.','„Mein Name ist …“ ist eine höfliche Vorstellung; Frau steht als Anrede vor dem Familiennamen.','“Mein Name ist …” is a polite introduction; Frau comes before the surname as a title.','„Mein Name ist …“ là cách giới thiệu lịch sự; Frau đứng trước họ để xưng hô.']],
'1.5':[['1','Mehrere Erwachsene begrüßen sich und stellen eine weitere Person vor.','Several adults greet one another and introduce another person.','Một nhóm người lớn chào nhau và giới thiệu thêm người khác.','„Das ist Frau …“ stellt eine Person vor; das Verb ist bleibt in Position zwei.','“Das ist Frau …” introduces someone; ist stays in second position.','„Das ist Frau …“ dùng để giới thiệu; ist ở vị trí thứ hai.'],['2','Die Gesprächspartner fragen formell nach dem Namen und nennen ihn erneut.','The speakers ask for a name formally and repeat it.','Mọi người hỏi tên theo cách lịch sự rồi nhắc lại tên.','In der W-Frage „Wie heißen Sie?“ folgt auf wie direkt das konjugierte heißen.','In the W-question “Wie heißen Sie?”, the conjugated heißen follows wie.','Trong câu hỏi W „Wie heißen Sie?“, động từ heißen đã chia đứng ngay sau wie.']],
'1.6':[['1','Die Personen beenden das formelle Gespräch und verabschieden sich.','The speakers close the formal conversation and say goodbye.','Mọi người kết thúc cuộc trò chuyện trang trọng và chào tạm biệt.','„Auf Wiedersehen“ ist formell; „Tschüs“ ist lockerer. Die Wahl hängt von Situation und Beziehung ab.','“Auf Wiedersehen” is formal; “Tschüs” is casual. Choose by context and relationship.','„Auf Wiedersehen“ trang trọng; „Tschüs“ thân mật. Chọn theo hoàn cảnh và quan hệ.']],
'1.7':[['1','Eine Frau spricht über ihre Herkunft und die Sprachen, die sie kann.','A woman talks about where she is from and which languages she speaks.','Một người phụ nữ nói về quê quán và những ngôn ngữ mình biết.','Woher fragt nach Herkunft; aus + Dativ nennt das Herkunftsland.','Woher asks about origin; aus + dative names the country of origin.','Woher hỏi xuất thân; aus + Dativ nêu quốc gia quê quán.'],['2','Zum Schluss nennt sie ihren Wohnort.','She then says where she lives.','Sau đó cô ấy nói nơi mình sống.','Wo fragt nach dem Ort; wohnen wird mit ich zu wohne konjugiert.','Wo asks for a place; wohnen becomes wohne with ich.','Wo hỏi địa điểm; wohnen chia với ich thành wohne.']],
'1.8':[['1','Die Zahlen werden von null bis zwanzig der Reihe nach gesprochen.','The numbers from zero to twenty are spoken in order.','Các số từ không đến hai mươi được đọc lần lượt.','Hier steht keine Satzgrammatik im Mittelpunkt: Höre auf Silben und Endungen, besonders bei dreizehn bis neunzehn.','There is no sentence grammar focus: listen for syllables and endings, especially in thirteen to nineteen.','Phần này không tập trung ngữ pháp câu: chú ý âm tiết và đuôi số, nhất là từ mười ba đến mười chín.']],
'1.9':[['1','Ein Anrufer möchte eine Person sprechen, die gerade nicht erreichbar ist.','A caller wants to speak to someone who is unavailable.','Người gọi muốn gặp một người hiện không có mặt.','„Ich möchte … sprechen“ klingt höflicher als „Ich will … sprechen“; sprechen bleibt nach möchte im Infinitiv.','“Ich möchte … sprechen” is more polite than “Ich will … sprechen”; sprechen stays infinitive after möchte.','„Ich möchte … sprechen“ lịch sự hơn „Ich will … sprechen“; sprechen giữ nguyên mẫu sau möchte.'],['2','Der Anrufer hinterlässt seine Nummer und bittet um Rückruf.','The caller leaves a number and asks to be called back.','Người gọi để lại số và nhờ gọi lại.','zurückrufen ist trennbar: „Kann sie zurückrufen?“ Nach kann steht zurückrufen als Infinitiv am Ende.','zurückrufen is separable; after kann, the infinitive stays at the end.','zurückrufen là động từ tách; sau kann, động từ nguyên mẫu đứng cuối câu.']],
'1.10':[['1','Eine Person nennt eine Telefonnummer in gut hörbaren Zahlengruppen.','A speaker gives a phone number in clear groups.','Một người đọc số điện thoại thành các nhóm rõ ràng.','Telefonnummern werden oft Ziffer für Ziffer gesprochen; Pausen helfen beim Mitschreiben.','Phone numbers are often read digit by digit; pauses help when writing them down.','Số điện thoại thường đọc từng chữ số; ngắt nhịp giúp ghi lại chính xác.'],['2','Die andere Person wiederholt die Nummer und bestätigt, dass sie stimmt.','The other person repeats the number and confirms it is correct.','Người kia đọc lại số và xác nhận đúng.','„Das ist richtig“ bestätigt eine Angabe; richtig steht als Prädikativ nach sein ohne Endung.','“Das ist richtig” confirms information; richtig is an uninflected predicate adjective after sein.','„Das ist richtig“ xác nhận thông tin; richtig là tính từ vị ngữ sau sein nên không thêm đuôi.']],
'1.11':[['1','Das deutsche Alphabet wird vollständig vorgesprochen.','The German alphabet is spoken from beginning to end.','Bảng chữ cái tiếng Đức được đọc từ đầu đến cuối.','Das ist Aussprachetraining: Achte auf die eigenen Namen von ä, ö, ü und ß.','This is pronunciation practice: notice the names of ä, ö, ü, and ß.','Đây là luyện phát âm: chú ý tên đọc riêng của ä, ö, ü và ß.']],
'1.12':[['1','Eine Person sagt ihre E-Mail-Adresse und buchstabiert den Namensteil.','A speaker gives an email address and spells the name section.','Một người đọc email rồi đánh vần phần tên.','„Kannst du sie buchstabieren?“: sie ersetzt die feminine E-Mail-Adresse; nach kann steht buchstabieren im Infinitiv.','“Can you spell it?” sie refers to feminine E-Mail-Adresse; buchstabieren follows kann as an infinitive.','„Kannst du sie buchstabieren?“: sie thay cho danh từ giống cái E-Mail-Adresse; buchstabieren ở nguyên mẫu sau kann.'],['2','Die zweite Person nennt ebenfalls eine Adresse und wiederholt sie buchstabiert.','The other person gives an address and spells it out too.','Người kia cũng đọc địa chỉ và đánh vần lại.','minus, Unterstrich, @ und Punkt werden als Wörter gesprochen, damit die Adresse eindeutig ist.','minus, Unterstrich, @, and Punkt are spoken as words to make the address clear.','minus, Unterstrich, @ và Punkt được đọc thành lời để email không bị nhầm.']],
'1.13':[['1','Die Sprecherin bittet darum, etwas noch einmal zu sagen.','The speaker asks for something to be repeated.','Người nói nhờ người kia nhắc lại.','„Entschuldigung, noch einmal bitte“ ist eine höfliche Kurzbitte; das Verb kann im Gespräch entfallen.','“Sorry, once again please” is a polite shortened request; the verb can be omitted in conversation.','„Entschuldigung, noch einmal bitte“ là lời nhờ lịch sự rút gọn; trong hội thoại có thể lược động từ.'],['2','Sie sagt, wenn sie etwas nicht versteht, und bittet um langsameres Sprechen.','She says when she does not understand and asks the other person to speak more slowly.','Cô ấy nói khi chưa hiểu và nhờ người kia nói chậm hơn.','In „Das verstehe ich nicht“ steht verstehe an Position zwei; nicht verneint das Verb bzw. die ganze Aussage.','In “Das verstehe ich nicht”, verstehe is in position two; nicht negates the verb or statement.','Trong „Das verstehe ich nicht“, verstehe đứng vị trí hai; nicht phủ định động từ hoặc cả ý câu.']]
});
Object.assign(TRACK_STEPS,{
'1.14':[['1','Im Interview nennt eine Person Schwimmen und Joggen als Hobbys.','In an interview, one person names swimming and jogging as hobbies.','Trong phỏng vấn, một người kể bơi và chạy bộ là sở thích.','„Ich schwimme gern“: gern zeigt die Vorliebe; „oft“ ergänzt, wie häufig sie joggt.','gern shows preference; oft adds how frequently she jogs.','gern cho biết sở thích; oft bổ sung tần suất chạy bộ.']],
'1.15':[['1','Die Freunde vergleichen Lesen und Reisen mit einem Kinobesuch.','The friends compare reading and travelling with going to the cinema.','Hai người bạn so sánh việc đọc, du lịch và đi xem phim.','„Nicht so gern“ macht die Ablehnung milder; auch verbindet zwei Aussagen.','“Nicht so gern” softens the negative preference; auch adds another activity.','„Nicht so gern“ làm câu từ chối nhẹ hơn; auch nối thêm một hoạt động.']],
'1.16':[['1','Eine Person nennt Fotografieren und Tanzen am Wochenende.','One person mentions photography and dancing at weekends.','Một người kể việc chụp ảnh và nhảy vào cuối tuần.','Am Wochenende nennt einen Zeitraum; das Verb passt sich an ich an: fotografiere, tanze.','Am Wochenende names a time; the verbs agree with ich: fotografiere, tanze.','Am Wochenende chỉ thời gian; động từ chia theo ich: fotografiere, tanze.']],
'1.17':[['1','Die beiden schlagen einen Kinobesuch vor und probieren verschiedene Tage aus.','They suggest going to the cinema and try different days.','Hai người rủ nhau đi xem phim và thử các ngày khác nhau.','„Gehen wir …?“ ist ein Vorschlag als Ja/Nein-Frage; am Samstag benennt den Tag.','“Gehen wir …?” is a suggestion phrased as a yes/no question; am Samstag names the day.','„Gehen wir …?“ là lời rủ dưới dạng câu hỏi Có/Không; am Samstag chỉ ngày.'],['2','Sie lehnen einen Termin ab und einigen sich auf einen anderen.','They decline one date and agree on another.','Họ từ chối một ngày rồi thống nhất ngày khác.','„Das geht leider nicht“ ist eine feste höfliche Absage; leider mildert den Ton.','“Das geht leider nicht” is a polite fixed refusal; leider softens it.','„Das geht leider nicht“ là cách từ chối lịch sự; leider làm giọng nhẹ hơn.']],
'1.18':[['1','Kurze Fragen und Antworten üben Verabredungen und passende Reaktionen.','Short questions and replies practise plans and suitable responses.','Câu hỏi đáp ngắn luyện hẹn gặp và phản hồi phù hợp.','Höre die Satzmelodie: Entscheidungsfragen steigen oft, Antworten und W-Fragen fallen häufig.','Listen to the melody: yes/no questions often rise; answers and W-questions often fall.','Chú ý ngữ điệu: câu hỏi Có/Không thường lên giọng, câu đáp và câu hỏi W thường xuống giọng.']],
'1.19':[['1','Mehrere Stimmen sprechen eine höfliche Absage in lockeren und regionalen Varianten.','Different speakers say a polite refusal in casual and regional forms.','Nhiều giọng đọc câu từ chối lịch sự theo cách thân mật và vùng miền.','Die Umgangssprache verändert die Aussprache von nein, aber nicht die Aussage „es ist nicht möglich“.','Colloquial speech changes how nein sounds, not the meaning that something is not possible.','Khẩu ngữ làm cách phát âm nein thay đổi, nhưng ý “việc đó không thể” vẫn giữ nguyên.']],
'1.20':[['1','Die Zahlwörter reichen von zwei Stellen bis zu vielen Tausend.','The number words range from two digits to many thousands.','Các từ số trải từ hai chữ số đến hàng nghìn.','Bei 21 bis 99 steht die Einerzahl meist vor der Zehnerzahl und wird mit und verbunden.','From 21 to 99, the units usually come before the tens and connect with und.','Từ 21 đến 99, hàng đơn vị thường đọc trước hàng chục và nối bằng und.']]

Object.assign(TRACK_STEPS,{
'1.21':[['1','Der Beitrag beschreibt den Hamburger Hafen mit großen Zahlen und Flächenmaßen.','The segment describes Hamburg’s port using large numbers and area measurements.','Đoạn nghe mô tả cảng Hamburg bằng số lớn và đơn vị diện tích.','Höre, ob eine Zahl die Schiffe pro Jahr, die Länder oder die Größe bezeichnet. pro Jahr bedeutet „jedes Jahr“.','Listen for whether a number refers to ships per year, countries, or area. pro Jahr means “each year”.','Phân biệt số nào chỉ tàu mỗi năm, quốc gia hay diện tích. pro Jahr nghĩa là “mỗi năm”.']],
'1.22':[['1','Eine Durchsage warnt vor dem abfahrenden Zug.','An announcement warns passengers about the departing train.','Thông báo nhắc hành khách tránh xa tàu sắp chạy.','Der Satz „Der Zug fährt ab“ trennt abfahren: Der Verbstamm steht an Position zwei, ab am Ende.','“Der Zug fährt ab” splits the verb abfahren: the conjugated part is second and ab goes last.','„Der Zug fährt ab“ tách abfahren: phần động từ đã chia ở vị trí hai, ab xuống cuối.'],['2','Danach hörst du Reisezeiten und Zugverbindungen zwischen Städten.','Then you hear journey times and train connections between cities.','Sau đó là thời gian đi và các tuyến tàu giữa những thành phố.','nach + Stadtname nennt ein Ziel; in acht Stunden beschreibt die Dauer bis dorthin.','nach + city names the destination; in acht Stunden gives the travel time.','nach + tên thành phố chỉ điểm đến; in acht Stunden nói thời gian di chuyển.']],
'1.23':[['1','Ein Rundgang nennt Alter, Breite und Höhe des Rathauses sowie die Zahl der Räume.','A tour gives the town hall’s age, width, height, and number of rooms.','Đoạn giới thiệu nêu tuổi, chiều rộng, chiều cao và số phòng của tòa thị chính.','Achte darauf, welche Maße zu welcher Eigenschaft gehören. Es gibt + Akkusativ nennt, was vorhanden ist.','Match each measurement to the feature. Es gibt + accusative says what exists.','Ghép từng số đo với đặc điểm. Es gibt + Akkusativ nêu thứ hiện có.']],
'1.24':[['1','Die Kirche wird mit Spitznamen, Turm und Aussicht vorgestellt.','The church is introduced through its nickname, tower, and view.','Nhà thờ được giới thiệu qua biệt danh, tòa tháp và tầm nhìn.','„Man sagt …“ führt eine örtliche Bezeichnung ein; „Hier ist Platz für …“ nennt die Kapazität.','Man sagt introduces a local name; Hier ist Platz für gives capacity.','„Man sagt …“ giới thiệu cách gọi địa phương; „Hier ist Platz für …“ nêu sức chứa.']],
'1.25':[['1','Ein Gespräch stellt die Elbphilharmonie und ihre Besucher- und Konzertzahlen vor.','A conversation introduces the Elbphilharmonie and its visitor and concert figures.','Cuộc trò chuyện giới thiệu Elbphilharmonie cùng số khách và buổi hòa nhạc.','Das Präsens kann einen nahen Programmpunkt nennen: Das Konzert beginnt in fünf Minuten.','The present tense can describe a scheduled near-future event.','Hiện tại có thể nói về sự kiện sắp diễn ra: buổi hòa nhạc bắt đầu sau năm phút.']],
'1.26':[['1','Fahrgast und Fahrer klären Ziel und Preis für die Taxifahrt.','Passenger and driver confirm the destination and fare.','Khách và tài xế xác nhận điểm đến và tiền taxi.','Zum Hotel ist die Kurzform von zu dem Hotel; zu verlangt den Dativ.','zum Hotel contracts zu dem Hotel; zu takes the dative.','Zum Hotel rút gọn từ zu dem Hotel; zu đi với Dativ.']],
'1.27':[['1','Drei Menschen verwenden regionale Grußformen.','Three speakers use regional greetings.','Ba người dùng lời chào theo vùng miền.','Die Ausdrücke haben eine ähnliche Grußfunktion; lerne jeweils Region und Aussprache mit.','The expressions serve a similar greeting function; learn their region and pronunciation.','Các cụm có chức năng chào tương tự; hãy nhớ cả vùng miền và cách đọc.']],
'1.28':[['1','Wörter mit verschiedenen Vokallängen werden gegenübergestellt.','Words with different vowel lengths are contrasted.','Các từ có độ dài nguyên âm khác nhau được đặt cạnh nhau.','Kein neuer Grammatikpunkt: Höre langes und kurzes a, e, i, o und u im Wort.','No new grammar point: listen for long and short a, e, i, o, and u in words.','Không có điểm ngữ pháp mới: nghe nguyên âm a, e, i, o, u dài và ngắn trong từ.']],
'1.29':[['1','Die Vokalgruppen werden wiederholt, damit der Klangunterschied sicherer wird.','The vowel groups are repeated to reinforce the sound contrasts.','Các nhóm nguyên âm được nghe lại để ghi nhớ sự khác biệt.','Sprich die Wörter als ganze Einheiten nach und halte lange Vokale hörbar länger.','Repeat whole words and make long vowels audibly longer.','Nhắc lại cả từ và kéo dài rõ nguyên âm dài.']],
'1.30':[['1','Eine Person fragt nach dem Theater und erhält eine Route mit zwei Linksabbiegungen.','A person asks for the theatre and receives directions involving two left turns.','Một người hỏi nhà hát và được chỉ đường với hai lần rẽ trái.','Gehen Sie links/geradeaus ist der höfliche Imperativ mit Sie. „Bis zur Straße“ nennt den Wegabschnitt.','Gehen Sie links/geradeaus is a polite imperative with Sie. Bis zur Straße marks the route segment.','Gehen Sie links/geradeaus là mệnh lệnh lịch sự với Sie. Bis zur Straße chỉ đoạn đường cần đi.']],
'1.31':[['1','Die Wegbeschreibung führt von der fragenden Person zur U-Bahn.','The directions lead from the speaker to the underground.','Lời chỉ đường dẫn người hỏi đến ga tàu điện ngầm.','rechts, links und dann ordnen die Schritte; da zeigt auf das Ziel, das man dort erreicht.','rechts, links, dann sequence the steps; da points to the place reached.','rechts, links, dann sắp thứ tự; da chỉ nơi đến ở phía trước.']],
'1.32':[['1','Ein Reisender bekommt den Weg zum Hotel und fragt nach der Entfernung.','A traveller gets directions to the hotel and asks how far it is.','Du khách được chỉ đường đến khách sạn rồi hỏi có xa không.','„Ist das weit?“ beginnt mit dem Verb, weil es eine Ja/Nein-Frage ist. Die Antwort nennt eine kurze Gehzeit.','“Ist das weit?” starts with the verb because it is a yes/no question. The reply gives a short walking time.','„Ist das weit?“ đưa động từ lên đầu vì là câu hỏi Có/Không. Câu đáp nêu thời gian đi bộ ngắn.']],
'1.33':[['1','Eine Wortreihe sammelt Nomen aus Theater, Musik, Film und Publikum.','A word list collects nouns for theatre, music, film, and audiences.','Danh sách từ gom danh từ về sân khấu, nhạc, phim và khán giả.','Höre immer den Artikel mit: das Theater, der Chor, das Publikum. So lernst du das Genus gleich mit.','Always learn the article with the noun; this helps you remember its gender.','Luôn nghe mạo từ cùng danh từ để nhớ giống ngay từ đầu.']],
'1.34':[['1','Ein Anrufer erzählt vom Schwimmen im Sommer nach der Arbeit.','A caller talks about swimming in summer after work.','Một thính giả kể về việc bơi mùa hè sau giờ làm.','im Sommer ist eine Dativ-Zeitangabe; jeden Tag sagt, wie oft er schwimmt.','im Sommer is a dative time phrase; jeden Tag gives frequency.','im Sommer là cụm thời gian Dativ; jeden Tag chỉ tần suất.']],
'1.35':[['1','Eine Frau beschreibt Radfahren im Frühling und einen aktiven Urlaub.','A woman describes cycling in spring and an active holiday.','Một người phụ nữ kể chuyện đạp xe vào mùa xuân và kỳ nghỉ năng động.','mit dem Fahrrad uses mit + Dativ. „Meine Freundin und ich“ is plural, so the verb is fahren.','mit dem Fahrrad uses mit + dative. The compound subject takes plural fahren.','mit dem Fahrrad dùng mit + Dativ. Chủ ngữ ghép đi với động từ số nhiều fahren.']],
'1.36':[['1','Ein Anrufer berichtet, warum er gern im Herbst reist, und nennt Städte.','A caller explains why he likes travelling in autumn and names cities.','Một thính giả kể vì sao thích du lịch mùa thu và nhắc tên thành phố.','nach steht vor den genannten Städten ohne Artikel; im Oktober und im November nennen Zeitpunkte.','nach precedes these city names without an article; im Oktober and im November give times.','nach đứng trước tên thành phố không mạo từ; im Oktober và im November chỉ thời điểm.']],
'1.37':[['1','Eine Anruferin erzählt von Spaziergängen und Museumsbesuchen im Winter.','A caller talks about walks and museum visits in winter.','Một thính giả kể về đi dạo và thăm bảo tàng vào mùa đông.','spazieren gehen ist die feste Verbindung. Draußen und drinnen bilden einen Gegensatz; es ist kalt nutzt es als Formalsubjekt.','spazieren gehen is a fixed phrase. draußen and drinnen contrast; es in es ist kalt is a formal subject.','spazieren gehen là cụm cố định. draußen và drinnen đối lập; es trong es ist kalt là chủ ngữ hình thức.']]
});

'1.41':{title:['An der Wursttheke bestellen','Ordering at the deli counter','Gọi món ở quầy thịt nguội'],listen:['Eine Kundin bittet um Wurst. Die Verkäuferin nennt ein Angebot mit Schinken; die Kundin entscheidet sich für eine Menge.','A customer asks for sausage. The seller mentions a ham offer, and the customer chooses a quantity.','Khách hỏi mua xúc xích; người bán giới thiệu giăm bông đang khuyến mãi, rồi khách chọn số lượng.'],grammar:['„Was möchten Sie?“ fragt höflich nach einem Wunsch. „Welche Wurst?“ passt zum femininen Nomen die Wurst. „Dann nehme ich …“ klingt wie eine klare, freundliche Kaufentscheidung.','“Was möchten Sie?” politely asks what the customer wants. Welche agrees with feminine Wurst. “Dann nehme ich …” makes a clear, friendly choice.','„Was möchten Sie?“ hỏi lịch sự khách muốn gì. Welche đi với danh từ giống cái Wurst. „Dann nehme ich …“ là cách chọn món rõ ràng, tự nhiên.'],example:['Dann nehme ich 100 Gramm Schinken, bitte.','Then I’ll take 100 grams of ham, please.','Vậy cho tôi 100 gam giăm bông nhé.'],words:[['die Wurst','[vʊʁst]','sausage; cold cuts','xúc xích; thịt nguội'],['der Schinken','[ˈʃɪŋkn̩]','ham','giăm bông'],['das Angebot','[ˈanɡəboːt]','special offer','món hàng khuyến mãi'],['nehmen','[ˈneːmən]','take; choose','lấy; chọn']]},
'1.42':{title:['Angebote im Lebensmittelgeschäft verstehen','Understanding grocery offers','Hiểu quảng cáo khuyến mãi thực phẩm'],listen:['Eine Anzeige nennt Marmelade, Käse und Brot. Höre auf Produkt, Gewicht und Preis, damit du die Angebote vergleichen kannst.','An advert lists jam, cheese, and bread. Listen for the product, weight, and price so you can compare the offers.','Quảng cáo nêu mứt, phô mai và bánh mì. Hãy nghe tên món, khối lượng và giá để so sánh khuyến mãi.'],grammar:['„für nur“ leitet den Preis ein. Bei Mengenangaben steht die Einheit meist im Singular: 450 Gramm, 100 Gramm. „zum Abendbrot“ bedeutet: beim Abendessen.','“für nur” introduces a price. The unit usually stays singular after a number: 450 Gramm. “zum Abendbrot” means at the evening meal.','„für nur“ mở đầu giá tiền. Sau con số, đơn vị thường ở số ít: 450 Gramm. „zum Abendbrot“ nghĩa là trong bữa tối.'],example:['Der Käse kostet 1 Euro 19 für 100 Gramm.','The cheese costs €1.19 per 100 grams.','Phô mai giá 1 euro 19 cho mỗi 100 gam.'],words:[['die Erdbeermarmelade','[ˈeːɐ̯tbeːɐ̯ˌmaʁməlaːdə]','strawberry jam','mứt dâu'],['der Käse','[ˈkɛːzə]','cheese','phô mai'],['das Gramm','[ɡʁam]','gram','gam'],['billig','[ˈbɪlɪç]','cheap','rẻ']]},
'1.43':{title:['In der Bäckerei einkaufen','Shopping at the bakery','Mua đồ ở tiệm bánh'],listen:['Ein Kunde wird begrüßt und zeigt auf ein Brot. Danach ergänzt er die Bestellung um drei Brötchen.','A customer is greeted, points to a loaf, and adds three bread rolls to the order.','Khách được chào, chỉ chiếc bánh mì muốn mua rồi gọi thêm ba bánh mì nhỏ.'],grammar:['„Was darf’s denn sein?“ ist eine höfliche Frage nach der Bestellung; darf’s steht verkürzt für darf es. „Geben Sie mir bitte …“ ist ein höflicher Wunsch. „Noch drei Brötchen“ lässt das Verb weg, weil es aus dem Zusammenhang klar ist.','“Was darf’s denn sein?” politely asks for an order; darf’s shortens darf es. “Geben Sie mir bitte …” is a polite request. “Noch drei Brötchen” omits the understood verb.','„Was darf’s denn sein?“ hỏi lịch sự khách gọi gì; darf’s rút gọn từ darf es. „Geben Sie mir bitte …“ là lời nhờ lịch sự. „Noch drei Brötchen“ lược động từ vì người nghe tự hiểu.'],example:['Geben Sie mir bitte ein Brot und drei Brötchen.','Please give me a loaf and three bread rolls.','Làm ơn cho tôi một ổ bánh mì và ba bánh mì nhỏ.'],words:[['die Bäckerei','[bɛkəˈʁaɪ̯]','bakery','tiệm bánh'],['das Brot','[bʁoːt]','bread; loaf','bánh mì'],['das Brötchen','[ˈbʁøːtçən]','bread roll','bánh mì nhỏ'],['geben','[ˈɡeːbən]','give','đưa; cho']]},
'1.44':{title:['Obst und Gemüse auf dem Markt kaufen','Buying fruit and vegetables at the market','Mua rau củ và trái cây ở chợ'],listen:['Ein Verkäufer lädt zum Probieren ein. Die Kundschaft kauft Kartoffeln, Bananen und Äpfel, nennt Mengen und beendet den Einkauf.','A seller invites customers to taste the produce. They buy potatoes, bananas, and apples, state quantities, and finish the shop.','Người bán mời khách nếm thử. Khách mua khoai tây, chuối và táo, nói số lượng rồi kết thúc lượt mua.'],grammar:['„Wir brauchen Kartoffeln“ nennt den Bedarf. Mengen stehen ohne Artikel: zwei Kilo Kartoffeln, ein Kilo Äpfel. „Haben Sie noch einen Wunsch?“ fragt nach weiteren Dingen; „Das ist alles“ beendet die Bestellung.','“Wir brauchen …” states a need. Quantities can appear without an article: zwei Kilo Kartoffeln. “Haben Sie noch einen Wunsch?” asks if anything else is needed.','„Wir brauchen …“ nói món cần mua. Lượng hàng có thể đứng không mạo từ: zwei Kilo Kartoffeln. „Haben Sie noch einen Wunsch?“ hỏi khách có cần gì thêm không.'],example:['Wir brauchen zwei Kilo Kartoffeln und ein Kilo Äpfel.','We need two kilos of potatoes and one kilo of apples.','Chúng tôi cần hai ký khoai tây và một ký táo.'],words:[['der Markt','[maʁkt]','market','chợ'],['die Kartoffel','[kaʁˈtɔfl̩]','potato','khoai tây'],['die Banane','[baˈnaːnə]','banana','chuối'],['der Apfel','[ˈapfl̩]','apple','táo']]},
'1.45':{title:['Einkäufe für ein gemeinsames Essen planen','Planning shopping for a shared meal','Lên danh sách mua đồ cho bữa ăn chung'],listen:['Zwei Personen teilen die Einkäufe auf. Sie prüfen, was schon da ist und was noch fehlt, und vereinbaren, wer Markt oder Supermarkt besucht.','Two people divide the shopping. They check what they have and what is missing, then decide who goes to the market or supermarket.','Hai người chia nhau việc mua sắm. Họ kiểm tra món đã có, món còn thiếu rồi thống nhất ai đi chợ hay siêu thị.'],grammar:['„Wir brauchen noch …“ zeigt, was fehlt; „Wir haben keinen Käse mehr“ bedeutet, dass nichts davon übrig ist. Verneinte Mengen nutzen keinen/keine/kein passend zum Nomen. „Kaufst du …?“ fragt nach einer Aufgabe.','“Wir brauchen noch …” says what is still needed. “Wir haben keinen Käse mehr” means none is left. keinen/keine/kein agrees with the noun.','„Wir brauchen noch …“ cho biết còn thiếu gì. „Wir haben keinen Käse mehr“ nghĩa là không còn chút nào. keinen/keine/kein đổi theo giống và cách của danh từ.'],example:['Wir haben kein Öl mehr. Kaufst du bitte welches?','We have no oil left. Could you buy some?','Chúng ta hết dầu rồi. Bạn mua giúp nhé?'],words:[['die Einkaufsliste','[ˈaɪ̯nkaʊ̯fsˌlɪstə]','shopping list','danh sách mua sắm'],['fehlen','[ˈfeːlən]','be missing','bị thiếu'],['der Supermarkt','[ˈzuːpɐˌmaʁkt]','supermarket','siêu thị'],['aufteilen','[ˈaʊ̯fˌtaɪ̯lən]','divide up','chia ra']]},
'1.46':{title:['Pluralformen von Lebensmitteln hören','Listening for food plurals','Nghe dạng số nhiều của từ thực phẩm'],listen:['Die Übung stellt Einzahl und Mehrzahl gegenüber: Apfel/Äpfel, Saft/Säfte, Markt/Märkte sowie Brot/Brötchen. Danach erscheinen die Wörter in kurzen Alltagssätzen.','The exercise contrasts singular and plural forms, then places the words in short everyday sentences.','Bài tập đối chiếu số ít và số nhiều, sau đó đặt từ vào các câu sinh hoạt ngắn.'],grammar:['Im Plural kann sich der Stammvokal ändern: a wird zu ä in Apfel/Äpfel und Markt/Märkte. Brot hat hier den Plural Brötchen für kleine Brote. Deshalb lernt man Pluralformen am besten mit dem Nomen zusammen.','Some plurals change the stem vowel, such as Apfel/Äpfel. Brot has the diminutive plural Brötchen here. Learn each plural with its noun.','Một số danh từ đổi nguyên âm khi sang số nhiều, như Apfel/Äpfel. Brot có dạng Brötchen để chỉ bánh nhỏ. Nên học dạng số nhiều cùng danh từ.'],example:['Ein Apfel liegt auf dem Tisch; zwei Äpfel liegen im Korb.','One apple is on the table; two apples are in the basket.','Một quả táo ở trên bàn; hai quả táo ở trong giỏ.'],words:[['der Apfel – die Äpfel','[ˈapfl̩] – [ˈɛpfl̩]','apple – apples','quả táo – các quả táo'],['der Saft – die Säfte','[zaft] – [ˈzɛftə]','juice – juices','nước ép – các loại nước ép'],['der Markt – die Märkte','[maʁkt] – [ˈmɛʁktə]','market – markets','chợ – các khu chợ'],['das Brötchen','[ˈbʁøːtçən]','bread roll','bánh mì nhỏ']]},
'1.47':{title:['Lebensmittelwörter deutlich aussprechen','Pronouncing food vocabulary clearly','Phát âm rõ từ vựng thực phẩm'],listen:['Die Wortreihe enthält Wörter mit ähnlichen Lauten und verschiedenen Betonungen. Höre auf Wortanfang, Vokallänge und den betonten Teil.','The word list contains similar sounds and different stress patterns. Listen for the first sound, vowel length, and stressed syllable.','Danh sách có các âm gần giống nhau và trọng âm khác nhau. Chú ý âm đầu, độ dài nguyên âm và âm tiết được nhấn.'],grammar:['Das ist eine Ausspracheübung, keine neue Satzregel. Bei Tomate und Kartoffel liegt die Betonung nicht auf der ersten Silbe. Sprich das Wort als Ganzes nach, damit der Rhythmus natürlich bleibt.','This is pronunciation practice, not a new sentence rule. In Tomate and Kartoffel, stress is not on the first syllable. Repeat each whole word.','Đây là luyện phát âm chứ không phải quy tắc câu. Tomate và Kartoffel không nhấn âm tiết đầu. Hãy nhắc lại cả từ để giữ nhịp tự nhiên.'],example:['Die Tomate kommt vom Markt.','The tomato comes from the market.','Quả cà chua được mua ở chợ.'],words:[['die Tomate','[toˈmaːtə]','tomato','cà chua'],['die Kartoffel','[kaʁˈtɔfl̩]','potato','khoai tây'],['die Einladung','[ˈaɪ̯nlaːdʊŋ]','invitation','lời mời'],['das Wörterbuch','[ˈvœʁtɐˌbuːx]','dictionary','từ điển']]},
'1.48':{title:['Kleingeld für den Einkaufswagen wechseln','Changing a coin for the shopping cart','Đổi tiền xu để lấy xe đẩy'],listen:['Eine Kundin braucht eine Münze für den Einkaufswagen und bittet eine andere Person um Wechselgeld.','A customer needs a coin for the shopping cart and asks someone to change money.','Khách cần đồng xu để dùng xe đẩy và nhờ người khác đổi tiền.'],grammar:['„Ich brauche einen Euro für …“ erklärt den Zweck mit für + Akkusativ. „Können Sie wechseln?“ ist eine höfliche Bitte mit können; das Vollverb steht am Ende.','für + accusative gives the purpose. können makes the request polite, and the main verb goes at the end.','für + Akkusativ nêu mục đích. können làm lời nhờ lịch sự, động từ chính đứng cuối câu.'],example:['Können Sie mir bitte einen Euro wechseln?','Could you change a euro for me, please?','Anh/chị đổi giúp tôi một euro được không?'],words:[['der Einkaufswagen','[ˈaɪ̯nkaʊ̯fsˌvaːɡn̩]','shopping cart','xe đẩy mua hàng'],['das Kleingeld','[ˈklaɪ̯nɡɛlt]','small change','tiền lẻ'],['wechseln','[ˈvɛksl̩n]','change; exchange','đổi']]},
'1.49':{title:['Nach dem Preis fragen','Asking about the price','Hỏi giá tiền'],listen:['Eine Person fragt nach dem Preis von Apfelsaft und Orangensaft und vergleicht die beiden Beträge.','A customer asks the prices of apple and orange juice and compares them.','Khách hỏi giá nước táo và nước cam rồi so sánh hai mức giá.'],grammar:['„Was kostet …?“ und „Wie viel kostet …?“ fragen beide nach dem Preis. Das Verb kostet steht im Singular, weil das Produkt im Satz das Subjekt ist. Cent und Euro nennt man danach als Betrag.','Both “Was kostet …?” and “Wie viel kostet …?” ask for a price. kostet is singular because the product is the subject.','Cả „Was kostet …?“ và „Wie viel kostet …?“ đều dùng để hỏi giá. kostet chia số ít vì sản phẩm là chủ ngữ.'],example:['Wie viel kostet der Orangensaft? – Ein Euro neun.','How much is the orange juice? – One euro nine.','Nước cam giá bao nhiêu? – Một euro lẻ chín.'],words:[['der Apfelsaft','[ˈapfl̩ˌzaft]','apple juice','nước táo'],['der Orangensaft','[oˈʁaŋənˌzaft]','orange juice','nước cam'],['kosten','[ˈkɔstn̩]','cost','có giá']]},
'1.50':{title:['An der Käsetheke bestellen','Ordering at the cheese counter','Gọi món ở quầy phô mai'],listen:['Eine Kundin wartet, bis sie an der Reihe ist. Sie bestellt ein Stück Käse und zusätzlich eine bestimmte Menge Schinken.','A customer waits her turn, then orders a piece of cheese and a measured amount of ham.','Khách chờ đến lượt rồi gọi một miếng phô mai và một lượng giăm bông cụ thể.'],grammar:['„Wer kommt dran?“ fragt, wer als Nächstes bedient wird. „Ich möchte …“ ist eine direkte, höfliche Bestellung. Nach „Sonst noch etwas?“ kann man mit „Ich nehme noch …“ ergänzen.','“Wer kommt dran?” asks whose turn it is. “Ich möchte …” is a polite order; “Ich nehme noch …” adds another item.','„Wer kommt dran?“ hỏi ai đến lượt. „Ich möchte …“ là cách gọi món lịch sự; „Ich nehme noch …“ dùng để gọi thêm.'],example:['Ich möchte ein Stück Käse und noch 150 Gramm Schinken.','I’d like a piece of cheese and another 150 grams of ham.','Cho tôi một miếng phô mai và thêm 150 gam giăm bông.'],words:[['die Käsetheke','[ˈkɛːzəˌteːkə]','cheese counter','quầy phô mai'],['das Stück','[ʃtʏk]','piece','miếng'],['drankommen','[ˈdʁanˌkɔmən]','be next; have a turn','đến lượt'],['der Schinken','[ˈʃɪŋkn̩]','ham','giăm bông']]},
'1.51':{title:['Ein Produkt im Supermarkt finden','Finding a product in the supermarket','Tìm một món hàng trong siêu thị'],listen:['Eine Kundin fragt, wo der Reis steht. Die Antwort verweist knapp auf den Gang rechts.','A customer asks where the rice is. The reply points briefly to the aisle on the right.','Khách hỏi gạo ở đâu; người bán trả lời ngắn rằng ở phía bên phải.'],grammar:['„Wo finde ich …?“ fragt nach einem Standort. „Dort rechts“ reicht als Antwort, wenn beide wissen, dass ein Regal oder Gang gemeint ist.','“Wo finde ich …?” asks for a location. “Over there on the right” is enough when the aisle is understood.','„Wo finde ich …?“ hỏi vị trí. „Dort rechts“ là đủ khi hai bên đều hiểu đang nói về quầy hay lối đi.'],example:['Entschuldigung, wo finde ich den Reis? – Dort rechts.','Excuse me, where can I find the rice? – Over there on the right.','Xin lỗi, tôi tìm gạo ở đâu? – Phía bên phải kia.'],words:[['der Reis','[ʁaɪ̯s]','rice','gạo'],['finden','[ˈfɪndn̩]','find','tìm thấy'],['rechts','[ʁɛçts]','on the right','bên phải']]},
'1.52':{title:['An der Kasse bezahlen','Paying at the checkout','Thanh toán ở quầy thu ngân'],listen:['Die Kundin bittet um eine Tüte, reagiert auf deren Preis und entscheidet sich dann doch dafür. Zum Schluss wird der Gesamtbetrag genannt und nach dem Kassenbon gefragt.','The customer asks for a bag, reacts to its price, and decides to take it after all. The cashier gives the total and asks about a receipt.','Khách xin túi, ngạc nhiên vì giá rồi vẫn quyết định lấy. Cuối cùng thu ngân báo tổng tiền và hỏi có cần hóa đơn không.'],grammar:['„Das ist aber teuer!“ nutzt aber, um die Überraschung zu verstärken. „Also gut“ zeigt Zustimmung nach kurzem Zögern. „Brauchen Sie den Kassenzettel?“ ist eine höfliche Sie-Frage.','aber adds emphasis to the reaction. Also gut signals agreement after hesitation. The cashier uses a polite Sie question.','aber nhấn mạnh sự ngạc nhiên. Also gut cho thấy đồng ý sau khi hơi do dự. Nhân viên dùng câu hỏi lịch sự với Sie.'],example:['Die Tüte kostet 35 Cent. Also gut, ich nehme sie.','The bag costs 35 cents. All right, I’ll take it.','Túi giá 35 cent. Thôi được, tôi lấy.'],words:[['die Kasse','[ˈkasə]','checkout; till','quầy thu ngân'],['die Tüte','[ˈtyːtə]','bag','túi'],['der Kassenzettel','[ˈkasənˌtsɛtl̩]','receipt','hóa đơn'],['teuer','[ˈtɔɪ̯ɐ]','expensive','đắt']]},
'1.53':{title:['Beim Essen guten Appetit wünschen','Wishing someone an enjoyable meal','Chúc ngon miệng'],listen:['Am Tisch wünschen sich die Personen guten Appetit. Eine Person fragt, ob das Essen schmeckt, und bekommt eine positive Rückmeldung.','At the table, people wish each other an enjoyable meal. One asks how the food tastes and receives a positive reply.','Mọi người chúc nhau ngon miệng; một người hỏi món ăn có ngon không và nhận được lời khen.'],grammar:['„Schmeckt’s?“ ist die Kurzform von „Schmeckt es?“; das Gericht ist das gedachte Subjekt. „Gleichfalls“ erwidert einen Wunsch: dir/euch ebenfalls.','“Schmeckt’s?” shortens “Schmeckt es?”; the dish is the implied subject. Gleichfalls returns the good wish.','„Schmeckt’s?“ rút gọn từ „Schmeckt es?“; món ăn là chủ ngữ được hiểu ngầm. Gleichfalls đáp lại lời chúc.'],example:['Guten Appetit! – Danke, gleichfalls.','Enjoy your meal! – Thanks, you too.','Chúc ngon miệng! – Cảm ơn, bạn cũng vậy.'],words:[['der Appetit','[apɛˈtiːt]','appetite','cảm giác ngon miệng'],['schmecken','[ˈʃmɛkn̩]','taste','có vị'],['gleichfalls','[ˈɡlaɪ̯çˌfals]','likewise','bạn cũng vậy']]},
'1.54':{title:['Essen anbieten und Sättigung ausdrücken','Offering food and saying you are full','Mời ăn và nói đã no'],listen:['Eine Person bietet ein Würstchen an. Die anderen nehmen gern etwas oder lehnen ab, weil sie schon satt sind.','Someone offers a sausage. The others accept or decline because they are already full.','Một người mời xúc xích; người kia nhận hoặc từ chối vì đã no.'],grammar:['„Möchtet ihr …?“ fragt mehrere vertraute Personen. „Ich bin satt“ beschreibt einen Zustand; satt bedeutet hier, genug gegessen zu haben. „wirklich lecker“ verstärkt die positive Bewertung.','Möchtet ihr addresses several people informally. Ich bin satt describes being full; wirklich intensifies lecker.','„Möchtet ihr …?“ hỏi một nhóm người quen. „Ich bin satt“ nói đã ăn đủ; wirklich nhấn mạnh món rất ngon.'],example:['Möchtet ihr noch etwas? – Nein danke, wir sind satt.','Would you like anything else? – No thanks, we’re full.','Mọi người ăn thêm gì không? – Không, cảm ơn, chúng tôi no rồi.'],words:[['das Würstchen','[ˈvʏʁstçən]','small sausage','xúc xích nhỏ'],['lecker','[ˈlɛkɐ]','tasty','ngon'],['satt','[zat]','full; satisfied','no; no bụng']]},
'1.55':{title:['Ein Gericht höflich ablehnen','Politely declining a dish','Lịch sự từ chối một món ăn'],listen:['Jemand bietet Salat an. Die andere Person lehnt freundlich ab und erklärt, dass sie keine Gurken isst.','Someone offers salad. The other person politely declines and explains that they do not eat cucumbers.','Một người mời salad; người kia từ chối lịch sự và nói mình không ăn dưa chuột.'],grammar:['„Nein, danke“ macht die Ablehnung freundlich. „Ich esse keine Gurken“ verneint das Nomen im Akkusativ Plural mit keine. Bei einem Lebensmittel allgemein bedeutet der Plural: diese Sorte überhaupt nicht.','Nein, danke makes the refusal polite. keine negates a plural accusative noun; here it means cucumbers in general.','„Nein, danke“ giúp lời từ chối lịch sự. keine phủ định danh từ số nhiều ở Akkusativ; ở đây nghĩa là không ăn dưa chuột nói chung.'],example:['Möchtest du Gurkensalat? – Nein danke, ich esse keine Gurken.','Would you like cucumber salad? – No thanks, I don’t eat cucumbers.','Bạn ăn salad dưa chuột không? – Không, cảm ơn, tôi không ăn dưa chuột.'],words:[['der Salat','[zaˈlaːt]','salad','món salad'],['die Gurke','[ˈɡʊʁkə]','cucumber','dưa chuột'],['ablehnen','[ˈapˌleːnən]','decline','từ chối']]},
'1.56':{title:['Beim Essen anstoßen und grüßen','Making a toast and using meal greetings','Cụng ly và chúc trong bữa ăn'],listen:['Die Aufnahme sammelt kurze Wendungen für Tisch und Getränk: Man wünscht guten Appetit oder stößt miteinander an.','The recording collects short expressions for meals and drinks: wishing someone a good meal and making a toast.','Bản nghe gom các câu ngắn dùng bên bàn ăn và khi uống: chúc ngon miệng, chúc sức khỏe.'],grammar:['Prost und Zum Wohl sind feste Ausrufe beim Anstoßen. Guten Appetit und Mahlzeit sind feste Wünsche rund ums Essen; sie werden nicht wörtlich Wort für Wort übersetzt.','Prost and Zum Wohl are fixed toast expressions. Guten Appetit and Mahlzeit are meal wishes, understood as whole phrases.','Prost và Zum Wohl là câu cố định khi cụng ly. Guten Appetit và Mahlzeit là lời chúc trong bữa ăn, nên học cả cụm.'],example:['Zum Wohl! – Danke, zum Wohl!','Cheers! – Thanks, cheers!','Chúc sức khỏe! – Cảm ơn, chúc sức khỏe!'],words:[['das Wohl','[voːl]','well-being','sức khỏe; điều tốt lành'],['Prost','[pʁoːst]','cheers','chúc sức khỏe'],['die Mahlzeit','[ˈmaːlˌtsaɪ̯t]','mealtime; enjoy your meal','bữa ăn; chúc ngon miệng']]},
'1.57':{title:['Im Restaurant ein Gericht auswählen','Choosing a dish in a restaurant','Chọn món trong nhà hàng'],listen:['Ein Gast kann sich zunächst nicht entscheiden. Der Kellner empfiehlt frischen Fisch, aber der Gast wählt lieber Steak und bestellt ein Getränk dazu.','A diner is unsure at first. The waiter recommends fresh fish, but the guest prefers steak and orders a drink.','Khách chưa quyết định được. Nhân viên giới thiệu cá tươi nhưng khách thích bít tết hơn và gọi thêm đồ uống.'],grammar:['„Was darf ich Ihnen bringen?“ ist eine höfliche Servicefrage. „Ich esse nicht gern Fisch“ beschreibt eine allgemeine Vorliebe; lieber vergleicht zwei Möglichkeiten. „Ich nehme das Steak“ trifft die konkrete Wahl.','The server’s question is polite. nicht gern describes a general dislike; lieber compares options, and Ich nehme makes the choice.','Câu của nhân viên là cách hỏi lịch sự. nicht gern nói sở thích chung; lieber dùng để so sánh lựa chọn; Ich nehme nêu món được chọn.'],example:['Ich esse nicht gern Fisch. Ich nehme lieber das Steak.','I don’t like fish. I’d rather have the steak.','Tôi không thích ăn cá. Tôi chọn bít tết hơn.'],words:[['das Restaurant','[ʁɛstoˈʁãː]','restaurant','nhà hàng'],['der Fisch','[fɪʃ]','fish','cá'],['das Steak','[ʃteːk]','steak','bít tết'],['lieber','[ˈliːbɐ]','preferably; rather','thích hơn']]},
'1.58':{title:['Einem Gast etwas zu trinken anbieten','Offering a guest something to drink','Mời khách uống nước'],listen:['Maria kommt vom Sport und hat großen Durst. Ihre Gastgeberin bietet Orangensaft an; Maria nimmt das Angebot an.','Maria comes back from sport very thirsty. Her host offers orange juice, which she accepts.','Maria đi tập thể thao về và rất khát. Chủ nhà mời nước cam và cô vui vẻ nhận lời.'],grammar:['„Komm doch rein“ ist eine freundliche Einladung; doch macht sie einladender. „Was möchtest du trinken?“ fragt nach einem Wunsch. „Orangensaft wäre super“ nutzt wäre, die Konjunktiv-II-Form von sein, als höfliche oder vorsichtige Zustimmung.','doch softens and warms the invitation. wäre is the Konjunktiv II form of sein and makes the response sound appreciative and slightly less blunt.','doch làm lời mời thân thiện hơn. wäre là Konjunktiv II của sein, giúp câu nhận lời nghe mềm mại, tự nhiên hơn.'],example:['Ein Wasser wäre super, danke.','A water would be great, thanks.','Cho tôi xin nước lọc thì tuyệt, cảm ơn nhé.'],words:[['der Durst','[dʊʁst]','thirst','cơn khát'],['der Orangensaft','[oˈʁaŋənˌzaft]','orange juice','nước cam'],['anbieten','[ˈanˌbiːtn̩]','offer','mời; đề nghị'],['wäre','[ˈvɛːʁə]','would be','sẽ là; thì sẽ']]},
'1.59':{title:['Eine Einladung wegen einer Diät ablehnen','Declining a treat because of a diet','Từ chối món ăn vì đang ăn kiêng'],listen:['In der Pause wird Schokolade angeboten. Die Person mag sie eigentlich, lehnt aber wegen einer aktuellen Diät ab. Das Gegenüber versteht den Grund und macht einen Scherz.','Someone offers chocolate during a break. The person likes it but declines because of a current diet; the other responds jokingly.','Trong giờ nghỉ, một người mời sô-cô-la. Người kia vốn thích nhưng từ chối vì đang ăn kiêng; bạn họ đùa rằng vậy mình ăn phần nhiều hơn.'],grammar:['„Du magst keine Schokolade!“ ist eine negative Vermutung. „Doch“ widerspricht einer Verneinung: Ja, ich mag sie! „Ich mache gerade eine Diät“ sagt, dass die Diät im Moment läuft; gerade bedeutet hier zurzeit.','Doch contradicts a negative statement: the speaker does like chocolate. gerade means currently in Ich mache gerade eine Diät.','Doch dùng để bác lại câu phủ định: thật ra tôi thích sô-cô-la. gerade trong câu này nghĩa là hiện đang ăn kiêng.'],example:['Du isst keine Schokolade? – Doch, aber ich mache gerade eine Diät.','You don’t eat chocolate? – I do, but I’m on a diet right now.','Bạn không ăn sô-cô-la à? – Có chứ, nhưng hiện tôi đang ăn kiêng.'],words:[['die Schokolade','[ʃokoˈlaːdə]','chocolate','sô-cô-la'],['die Diät','[diˈɛːt]','diet','chế độ ăn kiêng'],['gerade','[ɡəˈʁaːdə]','right now','ngay lúc này'],['doch','[dɔx]','yes (contradicting a negative)','có chứ (đáp lại câu phủ định)']]}
});
Object.assign(TRACK_STEPS,{
'1.41':[['1 · Den Wunsch nennen','Die Kundin bittet um Wurst und die Verkäuferin fragt nach der Sorte.','The customer asks for sausage and the seller asks which kind.','Khách hỏi mua xúc xích, người bán hỏi loại nào.','Welche richtet sich nach die Wurst; möchten fragt höflich nach einem Wunsch.','Welche agrees with feminine Wurst; möchten politely asks what is wanted.','Welche đi với danh từ cái Wurst; möchten hỏi mong muốn một cách lịch sự.'],['2 · Menge wählen','Die Kundin nimmt das Schinkenangebot und nennt 100 Gramm.','The customer chooses the ham offer and specifies 100 grams.','Khách chọn giăm bông khuyến mãi và lấy 100 gam.','Dann nehme ich … zeigt die Entscheidung; Gramm bleibt nach der Zahl unverändert.','Dann nehme ich … states the choice; Gramm stays unchanged after a number.','Dann nehme ich … nêu quyết định; Gramm không đổi sau số lượng.']],
'1.42':[['1 · Angebot und Gewicht hören','Die Anzeige nennt Marmelade und Käse samt Gewicht und Preis.','The advert gives jam and cheese prices with their weights.','Quảng cáo nêu giá mứt và phô mai kèm khối lượng.','für nur führt einen Aktionspreis ein; die Menge steht als 450 Gramm oder 100 Gramm.','für nur introduces a special price; the quantity is given in grams.','für nur mở đầu giá ưu đãi; số lượng được tính bằng gam.'],['2 · Weitere Ware vergleichen','Brot wird ebenfalls mit Gewicht und Preis angeboten.','Bread is also advertised with a weight and price.','Bánh mì cũng được quảng cáo kèm khối lượng và giá.','auch fügt ein weiteres Angebot hinzu; oder stellt zwei Käseoptionen gegenüber.','auch adds another offer; oder contrasts two cheese options.','auch thêm một món khuyến mãi; oder đưa ra hai lựa chọn phô mai.']],
'1.43':[['1 · Beim Bäcker begrüßen','Kunde und Verkäufer tauschen einen Morgengruß aus.','The customer and seller exchange a morning greeting.','Khách và người bán chào buổi sáng.','Guten Morgen ist eine feste Grußformel.','Guten Morgen is a fixed greeting.','Guten Morgen là lời chào cố định.'],['2 · Bestellung ergänzen','Der Kunde zeigt auf ein Brot und bestellt zusätzlich Brötchen.','The customer points to a loaf and adds bread rolls.','Khách chỉ bánh mì rồi gọi thêm bánh mì nhỏ.','Geben Sie mir … ist höflich; noch drei Brötchen lässt das leicht verständliche Verb weg.','Geben Sie mir … is polite; noch drei Brötchen omits the obvious verb.','Geben Sie mir … là cách nhờ lịch sự; noch drei Brötchen lược động từ đã rõ.']],
'1.44':[['1 · Ware probieren und Bedarf sagen','Der Verkäufer preist frisches Obst an; die Kundschaft braucht Kartoffeln.','The seller promotes fresh fruit; the customers need potatoes.','Người bán giới thiệu trái cây; khách cần mua khoai tây.','Wir brauchen + Akkusativ nennt den Bedarf: Kartoffeln.','Wir brauchen + accusative names what is needed.','Wir brauchen + Akkusativ nêu món cần mua.'],['2 · Menge und Kasse','Bananen und Äpfel werden ergänzt, dann nennt der Verkäufer den Gesamtpreis.','They add bananas and apples, then the seller gives the total.','Khách gọi thêm chuối, táo rồi người bán báo tổng tiền.','ein Kilo Äpfel und zwei Kilo Kartoffeln sind Mengenangaben; zusammen heißt hier insgesamt.','The kilo phrases state quantities; zusammen means in total.','Các cụm ein Kilo/two Kilo nêu số lượng; zusammen nghĩa là tổng cộng.']],
'1.45':[['1 · Aufgaben verteilen','Die beiden Personen teilen auf, wer Salat, Getränke, Fleisch und Würstchen kauft.','They divide up who buys salad, drinks, meat, and sausages.','Hai người chia nhau mua salad, đồ uống, thịt và xúc xích.','kaufen steht im Präsens; das Subjekt bestimmt die Form: ich kaufe, du kaufst.','kaufen is present tense; its form follows the subject.','kaufen ở hiện tại và đổi đuôi theo chủ ngữ.'],['2 · Fehlende Zutaten finden','Sie prüfen, was fehlt, und legen fest, wer zum Markt und wer zum Supermarkt geht.','They check what is missing and decide who goes to each shop.','Họ kiểm tra món còn thiếu rồi phân công người đi chợ và siêu thị.','keinen Käse verneint ein maskulines Nomen im Akkusativ; „nicht mehr“ means none remains.','keinen negates masculine accusative Käse; nicht mehr means none is left.','keinen phủ định Käse giống đực ở Akkusativ; nicht mehr nghĩa là không còn nữa.']],
'1.46':[['1 · Einzahl und Mehrzahl vergleichen','Die Übung bildet Plurale wie Apfel/Äpfel und Markt/Märkte.','The exercise forms plurals such as Apfel/Äpfel and Markt/Märkte.','Bài tập đổi danh từ sang số nhiều như Apfel/Äpfel, Markt/Märkte.','Bei manchen Nomen kommt ein Umlaut hinzu. Diese Veränderung muss man mit dem Plural lernen.','Some nouns add an umlaut in the plural; learn that change with the noun.','Một số danh từ thêm Umlaut khi sang số nhiều; cần ghi nhớ dạng đổi này.'],['2 · Wörter im Einkaufskontext','Die Wörter erscheinen anschließend in kurzen Sätzen zu Frühstück und Einkaufen.','The words then appear in short sentences about breakfast and shopping.','Các từ tiếp tục xuất hiện trong câu ngắn về bữa sáng và mua sắm.','zum ist zu dem; in der Bäckerei nennt einen Ort, an dem man einkauft.','zum contracts zu dem; in der Bäckerei gives the location.','zum rút gọn từ zu dem; in der Bäckerei cho biết địa điểm mua bánh.']],
'1.47':[['1 · Wortanfänge und Betonung hören','Die Wortreihe wechselt zwischen Lebensmitteln, Orten und anderen Alltagswörtern.','The list moves between food, places, and everyday words.','Danh sách chuyển giữa thực phẩm, địa điểm và từ sinh hoạt.','Achte auf die betonte Silbe, zum Beispiel To-ma-te und Kar-tof-fel.','Listen for the stressed syllable, for example in Tomate and Kartoffel.','Chú ý âm tiết được nhấn, như trong Tomate và Kartoffel.'],['2 · Wörter als Ganzes nachsprechen','Die vollständigen Wörter werden mit ihrem natürlichen Sprechrhythmus wiederholt.','Repeat the whole words with their natural rhythm.','Nhắc lại toàn bộ từ với nhịp nói tự nhiên.','Einzelne Laute verbinden sich im Wort; nicht nach jedem Buchstaben eine Pause machen.','Sounds connect within a word; do not pause between letters.','Các âm nối với nhau trong từ; đừng ngắt theo từng chữ cái.']],
'1.48':[['1 · Grund nennen','Die Kundin erklärt, dass sie einen Euro für den Einkaufswagen braucht.','The customer explains that she needs a euro for the shopping cart.','Khách nói mình cần một euro để dùng xe đẩy.','für den Einkaufswagen steht im Akkusativ und nennt den Zweck.','für den Einkaufswagen is accusative and gives the purpose.','für den Einkaufswagen ở Akkusativ, nêu mục đích.'],['2 · Höflich um Hilfe bitten','Sie fragt, ob die andere Person wechseln kann und bedankt sich.','She politely asks for change and then says thank you.','Khách lịch sự nhờ đổi tiền rồi cảm ơn.','Können Sie …? hat Verb-Erststellung; wechseln steht als Infinitiv am Satzende.','Können Sie …? puts the modal first; wechseln is the final infinitive.','Können Sie …? đưa động từ khiếm khuyết lên đầu; wechseln ở nguyên mẫu cuối câu.']],
'1.49':[['1 · Nach dem ersten Preis fragen','Die Kundin fragt nach Apfelsaft und bekommt den Preis.','The customer asks for apple juice and gets its price.','Khách hỏi giá nước táo và nhận câu trả lời.','Was kostet …? ist eine W-Frage; das Verb folgt direkt auf das Fragewort.','Was kostet …? is a W-question; the verb follows the question word.','Was kostet …? là câu hỏi W; động từ đứng ngay sau từ hỏi.'],['2 · Einen zweiten Preis vergleichen','Danach wird der Orangensaftpreis erfragt.','Then she asks for the orange juice price.','Sau đó khách hỏi giá nước cam.','Und verbindet die zweite Frage mit der ersten; die Frageform bleibt gleich.','Und connects the next question; the word order stays the same.','Und nối câu hỏi tiếp theo; trật tự câu hỏi không đổi.']],
'1.50':[['1 · Warten, bis man dran ist','Die Verkäuferin fragt, wer als Nächstes bedient wird.','The seller asks who is next.','Người bán hỏi ai đến lượt.','drankommen ist trennbar: Wer kommt dran? Im Hauptsatz steht dran am Ende.','drankommen is separable: the prefix dran goes to the end.','drankommen là động từ tách; dran xuống cuối câu hỏi.'],['2 · Menge und Sorte nennen','Die Kundin bestellt Käse und ergänzt Schinken in Gramm.','The customer orders cheese and adds a quantity of ham.','Khách gọi phô mai và thêm một lượng giăm bông tính bằng gam.','ein Stück beschreibt eine Einheit; 150 Gramm nennt eine genaue Menge.','ein Stück gives a unit; 150 Gramm gives an exact amount.','ein Stück nêu đơn vị; 150 Gramm nêu lượng chính xác.']],
'1.51':[['1 · Standort erfragen','Die Kundin möchte wissen, wo der Reis zu finden ist.','The customer asks where the rice can be found.','Khách hỏi có thể tìm gạo ở đâu.','Wo finde ich …? fragt nach einem Ort; Reis steht hier mit Artikel im Akkusativ.','Wo finde ich …? asks for a location; Reis is the accusative object.','Wo finde ich …? hỏi vị trí; Reis là tân ngữ Akkusativ.'],['2 · Kurz antworten','Der Verkäufer zeigt in eine Richtung.','The seller points in a direction.','Người bán chỉ một hướng.','Dort rechts ist eine verkürzte Antwort; der Satz „Der Reis ist dort rechts“ wird mitverstanden.','Dort rechts is a shortened reply; the full sentence is understood.','Dort rechts là câu trả lời rút gọn; người nghe tự hiểu câu đầy đủ.']],
'1.52':[['1 · Tüte kaufen oder ablehnen','Die Kundin fragt nach einer Tüte und reagiert auf den Preis.','The customer asks for a bag and reacts to its price.','Khách xin túi rồi phản ứng vì giá.','Wie bitte? signalisiert, dass man etwas nicht erwartet oder erneut hören möchte.','Wie bitte? shows surprise or asks for repetition.','Wie bitte? thể hiện ngạc nhiên hoặc muốn nghe nhắc lại.'],['2 · Bezahlen und Bon entscheiden','Der Betrag wird abgeschlossen und nach dem Kassenzettel gefragt.','The cashier gives the total and asks about the receipt.','Thu ngân báo tổng tiền rồi hỏi có cần hóa đơn không.','Brauchen Sie …? ist eine höfliche Frage. Das macht dann … nennt den Gesamtbetrag.','Brauchen Sie …? is polite; Das macht dann … gives the total.','Brauchen Sie …? là câu hỏi lịch sự; Das macht dann … báo tổng tiền.']],
'1.53':[['1 · Tischwunsch austauschen','Die Personen wünschen einander guten Appetit.','The diners wish each other an enjoyable meal.','Mọi người chúc nhau ngon miệng.','Guten Appetit ist ein fester Wunsch; gleichfalls erwidert ihn.','Guten Appetit is a fixed wish; gleichfalls returns it.','Guten Appetit là lời chúc cố định; gleichfalls đáp lại lời chúc.'],['2 · Geschmack beschreiben','Eine Person fragt nach dem Geschmack und das Fleisch wird gelobt.','One asks how it tastes and the meat is praised.','Một người hỏi món ăn thế nào và món thịt được khen.','Das Fleisch schmeckt gut: Das Essen ist das Subjekt, schmecken beschreibt den Geschmack.','Das Fleisch is the subject; schmecken describes its taste.','Das Fleisch là chủ ngữ; schmecken nói về vị món ăn.']],
'1.54':[['1 · Etwas anbieten','Eine Person fragt, ob die anderen noch ein Würstchen möchten.','Someone asks whether the others would like another sausage.','Một người hỏi mọi người có muốn ăn thêm xúc xích không.','Möchtet ist die höflichere Wunschform von mögen und richtet sich an ihr.','Möchtet is a polite wish form addressed to ihr.','Möchtet là dạng hỏi mong muốn lịch sự, chia theo ihr.'],['2 · Annehmen oder ablehnen','Eine Person lobt die Würstchen; eine andere sagt, dass sie satt ist.','One praises the sausages; another says they are full.','Một người khen xúc xích, người kia nói mình đã no.','die Würstchen steht im Plural; ich bin satt beschreibt einen Zustand.','Würstchen is plural; ich bin satt describes a state.','Würstchen ở số nhiều; ich bin satt mô tả trạng thái đã no.']],
'1.55':[['1 · Eine Speise anbieten','Salat wird angeboten und die andere Person antwortet freundlich.','Someone offers salad and the other person replies politely.','Một người mời salad và người kia trả lời lịch sự.','Möchtest du …? fragt eine einzelne vertraute Person.','Möchtest du …? addresses one person informally.','Möchtest du …? hỏi một người quen theo cách thân mật.'],['2 · Grund nennen','Die Person lehnt ab, weil sie keine Gurken isst.','The person declines because they do not eat cucumbers.','Người đó từ chối vì không ăn dưa chuột.','keine Gurken ist die Akkusativ-Plural-Verneinung; das Verb essen steht in Position zwei.','keine Gurken negates a plural accusative noun; essen is in second position.','keine Gurken phủ định danh từ số nhiều ở Akkusativ; essen ở vị trí thứ hai.']],
'1.56':[['1 · Beim Essen wünschen','Die Gruppe hört mehrere passende Tischwünsche.','The group hears several meal expressions.','Nhóm nghe một số câu chúc dùng trong bữa ăn.','Guten Appetit und Mahlzeit sind feste Wendungen; man verwendet sie als Ganzes.','Guten Appetit and Mahlzeit are fixed expressions, learned as a whole.','Guten Appetit và Mahlzeit là cụm cố định, nên học nguyên cụm.'],['2 · Anstoßen','Prost und Zum Wohl gehören zum gemeinsamen Trinken.','Prost and Zum Wohl are used for toasts.','Prost và Zum Wohl được dùng khi cùng nâng ly.','Zum Wohl bedeutet sinngemäß „auf die Gesundheit“; die Präposition zu steht hier in einer festen Wendung.','Zum Wohl roughly means “to your health”; it is a fixed phrase.','Zum Wohl gần nghĩa “chúc sức khỏe”; đây là cụm cố định.']],
'1.57':[['1 · Empfehlung hören','Der Kellner empfiehlt frischen Fisch, der Gast ist zunächst unentschlossen.','The waiter recommends fresh fish; the guest is unsure at first.','Nhân viên giới thiệu cá tươi nhưng khách ban đầu còn phân vân.','Was darf ich Ihnen bringen? nutzt darf als höfliche Serviceformel; Ihnen ist die formelle Anrede.','darf is a polite service expression; Ihnen is formal “you”.','darf tạo cách hỏi phục vụ lịch sự; Ihnen là đại từ xưng hô trang trọng.'],['2 · Wahl und Getränk nennen','Der Gast bevorzugt Steak und bestellt Cola.','The guest prefers steak and orders cola.','Khách chọn bít tết hơn và gọi cola.','lieber zeigt die bevorzugte Option; zu trinken fragt nach einem Getränk.','lieber marks preference; zu trinken asks what to drink.','lieber đánh dấu món thích hơn; zu trinken hỏi đồ uống.']],
'1.58':[['1 · Gast begrüßen','Maria wird hereingebeten und gefragt, wie es ihr geht.','Maria is welcomed in and asked how she is.','Maria được mời vào nhà và hỏi thăm.','Komm herein ist ein informeller Imperativ; doch macht die Einladung weicher.','Komm herein is an informal imperative; doch softens it.','Komm herein là mệnh lệnh thân mật; doch làm lời mời nhẹ nhàng hơn.'],['2 · Durst stillen','Die Gastgeberin bietet Saft an; Maria sagt zu.','The host offers juice and Maria accepts.','Chủ nhà mời nước ép và Maria đồng ý.','Orangensaft wäre super nutzt Konjunktiv II für eine freundliche, vorsichtige Zustimmung.','wäre is Konjunktiv II, making the acceptance warm and less abrupt.','wäre là Konjunktiv II, giúp nhận lời nghe thân thiện, bớt cụt.']],
'1.59':[['1 · Angebot ablehnen','In der Pause wird Schokolade angeboten, die Person lehnt zunächst ab.','Chocolate is offered during the break and initially declined.','Trong giờ nghỉ có người mời sô-cô-la, người kia ban đầu từ chối.','Möchtest du …? ist eine vertraute Frage; Nein, danke lehnt freundlich ab.','Möchtest du …? is informal; Nein, danke is a polite refusal.','Möchtest du …? là câu hỏi thân mật; Nein, danke từ chối lịch sự.'],['2 · Missverständnis korrigieren','Das Gegenüber glaubt, die Person möge keine Schokolade; doch korrigiert die Aussage.','The other person assumes they dislike chocolate; doch corrects that assumption.','Người kia tưởng bạn mình không thích sô-cô-la; doch đính chính điều đó.','Doch widerspricht einer negativen Aussage. gerade bedeutet hier „zurzeit“, nicht „straight“.','Doch contradicts a negative statement. gerade here means “currently”.','Doch bác lại câu phủ định; gerade ở đây nghĩa là “hiện tại”.']]
});
function addTrack(code,title,listen,grammar,example,words){
 TRACK_GUIDES[code]={title:title,listen:listen,grammar:grammar,example:example,words:words};
 TRACK_STEPS[code]=[["1 · Hörinhalt und Sprachmuster",listen[0],listen[1],listen[2],grammar[0],grammar[1],grammar[2]]];
}
// Kapitel 5–6: everyday routines, appointments, invitations, and dining out.
[
['1.60',['Morgens im Bad','A morning in the bathroom','Buổi sáng trong phòng tắm'],['Duschgeräusche zeigen den Start in den Tag. Höre auf die Alltagssituation und ordne passende Tätigkeiten zeitlich ein.','Shower sounds signal the start of the day. Identify the routine and place the activity in sequence.','Tiếng vòi sen gợi cảnh bắt đầu ngày mới. Hãy nhận diện hoạt động và đặt nó vào trình tự buổi sáng.'],['Bei einer Hörbild-Aufgabe ist nicht immer Sprache zu hören. Verbinde das Geräusch mit dem Tagesablauf; mögliche Sätze sind „Ich dusche am Morgen“ oder „Danach ziehe ich mich an.“','A sound-picture task may contain no speech. Connect the sound to a routine; for example, “I shower in the morning.”','Bài nghe âm thanh có thể không có lời thoại. Hãy nối âm thanh với thói quen, chẳng hạn “Ich dusche am Morgen” (Tôi tắm vào buổi sáng).'],['Am Morgen dusche ich und ziehe mich an.','I shower and get dressed in the morning.','Buổi sáng tôi tắm rồi mặc quần áo.'],[['die Dusche','[ˈdʊʃə]','shower','vòi sen'],['duschen','[ˈdʊʃn̩]','shower','tắm vòi sen'],['der Morgen','[ˈmɔʁɡn̩]','morning','buổi sáng']]],
['1.61',['Radio am Morgen','Radio in the morning','Nghe đài buổi sáng'],['Ein Radiogeräusch steht für eine Alltagssituation zu Hause. Überlege, zu welcher Tageszeit man Radio hört und welche Handlung dazu passt.','A radio sound represents a home routine. Consider when people listen and what activity may accompany it.','Âm thanh radio gợi một hoạt động ở nhà. Hãy nghĩ xem người ta thường nghe đài lúc nào và làm gì cùng lúc.'],['Nach „Radio hören“ steht das Nomen als Objekt: „Ich höre Radio.“ Das Verb hören wird nach dem Subjekt konjugiert.','In “Radio hören,” the noun is the object: “Ich höre Radio.” hören changes with the subject.','Trong cụm “Radio hören”, Radio là tân ngữ: “Ich höre Radio.” Động từ hören chia theo chủ ngữ.'],['Ich höre beim Frühstück Radio.','I listen to the radio at breakfast.','Tôi nghe radio trong lúc ăn sáng.'],[['das Radio','[ˈʁaːdi̯o]','radio','đài radio'],['hören','[ˈhøːʁən]','listen; hear','nghe'],['das Frühstück','[ˈfʁyːʃtʏk]','breakfast','bữa sáng']]],
['1.62',['Auf der Straße','On the street','Ngoài đường'],['Straßengeräusche bilden den Hintergrund für einen Weg zur Arbeit oder Schule. Höre auf Verkehr und Bewegung.','Street sounds set the scene for a trip to work or school. Listen for traffic and movement.','Âm thanh đường phố gợi cảnh đi làm hoặc đi học. Hãy chú ý tiếng xe cộ và sự di chuyển.'],['Orte mit „auf der Straße“ stehen im Dativ; „auf die Straße“ beschreibt dagegen eine Bewegung auf die Straße. Achte darauf, ob die Frage Wo? oder Wohin? passt.','auf der Straße is dative for a location; auf die Straße is accusative for movement onto it.','auf der Straße dùng Dativ để chỉ vị trí; auf die Straße dùng Akkusativ để chỉ hướng di chuyển ra đường.'],['Auf der Straße fahren viele Autos.','Many cars are driving on the street.','Ngoài đường có nhiều xe ô tô chạy.'],[['die Straße','[ˈʃtʁaːsə]','street','đường phố'],['das Auto','[ˈaʊ̯to]','car','ô tô'],['der Verkehr','[fɛɐ̯ˈkeːɐ̯]','traffic','giao thông']]],
['1.63',['Sich entschuldigen','Apologising','Xin lỗi'],['Eine Person stößt offenbar mit jemandem zusammen und entschuldigt sich. Die andere Person reagiert gelassen.','Someone seems to bump into another person and apologises; the other responds calmly.','Một người có vẻ va phải người khác và xin lỗi; người kia đáp lại nhẹ nhàng.'],['„Entschuldigung“ ist ein Nomen als kurze Entschuldigung. „Macht nichts“ bedeutet, dass es kein Problem ist. „Kann ja passieren“ tröstet: So etwas geschieht manchmal.','Entschuldigung is a short apology. Macht nichts means it is okay; kann ja passieren reassures that such things happen.','Entschuldigung là lời xin lỗi ngắn. Macht nichts nghĩa là không sao; kann ja passieren trấn an rằng chuyện đó đôi khi vẫn xảy ra.'],['Oh, Entschuldigung! – Macht nichts.','Oh, sorry! – No problem.','Ôi, xin lỗi nhé! – Không sao đâu.'],[['die Entschuldigung','[ɛntˈʃʊldɪɡʊŋ]','apology','lời xin lỗi'],['passieren','[paˈsiːʁən]','happen','xảy ra'],['nichts','[nɪçts]','nothing','không có gì']]],
['1.64',['In der Mensa','At the cafeteria','Ở căn-tin'],['Mensageräusche zeigen eine Mittagspause mit vielen Menschen. Erkenne die Umgebung, auch wenn das Geräusch keine vollständigen Sätze enthält.','Cafeteria sounds suggest a busy lunch break. Identify the setting even without complete spoken sentences.','Tiếng căn-tin gợi một giờ nghỉ trưa đông người. Hãy nhận ra bối cảnh dù không có câu nói trọn vẹn.'],['„in der Mensa“ beantwortet Wo? und steht deshalb im Dativ. Eine passende Alltagshandlung: „Wir essen in der Mensa zu Mittag.“','in der Mensa answers where and therefore uses dative. A natural sentence is “We eat lunch in the cafeteria.”','in der Mensa trả lời câu hỏi Wo? nên dùng Dativ. Có thể nói “Wir essen in der Mensa zu Mittag” (Chúng tôi ăn trưa ở căn-tin).'],['Wir essen heute in der Mensa.','We are eating in the cafeteria today.','Hôm nay chúng tôi ăn ở căn-tin.'],[['die Mensa','[ˈmɛnza]','cafeteria; canteen','căn-tin'],['das Mittagessen','[ˈmɪtaːkˌʔɛsn̩]','lunch','bữa trưa'],['essen','[ˈɛsn̩]','eat','ăn']]],
['1.65',['Bei der Oma zu Besuch','Visiting grandma','Đến thăm bà'],['Kaan lobt den Kuchen seiner Oma. Sie bedankt sich und fragt, wie es ihm geht.','Kaan praises his grandmother’s cake. She thanks him and asks how he is.','Kaan khen bánh của bà. Bà cảm ơn rồi hỏi thăm cậu.'],['„Der Kuchen ist lecker“ beschreibt den Kuchen mit sein + Adjektiv. „Wie es dir geht“ ist eine indirekte Frage; darum steht geht am Ende.','sein + adjective describes the cake. In the indirect question “wie es dir geht,” the verb goes to the end.','sein + tính từ dùng để miêu tả bánh. Trong câu hỏi gián tiếp „wie es dir geht“, động từ geht xuống cuối.'],['Der Kuchen ist lecker. Wie geht es dir?','The cake is delicious. How are you?','Bánh ngon quá. Bà khỏe không ạ?'],[['der Kuchen','[ˈkuːxn̩]','cake','bánh ngọt'],['die Oma','[ˈoːma]','grandma','bà'],['lecker','[ˈlɛkɐ]','delicious','ngon']]],
['1.66',['Eine neue Bekanntschaft in der Kaffeepause','Meeting someone during a coffee break','Làm quen trong giờ nghỉ cà phê'],['Zwei Personen treffen sich zufällig in einer Kaffeepause. Sie stellen sich vor und laden einander zum Sitzen ein.','Two people meet by chance during a coffee break, introduce themselves, and invite one another to sit.','Hai người tình cờ gặp trong giờ nghỉ cà phê, làm quen rồi mời nhau ngồi.'],['„Setz dich doch!“ ist ein informeller Imperativ mit dich, weil sich setzen reflexiv ist. „Bist du oft hier?“ stellt das Verb an den Anfang, weil es eine Ja/Nein-Frage ist.','Setz dich is an informal imperative with reflexive dich. A yes/no question such as Bist du oft hier? starts with the verb.','„Setz dich“ là mệnh lệnh thân mật có đại từ phản thân dich. Câu hỏi Có/Không như „Bist du oft hier?“ đưa động từ lên đầu.'],['Setz dich doch! Bist du oft hier?','Have a seat! Are you often here?','Ngồi xuống nhé! Bạn thường đến đây không?'],[['die Kaffeepause','[ˈkafəˌpaʊ̯zə]','coffee break','giờ nghỉ cà phê'],['der Zufall','[ˈtsuːfal]','coincidence','sự tình cờ'],['sich setzen','[zɪç ˈzɛtsn̩]','sit down','ngồi xuống']]],
['1.67',['Einen Termin für Sonntag finden','Finding a time to meet on Sunday','Tìm giờ hẹn vào Chủ nhật'],['Toby schlägt ein Treffen vor, doch Kaan hat schon mehrere Pläne. Die beiden verschieben das Treffen auf ein anderes Wochenende.','Toby suggests meeting, but Kaan already has plans. They move the meetup to another weekend.','Toby rủ gặp nhưng Kaan đã có nhiều kế hoạch. Hai người hẹn sang cuối tuần khác.'],['„Treffen wir uns?“ ist eine Frage mit trennbarem, reflexivem Verb. Zeitangaben wie am Sonntagmittag und um drei ordnen den Tag. „Dann“ verbindet den nächsten Schritt.','Treffen wir uns? uses a separable reflexive verb. Time phrases place events in the day; dann connects the next step.','„Treffen wir uns?“ dùng động từ tách phản thân. Cụm thời gian như am Sonntagmittag, um drei sắp xếp lịch; dann nối bước tiếp theo.'],['Am Sonntag esse ich mit meiner Familie. Danach treffe ich Freunde.','On Sunday I eat with my family. Afterwards I meet friends.','Chủ nhật tôi ăn cùng gia đình. Sau đó tôi gặp bạn bè.'],[['das Wochenende','[ˈvɔxn̩ˌʔɛndə]','weekend','cuối tuần'],['sich treffen','[zɪç ˈtʁɛfn̩]','meet','gặp nhau'],['der Nachmittag','[ˈnaːxˌmɪtaːk]','afternoon','buổi chiều']]],
['1.68',['Am Morgen aufstehen','Getting up in the morning','Thức dậy buổi sáng'],['Julian wird geweckt und fragt nach der Uhrzeit. Es ist halb sieben; er sagt, dass er gleich kommt.','Julian is woken up and asks the time. It is half past six, and he says he will come in a moment.','Julian được gọi dậy và hỏi giờ. Lúc đó là sáu giờ rưỡi; cậu nói sẽ ra ngay.'],['aufstehen ist trennbar: „Ich stehe auf.“ Im Imperativ steht das Präfix ebenfalls am Ende. halb sieben bedeutet 6:30, also eine halbe Stunde vor sieben.','aufstehen is separable: “Ich stehe auf.” The prefix also goes last in the imperative. halb sieben means 6:30.','aufstehen là động từ tách: „Ich stehe auf.“ Trong mệnh lệnh, tiền tố cũng xuống cuối. halb sieben là 6 giờ 30, tức nửa tiếng trước 7 giờ.'],['Ich stehe um halb sieben auf.','I get up at half past six.','Tôi thức dậy lúc sáu giờ rưỡi.'],[['aufstehen','[ˈaʊ̯fˌʃteːən]','get up','thức dậy'],['halb sieben','[halp ˈziːbn̩]','half past six','sáu giờ rưỡi'],['gleich','[ɡlaɪ̯ç]','in a moment','ngay bây giờ']]],
['1.69',['Die Uhrzeit vor einem Termin prüfen','Checking the time before an appointment','Kiểm tra giờ trước cuộc hẹn'],['Ein Termin mit dem Chef ist um halb vier. Die aktuelle Zeit ist fünf vor zwei, also gibt es noch genügend Zeit.','A meeting with the boss is at 3:30. It is currently ten to two, so there is enough time.','Cuộc hẹn với sếp lúc 3 giờ rưỡi. Hiện là 1 giờ 55 nên vẫn còn đủ thời gian.'],['„um halb vier“ nennt 3:30. „fünf vor zwei“ heißt 1:55. „Wir haben noch genug Zeit“ beruhigt; genug steht vor dem Nomen Zeit.','um halb vier is 3:30; fünf vor zwei is 1:55. genug Zeit means enough time.','um halb vier là 3:30; fünf vor zwei là 1:55. genug Zeit nghĩa là còn đủ thời gian.'],['Der Termin ist um halb vier. Jetzt ist es fünf vor zwei.','The appointment is at 3:30. It is now 1:55.','Cuộc hẹn lúc 3 giờ rưỡi. Bây giờ là 1 giờ 55.'],[['der Termin','[tɛɐ̯ˈmiːn]','appointment','cuộc hẹn'],['der Chef','[ʃɛf]','boss','sếp'],['genug','[ɡəˈnuːk]','enough','đủ']]],
['1.70',['Knapp vor Seminarbeginn','Just before a seminar starts','Sắp đến giờ bắt đầu hội thảo'],['Die Personen vergleichen die Startzeit des Seminars mit der aktuellen Zeit. Sie merken, dass es sehr knapp wird.','They compare the seminar start with the current time and realise they are nearly late.','Mọi người so giờ bắt đầu hội thảo với giờ hiện tại và nhận ra sắp muộn.'],['Viertel nach neun bedeutet 9:15; zehn nach neun ist 9:10. „Jetzt aber schnell!“ fordert dazu auf, sich zu beeilen.','Viertel nach neun is 9:15; zehn nach neun is 9:10. Jetzt aber schnell urges someone to hurry.','Viertel nach neun là 9:15; zehn nach neun là 9:10. Jetzt aber schnell giục mọi người nhanh lên.'],['Das Seminar beginnt um Viertel nach neun. Es ist schon zehn nach neun.','The seminar starts at 9:15. It is already 9:10.','Hội thảo bắt đầu lúc 9 giờ 15. Bây giờ đã 9 giờ 10.'],[['das Seminar','[zemiˈnaːɐ̯]','seminar','hội thảo'],['Viertel nach neun','[ˈfɪʁtl̩ naːx nɔʏ̯n]','quarter past nine','chín giờ mười lăm'],['schnell','[ʃnɛl]','quickly','nhanh']]],
['1.71',['Auf jemanden warten und pünktlich ankommen','Waiting for someone to arrive','Chờ ai đó đến'],['Moritz verspätet sich; der Film beginnt bald. Als die anderen über ihn sprechen, kommt er gerade an.','Moritz is late and the film is about to start. As the others discuss him, he arrives.','Moritz đến muộn trong khi phim sắp chiếu; đúng lúc mọi người nhắc tới thì cậu xuất hiện.'],['„Wo bleibt Moritz?“ fragt, warum jemand noch nicht da ist. In „wo er ist“ steht das Verb am Ende, weil es eine indirekte Frage ist.','Wo bleibt Moritz? asks why someone has not arrived. The verb goes last in the indirect question wo er ist.','„Wo bleibt Moritz?“ hỏi sao người đó chưa đến. Trong câu hỏi gián tiếp „wo er ist“, động từ xuống cuối.'],['Der Film beginnt in fünf Minuten. Wo bleibt Moritz?','The film starts in five minutes. Where is Moritz?','Năm phút nữa phim bắt đầu. Moritz đâu rồi?'],[['warten','[ˈvaʁtn̩]','wait','chờ'],['der Film','[fɪlm]','film','phim'],['verspätet','[fɛɐ̯ˈʃpɛːtət]','late','muộn']]],
['1.72',['Bahnhofsdurchsage verstehen','Understanding a station announcement','Hiểu thông báo ở nhà ga'],['Eine Durchsage nennt Anschlusszüge, Richtung, Abfahrtszeit und Gleis. Höre gezielt nach den Angaben, die man für den Umstieg braucht.','An announcement gives connecting trains, direction, departure time, and platform. Listen for the details needed to transfer.','Thông báo nêu chuyến nối, hướng đi, giờ khởi hành và sân ga. Hãy tập trung vào thông tin cần để chuyển tàu.'],['„um 13 Uhr 10“ nennt die Abfahrtszeit; „auf Gleis 3“ den Bahnsteig. nach München steht für die Richtung beziehungsweise das Ziel.','um 13 Uhr 10 gives the time; auf Gleis 3 gives the platform; nach München gives the destination.','um 13 Uhr 10 chỉ giờ; auf Gleis 3 chỉ sân ga; nach München nêu hướng đến.'],['Der Zug nach München fährt um 13:10 Uhr auf Gleis 3.','The train to Munich leaves at 1:10 p.m. from platform 3.','Tàu đi Munich khởi hành lúc 13:10 ở sân ga số 3.'],[['der Anschluss','[ˈanʃlʊs]','connection; transfer','chuyến nối'],['das Gleis','[ɡlaɪ̯s]','platform; track','sân ga'],['abfahren','[ˈapˌfaːʁən]','depart','khởi hành']]],
['1.73',['Eine Terminverschiebung am Telefon','A schedule change by phone','Báo đổi lịch hẹn qua điện thoại'],['Eine Arztpraxis teilt per Nachricht mit, dass ein Termin verlegt werden muss, und bittet um Rückruf.','A doctor’s office leaves a message saying an appointment must be moved and asks for a call back.','Phòng khám nhắn rằng phải dời lịch hẹn và đề nghị gọi lại.'],['müssen + Infinitiv zeigt eine Notwendigkeit: „Wir müssen verschieben.“ „Rufen Sie … an“ ist ein höflicher Imperativ; anrufen ist trennbar.','müssen + infinitive expresses necessity. Rufen Sie … an is a polite imperative with separable anrufen.','müssen + nguyên mẫu diễn tả việc cần làm. Rufen Sie … an là mệnh lệnh lịch sự; anrufen là động từ tách.'],['Wir müssen Ihren Termin verschieben. Bitte rufen Sie zurück.','We have to reschedule your appointment. Please call back.','Chúng tôi phải dời lịch hẹn của anh/chị. Vui lòng gọi lại.'],[['die Praxis','[ˈpʁaksɪs]','medical practice','phòng khám'],['verschieben','[fɛɐ̯ˈʃiːbn̩]','reschedule; postpone','dời lịch'],['zurückrufen','[tsuˈʁʏkˌʁuːfn̩]','call back','gọi lại']]],
['1.74',['Einen Abendkurs zeitlich planen','Scheduling an evening course','Sắp xếp giờ học buổi tối'],['Eine Person erfährt von einem Abendkurs und fragt nach den Wochentagen sowie der Dauer.','Someone learns about an evening course and asks which days it meets and how long it lasts.','Một người nghe giới thiệu lớp buổi tối rồi hỏi ngày học và thời lượng.'],['„Wann ist der?“ verwendet der, weil Kurs maskulin ist. „Wie lange dauert …?“ fragt nach der Dauer; dauern steht im Singular zum Kurs.','der refers back to masculine Kurs. Wie lange dauert …? asks about duration.','der thay cho danh từ giống đực Kurs. Wie lange dauert …? hỏi lớp kéo dài bao lâu.'],['Der Kurs ist dienstags und donnerstags. Wie lange dauert er?','The course is on Tuesdays and Thursdays. How long does it last?','Lớp học vào thứ Ba và thứ Năm. Lớp kéo dài bao lâu?'],[['der Abendkurs','[ˈaːbn̩tˌkʊʁs]','evening course','lớp học buổi tối'],['der Anfänger','[ˈanfɛŋɐ]','beginner','người mới học'],['dauern','[ˈdaʊ̯ɐn]','last; take time','kéo dài']]],
['1.75',['Ein Abendprogramm auswählen','Choosing an evening programme','Chọn chương trình buổi tối'],['Zwei Personen überlegen, was im Fernsehen läuft. Sie finden einen Krimi passend und entscheiden, ihn anzusehen.','Two people check what is on TV, choose a crime series, and decide to watch it.','Hai người xem tối nay có gì trên TV, chọn phim hình sự và quyết định xem.'],['„Was gibt es im Fernsehen?“ fragt nach dem Programm. „Den können wir uns ansehen“ nutzt können + Infinitiv; uns gehört zum reflexiven sich etwas ansehen.','The question asks what is on TV. können + infinitive expresses possibility; uns belongs to sich etwas ansehen.','Câu hỏi hỏi chương trình TV. können + nguyên mẫu diễn tả có thể; uns thuộc cụm phản thân sich etwas ansehen (xem).'],['Den Krimi können wir uns ansehen.','We can watch the crime series.','Chúng ta có thể xem phim hình sự đó.'],[['das Fernsehen','[ˈfɛɐ̯nˌzeːən]','television','truyền hình'],['der Krimi','[ˈkʁiːmi]','crime series','phim hình sự'],['sich ansehen','[zɪç ˈanˌzeːən]','watch','xem']]],
['1.76',['Die nächste Busverbindung finden','Finding the next bus','Tìm chuyến xe buýt kế tiếp'],['Eine Person fragt nach der Abfahrtszeit. Der nächste Bus kommt in zehn Minuten, daher besteht noch kein Zeitdruck.','Someone asks when the bus leaves. It is in ten minutes, so there is no rush.','Một người hỏi giờ xe chạy; chuyến kế tiếp còn mười phút nữa nên chưa cần vội.'],['„Wann fährt der Bus?“ ist eine W-Frage. „in zehn Minuten“ bedeutet, dass zehn Minuten ab jetzt vergehen. „noch Zeit haben“ sagt, dass man nicht sofort losmuss.','The W-question asks when the bus departs. in zehn Minuten means ten minutes from now; noch Zeit haben means there is time left.','„Wann fährt der Bus?“ là câu hỏi W. „in zehn Minuten“ nghĩa là sau mười phút nữa; „noch Zeit haben“ nói vẫn còn thời gian.'],['Der nächste Bus fährt in zehn Minuten.','The next bus leaves in ten minutes.','Mười phút nữa chuyến xe buýt kế tiếp chạy.'],[['der Bus','[bʊs]','bus','xe buýt'],['die Verbindung','[fɛɐ̯ˈbɪndʊŋ]','connection','chuyến nối'],['die Minute','[miˈnuːtə]','minute','phút']]],
