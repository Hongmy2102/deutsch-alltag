['1.77',['Eine Nachricht an die Musikschule hinterlassen','Leaving a message for the music school','Để lại lời nhắn cho trường nhạc'],['Eine Mutter sagt mehrere Unterrichtstermine ab, erklärt Krankheit und ein Schulprojekt und bittet darum, die Lehrkräfte zu informieren.','A mother cancels lessons, explains illness and a school project, and asks the teachers to be informed.','Một người mẹ báo các con nghỉ học nhạc vì ốm và bận dự án ở trường, rồi nhờ báo lại giáo viên.'],['können + nicht bedeutet, dass etwas nicht möglich ist. „Können Sie bitte … informieren?“ ist eine höfliche Bitte; informieren bleibt am Satzende im Infinitiv.','können + nicht expresses inability or impossibility. The polite request places informieren at the end.','können + nicht nói việc không thể làm. Câu nhờ lịch sự đưa informieren ở nguyên mẫu xuống cuối.'],['Meine Tochter ist krank. Können Sie bitte die Lehrer informieren?','My daughter is ill. Could you please inform the teachers?','Con gái tôi bị ốm. Anh/chị vui lòng báo cho các giáo viên giúp tôi nhé?'],[['die Musikschule','[muˈziːkˌʃuːlə]','music school','trường nhạc'],['die Tochter','[ˈtɔxtɐ]','daughter','con gái'],['krank','[kʁaŋk]','ill','ốm'],['informieren','[ɪnfɔʁˈmiːʁən]','inform','thông báo']]],
['1.78',['Familienwörter und Alltagslaute erkennen','Recognising family words and everyday sounds','Nhận biết từ gia đình và âm thanh đời thường'],['Die Wortreihe mischt Verben, Familienmitglieder, Orte und Dinge. Höre die Wörter als einzelne Einheiten und achte auf ihren Anfangslaut.','The list mixes verbs, relatives, places, and objects. Hear each as a separate word and notice its initial sound.','Danh sách trộn động từ, người thân, địa điểm và đồ vật. Hãy nhận diện từng từ và chú ý âm đầu.'],['Die Aufgabe trainiert Hören und Wortschatz. Bei zusammengesetzten Wörtern wie Musikunterricht liegt die Hauptbetonung meist auf dem ersten Wortteil.','This task practises listening and vocabulary. In compounds, the main stress is usually on the first element.','Bài luyện nghe và từ vựng. Với từ ghép như Musikunterricht, trọng âm chính thường nằm ở thành tố đầu.'],['Meine Schwester hört im Büro Musik.','My sister listens to music at the office.','Chị/em gái tôi nghe nhạc ở văn phòng.'],[['die Schwester','[ˈʃvɛstɐ]','sister','chị/em gái'],['der Vater','[ˈfaːtɐ]','father','cha; bố'],['das Büro','[byˈʁoː]','office','văn phòng'],['die Trompete','[tʁɔmˈpeːtə]','trumpet','kèn trumpet']]],
['1.79',['Einen Kinobesuch verabreden','Arranging a cinema visit','Hẹn đi xem phim'],['Eine Person ist morgen beschäftigt, aber am Dienstag frei. Die beiden schlagen Kino vor und vereinbaren die Uhrzeit.','One person is busy tomorrow but free Tuesday. They suggest the cinema and agree on a time.','Một người bận ngày mai nhưng rảnh thứ Ba; hai người hẹn xem phim và chốt giờ.'],['müssen + Infinitiv nennt eine Pflicht: „Ich muss arbeiten.“ können + Infinitiv macht einen Vorschlag möglich. „Das geht“ bedeutet hier: Der Termin passt.','müssen + infinitive expresses an obligation. können + infinitive makes a suggestion; Das geht means the time works.','müssen + nguyên mẫu nói việc phải làm. können + nguyên mẫu đưa ra đề nghị; Das geht nghĩa là giờ đó được.'],['Am Dienstag können wir ins Kino gehen.','We can go to the cinema on Tuesday.','Thứ Ba chúng ta có thể đi xem phim.'],[['das Kino','[ˈkiːno]','cinema','rạp chiếu phim'],['der Dienstag','[ˈdiːnstaːk]','Tuesday','thứ Ba'],['müssen','[ˈmʏsn̩]','must; have to','phải'],['können','[ˈkœnən]','can; be able to','có thể']]],
['1.80',['Einen Arzttermin vereinbaren','Making a doctor’s appointment','Đặt lịch khám'],['Eine Patientin möchte einen Termin. Sie kann Freitag und Montag nicht, einigt sich aber mit der Praxis auf Mittwoch.','A patient needs an appointment, cannot come Friday or Monday, and agrees on Wednesday.','Bệnh nhân cần lịch khám, không đến được thứ Sáu hay thứ Hai nhưng thống nhất được vào thứ Tư.'],['„Ich hätte gern …“ ist höflicher als „Ich will …“. „Geht es am Mittwoch?“ fragt, ob der Vorschlag passt. Die Uhrzeit steht mit um: um 11:30 Uhr.','Ich hätte gern is more polite than Ich will. Geht es am Mittwoch? checks availability. Times use um.','„Ich hätte gern …“ lịch sự hơn „Ich will …“. „Geht es am Mittwoch?“ hỏi giờ đó có được không. Nói giờ dùng um.'],['Ich hätte gern einen Termin am Mittwoch um halb zwölf.','I would like an appointment on Wednesday at 11:30.','Tôi muốn đặt lịch vào thứ Tư lúc 11 giờ rưỡi.'],[['der Arzttermin','[ˈaːɐ̯tstˌtɛɐ̯miːn]','doctor’s appointment','lịch khám'],['die Praxis','[ˈpʁaksɪs]','medical practice','phòng khám'],['frei','[fʁaɪ̯]','available; free','còn trống; rảnh'],['hätte gern','[ˈhɛtə ɡɛʁn]','would like','muốn (lịch sự)']]],
['1.81',['Höflich um einen Termin bitten','Politely asking for an appointment','Lịch sự xin một cuộc hẹn'],['Vier Formulierungen reichen von direkt bis besonders höflich. Vergleiche, wie Ich will, Kann ich, Ich möchte und Ich hätte gern wirken.','Four phrases range from direct to especially polite. Compare the tone of each request.','Bốn cách nói đi từ trực tiếp đến lịch sự hơn. Hãy so sánh sắc thái của từng câu xin lịch.'],['„Ich will“ klingt sehr direkt. „Kann ich bitte … haben?“ ist höflicher; „Ich möchte …“ und besonders „Ich hätte gern …“ klingen freundlich und passend im Servicekontakt.','Ich will sounds direct. Kann ich bitte … haben? is softer; Ich möchte and Ich hätte gern are polite choices for service situations.','„Ich will“ khá trực tiếp. „Kann ich bitte … haben?“ mềm hơn; „Ich möchte“ và nhất là „Ich hätte gern“ phù hợp khi giao tiếp dịch vụ.'],['Ich hätte gern einen Termin, bitte.','I would like an appointment, please.','Làm ơn cho tôi xin một lịch hẹn.'],[['der Termin','[tɛɐ̯ˈmiːn]','appointment','lịch hẹn'],['höflich','[ˈhøːflɪç]','polite','lịch sự'],['wollen','[ˈvɔlən]','want','muốn'],['möchten','[ˈmœçtn̩]','would like','muốn (lịch sự)']]],
['1.82',['Zu spät zum Arzttermin kommen','Arriving late for a doctor’s appointment','Đến muộn lịch khám'],['Ein Patient kommt fünf Minuten nach dem Termin an und entschuldigt sich. Die Mitarbeiterin beruhigt ihn und bittet ihn ins Wartezimmer.','A patient arrives five minutes late, apologises, and is asked to wait.','Bệnh nhân đến muộn năm phút và xin lỗi; nhân viên bảo ông vào phòng chờ.'],['„Der Termin war um 10:45“ steht im Präteritum von sein, weil die Zeit vergangen ist. „Gehen Sie bitte …“ ist eine höfliche Aufforderung mit Sie-Imperativ.','war is past tense because the appointment time has passed. Gehen Sie bitte is a polite Sie imperative.','war là quá khứ của sein vì giờ hẹn đã qua. „Gehen Sie bitte …“ là lời hướng dẫn lịch sự dạng mệnh lệnh Sie.'],['Entschuldigen Sie die Verspätung. Gehen Sie bitte ins Wartezimmer.','I’m sorry I’m late. Please go to the waiting room.','Xin lỗi vì tôi đến muộn. Mời ông vào phòng chờ.'],[['die Verspätung','[fɛɐ̯ˈʃpɛːtʊŋ]','delay; lateness','sự chậm trễ'],['das Wartezimmer','[ˈvaʁtəˌtsɪmɐ]','waiting room','phòng chờ'],['warten','[ˈvaʁtn̩]','wait','chờ']]],
['1.83',['Zu spät zu einer Verabredung kommen','Arriving late to a get-together','Đến muộn buổi hẹn bạn bè'],['Freunde begrüßen einander; eine Person entschuldigt sich für 15 Minuten Verspätung. Die anderen bleiben gelassen und stoßen auf Pia an.','Friends greet one another; someone apologises for being 15 minutes late. The others are relaxed and make a toast.','Bạn bè chào nhau; một người xin lỗi vì trễ 15 phút. Mọi người thông cảm rồi nâng ly chúc Pia.'],['„Es tut mir leid“ entschuldigt sich; mir ist Dativ. „Wartet ihr schon lange?“ fragt im Plural. Zum Wohl ist ein fester Toast.','Es tut mir leid is an apology with dative mir. Wartet ihr? addresses several people. Zum Wohl is a fixed toast.','„Es tut mir leid“ là lời xin lỗi, mir ở Dativ. „Wartet ihr?“ hỏi nhiều người. Zum Wohl là câu chúc khi nâng ly.'],['Es tut mir leid, ich bin 15 Minuten zu spät.','I’m sorry, I’m 15 minutes late.','Mình xin lỗi, mình đến muộn 15 phút.'],[['leidtun','[ˈlaɪ̯tˌtuːn]','be sorry','lấy làm tiếc'],['zu spät','[tsuː ʃpɛːt]','late','muộn'],['anstoßen','[ˈanˌʃtoːsn̩]','make a toast','nâng ly']] ],
['1.84',['Ein Treffen wegen des Busses verspätet beginnen','Starting a meeting late because of the bus','Bắt đầu cuộc hẹn muộn vì xe buýt'],['Frau Moser fehlt zunächst. Die Gruppe beginnt ohne sie; als sie ankommt, erklärt sie den Bus und die anderen warten schon zehn Minuten.','Frau Moser is missing at first. The group starts without her; she arrives explaining the bus, after a ten-minute wait.','Ban đầu bà Moser chưa đến nên mọi người bắt đầu trước. Bà tới và giải thích do xe buýt; cả nhóm đã chờ mười phút.'],['„ohne Frau Moser“ steht mit Akkusativ. „Jetzt können wir endlich beginnen“ verwendet können + Infinitiv; endlich zeigt, dass das Warten vorbei ist.','ohne takes accusative. können + infinitive expresses possibility; endlich marks relief that the wait is over.','ohne đi với Akkusativ. können + nguyên mẫu nói có thể bắt đầu; endlich cho thấy cuối cùng việc chờ đã kết thúc.'],['Wir beginnen ohne Frau Moser. Jetzt können wir endlich anfangen.','We’ll start without Frau Moser. Now we can finally begin.','Chúng ta bắt đầu khi chưa có bà Moser. Cuối cùng cũng có thể bắt đầu rồi.'],[['der Bus','[bʊs]','bus','xe buýt'],['ohne','[ˈoːnə]','without','không có'],['endlich','[ˈɛntlɪç]','finally','cuối cùng'],['beginnen','[bəˈɡɪnən]','begin','bắt đầu']]],
['1.85',['Auf einen verspäteten Gast warten','Waiting for a late guest','Chờ một vị khách đến muộn'],['Das Essen ist fertig und die Gäste haben Hunger. Leo kommt eine halbe Stunde zu spät, entschuldigt sich und wird hereingebeten.','Dinner is ready and the guests are hungry. Leo arrives half an hour late, apologises, and is welcomed in.','Đồ ăn đã sẵn sàng, mọi người đói. Leo đến muộn nửa tiếng, xin lỗi và được mời vào nhà.'],['„Das Essen ist fertig“ beschreibt einen Zustand. „Ich bin eine halbe Stunde zu spät“ nennt die Verspätungsdauer. „Komm rein!“ ist ein informeller Imperativ von hereinkommen.','fertig describes a state. eine halbe Stunde names the delay. Komm rein is an informal imperative of hereinkommen.','fertig mô tả trạng thái đã xong. eine halbe Stunde nêu thời gian trễ. „Komm rein!“ là mệnh lệnh thân mật từ hereinkommen.'],['Das Essen ist fertig. Komm rein!','Dinner is ready. Come in!','Đồ ăn sẵn rồi. Vào đi!'],[['das Essen','[ˈɛsn̩]','meal; food','đồ ăn; bữa ăn'],['der Hunger','[ˈhʊŋɐ]','hunger','cơn đói'],['hereinkommen','[hɛˈʁaɪ̯nˌkɔmən]','come in','đi vào'],['die halbe Stunde','[ˈhalbə ˈʃtʊndə]','half an hour','nửa tiếng']]],
['1.86',['Winterangebote für Ski und Snowboard','Winter offers for skiing and snowboarding','Ưu đãi mùa đông cho trượt tuyết'],['Eine Anzeige kündigt den Saisonstart an und lädt dazu ein, Ski und Snowboards kostenlos zu testen.','An advert announces the season opening and free ski and snowboard trials.','Quảng cáo thông báo mùa tuyết bắt đầu và mời khách dùng thử ván trượt miễn phí.'],['„Es gibt“ führt etwas Neues ein. „zum Testen“ besteht aus zu + nominalisiertem Infinitiv und nennt den Zweck.','Es gibt introduces something; zum Testen names the purpose using a nominalised infinitive.','„Es gibt“ giới thiệu thứ đang có. „zum Testen“ nêu mục đích dùng thử.'],['Es gibt Ski und Snowboards zum Testen.','There are skis and snowboards to try.','Có ván trượt tuyết để dùng thử.'],[['der Ski','[ʃiː]','ski','ván trượt tuyết'],['das Snowboard','[ˈsnoːbɔːɐ̯t]','snowboard','ván trượt tuyết'],['gratis','[ˈɡʁaːtɪs]','free','miễn phí']]],
['1.87',['Ein Brettspiel fast gewinnen','Almost winning a board game','Suýt thắng một trò chơi bàn'],['Beim Würfelspiel braucht eine Person eine bestimmte Zahl, hat aber Pech. Kurz vor dem Ziel muss sie die Runde verlassen.','In a dice game, one player needs a number but has bad luck and must leave just before the finish.','Trong trò chơi xúc xắc, một người cần đúng số nhưng không may, phải ra ngoài ngay trước đích.'],['„Ich brauche eine Vier“ nutzt brauchen + Akkusativ. „Ich habe nie Glück“ verneint mit nie. muss … raus ist umgangssprachlich verkürzt für muss rausgehen.','brauchen takes an accusative object. nie means never; muss raus shortens muss rausgehen.','brauchen nhận tân ngữ Akkusativ. nie nghĩa là không bao giờ; muss raus rút gọn của muss rausgehen.'],['Ich brauche eine Vier, aber ich habe kein Glück.','I need a four, but I have no luck.','Tôi cần số bốn nhưng không may mắn.'],[['das Brettspiel','[ˈbʁɛtˌʃpiːl]','board game','trò chơi bàn'],['der Würfel','[ˈvʏʁfl̩]','dice','xúc xắc'],['das Ziel','[tsiːl]','finish; goal','đích'],['das Glück','[ɡlʏk]','luck','may mắn']]],
['1.88',['Ein Café für die Pause empfehlen','Recommending a café for a break','Giới thiệu quán cà phê để nghỉ'],['Eine Anzeige empfiehlt ein Café als Treffpunkt für Pausen, Freunde und Kaffee und hebt hausgemachten Kuchen hervor.','An advert recommends a café for breaks, friends, and coffee, highlighting homemade cake.','Quảng cáo giới thiệu quán cà phê làm nơi nghỉ, gặp bạn và uống cà phê, đặc biệt có bánh tự làm.'],['„der richtige Ort für …“ bewertet den Ort. „Wir backen unsere Kuchen selbst“ betont selbst als „eigenhändig“. „bekommen Sie“ ist höfliche Ansprache.','der richtige Ort für evaluates the place. selbst emphasises homemade; Sie addresses customers politely.','„der richtige Ort für …“ đánh giá địa điểm. selbst nhấn mạnh tự làm. Sie là cách xưng hô lịch sự với khách.'],['Das Café ist der richtige Ort für eine Pause.','The café is the right place for a break.','Quán cà phê là nơi thích hợp để nghỉ ngơi.'],[['das Café','[kaˈfeː]','café','quán cà phê'],['die Qualität','[kvaliˈtɛːt]','quality','chất lượng'],['backen','[ˈbakn̩]','bake','nướng bánh'],['selbst','[zɛlpst]','oneself; homemade','tự mình; tự làm']]],
['1.89',['Zu Hause einen Filmabend vereinbaren','Arranging a movie night at home','Hẹn xem phim ở nhà'],['Eine Person fragt nach Plänen und schlägt einen Film vor. Die andere sagt zu, fragt nach dem Film und bietet an, etwas mitzubringen.','One person asks about plans and suggests a film. The other agrees, asks which film, and offers to bring something.','Một người hỏi kế hoạch rồi rủ xem phim; người kia đồng ý, hỏi xem phim gì và đề nghị mang đồ theo.'],['„Hast du schon was vor?“ fragt nach bestehenden Plänen. Lust haben fragt freundlich nach Interesse. „Kann ich etwas mitbringen?“ nutzt können + Infinitiv.','Hast du schon was vor? asks about plans. Lust haben asks about interest; können + infinitive makes an offer.','„Hast du schon was vor?“ hỏi đã có kế hoạch chưa. Lust haben hỏi có muốn không; können + nguyên mẫu dùng để đề nghị giúp.'],['Hast du Lust, einen Film zu sehen? Kann ich etwas mitbringen?','Would you like to watch a film? Can I bring something?','Bạn có muốn xem phim không? Mình mang gì theo nhé?'],[['der Filmabend','[ˈfɪlmˌaːbn̩t]','movie night','buổi tối xem phim'],['Lust haben','[lʊst ˈhaːbn̩]','feel like; want to','muốn; có hứng'],['mitbringen','[ˈmɪtˌbʁɪŋən]','bring along','mang theo']]],
['1.90',['Geburtstage und Zwillinge','Birthdays and twins','Sinh nhật và cặp song sinh'],['Freunde vergleichen Geburtstage. Zwei Schwestern sind Zwillinge und haben nur zwei Tage Abstand; eine Person hat am Schalttag Geburtstag.','Friends compare birthdays. Twin sisters are two days apart; another person was born on leap day.','Bạn bè so ngày sinh. Hai chị em sinh đôi cách nhau hai ngày; một người sinh vào ngày nhuận.'],['Geburtstag haben + am nennt das Datum. „zwei Tage nach mir“ vergleicht Termine. nämlich erklärt einen Grund; alle vier Jahre beschreibt die Wiederholung des Schalttags.','am gives the date; nach mir compares dates. nämlich explains a reason; alle vier Jahre describes the leap-day cycle.','am nêu ngày sinh; nach mir so sánh ngày. nämlich giải thích nguyên nhân; alle vier Jahre nói chu kỳ bốn năm.'],['Ich habe am 24. September Geburtstag.','My birthday is on 24 September.','Tôi sinh ngày 24 tháng 9.'],[['der Geburtstag','[ɡəˈbuːɐ̯tstaːk]','birthday','sinh nhật'],['der Zwilling','[ˈtsvɪlɪŋ]','twin','người sinh đôi'],['der Schalttag','[ˈʃaltˌtaːk]','leap day','ngày nhuận'],['feiern','[ˈfaɪ̯ɐn]','celebrate','ăn mừng']]],
['1.91',['Geburtstage nach Monaten unterscheiden','Distinguishing birthdays by month','Phân biệt sinh nhật theo tháng'],['Die Übung nennt ähnliche Nachnamen und ordnet jeder Person einen Geburtstagsmonat zu. Höre genau auf die Vokale in den Namen.','The exercise pairs similar surnames with birthday months. Listen carefully to the vowels in the names.','Bài tập ghép họ gần giống nhau với tháng sinh. Hãy nghe kỹ nguyên âm trong từng họ.'],['Im Satz „Herr Rauter hat im April Geburtstag“ steht haben im Präsens; im April nennt den Monat. Ähnliche Namen unterscheidet man über den Laut, nicht nur über die Schreibweise.','haben is present tense; im April names the month. Distinguish similar names by sound, not spelling alone.','haben chia hiện tại; im April nêu tháng. Cần phân biệt họ gần giống bằng âm nghe, không chỉ nhìn chữ viết.'],['Frau Beimer feiert im Mai Geburtstag.','Ms Beimer celebrates her birthday in May.','Bà Beimer tổ chức sinh nhật vào tháng Năm.'],[['der April','[aˈpʁɪl]','April','tháng Tư'],['der August','[aʊ̯ˈɡʊst]','August','tháng Tám'],['der Geburtstag','[ɡəˈbuːɐ̯tstaːk]','birthday','sinh nhật']]],
['1.92',['Geburtstage in einer Freundesgruppe','Birthdays in a group of friends','Sinh nhật trong nhóm bạn'],['Eine Person erzählt, wer im Mai Geburtstag hat und wann Freunde gemeinsam feiern.','A speaker says who has a May birthday and when friends celebrate together.','Một người kể ai sinh tháng Năm và khi nào bạn bè tổ chức cùng nhau.'],['„Klaus und Leela feiern“ hat ein zusammengesetztes Subjekt und deshalb das Verb im Plural. „am 9. Mai“ nennt den konkreten Tag.','Klaus und Leela is a plural subject, so feiern is plural. am 9. Mai gives the date.','Klaus und Leela là chủ ngữ số nhiều nên dùng feiern. am 9. Mai nêu ngày cụ thể.'],['Klaus und Leela feiern zusammen am 9. Mai.','Klaus and Leela celebrate together on 9 May.','Klaus và Leela tổ chức sinh nhật chung vào ngày 9 tháng 5.'],[['der Mai','[maɪ̯]','May','tháng Năm'],['zusammen','[tsuˈzamən]','together','cùng nhau'],['feiern','[ˈfaɪ̯ɐn]','celebrate','ăn mừng']]],
['1.93',['Im Restaurant bestellen und einladen','Ordering and treating someone at a restaurant','Gọi món và mời bạn ở nhà hàng'],['Zwei Gäste bestellen Getränke und Essen. Eine Person lädt die Freundin ein und bittet zusätzlich um Wasser für den Hund.','Two diners order drinks and food. One treats a friend and asks for water for the dog.','Hai khách gọi đồ uống và thức ăn. Một người mời bạn, đồng thời xin nước cho chó.'],['„Ich lade dich ein“ nutzt einladen als trennbares Verb; dich ist das Objekt. „für den Hund“ steht im Akkusativ und nennt, für wen das Wasser gedacht ist.','einladen is separable and dich is its object. für den Hund is accusative and names who the water is for.','einladen là động từ tách, dich là tân ngữ. für den Hund dùng Akkusativ, chỉ nước dành cho ai.'],['Ich lade dich ein. Können Sie Wasser für den Hund bringen?','It’s my treat. Could you bring water for the dog?','Mình mời bạn nhé. Anh/chị mang nước cho chó được không?'],[['die Speisekarte','[ˈʃpaɪ̯zəˌkaʁtə]','menu','thực đơn'],['einladen','[ˈaɪ̯nˌlaːdn̩]','invite; treat','mời; đãi'],['der Hund','[hʊnt]','dog','chó'],['die Apfelsaftschorle','[ˈapfl̩zaftˌʃɔʁlə]','apple juice spritzer','nước táo pha soda']]],
['1.94',['Eine Restaurantbestellung verstehen','Understanding a restaurant order','Hiểu một lượt gọi món ở nhà hàng'],['Die Bestellung wird noch einmal als Hörübung wiederholt: Getränke, Salat mit Käse, Pizza mit Gemüse und Wasser für den Hund.','The order is repeated as listening practice: drinks, salad with cheese, vegetable pizza, and water for the dog.','Lượt gọi món được nghe lại: đồ uống, salad phô mai, pizza rau củ và nước cho chó.'],['„Für mich bitte …“ ist eine höfliche Bestellformel. „mit Käse“ und „mit Gemüse“ beschreiben die Zutaten mit mit + Dativ.','Für mich bitte is a polite ordering formula. mit Käse and mit Gemüse name ingredients with dative.','„Für mich bitte …“ là mẫu gọi món lịch sự. mit Käse và mit Gemüse nêu thành phần với Dativ.'],['Für mich bitte einen Salat mit Käse.','A salad with cheese for me, please.','Cho tôi một phần salad phô mai.'],[['der Salat','[zaˈlaːt]','salad','salad'],['das Gemüse','[ɡəˈmyːzə]','vegetables','rau củ'],['mit','[mɪt]','with','với'],['bestellen','[bəˈʃtɛlən]','order','gọi món']]],
['1.95',['Die Rechnung gemeinsam bezahlen','Paying the bill together','Thanh toán chung hóa đơn'],['Die Gäste bitten um die Rechnung. Sie teilen nicht getrennt, sondern bezahlen zusammen; das Geld reicht genau.','The diners ask for the bill and pay together rather than separately, leaving the exact amount.','Khách xin tính tiền, chọn trả chung thay vì tách riêng và đưa vừa đủ.'],['„Können wir bitte zahlen?“ ist eine höfliche Bitte mit können. Zusammen oder getrennt fragt nach der Zahlungsweise. „Stimmt so“ bedeutet, dass kein Wechselgeld nötig ist.','Können wir bitte zahlen? is a polite request. The server asks together or separately; Stimmt so means keep the change.','„Können wir bitte zahlen?“ là lời nhờ lịch sự. Nhân viên hỏi trả chung hay riêng; „Stimmt so“ nghĩa là khỏi thối tiền.'],['Zusammen, bitte. Stimmt so.','Together, please. Keep the change.','Tính chung nhé. Khỏi thối tiền.'],[['die Rechnung','[ˈʁɛçnʊŋ]','bill','hóa đơn'],['getrennt','[ɡəˈtʁɛnt]','separately','riêng'],['zahlen','[ˈtsaːlən]','pay','thanh toán'],['das Trinkgeld','[ˈtʁɪŋkˌɡɛlt]','tip','tiền boa']]],
['1.96',['Trinkgeld passend geben','Giving an appropriate tip','Đưa tiền boa phù hợp'],['Eine Übung vergleicht zwei Rechnungsbeträge mit dem gezahlten Betrag. Die Gäste sagen, wie viel die Bedienung behalten soll.','The exercise compares bill totals with the amount paid and shows how guests tell the server to keep the tip.','Bài tập so sánh hóa đơn với số tiền đưa; khách nói số tiền nhân viên có thể giữ lại.'],['„Stimmt so“ bedeutet, dass das Rückgeld als Trinkgeld bleibt. „Machen Sie 19 Euro“ nennt direkt den gewünschten Zahlbetrag.','Stimmt so means the change is left as a tip. Machen Sie 19 Euro states the total to charge.','„Stimmt so“ nghĩa là để lại tiền thừa làm tiền boa. „Machen Sie 19 Euro“ nêu thẳng số tiền cần tính.'],['Das macht 18 Euro 90. – Machen Sie 19 Euro, bitte.','That is €18.90. – Make it €19, please.','Tổng cộng 18 euro 90. – Tính 19 euro nhé.'],[['das Trinkgeld','[ˈtʁɪŋkˌɡɛlt]','tip','tiền boa'],['das Rückgeld','[ˈʁʏkˌɡɛlt]','change','tiền thừa'],['machen','[ˈmaxn̩]','make; charge','tính; làm']]],
['1.97',['Von einem Restaurantbesuch erzählen','Talking about a restaurant visit','Kể về một lần đi nhà hàng'],['Caro fragt nach dem Abendessen. Die Freunde erzählen, dass das Essen mittelmäßig, aber günstig war und dass der Hund im teuren Restaurant nicht erlaubt gewesen wäre.','Caro asks about dinner. The friends say the food was average but cheap, and the dog was not allowed at the expensive restaurant.','Caro hỏi bữa tối. Hai người kể đồ ăn bình thường nhưng rẻ, còn nhà hàng đắt tiền không cho mang chó vào.'],['war ist Präteritum von sein und hattet/hattet ihr sind Vergangenheitsformen von haben. „nicht so gut, aber billig“ stellt einen Gegensatz her. „Hunde sind verboten“ beschreibt eine Regel.','war is the past of sein; hattet is the past of haben. aber contrasts the food quality and price; verboten states a rule.','war là quá khứ của sein, hattet là quá khứ của haben. aber đối lập chất lượng với giá; verboten nêu quy định cấm.'],['Das Essen war nicht so gut, aber es war billig.','The food was not very good, but it was cheap.','Đồ ăn không ngon lắm nhưng giá rẻ.'],[['das Restaurant','[ʁɛstoˈʁãː]','restaurant','nhà hàng'],['verboten','[fɛɐ̯ˈboːtn̩]','forbidden','bị cấm'],['der Kellner','[ˈkɛlnɐ]','waiter','nhân viên phục vụ nam'],['der Spaß','[ʃpaːs]','fun','niềm vui']]],
['1.98',['Veranstaltungstipps für August und September','Event tips for August and September','Gợi ý sự kiện tháng Tám và tháng Chín'],['Ein Radiobeitrag kündigt Sport-, Kino-, Kultur- und Musikveranstaltungen in Deutschland, Österreich und der Schweiz mit Datum, Uhrzeit und Ticketpreis an.','A radio segment lists sports, cinema, cultural, and music events across Germany, Austria, and Switzerland with dates, times, and prices.','Bản tin giới thiệu sự kiện thể thao, phim, văn hóa và âm nhạc ở Đức, Áo, Thụy Sĩ kèm ngày, giờ và giá vé.'],['„Zuerst“ und „zum Schluss“ ordnen Informationen. „Sie können sich anmelden“ nutzt können + reflexives sich anmelden. „von 19 Uhr bis 3 Uhr“ nennt eine Zeitspanne; für Preise steht ab 49 Euro.','zuerst and zum Schluss organise information. können + sich anmelden expresses registration; von … bis gives a time span; ab gives a starting price.','zuerst và zum Schluss sắp xếp thông tin. können + sich anmelden nói có thể đăng ký; von … bis nêu khoảng giờ; ab chỉ giá bắt đầu từ.'],['Das Kino beginnt um 21 Uhr. Tickets gibt es ab zwölf Franken.','The film starts at 9 p.m. Tickets start at twelve francs.','Phim bắt đầu lúc 21 giờ. Vé có giá từ 12 franc.'],[['die Veranstaltung','[fɛɐ̯ˈʔanʃtaltʊŋ]','event','sự kiện'],['die Anmeldung','[ˈanˌmɛldʊŋ]','registration','việc đăng ký'],['das Ticket','[ˈtɪkət]','ticket','vé'],['der Preis','[pʁaɪ̯s]','price','giá']]]
].forEach(function(r){addTrack(r[0],r[1],r[2],r[3],r[4],r[5])});

[
['2.1',['Kaffee zum Mitnehmen bestellen','Ordering takeaway coffee','Gọi cà phê mang đi'],['Eine Person bestellt Kaffee, wählt die Größe und fragt nach Zucker. Der Verkäufer bestätigt, dass Zucker vorhanden ist.','A customer orders coffee, chooses a size, and asks for sugar. The server confirms it is available.','Khách gọi cà phê, chọn cỡ và hỏi có đường không; người bán xác nhận có.'],['„Einen Kaffee zum Mitnehmen“ bedeutet, dass man ihn mitnimmt statt hier zu trinken. „Haben Sie keinen Zucker?“ ist negativ formuliert; „Doch“ widerspricht der Vermutung.','zum Mitnehmen means takeaway. Doch answers a negative question by correcting it: there is sugar.','zum Mitnehmen nghĩa là mang đi. Doch dùng để bác lại câu hỏi phủ định: có đường.'],['Einen großen Kaffee zum Mitnehmen, bitte.','A large takeaway coffee, please.','Cho tôi một cà phê lớn mang đi.'],[['der Kaffee','[ˈkafe]','coffee','cà phê'],['mitnehmen','[ˈmɪtˌneːmən]','take away','mang đi'],['der Zucker','[ˈtsʊkɐ]','sugar','đường']]],
['2.2',['Einen Termin bei einer Firma abstimmen','Confirming a company appointment','Xác nhận lịch hẹn ở công ty'],['Laura und Adnan fragen, ob sie sich später sehen. Sie erinnern sich an einen Termin um drei und verabschieden sich; Adnan holt Laura ab.','Laura and Adnan confirm a 3 o’clock appointment and say goodbye; Adnan will pick Laura up.','Laura và Adnan xác nhận cuộc hẹn lúc ba giờ rồi chào nhau; Adnan sẽ đến đón Laura.'],['„Sehen wir uns?“ ist eine Ja/Nein-Frage mit dem reflexiven Verb sich sehen. „Ich hole dich ab“ trennt abholen im Hauptsatz; dich ist das Objekt.','Sehen wir uns? is a yes/no question with a reflexive verb. abholen splits, and dich is its object.','„Sehen wir uns?“ là câu hỏi với động từ phản thân. abholen tách đôi trong câu chính; dich là tân ngữ.'],['Um drei haben wir einen Termin. Ich hole dich ab.','We have an appointment at three. I’ll pick you up.','Ba giờ chúng ta có lịch hẹn. Mình sẽ đón bạn.'],[['der Termin','[tɛɐ̯ˈmiːn]','appointment','lịch hẹn'],['die Firma','[ˈfɪʁma]','company','công ty'],['abholen','[ˈapˌhoːlən]','pick up','đón']]],
['2.3',['Ein Paket entgegennehmen','Receiving a parcel','Nhận một bưu kiện'],['Ein Zusteller bringt Herrn Demir ein Paket und bittet ihn, den Empfang zu bestätigen. Danach wünschen sich beide einen schönen Tag.','A delivery worker brings Mr Demir a parcel and asks him to sign for it. They wish each other a nice day.','Nhân viên giao hàng đưa ông Demir một bưu kiện và nhờ ông ký nhận; sau đó họ chúc nhau một ngày tốt lành.'],['„Können Sie bitte … unterschreiben?“ ist eine höfliche Bitte. unterschreiben steht nach können im Infinitiv am Satzende. „für Sie“ bezeichnet den Empfänger.','Können Sie bitte … is a polite request; unterschreiben follows können as an infinitive at the end.','Können Sie bitte … là lời nhờ lịch sự; unterschreiben ở nguyên mẫu cuối câu sau können.'],['Können Sie bitte hier unterschreiben?','Could you sign here, please?','Anh vui lòng ký vào đây được không?'],[['das Paket','[paˈkeːt]','parcel','bưu kiện'],['unterschreiben','[ʊntɐˈʃʁaɪ̯bn̩]','sign','ký tên'],['der Zusteller','[ˈtsuːˌʃtɛlɐ]','delivery worker','nhân viên giao hàng']]],
['2.4',['Ein Ticket zum Hauptbahnhof kaufen','Buying a ticket to the central station','Mua vé đến ga trung tâm'],['Eine Reisende bittet um Hilfe und braucht ein Ticket zum Hauptbahnhof. Der Mitarbeiter erklärt, welche Tarifzone gilt und was das Ticket kostet.','A traveller asks for help and needs a ticket to the central station. The clerk explains the fare zone and price.','Hành khách nhờ giúp và cần vé đến ga trung tâm; nhân viên giải thích vé theo vùng nào và giá bao nhiêu.'],['„Können Sie mir helfen?“ ist eine höfliche Bitte; mir steht im Dativ. zum ist die Kurzform von zu dem und bezeichnet das Ziel.','mir is dative in the polite request. zum contracts zu dem and names the destination.','mir ở Dativ trong lời nhờ lịch sự. zum rút gọn từ zu dem, chỉ đích đến.'],['Ich brauche ein Ticket zum Hauptbahnhof.','I need a ticket to the central station.','Tôi cần vé đến ga trung tâm.'],[['das Ticket','[ˈtɪkət]','ticket','vé'],['der Hauptbahnhof','[ˈhaʊ̯ptˌbaːnhoːf]','central station','ga trung tâm'],['die Zone','[ˈtsoːnə]','zone','khu vực; vùng']]],
['2.5',['Eine Abholung später organisieren','Arranging a later pickup','Hẹn đón muộn hơn'],['Adnan sagt, dass er Elias später abholt. Rita beruhigt ihn, weil die Einrichtung bis sechs Uhr geöffnet ist.','Adnan says he will pick Elias up later. Rita reassures him that the place is open until six.','Adnan nói sẽ đón Elias muộn hơn; Rita bảo không sao vì cơ sở mở cửa đến sáu giờ.'],['„Ich hole Elias ab“ trennt abholen. „bis sechs geöffnet“ nennt die Endzeit. so um fünf bedeutet ungefähr fünf Uhr.','abholen splits in the main clause. bis six gives the closing time; so um fünf is approximate.','abholen tách đôi trong câu chính. bis sechs nêu giờ đóng cửa; so um fünf nghĩa khoảng năm giờ.'],['Ich hole Elias so um fünf ab.','I’ll pick Elias up at around five.','Khoảng năm giờ mình sẽ đón Elias.'],[['abholen','[ˈapˌhoːlən]','pick up','đón'],['geöffnet','[ɡəˈʔœfnət]','open','đang mở cửa'],['bis','[bɪs]','until','đến']]],
['2.6',['Urlaub und Arbeitszeit mit der Chefin besprechen','Discussing leave and work hours','Trao đổi ngày nghỉ và giờ làm'],['Laura möchte frei nehmen, zu einem Konzert fahren und früher Feierabend machen. Sie fragt nach Urlaub, Verkehrsmitteln und den Personen beim Kundentermin und erzählt von ihrem Geburtstag.','Laura wants a day off for a concert, to leave early, asks about transport and meeting attendees, and mentions her birthday.','Laura muốn xin nghỉ đi xem hòa nhạc, hôm khác về sớm, hỏi phương tiện và người dự cuộc hẹn khách hàng rồi kể sinh nhật mình.'],['„frei haben“ und „Urlaub nehmen“ beschreiben Abwesenheit. Modalverben müssen/möchten schicken den Infinitiv ans Ende. mit wem fragt nach einer Person und steht mit Dativ. „Ich bringe Kuchen mit“ trennt mitbringen.','frei haben and Urlaub nehmen describe time off. Modals send the infinitive to the end; mit wem takes dative. mitbringen splits.','frei haben và Urlaub nehmen nói về nghỉ làm. Modalverb đưa nguyên mẫu xuống cuối; mit wem hỏi người và dùng Dativ. mitbringen tách đôi.'],['Ich möchte am Mittwoch frei haben. Ich bringe einen Kuchen mit.','I’d like Wednesday off. I’ll bring a cake.','Tôi muốn nghỉ thứ Tư. Tôi sẽ mang bánh đến.'],[['der Urlaub','[ˈuːɐ̯laʊ̯p]','leave; holiday','ngày nghỉ'],['die Besprechung','[bəˈʃpʁɛçʊŋ]','meeting','cuộc họp'],['der Mitarbeiter','[ˈmɪtˌʔaʁbaɪ̯tɐ]','employee','nhân viên'],['mitbringen','[ˈmɪtˌbʁɪŋən]','bring along','mang theo']]],
['2.7',['Schorle, Tisch, Bus und essen unterscheiden','Distinguishing similar short words','Phân biệt các từ ngắn gần âm'],['Vier Wörter werden einzeln vorgesprochen. Konzentriere dich auf den Anfangslaut und darauf, ob der Vokal kurz oder lang klingt.','Four words are spoken separately. Focus on the initial sound and vowel length.','Bốn từ được đọc riêng. Tập trung vào âm đầu và độ dài nguyên âm.'],['Dies ist Aussprachetraining: Schorle beginnt mit sch, Tisch endet mit sch, Bus hat einen kurzen u-Laut, essen einen kurzen e-Laut.','This is pronunciation practice: notice the consonants and short vowels in each word.','Đây là luyện phát âm: chú ý cụm phụ âm và nguyên âm ngắn trong từng từ.'],['Wir essen am Tisch.','We eat at the table.','Chúng tôi ăn bên bàn.'],[['die Schorle','[ˈʃɔʁlə]','juice spritzer','nước ép pha soda'],['der Tisch','[tɪʃ]','table','cái bàn'],['der Bus','[bʊs]','bus','xe buýt'],['essen','[ˈɛsn̩]','eat','ăn']]],
['2.8',['Alltagswörter mit verschiedenen Lauten hören','Listening for everyday sound contrasts','Nghe các âm khác nhau trong từ thường ngày'],['Die Wortliste verbindet Begriffe aus Alltag und Freizeit. Höre auf kurze Vokale, Konsonantenverbindungen und die betonte Silbe.','The list combines everyday and leisure vocabulary. Listen for short vowels, consonant clusters, and stress.','Danh sách gồm từ sinh hoạt và giải trí. Hãy chú ý nguyên âm ngắn, cụm phụ âm và trọng âm.'],['vorstellen ist trennbar, wenn es „jemanden vorstellen“ heißt: Ich stelle dir … vor. Bei der Ausspracheübung geht es aber um den Wortklang, nicht um neue Grammatik.','vorstellen is separable in “introduce someone”: Ich stelle … vor. This track focuses on sound, not a new grammar rule.','vorstellen là động từ tách khi mang nghĩa giới thiệu ai: Ich stelle … vor. Track này chủ yếu luyện âm, không thêm quy tắc ngữ pháp.'],['Ich stelle dir meine Kollegin vor.','I’ll introduce my colleague to you.','Mình sẽ giới thiệu đồng nghiệp với bạn.'],[['das Fest','[fɛst]','celebration','lễ hội'],['der Stress','[ʃtʁɛs]','stress','căng thẳng'],['der Durst','[dʊʁst]','thirst','cơn khát'],['vorstellen','[ˈfoːɐ̯ˌʃtɛlən]','introduce','giới thiệu']]],
['2.9',['Über den Weg zur Arbeit sprechen','Talking about the commute to work','Trò chuyện trên đường đi làm'],['Zwei Kolleginnen treffen sich im Bus. Sie sprechen über Büro, Termine und Aufgaben und vergleichen, wie stressig ihr Arbeitstag wird.','Two colleagues meet on the bus and talk about their offices, appointments, and workload.','Hai đồng nghiệp gặp nhau trên xe buýt, nói về văn phòng, lịch hẹn và công việc trong ngày.'],['„mit dem Bus“ und „mit dem Fahrrad“ stehen im Dativ. „Ich hatte viel Stress“ nutzt hatte, das Präteritum von haben. müssen + Infinitiv beschreibt Arbeitsaufgaben.','mit takes dative. hatte is the past of haben; müssen + infinitive describes work obligations.','mit đi với Dativ. hatte là quá khứ của haben; müssen + nguyên mẫu nêu việc cần làm.'],['Heute muss ich einen Bericht schreiben.','Today I have to write a report.','Hôm nay tôi phải viết một bản báo cáo.'],[['der Arbeitstag','[ˈaʁbaɪ̯tsˌtaːk]','workday','ngày làm việc'],['der Bericht','[bəˈʁɪçt]','report','báo cáo'],['der Termin','[tɛɐ̯ˈmiːn]','appointment','lịch hẹn'],['der Stress','[ʃtʁɛs]','stress','căng thẳng']]],
['2.10',['Probleme mit digitalen Medien benennen','Describing digital media problems','Nói về sự cố thiết bị và mạng'],['Kurze Sätze nennen fehlendes Netz, langsames WLAN, Offline-Sein und einen leeren Akku. Höre die passende Wendung für das jeweilige Problem.','Short statements describe no signal, slow Wi-Fi, being offline, and an empty battery.','Các câu ngắn nói về mất mạng, Wi-Fi chậm, ngoại tuyến và hết pin.'],['„Ich habe kein Netz“ verneint das sächliche Nomen Netz mit kein. „seit Tagen“ bezeichnet einen Zeitraum bis jetzt; deshalb steht meist das Präsens.','kein negates neuter Netz. seit Tagen describes a period continuing to now, so German uses present tense.','kein phủ định danh từ giống trung Netz. seit Tagen chỉ khoảng thời gian kéo dài đến hiện tại nên thường dùng hiện tại.'],['Mein Akku ist leer und ich habe kein Netz.','My battery is dead and I have no signal.','Điện thoại tôi hết pin và không có sóng.'],[['das Netz','[nɛts]','network; signal','mạng; sóng'],['das WLAN','[ˈveːlaːn]','Wi-Fi','Wi-Fi'],['der Akku','[ˈaku]','battery','pin'],['offline','[ˈɔfˌlaɪ̯n]','offline','ngoại tuyến']]],
['2.11',['Kurze Gespräche über Wetter, Sport und Wochenende','Small talk about weather, sport, and the weekend','Trò chuyện ngắn về thời tiết, thể thao, cuối tuần'],['Die Dialoge wechseln zwischen heißem Wetter, einem Fußballspiel und einem Wochenende mit Familie. Achte darauf, wie Gespräche freundlich begonnen und beendet werden.','The dialogues move from hot weather to football and a family weekend. Notice how people start and end small talk.','Các đoạn chuyển từ trời nóng sang bóng đá rồi chuyện cuối tuần cùng gia đình. Hãy chú ý cách bắt đầu và kết thúc trò chuyện.'],['„oder?“ lädt zur Zustimmung ein. „Da möchte man lieber …“ drückt einen Wunsch aus; lieber vergleicht Optionen. Im Bericht über gestern stehen war und haben im Präteritum.','oder? invites agreement. lieber expresses preference; war and haben are past forms in the story about yesterday.','„oder?“ mời người nghe đồng tình. lieber nói lựa chọn thích hơn; war và haben là dạng quá khứ khi kể chuyện hôm qua.'],['Das Spiel war spannend, und am Wochenende besuchen wir Freunde.','The game was exciting, and we are visiting friends at the weekend.','Trận đấu rất hấp dẫn, cuối tuần chúng tôi đi thăm bạn.'],[['das Wochenende','[ˈvɔxn̩ˌʔɛndə]','weekend','cuối tuần'],['spannend','[ˈʃpanənt]','exciting','hấp dẫn'],['der Besuch','[bəˈzuːx]','visit','lần thăm'],['das Wetter','[ˈvɛtɐ]','weather','thời tiết']]],
['2.12',['Auf eine Einladung zum Ausgehen reagieren','Responding to an invitation to go out','Phản hồi lời rủ đi chơi'],['Thomas findet den gesunden Lebensstil seiner Freundin zwar gut, vermisst aber gemeinsame Abende und lädt sie für Freitag ein.','Thomas likes his friend’s healthy routine but misses seeing her and invites her out on Friday.','Thomas thấy lối sống khỏe của bạn mình tốt nhưng nhớ những buổi đi chơi chung và rủ cô đi vào thứ Sáu.'],['„Du gehst jeden Abend früh ins Bett“ erklärt, warum Thomas sie vermisst. zwar … aber stellt zwei Seiten gegenüber. „Wir warten auf dich“ verlangt auf + Akkusativ.','zwar … aber contrasts two sides. warten auf takes accusative.','zwar … aber nêu hai mặt đối lập. warten auf đi với Akkusativ.'],['Gesund leben ist gut, aber ich vermisse meine Freunde.','Living healthily is good, but I miss my friends.','Sống lành mạnh tốt, nhưng tôi nhớ bạn bè.'],[['das Experiment','[ɛkspeʁiˈmɛnt]','experiment','thử nghiệm'],['vermissen','[fɛɐ̯ˈmɪsn̩]','miss','nhớ'],['warten auf','[ˈvaʁtn̩ aʊ̯f]','wait for','chờ'],['der Freund','[fʁɔʏnt]','friend','bạn']]],
['2.13',['Gemeinsam schwimmen gehen','Going swimming together','Rủ nhau đi bơi'],['Claire unterstützt Annikas Experiment und erzählt, dass sie selbst mehr Sport treiben will. Sie lädt Annika zum Schwimmen ein und schlägt halb sieben vor.','Claire supports Annika’s experiment, wants to exercise more, and invites her swimming at 6:30.','Claire ủng hộ thử nghiệm của Annika, muốn tập thể thao nhiều hơn và rủ cô đi bơi lúc sáu rưỡi.'],['„Ich will Sport machen“ nutzt wollen + Infinitiv. „Hast du Lust?“ fragt nach Interesse; mitkommen ist trennbar und bedeutet, die andere Person zu begleiten.','wollen + infinitive states intention. Hast du Lust? asks interest; mitkommen is separable.','wollen + nguyên mẫu nói dự định. Hast du Lust? hỏi có muốn không; mitkommen là động từ tách nghĩa là đi cùng.'],['Hast du Lust, mit mir schwimmen zu gehen?','Would you like to go swimming with me?','Bạn có muốn đi bơi cùng mình không?'],[['das Experiment','[ɛkspeʁiˈmɛnt]','experiment','thử nghiệm'],['schwimmen gehen','[ˈʃvɪmən ˈɡeːən]','go swimming','đi bơi'],['mitkommen','[ˈmɪtˌkɔmən]','come along','đi cùng'],['allein','[aˈlaɪ̯n]','alone','một mình']]],
['2.14',['Gesundheit und Freunde in Balance halten','Balancing health and friends','Cân bằng sức khỏe và bạn bè'],['Die Mutter sorgt sich, weil ihre Tochter wenig isst und viel Sport macht. Sie fragt nach ihrem Befinden und lädt sie zum Essen ein.','A mother worries that her daughter eats little and exercises a lot, asks how she feels, and invites her to dinner.','Mẹ lo con gái ăn ít, tập nhiều, hỏi con có khỏe không rồi mời về ăn món con thích.'],['„Ist das gut für dich?“ fragt nach der Wirkung auf eine Person. „Komm doch zu uns“ ist eine freundliche Einladung; doch mildert den Imperativ. „Ich koche dir etwas“ verwendet dir im Dativ.','für dich asks about effect on someone. doch softens the invitation; dir is dative in Ich koche dir etwas.','für dich hỏi điều đó có tốt cho bạn không. doch làm lời mời nhẹ nhàng; dir ở Dativ trong Ich koche dir etwas.'],['Komm am Wochenende zu uns. Ich koche dir dein Lieblingsessen.','Come over this weekend. I’ll cook your favourite meal for you.','Cuối tuần về nhà nhé. Mẹ sẽ nấu món con thích cho con.'],[['das Lieblingsessen','[ˈliːplɪŋsˌʔɛsn̩]','favourite food','món ăn yêu thích'],['sich sorgen','[zɪç ˈzɔʁɡn̩]','worry','lo lắng'],['gefährlich','[ɡəˈfɛːɐ̯lɪç]','dangerous','nguy hiểm']]],
['2.15',['Einen Fitnesstest machen','Taking a fitness test','Làm bài kiểm tra thể lực'],['Svenja gibt Alter, Größe und Gewicht an. Sie zögert beim Gewicht, erklärt aber schließlich ungefähr den Wert.','Svenja gives her age, height, and weight. She hesitates about weight but eventually gives an approximate figure.','Svenja nói tuổi, chiều cao và cân nặng; cô ngần ngại khi nói cân nặng nhưng cuối cùng cho biết con số ước lượng.'],['„Wie viel wiegst du?“ fragt nach dem Gewicht; wiegen verändert den Stammvokal in du wiegst. „Das möchte ich nicht sagen“ ist eine höfliche Grenze. ungefähr macht eine Zahl ungenau.','wiegen changes its stem in du wiegst. The response politely sets a boundary; ungefähr makes the number approximate.','wiegen đổi thân từ ở dạng du wiegst. Câu trả lời lịch sự đặt giới hạn; ungefähr cho biết số liệu chỉ ước lượng.'],['Ich bin ungefähr 1,75 Meter groß.','I am about 1.75 metres tall.','Tôi cao khoảng 1,75 mét.'],[['der Fitnesstest','[ˈfɪtnəsˌtɛst]','fitness test','bài kiểm tra thể lực'],['das Gewicht','[ɡəˈvɪçt]','weight','cân nặng'],['wiegen','[ˈviːɡn̩]','weigh','cân nặng'],['ungefähr','[ʊŋɡəˈfɛːɐ̯]','approximately','khoảng']]],
['2.16',['Fitnessstudios und Sportangebote finden','Finding gyms and sports offers','Tìm phòng gym và chương trình thể thao'],['Drei Werbetexte stellen ein Fitnessstudio, ein Sommerprogramm und einen Ort zum Wiedereinstieg nach dem Winter vor. Höre nach Namen und Adresse.','Three adverts promote a gym, a summer programme, and a place to get fit after winter. Listen for names and addresses.','Ba quảng cáo giới thiệu phòng gym, chương trình mùa hè và nơi tập lại sau mùa đông; hãy nghe tên và địa chỉ.'],['„Kommen Sie …!“ ist ein höflicher Imperativ und wirbt direkt um Besucher. „bei uns“ bezeichnet den Anbieter; „in der Hauptstraße“ gibt den Standort an.','Kommen Sie is a polite imperative inviting customers. bei uns names the provider; in der Hauptstraße gives the location.','„Kommen Sie …!“ là lời mời lịch sự. bei uns chỉ nơi cung cấp dịch vụ; in der Hauptstraße nêu địa chỉ.'],['Trainieren Sie bei uns – mit Erfolg!','Train with us – successfully!','Hãy tập luyện cùng chúng tôi để đạt hiệu quả!'],[['das Fitnessstudio','[ˈfɪtnəsˌʃtuːdi̯o]','gym','phòng gym'],['das Sportprogramm','[ˈʃpɔʁtˌpʁoɡʁam]','sports programme','chương trình thể thao'],['die Hauptstraße','[ˈhaʊ̯ptˌʃtʁaːsə]','main street','đường chính'],['trainieren','[tʁɛˈniːʁən]','train','tập luyện']]],
['2.17',['Wortanfänge p, b, t, d, k und g unterscheiden','Distinguishing initial consonants','Phân biệt phụ âm đầu'],['Die Übung gruppiert Wörter nach den Anfangslauten p, b, t, d, k und g. Höre, ob der Laut stimmlos oder stimmhaft beginnt.','Words are grouped by initial p, b, t, d, k, and g. Listen for voicing.','Từ được nhóm theo âm đầu p, b, t, d, k, g. Hãy nghe âm bật vô thanh hay hữu thanh.'],['Dies ist Aussprachearbeit. Im Deutschen klingen p/t/k meist ohne Stimmton, b/d/g mit Stimmton. Die Wörter selbst liefern Beispiele; hier wird keine neue Grammatik eingeführt.','This is pronunciation practice: p/t/k are generally voiceless; b/d/g are voiced.','Đây là luyện phát âm: p/t/k thường vô thanh; b/d/g hữu thanh. Track không giới thiệu ngữ pháp mới.'],['Das Buch liegt beim Bett.','The book is by the bed.','Quyển sách nằm cạnh giường.'],[['die Pause','[ˈpaʊ̯zə]','break','giờ nghỉ'],['der Bauch','[baʊ̯x]','stomach','bụng'],['der Tag','[taːk]','day','ngày'],['duschen','[ˈdʊʃn̩]','shower','tắm vòi sen']]],
['2.18',['Beim Arzt eine Verletzung behandeln lassen','Getting an injury treated','Đi khám và điều trị chấn thương'],['Frau Pohn hat einen Fahrradunfall und Knieschmerzen. Die Ärztin untersucht die Wunde, legt einen Verband an und erklärt Pflege und Kontrolle.','Frau Pohn has a cycling accident and knee pain. The doctor examines the wound, applies a bandage, and explains care.','Bà Pohn bị tai nạn xe đạp, đau đầu gối. Bác sĩ khám vết thương, băng bó và dặn cách chăm sóc.'],['„Mein Knie tut weh“ nutzt das Körperteil als Subjekt; mir/ihm würde die betroffene Person markieren. „Legen Sie sich hin“ ist ein höflicher Imperativ mit Reflexivpronomen. muss + Infinitiv nennt eine notwendige Behandlung.','The body part is the subject in tut weh. The polite imperative uses sich; müssen + infinitive states necessary care.','Bộ phận cơ thể làm chủ ngữ trong tut weh. Mệnh lệnh lịch sự dùng đại từ phản thân; müssen + nguyên mẫu nêu việc cần làm.'],['Mein Knie tut weh. Ich muss die Wunde sauber machen.','My knee hurts. I have to clean the wound.','Đầu gối tôi đau. Tôi cần làm sạch vết thương.'],[['das Knie','[kniː]','knee','đầu gối'],['die Wunde','[ˈvʊndə]','wound','vết thương'],['der Verband','[fɛɐ̯ˈbant]','bandage','băng gạc'],['die Salbe','[ˈzalbə]','ointment','thuốc mỡ']]],
['2.19',['Schmerzlaute ausdrücken','Expressing pain sounds','Diễn tả tiếng kêu đau'],['Mehrere Ausrufe zeigen, wie Menschen spontan auf Schmerz reagieren. Höre die Unterschiede in Länge und Stärke.','Several interjections show spontaneous reactions to pain. Listen for differences in length and intensity.','Một số tiếng kêu thể hiện phản ứng tự nhiên khi đau; hãy chú ý độ dài và mức độ.'],['Au, Aua und Autsch sind Interjektionen, keine vollständigen Sätze. Man verwendet sie spontan; die Schreibweise bildet den gehörten Laut nach.','Au, Aua, and Autsch are interjections, not full sentences; they imitate spontaneous sounds.','Au, Aua và Autsch là thán từ chứ không phải câu đầy đủ; cách viết mô phỏng âm thanh.'],['Autsch! Das tut weh.','Ouch! That hurts.','Ái! Đau quá.'],[['der Schmerz','[ʃmɛɐ̯ts]','pain','cơn đau'],['wehtun','[ˈveːˌtuːn]','hurt','làm đau'],['Autsch','[aʊ̯tʃ]','ouch','ái; đau quá']]],
['2.20',['Bauchschmerzen beschreiben und Anweisungen verstehen','Describing stomach pain and understanding advice','Mô tả đau bụng và hiểu lời dặn'],['Ein Patient hat Bauchschmerzen und Übelkeit. Der Arzt fragt nach Ort, Dauer und Essen und gibt klare Anweisungen zu Trinken, Ruhe und Arbeit.','A patient has stomach pain and nausea. The doctor asks about symptoms and gives advice on fluids, rest, and work.','Bệnh nhân đau bụng, buồn nôn. Bác sĩ hỏi vị trí, thời gian và thức ăn, rồi dặn uống nước, nghỉ ngơi, không đi làm.'],['„Mir ist schlecht“ verwendet mir im Dativ. dürfen + Infinitiv sagt, was erlaubt ist; nicht dürfen bedeutet Verbot. müssen zu Hause bleiben nennt eine notwendige Maßnahme.','Mir ist schlecht uses dative mir. dürfen means permission; nicht dürfen is prohibition; müssen states necessity.','„Mir ist schlecht“ dùng mir ở Dativ. dürfen nói được phép; nicht dürfen là không được phép; müssen nêu điều bắt buộc.'],['Sie dürfen viel trinken, aber Sie dürfen nicht arbeiten.','You may drink plenty, but you must not work.','Ông/bà được uống nhiều nước nhưng không được đi làm.'],[['die Bauchschmerzen','[ˈbaʊ̯xˌʃmɛɐ̯tsn̩]','stomach ache','đau bụng'],['übel','[ˈyːbl̩]','nauseous','buồn nôn'],['dürfen','[ˈdʏʁfn̩]','may; be allowed to','được phép'],['die Kamille','[kaˈmɪlə]','chamomile','hoa cúc']]],
['2.21',['Erkältung und Fieber untersuchen lassen','Getting a cold and fever checked','Khám cảm lạnh và sốt'],['Der Arzt fragt nach Dauer, Fieber und Husten. Er stellt eine Erkältung fest und verordnet Hustensaft; außerdem gibt er Baderegeln bei Fieber.','The doctor asks about duration, fever, and cough, diagnoses a cold, prescribes syrup, and gives bathing advice.','Bác sĩ hỏi thời gian bệnh, sốt và ho, chẩn đoán cảm lạnh, kê si-rô ho và dặn việc tắm khi sốt.'],['„Wie lange sind Sie schon krank?“ fragt nach einer Dauer, die bis jetzt anhält. „Haben Sie Fieber?“ ist eine höfliche Frage. Den Hustensaft müssen Sie nehmen: müssen + Infinitiv.','schon asks how long a state has lasted until now. müssen + infinitive gives the prescription instruction.','schon trong câu hỏi hỏi tình trạng kéo dài bao lâu đến hiện giờ. müssen + nguyên mẫu nêu lời dặn dùng thuốc.'],['Sie müssen den Hustensaft abends nehmen.','You need to take the cough syrup in the evening.','Ông/bà cần uống si-rô ho vào buổi tối.'],[['die Erkältung','[ɛɐ̯ˈkɛltʊŋ]','cold','cảm lạnh'],['das Fieber','[ˈfiːbɐ]','fever','sốt'],['der Hustensaft','[ˈhʊstˌzaft]','cough syrup','si-rô ho'],['husten','[ˈhuːstn̩]','cough','ho']]],
['2.22',['Armschmerzen untersuchen lassen','Getting arm pain examined','Khám đau cánh tay'],['Herr Köck kann den Arm kaum bewegen. Die Ärztin untersucht ihn, schickt ihn ins Krankenhaus und gibt eine Überweisung sowie ein Rezept.','Mr Köck can barely move his arm. The doctor examines him and sends him to hospital with a referral and prescription.','Ông Köck gần như không cử động được tay. Bác sĩ khám rồi chuyển ông đến bệnh viện, cấp giấy chuyển tuyến và đơn thuốc.'],['„Ich kann ihn nicht bewegen“ nutzt ihn als Akkusativpronomen für den Arm. „ins Krankenhaus“ bedeutet in das Krankenhaus und beschreibt ein Ziel; deshalb Akkusativ. zweimal pro Tag gibt die Häufigkeit an.','ihn refers to der Arm in accusative. ins Krankenhaus is directional accusative; zweimal pro Tag gives frequency.','ihn thay cho der Arm ở Akkusativ. ins Krankenhaus chỉ hướng đến nên dùng Akkusativ; zweimal pro Tag chỉ tần suất.'],['Ich kann den Arm nicht bewegen. Ich muss ins Krankenhaus.','I can’t move my arm. I have to go to hospital.','Tôi không cử động được cánh tay. Tôi phải đến bệnh viện.'],[['der Arm','[aʁm]','arm','cánh tay'],['die Überweisung','[ˈyːbɐˌvaɪ̯zʊŋ]','referral','giấy chuyển tuyến'],['das Krankenhaus','[ˈkʁaŋkn̩ˌhaʊ̯s]','hospital','bệnh viện'],['die Tablette','[taˈblɛtə]','tablet','viên thuốc']]]
].forEach(function(r){addTrack(r[0],r[1],r[2],r[3],r[4],r[5])});

[
['2.23',['Zimmer in einer Wohnung beschreiben','Describing rooms in a home','Mô tả các phòng trong nhà'],['Eine Journalistin beschreibt, wo sie zu Hause arbeitet und welche Tätigkeiten sie dort erledigt. Im Hörtext soll das passende Zimmer ergänzt werden.','A journalist describes where she works at home and what she does there; the listener identifies the room.','Một nhà báo kể mình làm việc ở đâu trong nhà và làm gì tại đó; người nghe đoán căn phòng phù hợp.'],['„Wenn ich zu Hause bin“ ist ein wenn-Nebensatz; bin steht am Ende. Im Hauptsatz steht arbeite an zweiter Stelle. am Computer beschreibt, womit sie arbeitet.','The wenn-clause sends bin to the end; the main clause keeps arbeite in second position.','Mệnh đề wenn đưa bin xuống cuối; câu chính giữ arbeite ở vị trí thứ hai.'],['Wenn ich zu Hause bin, arbeite ich oft im Arbeitszimmer.','When I am at home, I often work in the study.','Khi ở nhà, tôi thường làm việc trong phòng làm việc.'],[['die Journalistin','[ʒʊʁnaˈlɪstɪn]','journalist','nhà báo nữ'],['das Arbeitszimmer','[ˈaʁbaɪ̯tsˌtsɪmɐ]','study; home office','phòng làm việc'],['recherchieren','[ʁɛʃɛʁˈʃiːʁən]','research','nghiên cứu, tra cứu']]],
['2.24',['Eine Wohnung nach Preis und Lage beurteilen','Evaluating an apartment by price and location','Đánh giá căn hộ theo giá và vị trí'],['Zwei Personen lesen eine Wohnungsanzeige: zentral, mit Balkon und Aufzug, aber die Miete ist hoch. Sie vergleichen danach eine weitere Anzeige.','Two people read a listing: central, balcony, lift, but high rent. They then compare another listing.','Hai người đọc tin thuê nhà: ở trung tâm, có ban công và thang máy nhưng tiền thuê cao; sau đó họ xem lựa chọn khác.'],['„im Zentrum“ nennt die Lage. „mit Balkon“ beschreibt Ausstattung. „950 Euro Miete“ steht als Nomenphrase; „zu teuer“ bewertet den Preis.','im Zentrum gives location; mit Balkon gives a feature; zu teuer evaluates the price.','im Zentrum nêu vị trí; mit Balkon nêu tiện nghi; zu teuer nhận xét giá quá cao.'],['Die Wohnung liegt zentral, aber die Miete ist zu teuer.','The apartment is central, but the rent is too expensive.','Căn hộ ở trung tâm nhưng tiền thuê quá đắt.'],[['die Miete','[ˈmiːtə]','rent','tiền thuê'],['der Balkon','[balˈkɔŋ]','balcony','ban công'],['der Aufzug','[ˈaʊ̯ftsʊk]','lift; elevator','thang máy'],['das Zentrum','[ˈtsɛntʁʊm]','centre','trung tâm']]],
['2.25',['Möbel in der Wohnung platzieren','Placing furniture around the home','Sắp xếp đồ nội thất trong nhà'],['Ein Paar diskutiert, in welches Zimmer Computer, Fernseher, Lampe, Regal und Kühlschrank gehören. Sie schlagen Plätze vor und widersprechen einander.','A couple debates where to put the computer, TV, lamp, shelf, and fridge, suggesting and rejecting locations.','Hai người bàn nên đặt máy tính, TV, đèn, kệ và tủ lạnh ở phòng nào, đưa ra rồi bác bỏ đề xuất.'],['Wohin? beschreibt Bewegung: „Wir stellen den Computer in die Küche“ mit Akkusativ. Wo? beschreibt den festen Standort: „Der Computer steht in der Küche“ mit Dativ. stellen zeigt eine Platzierung; stehen einen Zustand.','Wohin takes accusative for movement; Wo takes dative for location. stellen places; stehen describes position.','Wohin dùng Akkusativ cho hướng đặt; Wo dùng Dativ cho vị trí. stellen là đặt; stehen là đang ở.'],['Wir stellen das Regal ins Arbeitszimmer. Danach steht es neben dem Schreibtisch.','We put the shelf in the study. Then it stands next to the desk.','Chúng tôi đặt kệ vào phòng làm việc. Sau đó kệ ở cạnh bàn.'],[['das Regal','[ʁeˈɡaːl]','shelf','kệ'],['der Kühlschrank','[ˈkyːlˌʃʁaŋk]','fridge','tủ lạnh'],['stellen','[ˈʃtɛlən]','put; place','đặt'],['stehen','[ˈʃteːən]','stand; be located','đứng; nằm ở']]],
['2.26',['Einladungsdetails am Telefon nachfragen','Clarifying invitation details by phone','Hỏi lại thông tin lời mời qua điện thoại'],['Vanessa bestätigt ihre Teilnahme an einer Party, fragt aber nach Datum und Uhrzeit, weil diese Angaben in der Einladung fehlen.','Vanessa accepts a party invitation but asks for its date and time because they are missing.','Vanessa nhận lời dự tiệc nhưng hỏi lại ngày và giờ vì thư mời thiếu thông tin.'],['„An welchem Samstag?“ fragt nach einem konkreten Termin; welchem richtet sich nach dem maskulinen Samstag im Dativ. „In der Einladung steht …“ nutzt stehen im Sinn von „geschrieben sein“.','welchem agrees with masculine dative Samstag. stehen means “be written” in the invitation.','welchem đi với Samstag giống đực ở Dativ. stehen ở đây nghĩa là “được ghi” trong thư mời.'],['An welchem Samstag ist die Feier? – Am dritten Juni um 19 Uhr.','Which Saturday is the party? – On 3 June at 7 p.m.','Buổi tiệc vào thứ Bảy nào? – Ngày 3 tháng 6 lúc 19 giờ.'],[['die Einladung','[ˈaɪ̯nlaːdʊŋ]','invitation','lời mời'],['das Datum','[ˈdaːtʊm]','date','ngày tháng'],['die Feier','[ˈfaɪ̯ɐ]','celebration','buổi tiệc'],['stattfinden','[ˈʃtatˌfɪndn̩]','take place','diễn ra']]],
['2.27',['Gäste durch eine neue Wohnung führen','Showing guests around a new apartment','Dẫn khách xem căn hộ mới'],['Carla und Alex begrüßen Gäste, zeigen Zimmer und Terrasse und sprechen offen über Möbel, Geschmack und noch fehlende Dinge. Zum Schluss laden sie zum Büfett ein.','Carla and Alex welcome guests, show the rooms and terrace, discuss furnishings and tastes, then invite them to the buffet.','Carla và Alex đón khách, giới thiệu phòng và sân hiên, nói về đồ đạc và sở thích, rồi mời khách dùng tiệc buffet.'],['„Uns gefällt es hier“ bedeutet, dass der Ort ihnen gefällt; uns ist Dativ. „Ich finde die Lampe lustig“ nutzt finden + Akkusativobjekt + Adjektiv. doch/aber stellen unterschiedliche Meinungen gegenüber.','gefallen takes a dative person; finden + object + adjective gives an opinion. doch/aber contrast opinions.','gefallen dùng người ở Dativ; finden + tân ngữ + tính từ để nêu nhận xét. doch/aber tạo đối lập ý kiến.'],['Uns gefällt die Wohnung. Ich finde die Terrasse gemütlich.','We like the apartment. I find the terrace cosy.','Chúng tôi thích căn hộ. Tôi thấy sân hiên ấm cúng.'],[['die Terrasse','[tɛˈʁasə]','terrace','sân hiên'],['das Büfett','[byˈfɛt]','buffet','tiệc buffet'],['gefallen','[ɡəˈfalən]','please; be liked','làm ai thích'],['gemütlich','[ɡəˈmyːtlɪç]','cosy','ấm cúng']]],
['2.28',['Begeisterung über eine Wohnung ausdrücken','Expressing enthusiasm about a home','Thể hiện sự thích thú về căn nhà'],['Kurze Sätze zeigen verschiedene Reaktionen auf etwas Schönes: etwas toll finden, super finden oder sagen, dass es gut aussieht.','Short phrases express enthusiasm: finding something great or saying it looks good.','Các câu ngắn thể hiện sự thích thú: thấy thứ gì tuyệt vời hoặc trông đẹp.'],['„Ich finde das super“ nutzt finden + Akkusativobjekt. „Das sieht gut aus“ enthält das trennbare Verb aussehen; aus steht im Hauptsatz am Ende.','finden takes an accusative object. aussehen splits, with aus at the end.','finden nhận tân ngữ Akkusativ. aussehen là động từ tách, aus xuống cuối câu.'],['Das sieht wirklich schön aus!','That looks really nice!','Cái đó trông thật đẹp!'],[['die Begeisterung','[bəˈɡaɪ̯stɐʁʊŋ]','enthusiasm','sự hào hứng'],['aussehen','[ˈaʊ̯sˌzeːən]','look; appear','trông có vẻ'],['toll','[tɔl]','great','tuyệt'],['schön','[ʃøːn]','beautiful; nice','đẹp']]],
['2.29',['Wohnungswörter und Lagewörter hören','Listening for home and position words','Nghe từ vựng nhà ở và vị trí'],['Die Wortliste mischt Eigenschaften, Möbel und Präpositionen. Achte darauf, welches Wort ein Zimmer beschreibt und welches die Lage eines Gegenstands angibt.','The list mixes qualities, furniture, and prepositions. Identify room descriptions and object positions.','Danh sách trộn tính từ, đồ nội thất và giới từ. Hãy nhận ra từ miêu tả phòng và từ chỉ vị trí đồ vật.'],['neben steht oft mit Dativ bei einem festen Standort. „Der Teppich liegt …“ nutzt liegen für einen Gegenstand, der flach auf einer Fläche ist.','neben takes dative for a fixed location. liegen describes an object lying flat.','neben dùng Dativ khi chỉ vị trí cố định. liegen diễn tả vật nằm ngang trên bề mặt.'],['Der Teppich liegt neben dem Bett.','The rug is next to the bed.','Tấm thảm nằm cạnh giường.'],[['der Teppich','[ˈtɛpɪç]','rug','thảm'],['das Bett','[bɛt]','bed','giường'],['neben','[ˈneːbn̩]','next to','bên cạnh'],['hell','[hɛl]','bright','sáng']]],
['2.30',['Möbel und ihre Standorte beschreiben','Describing furniture and where it is','Miêu tả đồ đạc và vị trí'],['Drei Sätze nennen, wo ein Herd, ein Sessel und ein Student wohnen beziehungsweise stehen. Höre auf Möbelwort und Präposition.','Three sentences locate a stove, armchair, and student. Listen for the noun and preposition.','Ba câu nói vị trí bếp, ghế bành và sinh viên; hãy nghe danh từ và giới từ chỉ chỗ.'],['„Der Herd steht neben dem Regal“ beantwortet Wo? und verwendet Dativ. „Der Sessel steht vor dem Fenster“ ebenfalls: vor + Dativ bei Lage.','Both location sentences answer Wo? and use dative after neben/vor.','Cả hai câu trả lời Wo? nên dùng Dativ sau neben/vor.'],['Der Sessel steht vor dem Fenster.','The armchair is in front of the window.','Ghế bành ở trước cửa sổ.'],[['der Herd','[heːɐ̯t]','stove','bếp'],['der Sessel','[ˈzɛsl̩]','armchair','ghế bành'],['das Fenster','[ˈfɛnstɐ]','window','cửa sổ'],['das Regal','[ʁeˈɡaːl]','shelf','kệ']]],
['2.31',['Im Hochhaus wohnen: Vorteile und Nachteile','Living in a high-rise: pros and cons','Sống trong chung cư cao tầng: ưu và nhược điểm'],['Eine Person mochte Hochhäuser früher nicht, findet die Wohnung nun aber hell und hat einen weiten Blick. Gleichzeitig vermisst sie den Kontakt zu den Nachbarn.','Someone once disliked high-rises but now enjoys the light and view, while missing contact with neighbours.','Trước đây người nói không thích nhà cao tầng nhưng giờ thích phòng sáng và tầm nhìn rộng; họ tiếc vì ít quen hàng xóm.'],['„Ich wollte nie … wohnen“ nutzt wollte, Präteritum von wollen, für eine frühere Haltung. „über die ganze Stadt sehen“ nennt einen Vorteil; aber leitet den Gegensatz ein.','wollte is the past of wollen for a former attitude. aber introduces the drawback.','wollte là quá khứ của wollen, nói suy nghĩ trước đây. aber mở đầu ý trái ngược, nêu nhược điểm.'],['Ich wollte nie im Hochhaus wohnen, aber jetzt gefällt es mir.','I never wanted to live in a high-rise, but now I like it.','Trước đây tôi không muốn sống ở nhà cao tầng, nhưng giờ tôi thích nơi này.'],[['das Hochhaus','[ˈhoːxˌhaʊ̯s]','high-rise building','nhà cao tầng'],['der Nachbar','[ˈnaːxbaːɐ̯]','neighbour','hàng xóm'],['hell','[hɛl]','bright','sáng'],['wollen','[ˈvɔlən]','want','muốn']]],
['2.32',['In einem Loft wohnen','Living in a loft','Sống trong căn hộ loft'],['Eine Person liebt das große, helle Loft und den vielen Platz. Im Winter wird es jedoch oft kalt.','A person loves the large, bright loft and space, but it often gets cold in winter.','Người nói thích căn loft rộng, sáng và nhiều chỗ; tuy nhiên mùa đông thường lạnh.'],['„Ich wohne in einem Loft“ nutzt in + Dativ bei Wo? „Der Raum ist groß“ beschreibt mit sein + Adjektiv. aber markiert den Nachteil.','in takes dative for location. sein + adjective describes; aber introduces a drawback.','in dùng Dativ cho vị trí. sein + tính từ để miêu tả; aber nêu nhược điểm.'],['Das Loft ist groß und hell, aber im Winter oft kalt.','The loft is large and bright, but often cold in winter.','Căn loft rộng và sáng nhưng mùa đông thường lạnh.'],[['das Loft','[lɔft]','loft','căn hộ loft'],['der Raum','[ʁaʊ̯m]','room; space','căn phòng; không gian'],['der Platz','[plats]','space','chỗ trống'],['kalt','[kalt]','cold','lạnh']]],
['2.33',['Im Reihenhaus mit Garten wohnen','Living in a terraced house with a garden','Sống trong nhà liền kề có vườn'],['Eine Familie freut sich über Haus und Garten, wo Kinder spielen und die Familie grillen kann. Die ähnlichen Häuser und fehlende Privatsphäre stören manchmal.','A family enjoys its house and garden, though identical houses and little privacy can be drawbacks.','Gia đình vui vì có nhà và vườn để con chơi, cả nhà nướng đồ ăn; nhà nào cũng giống nhau và thiếu riêng tư là điểm trừ.'],['„Die Kinder können spielen“ nutzt können + Infinitiv. „Im Garten ist man nie allein“ verwendet man allgemein für Menschen im Allgemeinen; aber zeigt den Nachteil.','können + infinitive expresses possibility. man refers to people generally; aber contrasts a drawback.','können + nguyên mẫu nói khả năng. man chỉ người nói chung; aber chuyển sang nhược điểm.'],['Die Kinder können im Garten spielen.','The children can play in the garden.','Trẻ có thể chơi trong vườn.'],[['das Reihenhaus','[ˈʁaɪ̯ənˌhaʊ̯s]','terraced house','nhà liền kề'],['der Garten','[ˈɡaʁtn̩]','garden','khu vườn'],['allein','[aˈlaɪ̯n]','alone','một mình'],['grillen','[ˈɡʁɪlən]','barbecue','nướng BBQ']]],
['2.34',['In einer Altbauwohnung leben','Living in an older apartment','Sống trong căn hộ nhà cũ'],['Eine Familie wohnt seit Jahren in einer schönen Altbauwohnung mit großen Zimmern und hohen Decken. Die Nachbarn sind nett, aber man hört einander; außerdem gibt es keinen Aufzug.','A family enjoys a spacious old apartment and friendly neighbours, but hears them and has no lift.','Gia đình sống nhiều năm trong căn hộ nhà cũ rộng, hàng xóm thân thiện nhưng nghe thấy nhau và không có thang máy.'],['„seit acht Jahren“ beschreibt einen Zeitraum bis heute, daher steht wohnen im Präsens. „Man hört die Nachbarn“ nutzt man allgemein; keinen Aufzug verneint ein maskulines Akkusativobjekt.','seit + duration continuing to now uses present tense. keinen negates masculine accusative Aufzug.','seit + khoảng thời gian kéo dài đến nay dùng hiện tại. keinen phủ định Aufzug giống đực ở Akkusativ.'],['Wir wohnen seit acht Jahren hier, aber es gibt keinen Aufzug.','We have lived here for eight years, but there is no lift.','Chúng tôi sống ở đây tám năm rồi nhưng không có thang máy.'],[['die Altbauwohnung','[ˈaltbaʊ̯ˌvoːnʊŋ]','older apartment','căn hộ nhà cũ'],['die Decke','[ˈdɛkə]','ceiling','trần nhà'],['der Aufzug','[ˈaʊ̯ftsʊk]','lift','thang máy'],['die Treppe','[ˈtʁɛpə]','stairs','cầu thang']]],
['2.35',['In einem Fachwerkhaus wohnen','Living in a half-timbered house','Sống trong nhà khung gỗ'],['Ein Paar lebt in einem historischen Haus im Zentrum. Es ist gemütlich, aber klein und dunkel; an einem alten Haus gibt es immer etwas zu renovieren.','A couple lives in a historic central home. It is cosy but small and dark and needs regular work.','Hai vợ chồng sống trong căn nhà lịch sử ở trung tâm. Nhà ấm cúng nhưng nhỏ, tối và luôn cần sửa sang.'],['„über 200 Jahre alt“ beschreibt das Alter. „Man muss … machen“ nutzt müssen für eine Notwendigkeit; möchte ich das Badezimmer neu machen beschreibt einen Plan.','über 200 Jahre alt gives age. müssen expresses necessity; möchte describes a plan.','über 200 Jahre alt nói tuổi đời. müssen nêu việc cần làm; möchte diễn tả dự định sửa phòng tắm.'],['Das Haus ist alt und gemütlich, aber das Badezimmer muss renoviert werden.','The house is old and cosy, but the bathroom needs renovating.','Ngôi nhà cũ và ấm cúng, nhưng phòng tắm cần sửa lại.'],[['das Fachwerkhaus','[ˈfaxvɛʁkˌhaʊ̯s]','half-timbered house','nhà khung gỗ'],['die Geschichte','[ɡəˈʃɪçtə]','history','lịch sử'],['dunkel','[ˈdʊŋkl̩]','dark','tối'],['renovieren','[ʁenɔˈviːʁən]','renovate','sửa sang']]]
].forEach(function(r){addTrack(r[0],r[1],r[2],r[3],r[4],r[5])});
